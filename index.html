ttps://arxiv.org/pdf/2602.13977v2", "ps": 3, "b": 25, "talk": "", "tier": "S", "why": "World models as simulators for VLA RL", "top": ["VLA testing", "Training frontier", "World models", "RL"], "sum": "Reinforcement learning could improve vision-language-action policies, but real-world interaction is costly and learned world-model simulators hallucinate and accumulate error. WoVR uses an action-controllable video world model, rollouts starting from keyframes to limit error buildup, and joint updates keeping the world model and policy aligned. It improves performance on LIBERO and several real robots; no specific figures are given."}, {"id": "Gkka9VEhWb", "t": "WT-UMI: Tactile-based Whole-Body Manipulation via Force-Supervised Contact-Aware Planning", "a": "Jaehwi Jang; Zhaoyuan Gu; Alfred Cueva; Zimeng Chai; Junjie Sheng; Thong Nguyen; Himank Galundia; Yifan Wu; Huishu Xue; Isaac legene; Ojas Mediratta; Davin Doan; Andrew Collins; Sarah Sadegh; KyoungMok Kim; Rishita Dhalbisoi; Zun Chen; Ye Zhao", "k": ["Imitation learning (behavioral cloning, inverse RL)", "Robot systems, hardware, and sensors for learning", "Humanoid Whole-body Manipulation", "Tactile Sensing"], "kind": "P", "pdf": "https://arxiv.org/pdf/2606.13232v1", "ps": 2, "b": 202, "talk": "", "tier": "", "why": "", "top": []}, {"id": "c0ygOLwL7i", "t": "X-NavDP: Generalizing Navigation Diffusion Policy to Novel Behavior and Embodiments with Group Q-score Reweighted Matching", "a": "Tianyu Yang; Yiming Zeng; Wenzhe Cai; Yuqiang Yang; Jiaqi Peng; Hui Cheng; Jiangmiao Pang; Tai Wang", "k": ["Robot navigation and locomotion", "Reinforcement learning for physical robot control, end-to-end visual navigation, reinforcement learning for diffusion policy"], "kind": "P", "pdf": "https://arxiv.org/pdf/2607.28560v2", "ps": 1, "b": 174, "talk": "", "tier": "", "why": "", "top": []}, {"id": "mG3eBTsBiG", "t": "X-Tokenizer: A Multimodal Action Tokenizer for Vision-Language-Action Model Pretraining", "a": "Xirui Kang; Yanpei Shi; Yuxin Liang; Ruyi Gan; Dongxiu Liu; Pushi Zhang; Danpeng Chen; Xiaoyi Qin; Yinan Zheng; Jinliang Zheng; Hao Wang; Xianyuan Zhan; Hang Su", "k": ["Learning representations for robotic perception and control", "Robot foundation models and general-purpose knowledge systems"], "kind": "P", "pdf": "https://arxiv.org/pdf/2606.14752v2", "ps": 1, "b": 8, "talk": "", "tier": "", "why": "", "top": []}, {"id": "kBoTnjRw4s", "t": "X-WBC: A Cross-Embodiment Foundation Model for Humanoid Whole-Body Control", "a": "Juntong Zhang; Chun Gu; Li Zhang", "k": ["Reinforcement learning for physical robot control"], "kind": "P", "pdf": "https://arxiv.org/pdf/2609.15213v1", "ps": 2, "b": 194, "talk": "", "tier": "", "why": "", "top": []}, {"id": "wt25SMJmEq", "t": "XDex: Learning Cross-Embodiment Dexterous Grasping with 1000 Hands", "a": "Keyi Wang; Jianglong Ye; Chengjing Yuan; Xiaolong Wang", "k": ["Robot manipulation", "Sim-to-real transfer"], "kind": "P", "pdf": "", "ps": 2, "b": 117, "talk": "", "tier": "", "why": "", "top": []}, {"id": "LHLnvoAEhr", "t": "YOCO: You Only Calibrate Once! Fast Mocap Calibration for Dexterous Teleoperation", "a": "Yu Zhang; Yunqi Li; Yushi Du; Yi Ma; Yanchao Yang", "k": ["Robotic data generation", "Robot manipulation", "Teleoperation", "Hand Estimation Calibration"], "kind": "P", "pdf": "https://arxiv.org/pdf/2610.11657v1", "ps": 3, "b": 43, "talk": "", "tier": "S", "why": "Fast mocap calibration", "top": ["Perception & vision", "Dexterous/contact-rich", "Efficient/real-time"], "sum": "Low-cost motion-capture gloves and markerless hand trackers have biases that vary by user, fit, and session, hurting dexterous teleoperation. YOCO is a few-shot calibration method needing no fine-tuning: a hypernetwork conditioned on a few paired raw and target poses predicts light updates to a frozen MANO hand model. It improves calibration efficiency, hand-state estimation, and teleoperation, though no numbers are given."}, {"id": "QAHhXvXHtb", "t": "YUBI: Yielding Universal Bidigital Interface for Bimanual Dexterous Manipulation at Scale", "a": "Takehiko Ohkawa; Jumpei Arima; Yuki Noguchi; Masatoshi Tateno; Makoto Sugiura; Takuya Okubo; Kengo Ikeuchi; Yuma Shin; Hiroki Nishizawa; Naoaki Kanazawa; Yuki Wakayama; Daiki Fukunaga; Koshi Makihara; Tomohiro Motoda; Floris Marc Arden Erich; Yukiyasu Domae; Tatsuya Matsushima; Yoshihiro Okumatsu; Kei Ota", "k": ["Robotic data generation", "Hardware design and optimization", "UMI"], "kind": "P", "pdf": "https://arxiv.org/pdf/2606.10244v1", "ps": 3, "b": 119, "talk": "", "tier": "", "why": "", "top": []}, {"id": "trTMmn2U1g", "t": "ZeroWBC: Learning Natural Whole-Body Humanoid Interaction from Human Egocentric Data", "a": "Haoran Yang; Jiacheng Bao; Yucheng Xin; Haoming Song; Yuyang Tian; Bin Zhao; Dong Wang; Xuelong Li", "k": ["Human-robot interaction and natural language instruction", "Combination of learning and planning in robotics", "Humanoid", "Whole-body Interaction"], "kind": "P", "pdf": "https://arxiv.org/pdf/2603.09170v3", "ps": 2, "b": 188, "talk": "", "tier": "", "why": "", "top": []}, {"id": "4RLjGPEfpH", "t": "ZETA: A Controlled Study of Zero-Shot Cross-Embodiment VLA Transfer for Tabletop Manipulation", "a": "Mi Yan; Wenhao Zhang; Zhiqi Zhang; Yu Peng; Tangxinyu Wang; Lingfei Zhai; Jiayi Su; Shengliang Deng; Lin Peng; Yaowei Liu; Yuxing Chen; Zhiyuan Wei; Jilong Wang; Jiayi Chen; Jiangran Lyu; Zhizheng Zhang; He Wang", "k": ["Robot foundation models and general-purpose knowledge systems", "Learning representations for robotic perception and control", "Zero-shot cross-embodiment transfer"], "kind": "S", "pdf": "https://arxiv.org/pdf/2609.02546v3", "ps": 1, "b": 66, "talk": "S1", "tier": "", "why": "", "top": [], "sum": "This study examines how well vision-language-action models transfer to robot hardware unseen in training, separating strict zero-shot transfer from cases where the robot appears in pretraining. Using a benchmark of 14 held-out embodiments in simulation and real life, it finds local end-effector state and action encodings, more embodiment diversity, and auxiliary co-training help by about 15, 18 and 7 points; 5% target data in pretraining adds 13.4 points."}, {"id": "sIYfeRhQrn", "t": "λ-Reachability: Geometric-Horizon Safety Bellman Equations for Humanoid Safety", "a": "Rui Chen; Shangtao Li; Yifan Sun; Changliu Liu", "k": ["Robot safety, alignment, and safe learning-based systems", "Hamilton–Jacobi Safety Analysis", "Humanoids"], "kind": "P", "pdf": "", "ps": 3, "b": 192, "talk": "", "tier": "S", "why": "Safety Bellman equations", "top": ["Motion control & safety"], "sum": "Hamilton-Jacobi safety analysis is hard for high-dimensional robots like humanoids, and prior discounted methods use fixed one-step updates. Lambda-Reachability instead uses a stochastic multi-step estimator whose rollout horizon is geometrically distributed. It classifies safe sets and estimates safety margins better than single-step temporal-difference baselines, in both simulated and real humanoid tests; no specific numbers are reported."}, {"id": "ShBMWDRPVu", "t": "μ₀: A Scalable 3D Interaction-Trace World Model", "a": "Seungjae Lee; Yoonkyo Jung; Jusuk Lee; Jonghun Shin; Amir Hossein Shahidzadeh; Yao-Chih Lee; H. Jin Kim; Jia-Bin Huang; Furong Huang", "k": ["Video models and latent world models for robot learning", "Robot foundation models and general-purpose knowledge systems", "Structured 3D World Models", "Robot Manipulation"], "kind": "P", "pdf": "", "ps": 3, "b": 33, "talk": "", "tier": "S", "why": "3D interaction-trace world model", "top": ["VLA testing", "World models", "Efficient/real-time"], "sum": "Pixel-space video world models waste capacity on appearance detail, and action models need embodiment-specific labels. Mu-0 instead forecasts smooth 3D trajectories of salient interaction points, trained on supervision extracted from videos by a system called TraceExtract. It beats baselines at 2D and 3D trace prediction, and its frozen representation paired with action experts gives policies competitive with pi-0 despite action-free pretraining."}, {"id": "SN5sVBOZ8D", "t": "π, But Make It Fly: Physics-Guided Transfer of VLA Models to Aerial Manipulation", "a": "Johnathan Tucker; Denis Liu; Aiden Swann; Allen Z. Ren; Jiankai Sun; Javier Yu; Brandon Kim; Lachlain McGranahan; Quan Vuong; Mac Schwager", "k": ["Robot foundation models and general-purpose knowledge systems", "Autonomous driving and flight", "Cross-embodiment transfer", "Vision-language-action models"], "kind": "P", "pdf": "", "ps": 2, "b": 224, "talk": "", "tier": "", "why": "", "top": []}, {"id": "5XKFwWrW0v", "t": "π₀.₇: a Steerable Generalist Robotic Foundation Model with Emergent Capabilities", "a": "Bo Ai; Ali Amin; Raichelle Aniceto; Ashwin Balakrishna; Greg Balke; Kevin Black; George Elledge Bokinsky; Shihao Cao; Thomas Charbonnier; Vedant Choudhary; Foster Collins; Ken Conley; Grace B Connors; James Darpinian; Karan Dhabalia; Maitrayee Dhaka; Jared Di Carlo; Danny Driess; Michael Robert Equi; Adnan Esmail; Yunhao Fang; Chelsea Finn; Catherine Glossop; Thomas Godden; Ivan Goryachev; Lachy Groom; Haroun Habeeb; Hunter Hancock; Karol Hausman; Gashon Hussein; Victor Hwang; brian ichter; Connor Jacobsen; Szymon Jakubczak; Rowan Jen; Tim Jones; Gregg Kammerer; Benjamin Katz; Liyiming Ke; Mairbek Khadikov; Chandra Kuchi; Marinda Lamb; Devin LeBlanc; Sergey Levine; Xinyu Li; Adrian Li-Bell; Vladislav Lialin; Zhonglin Liang; Wallace Lim; Yao Lu; Enyu Luo; Vishnu Mano; Nandan Marwaha; Aikys Mongush; Liam Murphy; Suraj Nair; Karl Pertsch; Allen Z. Ren; Gavin Schelske; Charvi Sharma; Baifeng Shi; Lucy Xiaoyang Shi; Laura Smith; Jost Tobias Springenberg; Kyle Stachowicz; Will Stoeckle; Jiaming Tang; James Tanner; Shalom Tekeste; Marcel Torne; Kyle Vedder; Quan Vuong; Anna Walling; Haohuan Wang; Jason Wang; XuDong Wang; Christopher Whalen; Sam Whitmore; Blake Williams; Charles Xu; Sukwon Yoo; Lili Yu; Wuming Zhang; Zhuoyang Zhang; Ury Zhilinsky", "k": ["Robot foundation models and general-purpose knowledge systems", "Robot manipulation"], "kind": "O", "pdf": "", "ps": 1, "b": 63, "talk": "O1", "tier": "S", "why": "Oral: pi-0.7 steerable generalist model — state of the art", "top": ["VLA testing", "Efficient/real-time"], "sum": "Pi-0.7 aims to be a generalist robot model that works well out of the box across many scenarios. It is trained with diverse context in its prompt, such as task-performance metadata and subgoal images, which steers its strategy and lets it learn from varied data including failures and non-robot sources. It runs an espresso machine out of the box, comparable to specialist models fine-tuned with reinforcement learning."}, {"id": "qvOl1xOUtn", "t": "τ₀-WM: A Unified Video-Action World Model for Robotic Manipulation", "a": "Pengfei Zhou; Shengcong Chen; Di Chen; Jiaxu Wang; Rongjun Jin; Bingwen Zhu; Yike Pan; Songen Gu; Kuanning Wang; Shufeng Nan; Xingyu Qiu; Chenhao Qiu; Pu Yang; Yunuo Cai; Jianxiong Gao; Yifan Li; Yanwei Fu; Xiangyu Yue; Zhi Chen; Jianlan Luo", "k": ["Robot foundation models and general-purpose knowledge systems", "Video models and latent world models for robot learning"], "kind": "P", "pdf": "", "ps": 3, "b": 5, "talk": "", "tier": "", "why": "", "top": []}], "events": [{"d": 0, "s": 840, "e": 1200, "v": "JW", "t": "Badge pickup (Room 201, 2nd floor)", "kind": "logistics", "p": "must", "n": "Do it today. Only place to get the badge.", "code": "", "link": "", "demos": [], "sum": "Pick up your badge at JW Room 201. You need it for every activity.", "id": "d0-840-badge-pickup-room-201-2nd-fl", "slot": "d0-840-badge-pickup-room-201-2nd-fl", "def": true}, {"d": 1, "s": 540, "e": 570, "v": "H", "t": "Generalist policies, memory and transfer", "kind": "spotlight", "p": "must", "n": "", "code": "S1", "link": "", "demos": [], "sum": "Nine 3-minute talks on generalist VLA policies: cross-embodiment transfer (ZETA, EmbodiSteer), memory for VLAs (MEM), language steering, and one evaluation paper on counterfactual failures when vision overrides language.", "id": "d1-540-generalist-policies-memory-a", "slot": "d1-540-generalist-policies-memory-a", "def": true}, {"d": 1, "s": 630, "e": 660, "v": "H", "t": "Generalist policies and context scaling", "kind": "oral", "p": "must", "n": "", "code": "O1", "link": "", "demos": [], "sum": "Three 10-minute talks on scaling generalist policies: π0.7 (Physical Intelligence, steerable foundation model), RoboTTT (scaling the context a policy uses at test time) and Being-H0.5 (human-centric pretraining for cross-embodiment).", "id": "d1-630-generalist-policies-and-cont", "slot": "d1-630-generalist-policies-and-cont", "def": true}, {"d": 1, "s": 660, "e": 690, "v": "H", "t": "World models and temporal representations", "kind": "oral", "p": "must", "n": "", "code": "O2", "link": "", "demos": [], "sum": "Three talks on world models and time: World Action Models used directly as zero-shot policies, a memory-augmented action-conditioned world model, and TEMPO (temporal context for dynamic manipulation).", "id": "d1-660-world-models-and-temporal-re", "slot": "d1-660-world-models-and-temporal-re", "def": true}, {"d": 1, "s": 690, "e": 720, "v": "H", "t": "Data, simulation and evaluation", "kind": "oral", "p": "must", "n": "Top talk for VLA testing: \"What are we actually benchmarking\".", "code": "O3", "link": "", "demos": [], "sum": "Three talks on data and evaluation: what manipulation benchmarks really measure, a fast dataset-diversity metric, and MolmoB0T (large-scale simulation for zero-shot manipulation). The most relevant block for VLA testing.", "id": "d1-690-data-simulation-and-evaluati", "slot": "d1-690-data-simulation-and-evaluati", "def": true}, {"d": 1, "s": 870, "e": 900, "v": "H", "t": "Efficient execution, world models and learning", "kind": "spotlight", "p": "must", "n": "", "code": "S2", "link": "", "demos": [], "sum": "Nine short talks on efficient execution: time-adaptive control (TARC), asynchronous real-time VLA inference (EagleVLA, REACT), 1-bit VLAs, model-based policy optimization, and attacks on world-model training pipelines.", "id": "d1-870-efficient-execution-world-mo", "slot": "d1-870-efficient-execution-world-mo", "def": true}, {"d": 2, "s": 510, "e": 540, "v": "H", "t": "Human learning, dexterity and cooperation", "kind": "spotlight", "p": "should", "n": "", "code": "S3", "link": "", "demos": [], "sum": "Nine short talks on learning from humans: egocentric human data, bimanual and in-hand dexterity, shared-autonomy teleoperation, and human-in-the-loop adaptation of generative policies.", "id": "d2-510-human-learning-dexterity-and", "slot": "d2-510-human-learning-dexterity-and", "def": true}, {"d": 2, "s": 540, "e": 570, "v": "H", "t": "Reinforcement learning and motion reasoning", "kind": "oral", "p": "must", "n": "", "code": "O4", "link": "", "demos": [], "sum": "Three talks on RL: Flow Policy Gradients (RL on flow-matching policies), RL Token (online RL bootstrapped from a VLA), and neuro-symbolic motion prediction for ground vehicles.", "id": "d2-540-reinforcement-learning-and-m", "slot": "d2-540-reinforcement-learning-and-m", "def": true}, {"d": 2, "s": 630, "e": 660, "v": "H", "t": "Dexterous learning, grasping and assembly", "kind": "oral", "p": "should", "n": "", "code": "O5", "link": "", "demos": [], "sum": "Three talks on dexterity: EgoScale (dexterous skills from egocentric human data), open-vocabulary task-oriented dexterous grasping, and Play2Perfect (play pretraining for precise assembly).", "id": "d2-630-dexterous-learning-grasping", "slot": "d2-630-dexterous-learning-grasping", "def": true}, {"d": 2, "s": 660, "e": 690, "v": "H", "t": "Force, tactile control and manipulation planning", "kind": "oral", "p": "must", "n": "", "code": "O6", "link": "", "demos": [], "sum": "Three talks on force and tactile: FACTR 2 (learned external force sensing without an F/T sensor), PACE (tactile-conditioned chunked insertion) and DISCO (long-horizon rearrangement by distilled tree search).", "id": "d2-660-force-tactile-control-and-ma", "slot": "d2-660-force-tactile-control-and-ma", "def": true}, {"d": 2, "s": 690, "e": 720, "v": "H", "t": "Humanoid data, control and skills", "kind": "oral", "p": "skip", "n": "Humanoids. Walk to JW for demo run 2.", "code": "O7", "link": "", "demos": [], "sum": "Three talks on humanoids: loco-manipulation generated from world models (GRAIL), soccer shooting (RoboNaldo) and whole-body control from one differentiable world model (SuperMimic).", "id": "d2-690-humanoid-data-control-and-sk", "slot": "c2-1130", "def": false}, {"d": 2, "s": 840, "e": 870, "v": "H", "t": "Touch, force and contact-rich manipulation", "kind": "spotlight", "p": "must", "n": "Best session of the day.", "code": "S4", "link": "", "demos": [], "sum": "Nine short talks on contact-rich manipulation: why VLAs fail in contact-rich tasks, impedance control from a generative policy, torque adaptation (TAM), force injection for VLA post-training, and vision-based tactile sensors.", "id": "d2-840-touch-force-and-contact-rich", "slot": "d2-840-touch-force-and-contact-rich", "def": true}, {"d": 2, "s": 870, "e": 900, "v": "H", "t": "Deformable manipulation, geometry and morphology", "kind": "spotlight", "p": "must", "n": "", "code": "S5", "link": "", "demos": [], "sum": "Nine short talks on deformables and geometry: robust MPC for certified deformable manipulation, physics-guided residual dynamics, cloth and cable benchmarks, 3D policies robust to depth corruption, reachability across morphologies.", "id": "d2-870-deformable-manipulation-geom", "slot": "d2-870-deformable-manipulation-geom", "def": true}, {"d": 3, "s": 510, "e": 540, "v": "H", "t": "Optimization, agentic planning and evaluation", "kind": "spotlight", "p": "must", "n": "Conic-solver unfolding fits your QP solver work.", "code": "S6", "link": "", "demos": [], "sum": "Nine short talks on optimization and evaluation: deep unfolding of conic optim   const c=window.claude; if(!c||!c.use) return;

  const user=await c.use('user');
  if(user&&typeof user.can==='function'){try{if(await user.can('data.write')===false) canWrite=false}catch(e){}}

  db.collection('notes').onSnapshot(snap=>{
    const fresh={}; snap.docs.forEach(d=>fresh[d.id]=d.data());
    for(const k in notes) if(!fresh[k]&&notes[k]&&notes[k]._local) fresh[k]=notes[k];
    notes=fresh; lsSave(); if(!typing()) render(false);

const pending={};
function save(id,patch){
  const cur=Object.assign({},notes[id]||{},patch,{ts:Date.now()}); delete cur._local;
  notes[id]=Object.assign({},cur,db?{}:{_local:true}); lsSave();
  if(!db||!canWrite) return Promise.resolve();
  pending[id]=(pending[id]||Promise.resolve()).then(()=>db.doc('notes/'+id).set(cur)).catch(e=>{
    if(e&&e.code==='invalid_argument'){canWrite=false;setSync('Read-only · saved on this device')}
    notes[id]._local=true; lsSave();});
  return pending[id];
}

function austinNow(){
  const f=new Intl.DateTimeFormat('en-US',{timeZone:'America/Chicago',year:'numeric',month:'numeric',day:'numeric',hour:'numeric',minute:'numeric',hourCycle:'h23'});
  const o={};f.formatToParts(new Date()).forEach(x=>o[x.type]=x.value);
  const y=+o.year,mo=+o.month,d=+o.day;
  return {day:(y===2026&&mo===11&&d>=8&&d<=12)?d-8:-1,min:(+o.hour)*60+(+o.minute),days:Math.round((Date.UTC(2026,10,8)-Date.UTC(y,mo-1,d))/864e5)};
}

const chipsFor=e=>{
  const ps=evPapers(e), mine=ps.filter(p=>tierOf(p)), read=mine.filter(p=>flag(p.id,'read')).length;
  const c=[];
  if(attended(e)) c.push('<span class="chip ok">attended</span>');
  if(mine.length) c.push(`<span class="chip ${read===mine.length?'ok':''}">read ${read}/${mine.length}</span>`);
  if(hasNote('ev-'+e.id)) c.push('<span class="chip acc">notes</span>');
  const alts=E.filter(x=>x.slot===e.slot).length-1; if(alts>0) c.push(`<span class="chip">+${alts} option${alts>1?'s':''}</span>`);
  if(e.s==null) c.push('<span class="chip warn">time TBD</span>');
  return `<span class="chips">${c.join('')}</span>`;
};
function dayRows(d,opts={}){
  let evs=E.filter(e=>e.d===d&&(opts.all||e.kind==='break'||going(e))).sort((a,b)=>(a.s??9999)-(b.s??9999));
  let h='',prev=null; const nw=austinNow(); let nowDone=!(nw.day===d);
  evs.forEach(e=>{
    if(!nowDone&&e.s!=null&&e.s>nw.min){h+=`<div class="nowline">NOW ${hm(nw.min)}</div>`;nowDone=true}
    if(opts.walk&&prev&&going(e)&&e.v!==prev&&MOVE[prev+'-'+e.v]) h+=`<div class="walk">↳ ${MOVE[prev+'-'+e.v]}</div>`;
    const dim=!going(e);
    if(e.kind==='break'){h+=`<div class="brk"><span class="tm">${hm(e.s)}</span><span>${esc(e.t)} · ${VEN[e.v]}${e.e?' · until '+hm(e.e):''}</span></div>`;}
    else if(STATIC.includes(e.kind)){h+=`<div class="row static${dim?' dim':''}"><span class="tm">${hm(e.s)}</span><span class="ti"><b>${esc(e.t)}</b><span><span class="vd ${e.v}"></span>${VEN[e.v]}${e.e?' · until '+hm(e.e):''}</span></span><span></span></div>`;}
    else h+=`<button class="row${dim?' dim':''}${attended(e)?' att':''}" data-route="${e.id}"><span class="tm">${hm(e.s)}</span><span class="ti"><b>${esc(e.t)}</b><span><span class="vd ${e.v}"></span>${VEN[e.v]}${e.code&&!e.code.startsWith('P')?' · '+e.code:''} · ${KIND[e.kind]||e.kind}</span></span>${chipsFor(e)}</button>`;
    if(going(e)&&e.s!=null) prev=e.v;
  });
  if(!nowDone&&evs.length) h+=`<div class="nowline">NOW ${hm(nw.min)}</div>`;
  return h||'<div class="empty">Nothing planned.</div>';
}

function vPlan(){
  const must=P.filter(p=>tierOf(p)==='M'), should=P.filter(p=>tierOf(p)==='S');
  const mustN=must.length;
  const mr=must.filter(p=>flag(p.id,'read')).length, sr=should.filter(p=>flag(p.id,'read')).length;
  const chosen=E.filter(e=>going(e)&&!STATIC.includes(e.kind)).length, att=E.filter(attended).length;
  const tbd=E.filter(e=>going(e)&&e.s==null);
  const n=austinNow();
  let h=`<h1>Jonathan's plan</h1><p class="lead">${n.day<0&&n.days>0?`${n.days} days to go. `:''}Your week at a glance. Tap a block to open its page. The Today tab has the detailed day list.</p>
  <div class="kpis"><div class="kpi"><b>${mr}/${must.length}</b><span>Must papers read${mustN>10?` · <b style="display:inline;font-size:inherit;color:var(--warn)">${mustN} Must, target ≤10</b>`:''}</span><div class="bar"><i style="width:${must.length?mr/must.length*100:0}%"></i></div></div>
  <div class="kpi"><b>${sr}/${should.length}</b><span>Should papers read</span><div class="bar"><i style="width:${should.length?sr/should.length*100:0}%"></i></div></div>
  <div class="kpi"><b>${att}/${chosen}</b><span>Events attended</span><div class="bar"><i style="width:${chosen?att/chosen*100:0}%"></i></div></div></div>`;
  const todo=[];
  if(tbd.length) tbd.forEach(e=>todo.push(`<b>${esc(e.t.replace('Workshop: ',''))}</b>: time not published yet. Check the site before Thursday.`));
  const before=n.day<0&&n.days>0;
  if(before||n.day===0) todo.push('Sun Nov 8, 14:00–20:00: pick up your badge at JW Marriott, Room 201 (2nd floor).');
  if(tbd.length&&(before||(n.day>=0&&n.day<4))) todo.push('Thursday: pick the morning or afternoon workshop when the surgical tutorial time is known.');
  if(mr<must.length&&(before||n.day===0)) todo.push(`Read ${must.length-mr} more Must papers (Prep tab).`);
  if(n.day>=1&&n.day<=4){const nx=E.filter(e=>e.d===n.day&&going(e)&&e.s!=null&&e.s>n.min&&!STATIC.includes(e.kind)&&e.kind!=='break').sort((a,b)=>a.s-b.s)[0]; if(nx) todo.push(`Next today: <b>${hm(nx.s)} ${esc(nx.t)}</b> (${VEN[nx.v]}).`)}
  if(!todo.length) todo.push('Nothing open.');
  h+=`<div class="todo"><b>To do</b><ul>${todo.map(t=>`<li>${t}</li>`).join('')}</ul></div>`;
  h+=`<div style="margin-top:14px"><label class="chk"><input type="checkbox" id="showAll" ${st.showAll?'checked':''}> Show options I did not pick</label></div>`;
  h+=weekGrid(n);
  return h;
}
function weekGrid(n){
  const T0=8*60, T1=22*60, PX=1.5, H=(T1-T0)*PX;
  const short=e=>{const t=e.t.replace(/^Workshop: /,'').replace(/^Early Career Keynote /,'ECK ').replace(/ \(.*?\)$/,'');return (e.code&&!e.code.startsWith('P')?e.code+' · ':'')+t};
  const narrow=window.innerWidth<640; const days=narrow?[st.planDay||1]:[1,2,3,4];
  let cols='', tbd='';
  for(const d of days){
    const evs=E.filter(e=>e.d===d&&e.s!=null&&(e.kind==='break'||going(e)||st.showAll)).sort((a,b)=>a.s-b.s||(going(b)?1:0)-(going(a)?1:0));
    // lanes
    const lanes=[]; const pos=new Map(); let group=[],gEnd=-1;
    const flush=()=>{const L=Math.max(1,...group.map(g=>pos.get(g)+1)); group.forEach(g=>g._L=L); group=[]};
    evs.filter(e=>e.kind!=='break').forEach(e=>{ if(e.s>=gEnd&&group.length){flush();lanes.length=0}
      let li=lanes.findIndex(end=>end<=e.s); if(li<0){li=lanes.length;lanes.push(0)} lanes[li]=e.e; pos.set(e,li); group.push(e); gEnd=Math.max(gEnd,e.e)});
    if(group.length) flush();
    let blocks='';
    evs.forEach(e=>{
      const top=(Math.max(e.s,T0)-T0)*PX, h=Math.max(16,(Math.min(e.e,T1)-Math.max(e.s,T0))*PX-2), L=e.kind==='break'?1:(e._L||1), li=e.kind==='break'?0:pos.get(e);
      const cls=e.kind==='break'?'gb brk2':`gb v${e.v}${going(e)?'':' opt'}${e.p==='must'&&going(e)?' must':''}${attended(e)?' done':''}`;
      const stat=STATIC.includes(e.kind)||e.kind==='break';

/* ---------- NOTES / REPORT ---------- */
function reportData(){
  const days=[];
  for(let d=0;d<5;d++){
    const evs=E.filter(e=>e.d===d&&(attended(e)||hasNote('ev-'+e.id))).sort((a,b)=>(a.s??9999)-(b.s??9999));
    days.push({d,evs});
  }
  const papers=P.filter(p=>flag(p.id,'seen')||hasNote(p.id)||flag(p.id,'follow'));
  const people=PE.filter(x=>flag('person-'+x.id,'seen')||hasNote('person-'+x.id));
  const mine=myContacts();
  const comps=CO.hi.filter(c=>{const id='co-'+c.n.replace(/[^A-Za-z0-9]+/g,'-');return flag(id,'seen')||hasNote(id)});
  const demos=DM.filter(d=>flag('demo'+d.n,'seen')||hasNote('demo'+d.n));
  return {days,papers,people,comps,demos,mine};
}

  if(t.closest('[data-back]')){history.length>1?history.back():go(st.tab);return}
  const g=t.closest('[data-go]'); if(g&&SHARED){return}
  if(g){const ev=evById[g.dataset.go];setGo(ev,!going(ev));render(false);return}
  const a=t.closest('[data-att]'); if(a){const ev=evById[a.dataset.att];const v=!attended(ev);save('ev-'+ev.id,{att:v});if(v&&!going(ev))setGo(ev,true);render(false);return}
  const f=t.closest('[data-flag]'); if(f){const id=f.dataset.id,k=f.dataset.flag;save(id,{[k]:!flag(id,k),status:''});render(false);return}
  const cy=t.closest('[data-cyc]'); if(cy&&SHARED){e.preventDefault();return}
  if(cy){e.preventDefault();e.stopPropagation();const p=byId[cy.dataset.cyc];const nx={'':'S','S':'M','M':''}[tierOf(p)||''];save(p.id,{tier:nx});render(false);return}
  const ap=t.closest('[data-addp]'); if(ap){const k=ap.dataset.addp,id=ap.dataset.id;
    if(k==='paper'){const p=byId[id];openQuick(`Author of "${p.t.split(':')[0]}" (Poster ${p.ps} #${p.b})`,p.a.split('; '))}
    else if(k==='demo'){const d=demoBy[+id];openQuick(`Demo ${d.n}: ${d.t.split(':')[0]}`,d.pres.split(/,\s*/))}
    else if(k==='event'){const ev=evById[id];openQuick(`${DAYS[ev.d].l} ${hm(ev.s)} · ${ev.t}`,[])}
    else openQuick(route?evById[route].t:'',[]);return}
  if(t.closest('[data-qpclose]')){qp=null;renderQuick();return}
  const qn=t.closest('[data-qpname]'); if(qn){document.getElementById('qp-name').value=qn.dataset.qpname;return}
  if(t.id==='qp-save'){saveQuick();return}
  const ud=t.closest('[data-ucdel]'); if(ud){save(ud.dataset.ucdel,{deleted:true});render(false);return}
  const pc=t.closest('[data-person]'); if(pc){st.tab='network';st.net='people';saveUI();openSet.add('person-'+pc.dataset.person);scrollTo_='person-'+pc.dataset.person;go('network');return}
  const cc=t.closest('[data-company]'); if(cc){const id=coId(cc.dataset.company);st.tab='network';st.net='companies';saveUI();openSet.add(id);scrollTo_=id;go('network');return}
  const pp=t.closest('[data-paper]'); if(pp){st.tab='library';st.lib='papers';st.q=byId[pp.dataset.paper].t;st.tier='';saveUI();openSet.add('p-'+pp.dataset.paper+'l');go('library');return}
  const td=t.closest('[data-today]'); if(td){st.today=+td.dataset.today;saveUI();render();return}
  const pr=t.closest('[data-prep]'); if(pr){st.prepFilter=pr.dataset.prep;saveUI();render();return}
  const lg=t.closest('[data-libgo]'); if(lg){st.tab='library';st.lib=lg.dataset.libgo;saveUI();go('library');return}
  const lb=t.closest('[data-lib]'); if(lb){st.lib=lb.dataset.lib;saveUI();render();return}
  const nb=t.closest('[data-net]'); if(nb){st.net=nb.dataset.net;saveUI();render();return}
  const pd=t.closest('[data-planday]'); if(pd){st.planDay=+pd.dataset.planday;saveUI();render(false);return}
  const psb=t.closest('[data-psess]'); if(psb){st.psess=+psb.dataset.psess;saveUI();render();return}
  if(t.id==='more'){st.limit+=50;render(false);return}
  if(t.id==='toggleMd'){showMd=!showMd;render(false);return}
  if(t.id==='copyMd'){const md=markdown(),msg=document.getElementById('copyMsg');
    try{navigator.clipboard.writeText(md).then(()=>msg.textContent='Copied.',()=>{showMd=true;render(false);const a2=document.getElementById('mdArea');a2&&a2.select();document.getElementById('copyMsg').textContent='Select all and copy.'})}catch(err){showMd=true;render(false)}
    return}
});
document.addEventListener('change',e=>{const t=e.target;
  if(t.id==='allBoards'){st.allBoards=t.checked;saveUI();render(false);return}
  if(t.id==='showAll'){st.showAll=t.checked;saveUI();render(false);return}
  if(t.dataset.tier!==undefined&&t.tagName==='SELECT'&&!SHARED){save(t.dataset.tier,{tier:t.value});render(false);return}
  if(['tier','topic','sess'].includes(t.id)){st[t.id]=t.value;st.limit=50;saveUI();render(false)}
});
const timers={};
document.addEventListener('input',e=>{const t=e.target;
  if(t.dataset.note){const k=t.dataset.note;document.querySelectorAll(`[data-saved="${CSS.escape(k)}"]`).forEach(x=>x.textContent='Typing…');clearTimeout(timers[k]);
    timers[k]=setTimeout(()=>save(k,{note:t.value}).then(()=>document.querySelectorAll(`[data-saved="${CSS.escape(k)}"]`).forEach(x=>x.textContent=db&&canWrite?'Saved':'Saved on this device')),600);return}
  if(t.id==='q'){clearTimeout(timers.q);const v=t.value;timers.q=setTimeout(()=>{st.q=v;st.limit=50;render(false,true)},180)}
});
document.addEventListener('focusout',e=>{if(e.target.dataset&&e.target.dataset.note){const k=e.target.dataset.note;if(timers[k]){clearTimeout(timers[k]);save(k,{note:e.target.value})}}});

function render(reset=true,keepFocus=false){
  document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-selected',!route&&b.dataset.tab===st.tab));
  const y=window.scrollY, q=document.getElementById('q'), sel=q&&document.activeElement===q?[q.selectionStart,q.selectionEnd]:null;
  main.classList.toggle('wide',!route&&st.tab==='plan');
  main.innerHTML=route?vEvent(evById[route]):{plan:vPlan,today:vToday,prep:vPrep,library:vLibrary,network:vNetwork,notes:vNotes}[st.tab]();
  if(!reset) window.scrollTo(0,y);
  if(scrollTo_){const el=document.querySelector(`[data-k="${scrollTo_}"]`);scrollTo_=null;if(el)setTimeout(()=>el.scrollIntoView({block:'start'}),0)}
  if(sel||keepFocus){const q2=document.getElementById('q');if(q2){q2.focus();if(sel)q2.setSelectionRange(sel[0],sel[1])}}
}
function tick(){
  const f=new Intl.DateTimeFormat('en-US',{timeZone:'America/Chicago',weekday:'short',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit',hourCycle:'h23'});
  const loc=new Intl.DateTimeFormat('en-GB',{hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).format(new Date());
  const aus=f.format(new Date()); const ausT=aus.split(', ').pop();
  const nar=window.innerWidth<520;
  document.getElementById('clock').textContent=nar?`Austin ${ausT}`+(ausT!==loc?` · you ${loc}`:''):`Austin ${aus}`+(ausT!==loc?` · your time ${loc}`:'');
}
render(); tick();
let wasNarrow=window.innerWidth<640; window.addEventListener('resize',()=>{const nw=window.innerWidth<640; if(nw!==wasNarrow){wasNarrow=nw; if(!typing()) render(false)}});
setInterval(()=>{tick(); if(!typing()&&!route&&(st.tab==='today'||st.tab==='plan'))render(false)},60000);
})();
</script>

</body></html>
