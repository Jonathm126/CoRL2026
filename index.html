, then trains a lightweight tactile residual policy through online interaction. On four real tasks, it raised visual base policies from 5-40% success to 85-100% within 40-80 minutes."}, {"id": "wYLEzeAKFI", "t": "On the Limits of Sampling-Based Reachability: Geometry, Dynamics, and Sample Complexity", "a": "Jixian Liu; Ihab Tabbara; Hussein Sibai; Enrique Mallada", "k": ["Theoretical foundations of robot learning", "Robot safety, alignment, and safe learning-based systems", "Sampling-based reachable set approximation", "Fundamental limits of sampling-based reachability"], "kind": "P", "pdf": "https://arxiv.org/pdf/2607.18606v1", "ps": 1, "b": 216, "talk": "", "tier": "S", "why": "Limits of sampling-based reachability", "top": ["Motion control & safety"], "sum": "This paper treats recovering a system's reachable set from samples as a geometric support-estimation problem. Under two regularity conditions, including Lipschitz dynamics, it gives accuracy r in Hausdorff distance with sample complexity of roughly (e^{3LT}/r)^n, exponential in dimension and horizon, and proves a matching lower bound. Experiments show adversarial sampling improves constants but not scaling."}, {"id": "bXQv3Kn5qL", "t": "One Agent to Guide Them All: Empowering MLLMs for Vision-and-Language Navigation via Explicit World Representation", "a": "Zerui Li; Hongpei Zheng; Fangguo Zhao; Yanyan Shao; Jian Zhou; Sihao Lin; Shijie Li; Qi Wu", "k": ["Human-robot interaction and natural language instruction", "Robot navigation and locomotion", "Vision-and-language Navigation", "Agentic Navigation"], "kind": "P", "pdf": "https://arxiv.org/pdf/2602.15400v1", "ps": 1, "b": 167, "talk": "", "tier": "", "why": "", "top": []}, {"id": "FuxTpvfYnh", "t": "One-Step World Models for Multi-Modal Goal Navigation", "a": "wangtian shen; Ziyang Meng; Jinming Ma; mingliang zhou; Diyun Xiang", "k": ["Robot navigation and locomotion", "World Model", "Multi-Modal Goal Navigation"], "kind": "P", "pdf": "", "ps": 1, "b": 163, "talk": "", "tier": "", "why": "", "top": []}, {"id": "QDJCwo9pmt", "t": "Online Robot Manipulation Error Detection and Description", "a": "Yung-Shun Chan; Kuniaki Saito; Cristian Camilo Beltran-Hernandez; Jeremy Siburian; Masashi Hamaya; Chun-Yi Lee", "k": ["Robot safety, alignment, and safe learning-based systems", "Robotic data generation"], "kind": "P", "pdf": "", "ps": 2, "b": 91, "talk": "", "tier": "S", "why": "Online manipulation error detection", "top": ["Motion control & safety"]}, {"id": "74gh4jCB2a", "t": "Online World Modeling Enables Real-World Inverse Reinforcement Learning from Observation", "a": "Tyler Han; Bat Nemekhbold; Siyang Shen; Rohan Baijal; Richard Ebock; Harine Ravichandiran; Sanghun Jung; Kevin Huang; Byron Boots", "k": ["Imitation learning (behavioral cloning, inverse RL)", "Video models and latent world models for robot learning", "Real-world learning", "Transfer learning"], "kind": "P", "pdf": "https://arxiv.org/pdf/2602.24121v3", "ps": 3, "b": 32, "talk": "", "tier": "", "why": "", "top": []}, {"id": "wLgEYxjqid", "t": "OPENDEXGRASP: Open-vocabulary Task-Oriented Dexterous Grasping", "a": "Jiyao Zhang; Junhan Wang; Tianyu Wang; Zeyuan Chen; Anthony Bolton; Yitong Peng; Hao Dong", "k": ["Robot manipulation"], "kind": "O", "pdf": "https://arxiv.org/pdf/2609.18117v3", "ps": 2, "b": 121, "talk": "O5", "tier": "", "why": "", "top": [], "sum": "Robots need dexterous grasps that fit the function implied by a free-form language instruction, given visual input and object shape. OpenDexGrasp introduces the OpenDexVerse dataset, mixing generated grasps with teleoperated demonstrations, and a shared latent space linking vision-language context to grasp generation directly. The abstract claims better functional alignment, feasibility, and generalization, but gives no numbers."}, {"id": "TTFZrb0Hw3", "t": "OpenHLM: An Empirical Recipe for Whole-Body Humanoid Loco-Manipulation", "a": "Yingdong Hu; Haodong Zhu; Boyuan Zheng; Yihang Hu; Tong Zhang; Zunhao Chen; Junming Zhao; Ruiqian Nai; Yang Gao", "k": ["Robot foundation models and general-purpose knowledge systems", "Robot manipulation", "Humanoid Loco-Manipulation"], "kind": "S", "pdf": "https://arxiv.org/pdf/2606.22174v1", "ps": 3, "b": 199, "talk": "S7", "tier": "", "why": "", "top": [], "sum": "Most humanoid systems split upper- and lower-body control, which limits whole-body coordination. The authors ran a step-by-step empirical study of whole-body teleoperation, vision-language-action model design, and co-training with HuMI, a humanoid version of UMI, and released the result as the OpenHLM recipe. On a long-horizon task spanning a wide vertical range, it beats GR00T N1.6 and Ψ0 while using less than half the demonstration time."}, {"id": "7BCkvvmpuj", "t": "OptiGeo: Efficient Monocular Geometry for Embodied Perception in Optically Challenging Scenes", "a": "Muxin Liu; TIANBO LIU; Jing Xia; Xiaoyang Lyu; Xiaoshan Wu; Bo Wang; Peng Dai; Zhongrui Wang; Shaoshuai Shi; Xiaojuan Qi", "k": ["Multimodal perception, sensor fusion, and robot vision", "Learning representations for robotic perception and control", "Monocular Depth Estimation"], "kind": "P", "pdf": "https://arxiv.org/pdf/2608.29881v2", "ps": 1, "b": 185, "talk": "", "tier": "S", "why": "Monocular geometry in optically challenging scenes — specular/transparent (surgical scenes)", "top": ["Perception & vision", "Efficient/real-time"], "sum": "Depth sensors give missing or biased readings on transparent, mirror-like and glossy surfaces. OptiGeo is a training framework using a clean-geometry teacher, residual-trimmed alignment and a small set of rendered transparent-object data. With 30M parameters, it is reported to beat 300M-scale monocular models and billion-scale multi-view baselines on transparent-scene benchmarks; no specific scores are given."}, {"id": "39Q3r1h0mD", "t": "Optimal Control with Learned Critics under Unmodeled State Dependencies", "a": "Philipp Schoch; Markus Ryll", "k": ["Model-based and model-free learning for robotic control", "Combination of learning and planning in robotics", "Model-based Reinforcement Learning"], "kind": "P", "pdf": "https://arxiv.org/pdf/2610.05359v1", "ps": 1, "b": 221, "talk": "", "tier": "S", "why": "Optimal control with learned critics", "top": ["Dexterous/contact-rich", "Planning & optimization", "RL"], "sum": "Model predictive control struggles with contacts and other effects that are hard to model analytically, while model-free reinforcement learning needs a lot of data. The authors combine a nominal model, a learned residual dynamics network and a learned critic that adds long-horizon information to a GPU-batched iLQR solver. They report better closed-loop control on biased, incompletely modeled tasks, without specific numbers."}, {"id": "uNi5VigrGr", "t": "Optimal Transport Q-Learning for Flow Policy Steering and Acceleration", "a": "Andreas Sochopoulos; Esmeralda S. Whitammer; Nikolaos Tsagkas; Joao Moura; Michael Gienger; Sethu Vijayakumar", "k": ["Reinforcement learning for physical robot control", "Imitation learning (behavioral cloning, inverse RL)", "Flow Matching"], "kind": "P", "pdf": "https://arxiv.org/pdf/2607.06262v1", "ps": 3, "b": 67, "talk": "", "tier": "", "why": "", "top": []}, {"id": "xHjEeyHkhY", "t": "ORD-WM: Learning Object-Centric Rigid Dynamics for 3D World Modeling in Robotic Manipulation", "a": "Yueyang Weng; Xiaopeng Zhang; Yuxi Ou; Mu Yongjin; Chengzhi zhao; Yanjie Li", "k": ["Video models and latent world models for robot learning", "Robot manipulation, 3D Dynamics Prediction"], "kind": "P", "pdf": "https://arxiv.org/pdf/2610.23156v1", "ps": 3, "b": 16, "talk": "", "tier": "", "why": "", "top": []}, {"id": "hr2FYFod4n", "t": "OSCAR: Obstacle Survival Curves for Adaptive Robot Navigation", "a": "Hshmat Sahak; Aoran Jiao; Nicholas Rhinehart; Timothy Barfoot", "k": ["Combination of learning and planning in robotics", "Robot navigation and locomotion"], "kind": "S", "pdf": "https://arxiv.org/pdf/2606.00990v3", "ps": 3, "b": 204, "talk": "S8", "tier": "", "why": "", "top": [], "sum": "A mobile robot on known routes can waste time waiting behind a temporary obstacle or rerouting when it would soon clear. OSCAR learns how long each obstacle class typically persists using survival models built from online experience, and a time-dependent graph planner sets a patience threshold per blocked edge. In simulation, time-to-goal came within 1% of an oracle after fewer than 20 observations per class."}, {"id": "AIInkHZlvB", "t": "PACE: Temporal-Role Tactile Conditioning for Chunk-Based Insertion Policies", "a": "Zhiyuan Chen; Shixiong Xu; Shuai Chen; You Yangwei", "k": ["Imitation learning (behavioral cloning, inverse RL)", "Multimodal perception, sensor fusion, and robot vision", "Visuotactile imitation learning", "Contact-rich robotic manipulation"], "kind": "O", "pdf": "https://arxiv.org/pdf/2610.16308v1", "ps": 2, "b": 164, "talk": "O6", "tier": "M", "why": "Oral: tactile-conditioned chunked insertion policies — precision insertion", "top": ["Perception & vision", "Precision", "Dexterous/contact-rich", "RL"], "sum": "Visuotactile insertion policies usually fold all touch feedback into one pathway. PACE splits tactile input into three roles: persistent contact conditions action-chunk generation, sudden contact events correct the chunk, and predicting contact consequences shapes training. It averaged 90.7% success on five real insertion tasks, over 44 points above baselines, and 88.7% on six ManipulationNet configurations including 0.1 mm clearance."}, {"id": "fuB1LcFk9g", "t": "PACER: Process-Aware VLA Policy Learning from Human Corrections for Robotic Disassembly", "a": "Chang Liu; Sibo Tian; Litian Gong; Zhiwen Fan; Jiachen Li; Xiao Liang; Minghui Zheng", "k": ["Robot foundation models and general-purpose knowledge systems", "Imitation learning (behavioral cloning, inverse RL)"], "kind": "P", "pdf": "https://arxiv.org/pdf/2610.19248v1", "ps": 3, "b": 134, "talk": "", "tier": "S", "why": "Disassembly from human corrections", "top": ["VLA testing", "Dexterous/contact-rich", "RL", "Efficient/real-time"], "sum": "Robotic disassembly must cope with product variation, step ordering, and precise contact, but limited demonstrations for supervised fine-tuning miss these shifts. PACER reuses the policy's rollouts and human corrections, weighting each action chunk by progress toward the target and by trace source and outcome. On UR5e motherboard disassembly it completed 87 of 100 held-out trials versus 54 of 100 for vanilla post-SFT."}, {"id": "2vDRocNuih", "t": "PAKT: Physically-Aligned Kinesthetic Teaching for Reinforcement Learning", "a": "Lars Johannsmeier; Yashraj Narang", "k": ["Reinforcement learning for physical robot control", "Robotic data generation", "Demonstration collection for reinforcement learning"], "kind": "P", "pdf": "https://arxiv.org/pdf/2609.25630v1", "ps": 1, "b": 102, "talk": "", "tier": "", "why": "", "top": []}, {"id": "XA0dFQQlqP", "t": "PanoVine: Whole-Body Visuomotor Control for Soft Growing Vine Robot", "a": "Yimeng Qin; Xiaomeng Xu; William E. Heap; Aditi Oak; Shuran Song; Allison Okamura", "k": ["Robot systems, hardware, and sensors for learning", "Imitation learning (behavioral cloning, inverse RL)", "Soft robot, vine robot", "Whole-body sensing"], "kind": "P", "pdf": "https://arxiv.org/pdf/2606.22923v2", "ps": 1, "b": 173, "talk": "", "tier": "", "why": "", "top": []}, {"id": "JhEwJ56SH3", "t": "PartialBiGrasp: Inferring Hidden Local Geometry for Bimanual Grasping from Partial Views", "a": "Ayush Kaura; Vignesh Vembar; Md Faizal Karim; Keshab Patra; Madhava Krishna", "k": ["Robot manipulation"], "kind": "P", "pdf": "https://arxiv.org/pdf/2608.19188v1", "ps": 2, "b": 136, "talk": "", "tier": "", "why": "", "top": []}, {"id": "rwx9GCSVjH", "t": "PathLift: Depth-Conditioned Metric Lifting for Visual-Navigation Priors", "a": "Gwanjun Shin; Hyeongseok Suh; Hongmo Jung; Jongwoo Lim", "k": ["Combination of learning and planning in robotics", "Robot safety, alignment, and safe learning-based systems", "Visual Navigation"], "kind": "P", "pdf": "https://arxiv.org/pdf/2610.16103v1", "ps": 1, "b": 175, "talk": "", "tier": "", "why": "", "top": []}, {"id": "Sal8Urvt1F", "t": "PathPainter: Transferring the Generalization Ability of Image Generation Models to Embodied Navigation", "a": "Yijin Wang; Yuru Tian; Xijie Huang; Weiqi Gai; Mo Zhu; Xin Zhou; Yuze Wu; Fei Gao", "k": ["Robot navigation and locomotion"], "kind": "P", "pdf": "https://arxiv.org/pdf/2605.07496v3", "ps": 1, "b": 158, "talk": "", "tier": "", "why": "", "top": []}, {"id": "kCeFEyLOuW", "t": "PAWN: Preference-Aware Semantic NFT for Online Reinforcement Learning of Flow-based VLAs", "a": "Haomin Zuo; Wenzhan Li; Ruimao Zhang; Yulan Guo", "k": ["Reinforcement learning for physical robot control", "Robot manipulation"], "kind": "P", "pdf": "", "ps": 1, "b": 92, "talk": "", "tier": "", "why": "", "top": []}, {"id": "c5oiL7JqbQ", "t": "Perceptive Behavior Foundation Model: Adapting Human Motion Priors to Robot-Centric Terrain", "a": "Zifan Wang; Yizhao Li; Teli Ma; Qiang Zhang; Yudong Fan; Hao Xu; Shuo Yang; Junwei Liang", "k": ["Combination of learning and planning in robotics", "Robot foundation models and general-purpose knowledge systems"], "kind": "P", "pdf": "https://arxiv.org/pdf/2606.08059v3", "ps": 3, "b": 166, "talk": "", "tier": "", "why": "", "top": []}, {"id": "9Jm97oFGuA", "t": "Perfect Demo Makes Poor Teacher:Learning Robust Alignment from Critical Motion Segments", "a": "Mingyu Liu; Zeju Li; Jiuhe Shu; Hanqing Wang; Yuhao Chao; Hao Chen; Chunhua Shen", "k": ["Robot manipulation", "Imitation learning (behavioral cloning, inverse RL)"], "kind": "P", "pdf": "https://arxiv.org/pdf/2606.15587v2", "ps": 2, "b": 36, "talk": "", "tier": "", "why": "", "top": []}, {"id": "zhiG7XB56D", "t": "Phase-Conditioned Affordance Fields for SE(3)-Equivariant Visuomotor Policies", "a": "Xinzhe Chen; Liqi Huang; Sihua Ren; Haowen Sun; Mingyang Li; Zeyang Liu; Xingyu Chen; Xuguang Lan", "k": ["Robot manipulation", "Learning representations for robotic perception and control"], "kind": "P", "pdf": "https://arxiv.org/pdf/2610.17281v1", "ps": 1, "b": 129, "talk": "", "tier": "", "why": "", "top": []}, {"id": "lY47GBfn32", "t": "PHUMA: Physically Reliable Humanoid Locomotion Dataset", "a": "Kyungmin Lee; Sibeen Kim; Youngdo Lee; Minho Park; Hyunseung Kim; Dongyoon Hwang; Donghu Kim; Hojoon Lee; Jaegul Choo", "k": ["Benchmarks and datasets for robot learning"], "kind": "S", "pdf": "https://arxiv.org/pdf/2510.26236v3", "ps": 3, "b": 196, "talk": "S7", "tier": "", "why": "", "top": [], "sum": "Motion capture data for humanoid locomotion is scarce and costly, while internet video is plentiful but yields physically unrealistic motion. PHUMA is a 73-hour dataset built by filtering motions for physical plausibility and retargeting them under physical constraints. Policies trained on it track motions more successfully than those trained on AMASS or Humanoid-X and transfer zero-shot to a Unitree G1; no rate is stated."}, {"id": "gO08puaqia", "t": "PhysCoRe: Physics-Corrected Residual World Models for Material-Aware Deformable Dynamics", "a": "Haocheng Yin; Shuohan Tao; Yongsheng Chen; Lu Gan", "k": ["Video models and latent world models for robot learning", "Robot manipulation", "Deformable Object Manipulation", "Dynamics Modeling"], "kind": "P", "pdf": "https://arxiv.org/pdf/2607.20653v3", "ps": 2, "b": 46, "talk": "", "tier": "S", "why": "Material-aware deformable dynamics", "top": ["World models", "Deformable"], "sum": "Predicting how deformable objects change under manipulation is hard: per-object material fitting is slow, and end-to-end models generalize poorly and can break physics. PhysCoRe pairs a differentiable Material Point Method simulator with one network inferring per-particle elasticity from vision and another correcting simulator errors. It beats state-of-the-art baselines on real manipulation sequences; no specific numbers are given."}, {"id": "tQRHDxUApa", "t": "Physics-Aware Object-Centric SE(3) Forecasting for Real-Time Proactive Dynamic Grasping", "a": "Yirui Zhou; Hongli XU; Ying Zheng; Yi Wang; Lap-Pui Chau", "k": ["Robot manipulation", "Combination of learning and planning in robotics", "Dynamic Grasping", "Obejct-centric Forecasting"], "kind": "P", "pdf": "https://arxiv.org/pdf/2610.17843v1", "ps": 3, "b": 128, "talk": "", "tier": "", "why": "", "top": []}, {"id": "VKVM1q9FbN", "t": "Physics-Guided Biomechanical Gait Adaptation for Humanoid Locomotion on Extreme Sloped Terrains", "a": "Xuanyu Chen; Mohan Liu; DENGCHEN MEI; Zhihao Gu; Zhang Haitian; Mao Kaimin; Haiyue Zhu; Yan Shijun; Lin Wang", "k": ["Reinforcement learning for physical robot control", "Robot navigation and locomotion"], "kind": "P", "pdf": "https://arxiv.org/pdf/2607.07830v1", "ps": 3, "b": 158, "talk": "", "tier": "", "why": "", "top": []}, {"id": "A1Wg3RqdsR", "t": "PIGEON: VLM-Driven Object Navigation via Points of Interest Selection", "a": "Cheng Peng; Zhenzhe Zhang; Yanhao Zhang; Heng Wang; Pengwei Wang; Zhongyuan Wang; Cheng Chi; Shanghang Zhang; Jing Liu", "k": ["Robot navigation and locomotion"], "kind": "P", "pdf": "https://arxiv.org/pdf/2511.13207v2", "ps": 1, "b": 161, "talk": "", "tier": "", "why": "", "top": []}, {"id": "2vx7I6aRPS", "t": "PIVOT: Policy Improvement via Trust-Region Optimization from Deployment Experience", "a": "Shenghan Lin; Qicheng Xu; Zhecheng Yuan; Xiangchen Tian; Chenhao Lu; Zilin Kang; Muhan Wang; Xiuyu Xie; Huazhe Xu", "k": ["Robot manipulation", "Reinforcement learning for physical robot control"], "kind": "P", "pdf": "", "ps": 1, "b": 84, "talk": "", "tier": "", "why": "", "top": []}, {"id": "RExYYVsLbT", "t": "Plann3r: Predicting Planning Costs Grounded in 3D", "a": "Aditya Vadali; Krish Pandya; Vansh Garg; Nishant Chandna; Dustin Craggs; Feras Dayoub; Madhava Krishna; Sourav Garg", "k": ["Learning representations for robotic perception and control", "Robot navigation and locomotion"], "kind": "P", "pdf": "", "ps": 2, "b": 226, "talk": "", "tier": "", "why": "", "top": []}, {"id": "awVlNORXDS", "t": "PLATO: Preintegration-Based Likelihood Maximization from Accurate Trajectory Observations for Neural Inertial Odometry", "a": "Haoying Li; Qihang Liu; Yifan Peng; Keyan Miao; Junfeng Wu", "k": ["Probabilistic learning and uncertainty in robotics", "Multimodal perception, sensor fusion, and robot vision"], "kind": "P", "pdf": "", "ps": 1, "b": 194, "talk": "", "tier": "", "why": "", "top": []}, {"id": "GMAZdF34n5", "t": "PLaW-VLA: Predictive Latent World Modeling for Vision-Language-Action Policies", "a": "Yu Liu; Hetian Guo; Tianlv Huang; Ziyi Cai; Wudi Chen; Hantang WANG; Qiutong Liu; Yingzhi Peng; Wei Han; Peijun Tang; Jianan Wang; zipei fan; Zhiyuan Zha; Xuan Song", "k": ["Video models and latent world models for robot learning", "Learning representations for robotic perception and control"], "kind": "P", "pdf": "https://arxiv.org/pdf/2610.12285v1", "ps": 3, "b": 2, "talk": "", "tier": "", "why": "", "top": []}, {"id": "RRl1xXZLdM", "t": "Play2Perfect: What Matters in Dexterous Play Pretraining for Precise Assembly?", "a": "Tyler Ga Wei Lum; Kushal Kedia; Karen Liu; Jeannette Bohg", "k": ["Reinforcement learning for physical robot control", "Robot manipulation"], "kind": "O", "pdf": "https://arxiv.org/pdf/2606.26428v4", "ps": 2, "b": 126, "talk": "O5", "tier": "S", "why": "Oral: dexterous pretraining for precise assembly — precision", "top": ["Precision", "Training frontier", "Dexterous/contact-rich", "RL"], "sum": "Precise assembly with multi-fingered hands is hard because data collection and reward-driven exploration are both impractical. Play2Perfect pretrains a reinforcement learning policy on task-agnostic play with varied objects, then finetunes it for assembly. The pretrained prior is 33 times more sample-efficient than training from scratch, and zero-shot sim-to-real transfer reaches 60 percent success on insertions with 0.5 mm clearance."}, {"id": "GeL3GdwSYo", "t": "Playful Agentic Robot Learning", "a": "Junyi Zhang; Jiaxin Ge; Hanjun Yoo; Letian Fu; Zihan Yang; Yaowei Liu; Raj Saravanan; Shaofeng Yin; Justin Yu; Dantong Niu; Zirui Wang; Roei Herzig; Ken Goldberg; Yutong Bai; David M. Chan; Ion Stoica; Angjoo Kanazawa; Jiahui Lei; Haiwen Feng; Trevor Darrell", "k": ["Combination of learning and planning in robotics"], "kind": "S", "pdf": "https://arxiv.org/pdf/2606.19419v1", "ps": 3, "b": 99, "talk": "S6", "tier": "", "why": "", "top": [], "sum": "Code-writing robot agents mostly learn new skills only when explicitly asked. The authors let an agent team, RATs, learn through self-directed play: it invents exploratory tasks, writes and checks robot code, retries using step-by-step feedback, and stores working code in a skill library for later use. On held-out tasks, these skills beat the CaP-Agent0 baseline by 20.6 points on LIBERO-PRO and 17.0 points on MolmoSpaces."}, {"id": "XnyoJXimAK", "t": "Playing Soccer Like Humans Do: Learning Versatile and Agile Humanoid Soccer via Latent Motion Priors", "a": "Haoyu Shao; Yunshen Wang; Jingze Zhang; Shaohang Zhu; Yong-Lu Li; Tianzhu Zhang; Baoxiong Jia; Siyuan Huang", "k": ["Reinforcement learning for physical robot control", "Learning representations for robotic perception and control"], "kind": "P", "pdf": "", "ps": 2, "b": 177, "talk": "", "tier": "", "why": "", "top": []}, {"id": "HATezFmdN5", "t": "PlayWorld: Learning Robot World Models from Autonomous Play Data", "a": "Tenny Yin; Zhiting Mei; Zhonghe Zheng; Miyu Yamane; David Wang; Jade Sceats; Samuel M Bateman; Lihan Zha; Apurva Badithela; Ola Sho; Anirudha Majumdar", "k": ["Video models and latent world models for robot learning", "Robotic data generation", "Policy Evaluation", "Reinforcement Learning Fine-Tuning for Robot Policies"], "kind": "P", "pdf": "", "ps": 3, "b": 26, "talk": "", "tier": "", "why": "", "top": []}, {"id": "JKoP9L6myQ", "t": "PoLAR: Factorizing Extent and Mode in Latent Actions for Robot Policy Learning", "a": "Youngjoon Jeong; Jihwan Yu; Minsoo Jo; Junha Chun; Taesup Kim", "k": ["Learning representations for robotic perception and control", "Imitation learning (behavioral cloning, inverse RL)", "Latent Actions"], "kind": "P", "pdf": "https://arxiv.org/pdf/2606.21139v2", "ps": 1, "b": 22, "talk": "", "tier": "", "why": "", "top": []}, {"id": "M8NqiSkMDr", "t": "PolyFusion: Collision-Free Robot Learning using Bernstein Polynomials", "a": "Amisha Bhaskar; Gage MacLin; Camilla Tabasso; Leo Lin; Pratap Tokekar; Venanzio Cichella; Joshua Migdal; Tye Brady; Taskin Padir", "k": ["Imitation learning (behavioral cloning, inverse RL)", "Learning representations for robotic perception and control"], "kind": "P", "pdf": "", "ps": 1, "b": 214, "talk": "", "tier": "S", "why": "Collision-free learning with Bernstein polynomials", "top": ["Motion control & safety", "Perception & vision", "RL"], "sum": "Replaces the policy's dense action output with a piecewise Bernstein (Bézier) polynomial defined by a few control points. This gives synthetic training data from a single demo, analytic safety guarantees, and a convex projection that repairs infeasible trajectories while keeping key poses fixed."}, {"id": "P8H2WZH2Tw", "t": "Predictive Representation Learning for Manipulation via Streaming Egocentric 3D Hand Forecasting", "a": "Ruicong Liu; Yifei Huang; Liangyang Ouyang; Caixin Kang; Yoichi Sato", "k": ["Learning representations for robotic perception and control", "Task and motion planning", "Egocentric vision, hand pose forecasting"], "kind": "P", "pdf": "", "ps": 1, "b": 118, "talk": "", "tier": "", "why": "", "top": []}, {"id": "TPeVwyCt8w", "t": "Preference-Calibrated Human-in-the-Loop Reinforcement Learning for Robotic Manipulation", "a": "Zeyi Liu; Guangyao Liu; Yinuo Qu; Yuquan Xue; Bofang Jia; Chunhua Yang; Weihua Gui; Keke Huang; Ziwei Wang", "k": ["Reinforcement learning for physical robot control", "Robot manipulation"], "kind": "P", "pdf": "https://arxiv.org/pdf/2606.03949v2", "ps": 1, "b": 91, "talk": "", "tier": "", "why": "", "top": []}, {"id": "8YqfXYof0Y", "t": "Pri4R: Learning World Dynamics for Vision-Language-Action Models with Privileged 4D Representation", "a": "Jisoo Kim; Jungbin Cho; Sanghyeok Chu; Ananya Bal; Jinhyung Kim; Gunhee Lee; Sihaeng Lee; Seung Hwan Kim; Bohyung Han; Hyunmin Lee; Laszlo A. Jeni; Seungryong Kim", "k": ["Robot manipulation", "Robot foundation models and general-purpose knowledge systems"], "kind": "P", "pdf": "https://arxiv.org/pdf/2603.01549v2", "ps": 3, "b": 19, "talk": "", "tier": "", "why": "", "top": []}, {"id": "DyO8vc0zYK", "t": "Prioritized Multi-Constraint Coordination for Safe Multi-Robot Formation Navigation", "a": "Xiaofan Li; Zhifeng Yu; Yuxuan Ma; Jianwu Fang; Jianru Xue", "k": ["Robot navigation and locomotion", "Robot safety, alignment, and safe learning-based systems, multi-robot system, safe multi-agent reinforcement learning"], "kind": "P", "pdf": "", "ps": 1, "b": 170, "talk": "", "tier": "", "why": "", "top": []}, {"id": "rTX0zr5FjT", "t": "PRISM: Bridging Multimodality and Real-Time Control in Multisensory Policies", "a": "Amisha Bhaskar; Pratap Tokekar; Stefano Di Cairano; Alexander Schperberg", "k": ["Imitation learning (behavioral cloning, inverse RL)", "Multimodal perception, sensor fusion, and robot vision"], "kind": "P", "pdf": "", "ps": 2, "b": 15, "talk": "", "tier": "", "why": "", "top": []}, {"id": "rQZHMVTYYy", "t": "PRISM: Polynomial Representations for Interaction-Structured Motor Control", "a": "Seung Hyun Lee; Stella X. Yu", "k": ["Learning representations for robotic perception and control", "Polynomial interaction", "Motor control", "Sensorless compliance"], "kind": "P", "pdf": "https://arxiv.org/pdf/2607.23473v3", "ps": 2, "b": 75, "talk": "", "tier": "", "why": "", "top": []}, {"id": "rK0JCfddwK", "t": "Pro-HOI: Perceptive Root-guided Humanoid-Object Interaction", "a": "Yuhang Lin; Jiyuan Shi; Dewei Wang; Jipeng Kong; Yong Liu; Chenjia Bai; Xuelong Li", "k": ["Reinforcement learning for physical robot control"], "kind": "P", "pdf": "https://arxiv.org/pdf/2603.01126v1", "ps": 2, "b": 197, "talk": "", "tier": "", "why": "", "top": []}, {"id": "hvArz6F8eA", "t": "Probing Collision Grounding in Vision-Language Models for Safe Human–Robot Collaboration", "a": "Jun Wang; Xiaohao Xu; Xiaonan Huang", "k": ["Robot safety, alignment, and safe learning-based systems", "Human-robot interaction and natural language instruction"], "kind": "P", "pdf": "https://arxiv.org/pdf/2605.31196v1", "ps": 1, "b": 73, "talk": "", "tier": "S", "why": "Collision grounding in VLMs for safe HRC", "top": ["Motion control & safety"], "sum": "Safe human-robot collaboration needs a monitor that can tell whether a robot is clear, in contact, or about to collide. The authors built TouchSafeBench, a Habitat 3.0 simulated benchmark of 2,940 indoor episodes with multi-view RGB-D, trajectory maps and contact labels. The best vision-language model scored below 50% average Macro-F1, so current models are not reliable for this task."}, {"id": "ecN9efL5zs", "t": "Procedural Generation of Articulated Simulation-Ready Assets", "a": "Abhishek Joshi; Beining Han; Jack Nugent; Max Gonzalez Saez-Diez; Yiming Zuo; Jonathan Liu; Hongyu Wen; Stamatis Alexandropoulos; Karhan Kayan; Anna Calveri; Tao Sun; Gaowen Liu; Yi Shao; Alexander Raistrick; Jia Deng", "k": ["Sim-to-real transfer", "Robot manipulation", "Articulated assets", "Procedural generation"], "kind": "P", "pdf": "https://arxiv.org/pdf/2505.10755v3", "ps": 1, "b": 197, "talk": "", "tier": "", "why": "", "top": [], "sum": "Infinigen-Articulated: a toolkit for procedurally generating realistic articulated objects for robot simulation. Provides generators for 18 common categories plus Blender (Geometry Nodes) utilities to build custom ones, and exports simulation-ready assets with kinematic trees, materials and dynamics parameters to URDF, USD and MJCF."}, {"id": "J8pJIDI6rM", "t": "Progress-Guided Preference Generation for Aligning Generative Control Policies", "a": "Tung Minh Luu; Tri Ton; Minh Duc Nguyen; Thanh Xuan Nguyen; Nguyen Gia Binh; Quang Tan Nguyen; Vu N. Duong; Daniel Sonntag; Duy Minh Ho Nguyen; Vien Anh Ngo; Chang D. Yoo", "k": ["Imitation learning (behavioral cloning, inverse RL)", "Robot manipulation", "Preference-based Reinforcement Learning", "Gnerative Policy Fine-tuning"], "kind": "P", "pdf": "https://arxiv.org/pdf/2610.25692v1", "ps": 2, "b": 30, "talk": "", "tier": "", "why": "", "top": []}, {"id": "317SZV2vuS", "t": "PROOF: Perceptive Robustness via Out-of-Distribution Fallback for Legged Locomotion", "a": "Siyuan Wang; Dongjie Zhu; Jinxuan Lu; Wenjun Xu; Jiankun WANG", "k": ["Reinforcement learning for physical robot control", "Sim-to-real transfer"], "kind": "P", "pdf": "", "ps": 3, "b": 169, "talk": "", "tier": "", "why": "", "top": []}, {"id": "5oNzcK6SBR", "t": "PROSE: Training-Free Egocentric Scene Registration with Vision-Language Models", "a": "Zhiang Chen; Nahyuk Lee; Boyang Sun; Taein Kwon; Marc Pollefeys; Zuria Bauer; Sunghwan Hong", "k": ["Multimodal perception, sensor fusion, and robot vision"], "kind": "P", "pdf": "https://arxiv.org/pdf/2606.16569v2", "ps": 1, "b": 177, "talk": "", "tier": "", "why": "", "top": []}, {"id": "ULCeXiRzJD", "t": "ProxiDex: Learning Dynamics-Guided Proximity Policy for Dexterous Manipulation", "a": "Yushan Bai; Boyu Zheng; Zhiyang Mao; Hongzheng Sun; Yuchuang Tong; En Li; Zhengtao Zhang", "k": ["Robot manipulation", "Imitation learning (behavioral cloning, inverse RL)", "Dexterous Manipulation", "Latent Dynamics Model"], "kind": "P", "pdf": "https://arxiv.org/pdf/2609.16586v1", "ps": 2, "b": 132, "talk": "", "tier": "", "why": "", "top": []}, {"id": "tfC6LMD02z", "t": "Proxy Policy Steering", "a": "Chuanruo Ning; Tianrui Wang; Wei-Chiu Ma; Kuan Fang", "k": ["Robot manipulation", "Robot foundation models and general-purpose knowledge systems", "Policy Steering"], "kind": "P", "pdf": "https://arxiv.org/pdf/2609.09148v3", "ps": 2, "b": 27, "talk": "", "tier": "", "why": "", "top": []}, {"id": "QwpnI3BlwT", "t": "PRTS: A Primitive Reasoning and Tasking System via Contrastive Representations", "a": "Yang Zhang; Jiangyuan Zhao; Chenyou Fan; Fangzheng YAN; Tian Li; Haitong Tang; Sen Fu; Xuaner Wu; Qizhen Weng; Weinan Zhang; Xiu Li; Chi Zhang; Chenjia Bai; Xuelong Li", "k": ["Robot foundation models and general-purpose knowledge systems", "Learning representations for robotic perception and control", "Scaling Contrastive Reinforcement Learning into Pre-training"], "kind": "S", "pdf": "https://arxiv.org/pdf/2604.27472v1", "ps": 1, "b": 14, "talk": "S1", "tier": "", "why": "", "top": [], "sum": "Most vision-language-action models are pretrained with supervised behavior cloning, which ignores goal reaching and task progress. PRTS instead uses contrastive goal-conditioned reinforcement learning, treating instructions as goals and learning embeddings that estimate how likely a state-action pair reaches the goal, from reward-free offline trajectories. Pretrained on 167B tokens, it reports state-of-the-art results on several simulation benchmarks and a 14-task real-world suite."}, {"id": "tJpI5D27wh", "t": "PTLD: Sim-to-Real Privileged Tactile Latent Distillation for dexterous manipulation", "a": "Rosy Chen; Mustafa Mukadam; Michael Kaess; Tingfan Wu; Francois Robert Hogan; Jitendra Malik; Akash Sharma", "k": ["Sim-to-real transfer", "Robot manipulation", "Tactile representation learning"], "kind": "P", "pdf": "https://arxiv.org/pdf/2603.04531v3", "ps": 2, "b": 153, "talk": "", "tier": "", "why": "", "top": []}, {"id": "XQGBZwsuXt", "t": "Push the Limit: Learning High-Speed Sprinting and Aggressive Cornering on a Full-Scale Humanoid", "a": "Huaxing Huang; Ruidong Li; Jinchao Han; Ziyang Dong; Wenhao Cui", "k": ["Reinforcement learning for physical robot control", "Robot navigation and locomotion"], "kind": "P", "pdf": "https://arxiv.org/pdf/2610.14840v1", "ps": 3, "b": 189, "talk": "", "tier": "", "why": "", "top": []}, {"id": "9seU2kEIxR", "t": "Q-OIL: Optimistic Exploration in Learning from Human Interventions", "a": "Pranav Teegavarapu; Sriyash Poddar; Rico Qi; Cleah Winston; Krisha Khandelwal; Natasha Jaques; Abhishek Gupta", "k": ["Reinforcement learning for physical robot control", "Human-robot interaction and natural language instruction", "Learning from interventions"], "kind": "P", "pdf": "", "ps": 1, "b": 103, "talk": "", "tier": "", "why": "", "top": []}, {"id": "SaMjmUr6xC", "t": "RAM: Reachability Across Morphologies", "a": "Tim Walter; Xinyu Chen; Jonathan Külz; Matthias Althoff", "k": ["Learning representations for robotic perception and control"], "kind": "S", "pdf": "https://arxiv.org/pdf/2606.09108v2", "ps": 2, "b": 84, "talk": "S5", "tier": "", "why": "", "top": [], "sum": "Knowing which poses a robot can reach matters for design and operation, but current methods are slow, imprecise, or tied to one robot shape. RAM is a neural model that takes morphology as input, predicts reachability including self-collisions, and is trained on a released forward-kinematics dataset. It reaches 84% balanced accuracy, 15 points above a generative IK baseline, and runs about 1000 times faster."}, {"id": "k9EjTLL8bA", "t": "RAMT-VLA: Reliability-Aware Memory Tracing for Historical Support Assessment in Vision-Language-Action Models", "a": "Wenhao Li; Dong Li; Zhihua Xie; Wenbo Li", "k": ["Robot foundation models and general-purpose knowledge systems"], "kind": "P", "pdf": "", "ps": 2, "b": 85, "talk": "", "tier": "S", "why": "Reliability-aware VLA memory", "top": ["VLA testing", "Long-horizon", "Efficient/real-time"]}, {"id": "AAn8ouEHwO", "t": "RARM: Confidence-Gated Progress Reward Modeling for RL in Manipulation", "a": "Pengzhi Yang; Xinyu Wang; Pengyu Jing; Kehan Wen; Yiduo Qu; Zhenhao Huang; Minghao Fu; Xin Liu; Yaheng Shen; Fan Shi", "k": ["Reinforcement learning for physical robot control", "Robot manipulation", "Reward Model"], "kind": "P", "pdf": "https://arxiv.org/pdf/2606.22027v5", "ps": 1, "b": 95, "talk": "", "tier": "", "why": "", "top": []}, {"id": "FFB8qNJwV2", "t": "REACT: Rolling Denoising and Dual Decoupling for Reactive Robot Control with VLA Models", "a": "Houlong Xiong; Zhenqi Qiu; Zechen Wang; Suohang Zhang; Yiyu Ren; Wanting Xu; Hongfei Niu; Chengyang He; GE SUN; Ran Cheng; Qian Zhu", "k": ["Robot manipulation", "Robot foundation models and general-purpose knowledge systems", "Reactive Robot Control", "Vision-Language-Action Models"], "kind": "S", "pdf": "https://arxiv.org/pdf/2610.12007v1", "ps": 1, "b": 61, "talk": "S2", "tier": "S", "why": "Reactive VLA control", "top": ["VLA testing", "Efficient/real-time"], "sum": "Flow-based VLA models output action chunks, where long chunks run smoothly but react slowly, and frequent replanning reacts faster but jerkily. REACT keeps a rolling buffer of actions at staggered denoising stages, refines them with each new observation, executes the most finished block, and decouples sensing, encoding, denoising and execution. On RoboTwin 2.0 and real tasks it reports better success, latency and smoothness; no numbers are given."}, {"id": "2tjuz95jmb", "t": "Reactive Closed-Loop Motion Planning Towards Universal Humanoid Whole-Body Control", "a": "Xiao Chen; Weishuai Zeng; Xiaojie Niu; ZiRui Wang; Jianan Li; Huayi Wang; Furui Xu; Jiahe Chen; weixiang zhong; Lihe Ding; Kailin Li; Jiangmiao Pang; Tai Wang; Tianfan Xue; Jingbo Wang", "k": ["Task and motion planning", "Humanoid Whole-Body Planning and Control"], "kind": "P", "pdf": "https://arxiv.org/pdf/2606.30362v2", "ps": 2, "b": 208, "talk": "", "tier": "", "why": "", "top": []}, {"id": "VnF3D7ia9Y", "t": "Reactive Task-Oriented Robot-Human Handovers via Generative Hypothesis Selection", "a": "Carmen Scheidemann; Andreea Tulbure; Pascal Burkhard; Marco Hutter", "k": ["Human-robot interaction and natural language instruction", "Robot manipulation"], "kind": "P", "pdf": "https://arxiv.org/pdf/2610.08003v1", "ps": 1, "b": 75, "talk": "", "tier": "", "why": "", "top": []}, {"id": "jlXzHOkSXq", "t": "Real-Time Execution with Autoregressive Policies", "a": "Sangkyu Lee; Seohyeon Park; Tackgeun You; Avi Caciularu; Idan Szpektor; Hwasup Lim; Youngjae Yu", "k": ["Robot foundation models and general-purpose knowledge systems", "Imitation learning (behavioral cloning, inverse RL)", "Real-time execution", "Vision-Language-Action Model"], "kind": "P", "pdf": "https://arxiv.org/pdf/2606.13355v1", "ps": 2, "b": 11, "talk": "", "tier": "S", "why": "Real-time autoregressive policies", "top": ["VLA testing", "RL", "Efficient/real-time"], "sum": "Real-time control research mostly targets diffusion policies, though slow rollouts make autoregressive policies the harder case. The authors show autoregressive policies can run in real time by shortening the tokenization horizon and using constrained decoding that enforces strict latency limits and allows decoding several trajectories. In simulated and real tests it beat a comparable flow-matching policy and finished tasks faster than synchronous inference; no numbers are given."}, {"id": "LoGyKMEVVc", "t": "RealDexUMI: A Wearable Universal Manipulation Interface for Dexterous Robot Learning", "a": "Chaoyi Xu; Yixuan Jiang; Jiahui Huan; Yuhui Fu; Hao Yu Zhou; Weitian Yuan; Jiayi Yu; Wanpeng Zhang; Haoqi Yuan; Zongqing Lu", "k": ["Robot manipulation", "Hardware design and optimization", "Dexterous manipulation", "Demonstration collection"], "kind": "P", "pdf": "https://arxiv.org/pdf/2606.06033v2", "ps": 3, "b": 41, "talk": "", "tier": "", "why": "", "top": []}, {"id": "PAX622BSf6", "t": "REAP: Learning General Rearrangement Heuristics from Motion-Planner Feedback", "a": "Daniel Swoboda; Hector Geffner", "k": ["Combination of learning and planning in robotics", "Task and motion planning", "Generalised Planning for Robotics"], "kind": "P", "pdf": "https://arxiv.org/pdf/2610.23973v1", "ps": 1, "b": 140, "talk": "", "tier": "S", "why": "Planner-feedback rearrangement heuristics", "top": ["Long-horizon", "Planning & optimization"], "sum": "Learns a relational GNN heuristic over a simple symbolic task model; a motion planner acts as the supervisor during training, revealing geometric feasibility the symbolic model can't express. Needs ~10x fewer planner calls than classical heuristic search and generalizes to larger instances without retraining. Code is open."}, {"id": "HuFkyUA5RR", "t": "Recover, Discover, Plan: Learning Skills and Concepts from Robot Failures", "a": "Bowen Li; Mayank Mishra; Y. Isabel Liu; Stone Tao; Nishanth Kumar; Alexander G. Gray; Ruwan Wickramarachchi; Jonathan Francis; Sebastian Scherer; Tom Silver", "k": ["Combination of learning and planning in robotics", "Task and motion planning", "Recovery Learning", "Skill and Concept Learning"], "kind": "P", "pdf": "https://arxiv.org/pdf/2606.18328v2", "ps": 2, "b": 94, "talk": "", "tier": "", "why": "", "top": []}, {"id": "P1R9iBKyv4", "t": "Relational Spatial Alignment for Vision-Language-Action Models", "a": "Chaoran Zhu; Hengyi Wang; Chenglin Cui; Yazhe Wan; Taein Kwon; Changjae Oh", "k": ["Learning representations for robotic perception and control"], "kind": "P", "pdf": "https://arxiv.org/pdf/2610.24705v1", "ps": 2, "b": 41, "talk": "", "tier": "", "why": "", "top": []}, {"id": "1HqdYVWaXi", "t": "ReSiReg: Towards Spatially Consistent Semantics in Language-Conditioned Robotic Tasks", "a": "Simon Schwaiger; David Seyser; Alessandro Scherl; Wilfried Wöber; Gerald Steinbauer-Wagner", "k": ["Learning representations for robotic perception and control", "Multimodal perception, sensor fusion, and robot vision", "Language-Grounded Robot Control", "Semantic Mapping"], "kind": "P", "pdf": "https://arxiv.org/pdf/2606.19088v1", "ps": 1, "b": 141, "talk": "", "tier": "", "why": "", "top": []}, {"id": "rEmMzoUnpn", "t": "ResSafe: Learning Safety Filtering with Residual Reinforcement Learning for Humanoids", "a": "Gechen Qu; Tong Zhang; Bike Zhang; Yen-Jen Wang; Koushil Sreenath; Claire Tomlin; Jason Jangho Choi", "k": ["Robot safety, alignment, and safe learning-based systems", "Reinforcement learning for physical robot control", "Safe reinforcement learning", "Safety filter"], "kind": "S", "pdf": "https://arxiv.org/pdf/2609.15988v1", "ps": 3, "b": 198, "talk": "S7", "tier": "S", "why": "Safety filtering with residual RL", "top": ["Motion control & safety", "Dexterous/contact-rich", "RL"], "sum": "Humanoid robots are hard to control safely because of complex dynamics, frequent contact and sensitivity to disturbances, and learned policies can still output destabilizing actions. ResSafe splits the work between a nominal policy for task performance and a residual policy that learns safety corrections, acting as a built-in safety filter. It claims a better performance-safety balance, but gives no numbers."}, {"id": "qxboQ98QN4", "t": "Rethinking the Implications of Human Feedback for Preference Learning in Human-Robot Collaboration", "a": "Qiping Zhang; Kate Candon; Debasmita Ghose; Marynel Vázquez", "k": ["Human-robot interaction and natural language instruction", "Explicit and Implicit Human Feedback", "Interactive Learning"], "kind": "P", "pdf": "https://arxiv.org/pdf/2609.13982v1", "ps": 1, "b": 70, "talk": "", "tier": "", "why": "", "top": []}, {"id": "RYXo2ktK1M", "t": "RL Token: Bootstrapping Online RL with Vision-Language-Action Models", "a": "Charles Xu; Jost Tobias Springenberg; Michael Robert Equi; Ali Amin; Adnan Esmail; Sergey Levine; Liyiming Ke", "k": ["Reinforcement learning for physical robot control", "Learning representations for robotic perception and control"], "kind": "O", "pdf": "https://arxiv.org/pdf/2604.23073v2", "ps": 2, "b": 64, "talk": "O4", "tier": "S", "why": "Oral: bootstrapping online RL from VLAs — training frontier", "top": ["Perception & vision", "VLA testing", "Dexterous/contact-rich", "RL"], "sum": "Pretrained vision-language-action models handle many skills but lack the precision and speed real tasks need, and refining them with reinforcement learning is costly. RL Token exposes a compact internal representation and adds a small actor-critic that adjusts actions while staying near the original model. On four real-robot tasks it speeds up the hardest phase by up to 3x within minutes to hours of practice."}, {"id": "Nxn1pyNZpE", "t": "RMMBench: A Comprehensive Benchmark for Robotic Mobile Manipulation", "a": "李华鹏; Fuxiang Feng; Jinqiu Fan; Shuo Yang; FengJiao Chen; Xuezhi Cao; Ran Song; Wei Zhang", "k": ["Benchmarks and datasets for robot learning, robot task planning, mobile manipulation"], "kind": "P", "pdf": "https://arxiv.org/pdf/2610.05414v1", "ps": 2, "b": 105, "talk": "", "tier": "", "why": "", "top": []}, {"id": "qx5mPYiXVi", "t": "Robo-ValueRL: Reliable Value Estimation for Offline-to-Online Reinforcement Learning", "a": "Wenke Xia; Pei Ren; Wenbo Yu; Yizhuo Zhang; Jifan Li; Yixue Zhang; Yinuo Zhao; Qingyang Gao; Jianlong Fu; Jian Tang; Ji-Rong Wen; Zhengping Che; Di Hu", "k": ["Reinforcement learning for physical robot control", "Robot manipulation", "Offline-to-Online Reinforcement Learning"], "kind": "P", "pdf": "https://arxiv.org/pdf/2607.09866v1", "ps": 1, "b": 87, "talk": "", "tier": "", "why": "", "top": []}, {"id": "xWoyO2BPcl", "t": "RoboAffect: Egocentric Emotion Reasoning for Robot Companions in Shared Viewing", "a": "Ze Dong; Hao Shi; Zejia GAO; Zhonghua Yi; Kaiwei Wang; Lin Wang", "k": ["Benchmarks and datasets for robot learning", "Human-robot interaction and natural language instruction", "Egocentric emotion understanding", "Affective robot perception"], "kind": "P", "pdf": "", "ps": 1, "b": 79, "talk": "", "tier": "", "why": "", "top": []}, {"id": "db6WHoqH91", "t": "RoboAug: One Annotation to Hundreds of Scenes via Region-Contrastive Data Augmentation for Robotic Manipulation", "a": "Xinhua Wang; Kun Wu; Zhen Zhao; Hu Cao; Yinuo Zhao; Zhiyuan Xu; Meng Li; Shichao Fan; Di Wu; Yixue Zhang; Ning Liu; Zhengping Che; Jian Tang", "k": ["Learning representations for robotic perception and control", "Robotic data generation"], "kind": "P", "pdf": "https://arxiv.org/pdf/2602.14032v2", "ps": 3, "b": 87, "talk": "", "tier": "", "why": "", "top": []}, {"id": "uMgOYXmgn2", "t": "RoboDreamer: Anticipatory Humanoid Locomotion with Predictive State-Space Models", "a": "Zhe Li; Yangyang Wei; Xichen Yuan; Zhenzhe Zhang; Weihao Yuan; Shanghang Zhang; Jianfei Yang", "k": ["Reinforcement learning for physical robot control", "Robot navigation and locomotion"], "kind": "P", "pdf": "https://arxiv.org/pdf/2609.07096v2", "ps": 3, "b": 171, "talk": "", "tier": "", "why": "", "top": []}, {"id": "EfJCm9am0o", "t": "RoboFFT: Finetuning generative robot policy via online reinforcement learning with forward process", "a": "Yu Li; Shenghe Hu; Yuhan Wang; Yaoxiang Pu; Haotong Zhang; Yuanpei Chen; Yaodong Yang", "k": ["Reinforcement learning for physical robot control", "Imitation learning (behavioral cloning, inverse RL)", "Diffusion RL", "Robot manipulation"], "kind": "P", "pdf": "https://arxiv.org/pdf/2609.32236v1", "ps": 3, "b": 66, "talk": "", "tier": "", "why": "", "top": []}, {"id": "A9AQjk3dAt", "t": "RoboFollow: Unveiling the Instruction Following Mirage in Embodied Agents", "a": "Chang Guo; Yukun Xie; Bohan Tan; Zheng Chang; Zhaokai Yin; Qianli Ma; Yingqiao Wang; Chao.Liang; Zhipeng Zhang", "k": ["Benchmarks and datasets for robot learning", "Human-robot interaction and natural language instruction", "Instruction following", "Vision-Language-Action models"], "kind": "P", "pdf": "https://arxiv.org/pdf/2609.25636v1", "ps": 2, "b": 87, "talk": "", "tier": "S", "why": "Instruction-following mirage in embodied agents", "top": ["Policy eval & safety bounds", "VLA testing"], "sum": "Embodied agents can post high success rates while largely ignoring language when a scene allows only one valid task. RoboFollow uses scenes with multiple task branches, a four-level protocol (L0-L3) perturbing layout and semantics, and separate Intent and Execution scores. Across nine policies, strong L0 results did not reliably carry to harder levels, and common fixes did not close the gap."}, {"id": "xMysKLF2hX", "t": "RoboFQE: Rollout-Free Evaluation of Visual Robot Policies from Offline Trajectories", "a": "Yunfu Deng; Sangwoo Shin; Brahma S Pavse; Josiah P. Hanna", "k": ["Policy evaluation, adversarial scenarios generation, and red teaming"], "kind": "P", "pdf": "https://arxiv.org/pdf/2610.18699v1", "ps": 2, "b": 104, "talk": "", "tier": "S", "why": "Rollout-free policy evaluation from offline data — cheap eval", "top": ["Policy eval & safety bounds"], "sum": "Evaluating robot policies normally needs fresh rollouts on real robots, simulators or world models, which are costly and drift over long tasks. RoboFQE instead estimates a policy's discounted return from existing offline trajectories, using fitted Q-evaluation, a pretrained vision model and learned success labels. It reportedly gives accurate returns and correct policy rankings in simulation and real tasks, including long-horizon ones; no numbers are given."}, {"id": "uizBY3yrgz", "t": "RoboGene: Diversity-Driven Agentic Task Generation Framework for VLA Pre-training", "a": "Yixue Zhang; Kun Wu; Zhi Gao; Zhen Zhao; Pei Ren; Zhiyuan Xu; Fei Liao; Xinhua Wang; Shichao Fan; Di Wu; Qiuxuan Feng; Meng Li; Zhengping Che; Chang Liu; Jian Tang", "k": ["Robot manipulation", "Robotic data generation", "Automated Task Generation", "VLA Pre-training"], "kind": "P", "pdf": "", "ps": 1, "b": 201, "talk": "", "tier": "", "why": "", "top": []}, {"id": "xfZJ2GKrZG", "t": "RoboKit: Accelerating Parallel Differentiable Optimization for Robot Learning", "a": "Jianglong Ye; Xuanbin Peng; Conor Mc Gartoll; Changwei Jing; Lai Wei; Jiali Chen; Xueyan Zou; Xiaolong Wang", "k": ["Robot systems, hardware, and sensors for learning"], "kind": "S", "pdf": "", "ps": 3, "b": 105, "talk": "S6", "tier": "S", "why": "Parallel differentiable optimization", "top": ["Planning & optimization"]}, {"id": "pLyDkcGbkT", "t": "RoboLineage: Agent-Native Data Lifecycle Governance Across Robot Policy Iterations", "a": "Qian Luo; Wentao Guo; Zhennan Qin; Nanchun Guo; Yunhan Zhao; Yi Ma; Yanchao Yang", "k": ["Robot systems, hardware, and sensors for learning", "Robotic data generation", "Data lifecycle governance", "Agentic systems"], "kind": "P", "pdf": "https://arxiv.org/pdf/2606.22142v1", "ps": 3, "b": 96, "talk": "", "tier": "", "why": "", "top": []}, {"id": "Q4ehHMIPmb", "t": "RoboMemory: A Brain-inspired Multi-memory Agentic Framework for Interactive Environmental Learning in Physical Embodied Systems", "a": "Mingcong Lei; Honghao Cai; Yuyuan Yang; Yimou Wu; Jinke Ren; Zezhou Cui; Liangchen Tan; Junkun Hong; Gehan Hu; Shuangyu Zhu; Shaohan Jiang; Ge Wang; Junyuan Tan; Zhenglin Wan; Zhongkai Xue; LI ZHENG; Zhen Li; Shuguang Cui; Yiming Zhao; Yatong Han", "k": ["Task and motion planning", "Robot foundation models and general-purpose knowledge systems"], "kind": "P", "pdf": "https://arxiv.org/pdf/2508.01415v7", "ps": 1, "b": 44, "talk": "", "tier": "", "why": "", "top": []}, {"id": "WBGnJHRIso", "t": "RoboNaldo: Accurate, Stable and Powerful Humanoid Soccer Shooting via Motion-Guided Curriculum Reinforcement Learning", "a": "Yichao Zhong; Yidan Lu; Yuhang Lu; Tianyang TANG; Haoguang Mai; Yixuan Pan; Tianyu Li; Li Chen; Jingbo Wang; Zhongyu Li; Peng Lu; Hongyang Li", "k": ["Reinforcement learning for physical robot control", "Sim-to-real transfer", "Humanoid-Object Interaction", "Atheletic Robots"], "kind": "O", "pdf": "https://arxiv.org/pdf/2606.11092v3", "ps": 2, "b": 181, "talk": "O7", "tier": "", "why": "", "top": [], "sum": "Humanoid soccer shooting trades off stability from motion-tracking reinforcement learning against flexibility from task-reward learning, which struggles to discover kicks. RoboNaldo uses a three-stage curriculum: learn a stable kick from one human reference, adapt to stationary balls at random positions, then to moving balls. Simulated free-kick error drops 48.6%. On a Unitree G1 from 3 m, average error is 0.73 m (free kicks) and 0.86 m (moving balls), with ball speed up to 13.10 m/s."}, {"id": "thG2jwuii6", "t": "RoboPocket: Improve Robot Policies Instantly with Your Phone", "a": "Junjie Fang; Wendi Chen; Han Xue; Fangyuan Zhou; Tian Le; Yi Wang; Yuting Zhang; Jun Lv; Chuan Wen; Cewu Lu", "k": ["Robot systems, hardware, and sensors for learning", "Imitation learning (behavioral cloning, inverse RL)", "Data collection", "Interactive policy learning"], "kind": "P", "pdf": "https://arxiv.org/pdf/2603.05504v3", "ps": 1, "b": 69, "talk": "", "tier": "", "why": "", "top": []}, {"id": "MWj9u2VZPx", "t": "RoboSnap: One-Shot Real-to-Sim Scene Generation for Generalizable Robot Learning and Evaluation", "a": "Shujie Zhang; jingkun yi; Weipeng Zhong; Zirui Zhou; Yangkun Zhu; Hanqing Wang; Xudong XU; Weinan Zhang; Chunhua Shen", "k": ["Robotic data generation", "Robot manipulation", "Real-to-sim scene generation", "Robot Policy Evaluation"], "kind": "P", "pdf": "https://arxiv.org/pdf/2607.06699v1", "ps": 3, "b": 80, "talk": "", "tier": "", "why": "", "top": []}, {"id": "zsHXQqYhFn", "t": "Robot-DIFT: Correspondence-Sensitive Diffusion Features for Contact-Rich Robot Manipulation", "a": "Yu Deng; Yufeng Jin; Xiaogang Jia; Jiahong Xue; Gerhard Neumann; Georgia Chalvatzaki", "k": ["Learning representations for robotic perception and control", "Robot foundation models and general-purpose knowledge systems"], "kind": "P", "pdf": "https://arxiv.org/pdf/2602.11934v2", "ps": 3, "b": 141, "talk": "", "tier": "", "why": "", "top": []}, {"id": "2nityiXWGJ", "t": "Robot-Factored World Models via Robot Rendering", "a": "Byungjun Kim; Taeksoo Kim; Hyunsoo Cha; Hanbyul Joo", "k": ["Video models and latent world models for robot learning", "Robotic data generation", "Robotic action-contitioned world models"], "kind": "P", "pdf": "https://arxiv.org/pdf/2607.22535v1", "ps": 3, "b": 9, "talk": "", "tier": "", "why": "", "top": []}, {"id": "1yL1d39r7K", "t": "Robot-WATCHDOG : failure detection through object-centric graph representation", "a": "Quentin Rolland; Fabrice Mayran de Chamisso; Jean-Baptiste Mouret", "k": ["Robot safety, alignment, and safe learning-based systems", "Learning representations for robotic perception and control", "Object-centric failure detection", "Spatio-temporal graph representations"], "kind": "P", "pdf": "https://arxiv.org/pdf/2610.13403v1", "ps": 2, "b": 93, "talk": "", "tier": "S", "why": "Failure detection via object graphs", "top": ["Motion control & safety", "Perception & vision", "Policy eval & safety bounds"], "sum": "Failures of learned robot policies are hard to define in open-world settings, so Robot-WATCHDOG detects them using only nominal demonstrations. It represents scenes as object-centric spatio-temporal graphs and scores failures with TPC, a non-parametric consistency measure, and GnnT, a graph attention and transformer predictor. Both beat image-based detectors, especially on semantic failures; TPC is best on AUPR and MCC. No numbers are given."}, {"id": "4ar3F6Obiq", "t": "Robots as Tokens: Unified Diffusion Transformer for Coordinated Multi-Robot Trajectory Generation", "a": "RUOFEI BAI; Jie Chen; Yuxin Cai; Li jun; Wei-Yun Yau; Lihua Xie", "k": ["Combination of learning and planning in robotics", "Imitation learning (behavioral cloning, inverse RL)"], "kind": "P", "pdf": "https://arxiv.org/pdf/2606.15550v1", "ps": 1, "b": 218, "talk": "", "tier": "", "why": "", "top": []}, {"id": "NHE9q2cz1n", "t": "RoboTTT: Context Scaling for Robot Policies", "a": "Yunfan Jiang; Yevgen Chebotar; Ruijie Zheng; Fengyuan Hu; Yunhao Ge; Jimmy Wu; Tianyuan Dai; Scott Reed; Li Fei-Fei; Yuke Zhu; Linxi Fan", "k": ["Robot foundation models and general-purpose knowledge systems", "Imitation learning (behavioral cloning, inverse RL)", "Test-Time Training", "Long Context Policies"], "kind": "O", "pdf": "https://arxiv.org/pdf/2607.15275v1", "ps": 1, "b": 47, "talk": "O1", "tier": "S", "why": "Oral: context scaling for robot policies — training frontier", "top": ["VLA testing", "Training frontier", "RL", "Efficient/real-time"], "sum": "Robot foundation models usually see only a very short history. RoboTTT uses test-time training, where fast weights updated by gradient descent compress long histories, supporting context up to 8K timesteps without extra inference latency. On real-robot tasks it improves performance 87% over a single-step baseline, and 8K-context training beats 1K-context training by 62%."}, {"id": "UVJPDRCmlf", "t": "Robustness without Wrinkles: Parallel Simulation and Robust MPC for Certified Deformable Manipulation", "a": "Wei-Chen Li; Jeffrey Fang; Sasanka Polisetti; Yuexi Song; Glen Chou", "k": ["Robot manipulation", "Robot safety, alignment, and safe learning-based systems, deformable object manipulation, robust output-feedback control"], "kind": "S", "pdf": "https://arxiv.org/pdf/2606.14188v1", "ps": 2, "b": 47, "talk": "S5", "tier": "M", "why": "Parallel sim + robust MPC for certified deformable manipulation — tissue-like + MPC", "top": ["Motion control & safety", "Policy eval & safety bounds", "Deformable"], "sum": "Safely controlling ropes and cloth is hard because contact changes and models are uncertain. CORD-SLS pairs a GPU-parallel differentiable simulator with contact smoothing and a real-time robust model predictive controller, using conformal prediction to calibrate error bounds. The authors claim millisecond-scale planning and better safety, speed and task success than baselines, but the abstract gives no specific numbers."}, {"id": "1j0Hw81jY9", "t": "RoMo-GS: Efficient Online 3D Gaussian Splatting for Robot Mapping via Exposure-Integrated Motion Blur", "a": "Sangwoo Jung; Di Deng; Jiahui Fu; Laura Herlant; Ayoung Kim; Yafei Hu", "k": ["Learning representations for robotic perception and control", "Multimodal perception, sensor fusion, and robot vision", "Online 3D Gaussian Splatting", "Motion Deblurring"], "kind": "P", "pdf": "https://arxiv.org/pdf/2610.24605v1", "ps": 1, "b": 191, "talk": "", "tier": "", "why": "", "top": []}, {"id": "zYpPmDICVV", "t": "RPL: Learning Robust Humanoid Perceptive Locomotion on Challenging Terrains", "a": "Yuanhang Zhang; Younggyo Seo; Juyue Chen; Yifu Yuan; Koushil Sreenath; Pieter Abbeel; Carmelo Sferrazza; Karen Liu; Rocky Duan; Guanya Shi", "k": ["Robot navigation and locomotion", "Sim-to-real transfer", "Humanoid Perceptive Locomotion"], "kind": "P", "pdf": "https://arxiv.org/pdf/2602.03002v3", "ps": 3, "b": 159, "talk": "", "tier": "", "why": "", "top": []}, {"id": "Lp94sPpAo0", "t": "S2A2: Audio-Visual Imitation Learning for Manipulation Tasks Using Acoustic Spatial Information", "a": "Kaneyoshi Hiratsuka; Benjamin Yen; Ryosuke Kojima", "k": ["Imitation learning (behavioral cloning, inverse RL)", "Robot manipulation", "Robot Audition", "Sound Source Localization"], "kind": "P", "pdf": "https://arxiv.org/pdf/2607.26047v2", "ps": 2, "b": 82, "talk": "", "tier": "", "why": "", "top": []}, {"id": "VTSUekrCnH", "t": "S2M-Trek: From Single to Multi-Sphere Transport  via Per-Frame Deep Sets on a Wheel-Legged Robot", "a": "Zong Chen; Xuebin Li; Jinpeng Xiao; Shaoyang Li; Ben Liu; Min Li; Zhouping Yin; YIQUN LI", "k": ["Learning representations for robotic perception and control", "Model-based and model-free learning for robotic control, multi-object manipulation, loco-manipulation"], "kind": "P", "pdf": "https://arxiv.org/pdf/2606.01332v2", "ps": 2, "b": 182, "talk": "", "tier": "", "why": "", "top": []}, {"id": "gvM7KWEhVI", "t": "Safe Streaming Flow Planning by Aligning Sampling Dynamics with Execution Dynamics", "a": "Seunghwan Jang; Jeongyong Yang; Siddharth Ancha; SooJean Han", "k": ["Combination of learning and planning in robotics", "Robot safety, alignment, and safe learning-based systems"], "kind": "P", "pdf": "https://arxiv.org/pdf/2610.03132v1", "ps": 1, "b": 208, "talk": "", "tier": "S", "why": "Safe streaming flow planning", "top": ["Motion control & safety", "Planning & optimization"], "sum": "Diffusion and flow-matching planners struggle with safety and fast replanning, since existing safe versions build whole trajectories and repeatedly adjust them. SafeStreamingFlow instead integrates a learned vector field step by step with hierarchical state prediction, applying higher-order control barrier functions only to the executing step. It reports lower planning latency and better safety across navigation, racing, and locomotion benchmarks, without specific numbers."}, {"id": "rnp2Bj4RUX", "t": "Safe Task Planning with Long-Term Graph Memory for Embodied Agents", "a": "Siyuan Li; Taiyan Lang; Aoqi Yan; JiaYu; Feifan Liu; Yihan Du; Yu Zheng; Xun Wang; Peng Liu", "k": ["Robot safety, alignment, and safe learning-based systems", "Task and motion planning"], "kind": "P", "pdf": "https://arxiv.org/pdf/2609.08444v1", "ps": 1, "b": 43, "talk": "", "tier": "", "why": "", "top": []}, {"id": "Xgth4qBOmb", "t": "SafeDojo: Safe Reinforcement Learning for VLA via Interactive World Model", "a": "Kai Tang; Peidong Jia; Zhong Chu; Jiajun Cao; Jixian Wu; Rui Ma; Fangyuan Zhao; Sixiang Chen; Yichen Guo; Xiaowei Chi; Chun-Kai Fan; Kevin Zhang; Jinchang Xu; Fubing Yang; Weishi Mi; Xiaozhu Ju; Jian Tang; Shanghang Zhang", "k": ["Reinforcement learning for physical robot control", "Model-based and model-free learning for robotic control"], "kind": "P", "pdf": "https://arxiv.org/pdf/2606.20698v2", "ps": 3, "b": 28, "talk": "", "tier": "S", "why": "Safe RL for VLA via world model", "top": ["Motion control & safety", "VLA testing", "World models", "Dexterous/contact-rich", "RL"], "sum": "Safe reinforcement learning for vision-language-action policies usually needs costly real-world trials or hand-written safety rules. SafeDojo trains on imagined rollouts from an interactive video world model, scoring success and per-step risk, and balances them with a Lagrangian-constrained GRPO objective. On SafeLIBERO it gives the best overall success, safe success and efficiency, beating the strongest baseline by 8.25 points on Level I safe success."}, {"id": "7vjPgJ7x2b", "t": "SafeDriveVLA: Navigation-Conditioned World Model Dreaming for Conflict-Aware End-to-End Autonomous Driving", "a": "Shaoyuan Xie; Zihan Zhang; Jingxuan Wang; Jiashu Qu; Xiaoqing Liang; Lingdong Kong; Junchi Lu; Henrik I Christensen; Qi Alfred Chen", "k": ["Autonomous driving and flight", "Benchmarks and datasets for robot learning", "Autonomous Driving", "Safety"], "kind": "P", "pdf": "https://arxiv.org/pdf/2610.20609v1", "ps": 1, "b": 160, "talk": "", "tier": "", "why": "", "top": []}, {"id": "Z04KxYWC6V", "t": "SAGE-3D: Semantic-Aware 3D Representations for Generalizable Vision-Language-Action Models", "a": "Pengxiang Ding; Xuanxuan An; Kexian Yu; Haoying Wang; Minghui Lin; Xuhao Wan; Wenxuan Song; Han Zhao; Yihao Wang; Donglin Wang; Ning Ding", "k": ["Multimodal perception, sensor fusion, and robot vision", "Robot manipulation"], "kind": "P", "pdf": "", "ps": 1, "b": 7, "talk": "", "tier": "", "why": "", "top": []}, {"id": "qd6clCx6QY", "t": "Scalable Behavior Cloning with Open Data, Training, and Evaluation", "a": "Arthur Allshire; Himanshu Gaurav Singh; Ritvik Singh; Adam Rashid; Hongsuk Choi; David McAllister; Justin Yu; Yiyuan Chen; Huang Huang; Pieter Abbeel; Xi Chen; Rocky Duan; Phillip Isola; Jitendra Malik; Fred Shentu; Guanya Shi; Philipp Wu; Angjoo Kanazawa", "k": ["Robot foundation models and general-purpose knowledge systems", "Imitation learning (behavioral cloning, inverse RL)"], "kind": "P", "pdf": "https://arxiv.org/pdf/2606.27375v1", "ps": 1, "b": 113, "talk": "", "tier": "", "why": "", "top": []}, {"id": "CSYA6oHdlE", "t": "Scalable Deep Unfolding of Conic Optimizers", "a": "Alex Oshin; Rahul Vodeb Ghosh; Evangelos Theodorou", "k": ["Combination of learning and planning in robotics", "Theoretical foundations of robot learning", "Deep Unfolding", "Learning to Optimize"], "kind": "S", "pdf": "https://arxiv.org/pdf/2606.13825v1", "ps": 3, "b": 101, "talk": "S6", "tier": "S", "why": "Scalable deep unfolding of conic optimizers — fast QP/conic solvers", "top": ["Planning & optimization"], "sum": "Deep unfolding trains learnable parts of an iterative optimizer, but has been hard to apply to large semidefinite programs. The authors make backpropagation through the COSMO solver practical with a matrix-free implicit method using linear memory and a stable backward rule for the PSD cone. Learned hyperparameter policies and warm-starts give up to 50x speedup, and over 30x versus COSMO in covariance steering."}, {"id": "quVJ7qbQl6", "t": "Scale Up Strategically: Learning Compositional Generalization via Bias-Aware Evaluation and Data Collection for Robotic Manipulation", "a": "Yu Qi; Zhang Ye; Xinyi Xu; Yuxuan Lu; Amitoj Sandhu; Boce Hu; Haojie Huang; Jonathan Tremblay; Lawson L.S. Wong", "k": ["Robot manipulation", "Benchmarks and datasets for robot learning", "Robotic Data Collection Strategy, imitation learning"], "kind": "P", "pdf": "https://arxiv.org/pdf/2607.21582v1", "ps": 2, "b": 101, "talk": "", "tier": "S", "why": "Bias-aware evaluation and data collection", "top": ["Policy eval & safety bounds"], "sum": "Pretrained robot policies often rely on salient cues rather than the language in an instruction, which hurts generalization to new instruction combinations. The authors build a diagnostic that measures over-reliance on factors such as color, object and size using pairwise-bias and global-ranking metrics, then steer a fixed demonstration budget toward the weakest factors. This beats baselines in simulation and on a real robot, reportedly needing about half the demonstrations."}, {"id": "5m9zSorosa", "t": "Scaled Preference Conditioning for Terrain Costmap Generation", "a": "Luisa Mao; Garrett Warnell; Peter Stone; Joydeep Biswas", "k": ["Combination of learning and planning in robotics", "Learning representations for robotic perception and control"], "kind": "P", "pdf": "", "ps": 1, "b": 148, "talk": "", "tier": "", "why": "", "top": []}, {"id": "bL51SsKShM", "t": "ScaleEvals: Scaling Generalist Policy Evaluation through Reset-Free Autonomous Play", "a": "Amitoj Sandhu; Ethan Sick; Omkaar Buddhikot; Nadia Laswi; Wesley Durbano; Nadun Ranawaka Arachchige; You Liang Tan", "k": ["Policy evaluation, adversarial scenarios generation, and red teaming", "Benchmarks and datasets for robot learning"], "kind": "P", "pdf": "", "ps": 2, "b": 103, "talk": "", "tier": "S", "why": "Scaling policy evaluation via autonomous play", "top": ["Policy eval & safety bounds", "VLA testing", "Training frontier"]}, {"id": "EsZGt1eIZr", "t": "Scaling Self-Play for End-to-End Driving", "a": "Luke Rowe; Roger Girgis; Rodrigue de Schaetzen; Daphne Cornelisse; Alaap Grandhi; Felix Heide; Eugene Vinitsky; Christopher Pal; Liam Paull", "k": ["Autonomous driving and flight", "Self-Play", "Simulation"], "kind": "P", "pdf": "https://arxiv.org/pdf/2606.19641v2", "ps": 3, "b": 207, "talk": "", "tier": "", "why": "", "top": []}, {"id": "z5Mgc1GGjP", "t": "Scaling Sim-to-Real VLA Reinforcement Learning with Generative 3D Worlds", "a": "Andrew Choi; Xinjie Wang; Zhizhong Su; Wei Xu", "k": ["Reinforcement learning for physical robot control", "Robot foundation models and general-purpose knowledge systems", "Generative simulation", "Sim-to-real transfer"], "kind": "P", "pdf": "https://arxiv.org/pdf/2603.18532v4", "ps": 1, "b": 99, "talk": "", "tier": "S", "why": "Sim-to-real VLA RL with generative worlds", "top": ["VLA testing", "Training frontier", "Dexterous/contact-rich", "RL", "Efficient/real-time"], "sum": "Real-world reinforcement learning can over-specialize VLA models, and building varied simulated scenes is costly. The authors use 3D generative world models and a language-driven scene designer to create 100 diverse interactive scenes for parallel training. Simulation success rose from 9.7% to 79.8%, and with domain randomization real-world success improved from 21.7% to 75%."}, {"id": "hCG12ifteJ", "t": "Scaling World Model for Hierarchical Manipulation Policies", "a": "Long Qian; Yueze Wang; Jiaxi Song; Nan Sun; Qiwei Li; Junbo Zhang; Peiyan Li; Wenxuan Wang; Yuqi Wang; Haoyang Li; Shaoxuan Xie; Guocai Yao; Hanbo Zhang; xinglong wang; Zhongyuan Wang; Xuguang Lan; Huaping Liu; Xinghang Li", "k": ["Video models and latent world models for robot learning", "Robot manipulation", "Hierarchical manipulation framework"], "kind": "P", "pdf": "https://arxiv.org/pdf/2602.10983v2", "ps": 3, "b": 17, "talk": "", "tier": "", "why": "", "top": []}, {"id": "51YZMUGRUA", "t": "SCAPE: Scenario-Conditioned Simulation-Augmented Policy Evaluation", "a": "Dijie Zhu; Seunghun Oh; Ruopeng Huang; Zhiyu Huang; Jiaqi Ma; Chen Tang", "k": ["Policy evaluation, adversarial scenarios generation, and red teaming", "Autonomous driving and flight", "Robot navigation and locomotion"], "kind": "P", "pdf": "https://arxiv.org/pdf/2608.19425v1", "ps": 2, "b": 112, "talk": "", "tier": "S", "why": "Simulation-augmented policy evaluation — eval", "top": ["Policy eval & safety bounds"], "sum": "Real-world policy testing is costly, while simulation is biased by the sim-to-real gap and averages hide scenario-level results. SCAPE predicts real-world performance per scenario from a few paired sim and real samples plus many simulated rollouts, correcting bias and adding conformal uncertainty bounds. In sim-to-sim tests it cut prediction error by 4.9-34.7% (driving) and 14.5-27.7% (quadruped)."}, {"id": "foRrdaQ3mz", "t": "Schrödinger's Navigator: Imagining an Ensemble of Futures for Zero-Shot Object Navigation", "a": "Yu He; Da Huang; Zhenyang Liu; Zixiao Gu; Qiang Sun; Guangnan Ye; Yanwei Fu; Yu-Gang Jiang", "k": ["Robot navigation and locomotion"], "kind": "P", "pdf": "", "ps": 1, "b": 153, "talk": "", "tier": "", "why": "", "top": []}, {"id": "SUV5PudsyI", "t": "SCoCaT: Success Conditioned Constrained Reinforcement Learning for Spacecraft Docking", "a": "Aman Arora; Ricard M Castan; Matteo El-Hariry; Miguel Olivares-Mendez", "k": ["Reinforcement learning for physical robot control", "Robot safety, alignment, and safe learning-based systems", "Constrained Reinforcement Learning", "Sim-to-Real Transfer"], "kind": "S", "pdf": "https://arxiv.org/pdf/2609.06061v2", "ps": 3, "b": 71, "talk": "S8", "tier": "", "why": "", "top": [], "sum": "Termination-based constrained reinforcement learning can fail on docking-style tasks, where the goal sits near tightening safety constraints and agents stay safe by never arriving. SCoCaT adds a dense per-step success signal to standard PPO through an auxiliary value critic, improving task completion while keeping constraints satisfied. It is validated on a 6U CubeSat model and a floating-platform testbed with zero-shot sim-to-real transfer; no numbers are given."}, {"id": "FYNtpa7rwN", "t": "Scouting the Dynamics Gap: Test-Time Policy Adaptation via Action-Outcome Feedback", "a": "Yishu Li; Liyuan Geng; Xinyi Mao; Amber Li; David Held", "k": ["Learning representations for robotic perception and control", "Imitation learning (behavioral cloning, inverse RL)", "Test-time adaptation", "Meta-learning"], "kind": "P", "pdf": "https://arxiv.org/pdf/2609.36107v1", "ps": 3, "b": 110, "talk": "", "tier": "", "why": "", "top": []}, {"id": "rYkaehgzzO", "t": "See Less, Specify More: Visual Evidence Budgets for Generalizable VLAs", "a": "Yueh-Hua Wu; Tatsuya Matsushima; Kei Ota", "k": ["Robot foundation models and general-purpose knowledge systems"], "kind": "P", "pdf": "https://arxiv.org/pdf/2606.02735v2", "ps": 1, "b": 25, "talk": "", "tier": "", "why": "", "top": []}, {"id": "lHDmYo4bzs", "t": "SEED-UMI: Sharing the Exoskeleton between human and robot for onE-to-one Dexterous demonstration", "a": "Tengbo Yu; Jiahao Wu; Daohan Li; Bingxu Chen; Hao Liu; Xiaojian Ma; Hangxin Liu", "k": ["Hardware design and optimization", "Robot systems, hardware, and sensors for learning"], "kind": "P", "pdf": "https://arxiv.org/pdf/2609.11753v1", "ps": 3, "b": 56, "talk": "", "tier": "", "why": "", "top": []}, {"id": "hwTNqrJmuQ", "t": "Seek-before-Act: Generative Visual Foresight for Occlusion-Aware Wrist-View Manipulation", "a": "Dongjiang Li; Kehui Liu; Fangce Li; Haoming Song; Delin Qu; Dong Wang; Bin Zhao", "k": ["Robot manipulation", "Task and motion planning", "Video Generation for Robot Manipulation", "Active Viewpoint Seeking"], "kind": "P", "pdf": "", "ps": 3, "b": 22, "talk": "", "tier": "", "why": "", "top": []}, {"id": "DwRC6la1Kr", "t": "SeeTraceAct: Visibility-Aware Latent Planning from Cross-Embodiment Demonstration Videos", "a": "Jaehyeon Son; Junhyun Kim; Kyle Kam; Jeremiah Coholich; Seok Joon Kim; Jinhoo Kim; Chris Dongjoo Kim; Jaemin Cho; Dieter Fox; Zsolt Kira", "k": ["Robot foundation models and general-purpose knowledge systems", "Combination of learning and planning in robotics", "Vision-Language-Action Models", "Cross-Embodiment Learning"], "kind": "P", "pdf": "https://arxiv.org/pdf/2606.02745v2", "ps": 2, "b": 35, "talk": "", "tier": "", "why": "", "top": []}, {"id": "s8ZiyIAn3z", "t": "Self-play is not enough: human imitation improves self-play autonomy in the wild", "a": "Marc Heim; Bassam Helou; Rohit Satishkumar; Momchil Tomov; Hansford C. Hendargo; Nicolas Rey; Gianmarco Bernasconi; Joseph Baker; Alexander Boule; Rafael DaSilva; Abed Ghanbari; Cedric Warny; Yi Huo; Phuc Xuan Nguyen; Neset Unver Akmandor; Sarjak Thakkar; Daphne Cornelisse; Eugene Vinitsky; Forbes Howington; Boaz Floor; Yiluan Guo; Samuel Findler; Sourabh Vora", "k": ["Autonomous driving and flight", "Imitation learning (behavioral cloning, inverse RL)", "Self-play reinforcement learning", "Sim-to-real transfer"], "kind": "P", "pdf": "", "ps": 1, "b": 104, "talk": "", "tier": "", "why": "", "top": []}, {"id": "8xaYRUduNe", "t": "Self-supervised Dispersive Sampling for Quadrotor Motion Planning", "a": "Shashank A Deshpande; JONATHAN P HOW", "k": ["Combination of learning and planning in robotics", "Autonomous driving and flight"], "kind": "P", "pdf": "", "ps": 1, "b": 147, "talk": "", "tier": "", "why": "", "top": []}, {"id": "YTw6LOO9C5", "t": "Semantic Anchoring for Robotic Action Representations", "a": "Yuan Xu; Youheng Shi; Chengyang Li; Wentao Zhu; Yizhou Wang", "k": ["Learning representations for robotic perception and control", "Robot manipulation"], "kind": "S", "pdf": "https://arxiv.org/pdf/2607.13597v2", "ps": 1, "b": 19, "talk": "S1", "tier": "", "why": "", "top": [], "sum": "Fine-tuning Vision-Language-Action models on limited robot demonstrations erodes the semantic structure inherited from pretrained vision-language models, hurting generalization. The authors tie action representations to a semantic manifold and split them into shared and private channels, both removed at inference so the deployed model is unchanged. Real-world in-distribution performance improves by up to 18.7% and out-of-distribution by up to 21.5%."}, {"id": "kGGI0115Rg", "t": "Sensitivity Shaping for Latent Modeling", "a": "Hongzhan Yu; Chenghao Li; Ruipeng Zhang; Henrik I Christensen; Sicun Gao", "k": ["Learning representations for robotic perception and control", "Robot safety, alignment, and safe learning-based systems"], "kind": "P", "pdf": "https://arxiv.org/pdf/2606.14585v2", "ps": 3, "b": 113, "talk": "", "tier": "", "why": "", "top": []}, {"id": "SniDOKrnNY", "t": "SentryVLA: Uncertainty-Guided Action Selection and State Monitoring for Vision-Language-Action Robotic Control", "a": "Zongyao Lyu; Lingling Chen; William J. Beksi", "k": ["Probabilistic learning and uncertainty in robotics"], "kind": "P", "pdf": "", "ps": 1, "b": 220, "talk": "", "tier": "S", "why": "Uncertainty-guided action selection and state monitoring for VLAs — safety", "top": ["Policy eval & safety bounds", "VLA testing"], "sum": "Pretrained vision-language-action controllers give little signal about how reliable their actions are, making failures hard to anticipate. SentryVLA wraps a frozen VLA policy with two lightweight parts: conformalized quantile regression that bounds expected action deviation to rank sampled candidate actions, and a Mahalanobis-distance score that flags abnormal states. Simulation and real-robot tests show better action selection and useful runtime warnings; no numbers are given."}, {"id": "rfRjWMFfvV", "t": "Sequential Asymmetric Imitation for Learning Coupled Robot Policies", "a": "Ranpeng Qiu; Yincong Chen; Zihao Li; Yanan Zhou; Guoqiang Ren; Weiming Zhi", "k": ["Imitation learning (behavioral cloning, inverse RL)"], "kind": "S", "pdf": "https://arxiv.org/pdf/2606.16490v2", "ps": 2, "b": 172, "talk": "S3", "tier": "", "why": "", "top": [], "sum": "When two robots are physically linked through shared objects, failures usually come from poor timing, yielding, or releasing rather than weak individual skills. Sequential Asymmetric Imitation uses one teleoperator in stages: Robot A learns with a compliant human partner, Robot B trains against A's policy, then A is refined with sparse corrections at coordination failures. It reports better success, phase synchronization, and yielding than baselines, without specific numbers."}, {"id": "nIbnBCtz79", "t": "SERF: Spatiotemporal Environment and Robot Feature Map for Long-Horizon Mobile Manipulation", "a": "Sunghwan Kim; Byeonghyun Pak; Kehan Long; Yulun Tian; Nikolay Atanasov", "k": ["Learning representations for robotic perception and control", "Mobile manipulation", "Vision-language-action model"], "kind": "S", "pdf": "https://arxiv.org/pdf/2606.12956v2", "ps": 2, "b": 173, "talk": "S5", "tier": "", "why": "", "top": [], "sum": "Robots doing long multi-step household tasks struggle to track their location, environment changes and task progress from camera images alone. SERF represents the environment and the robot's jointed body as points in a shared latent map, updated from camera views and joint states, and passes map-derived tokens to a vision-language-action policy. It reportedly beats image-only baselines on BEHAVIOR-1K; no numbers are given."}, {"id": "xhO9wj1gGt", "t": "Shape Your Body: Value Gradients for Multi-Embodiment Robot Design", "a": "Nico Bohlinger; Jan Peters", "k": ["Reinforcement learning for physical robot control", "Hardware design and optimization", "Multi-Embodiment Learning", "Locomotion"], "kind": "S", "pdf": "https://arxiv.org/pdf/2606.00702v2", "ps": 2, "b": 115, "talk": "S5", "tier": "", "why": "", "top": [], "sum": "Robot design usually needs a separate reinforcement learning co-design run for every candidate, which is costly. This work trains one policy and value function across many designs, then freezes the value function and follows its gradients to tune design parameters. It handles models trained on up to 50 robots and design spaces with over 1,100 continuous parameters; no performance figure is given."}, {"id": "rJe0dLlPev", "t": "SHOES: Sim-to-real Hardware-adaptation via On-policy Expansion of Skills for Legged Robots", "a": "Kota Tsuruhara; Tsung-Yuan Chen; Kento Kawaharazuka", "k": ["Sim-to-real transfer"], "kind": "P", "pdf": "https://arxiv.org/pdf/2610.16457v1", "ps": 3, "b": 186, "talk": "", "tier": "", "why": "", "top": []}, {"id": "wBzyyPlFs6", "t": "SidewalkBench: Benchmarking Visual Navigation on Urban Sidewalks", "a": "Zhizheng Liu; Honglin He; Vivek Alumootil; Akshat Pandya; Brad Squicciarini; Wayne Wu; Bolei Zhou", "k": ["Benchmarks and datasets for robot learning"], "kind": "S", "pdf": "https://arxiv.org/pdf/2606.16953v3", "ps": 3, "b": 203, "talk": "S8", "tier": "", "why": "", "top": [], "sum": "Urban sidewalk navigation involves complex layouts, moving pedestrians, and long distances, and visual navigation models lack a shared benchmark. SidewalkBench is a GPU-accelerated Isaac Sim benchmark with procedural and scanned real-world sidewalk scenes and reactive pedestrians. Nine models were tested on 330 unit-test, 800 pedestrian-reactive, and 105 long-horizon scenarios, showing pedestrian interaction and long-horizon robustness as the main bottlenecks. No scores are given in the abstract."}, {"id": "2Y1Osh6gOU", "t": "SILO: Simulation-in-the-Loop Sim-to-Real Transfer for Multi-Stage Cable Routing", "a": "Stone Tao; Jie Xu; Hesam Rabeti; Yashraj Narang; Yijie Guo; Iretiayo Akinola", "k": ["Sim-to-real transfer", "Reinforcement learning for physical robot control"], "kind": "P", "pdf": "https://arxiv.org/pdf/2607.04616v1", "ps": 2, "b": 49, "talk": "", "tier": "S", "why": "Sim-in-the-loop cable routing", "top": ["Dexterous/contact-rich", "RL", "Deformable"], "sum": "Cable routing is hard because cables deform in complex ways, and imitation learning methods need thousands of task-specific demonstrations. The authors train reinforcement learning policies in thousands of parallel GPU simulations of varied cable shapes, then deploy them with simulation-in-the-loop execution, localized policies and robust cable state estimation. Real tests show better success rates and roughly half the cycle time of prior learning methods."}, {"id": "cvPjGuUATQ", "t": "Sim-and-Human Co-training for Data-Efficient and Scene-Generalizable Bimanual Manipulation", "a": "Kaipeng Fang; Weiqing Liang; Yuyang Li; Ji Zhang; Pengpeng Zeng; Heng Tao Shen; Jingkuan Song; Lianli Gao", "k": ["Robot manipulation", "Imitation learning (behavioral cloning, inverse RL)", "Co-training", "Learning from Human Videos"], "kind": "P", "pdf": "https://arxiv.org/pdf/2601.19406v2", "ps": 1, "b": 134, "talk": "", "tier": "", "why": "", "top": []}, {"id": "58liP3p4hu", "t": "Sim-to-Real Transfer for Muscle-Actuated Robots via Generalized Actuator Networks", "a": "Jan Schneider; Mridul Mahajan; Le Chen; Simon Guist; Bernhard Schölkopf; Ingmar Posner; Dieter Büchler", "k": ["Sim-to-real transfer", "Reinforcement learning for physical robot control"
