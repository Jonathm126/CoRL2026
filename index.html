<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body>

<style>
/* Layout: light, one column (max 760px). Top bar = 5 modes. Plan → session pages (hash routes). Everything collapsible. */
:root{
  color-scheme:light;
  --bg:#FFFFFF; --soft:#F5F6F8; --soft2:#ECEEF2; --fg:#16191F; --body:#3B414B; --muted:#6A717D; --faint:#A0A6B0; --line:#E4E7EC;
  --accent:#1F49C6; --accent-soft:#EAF0FD; --ok:#12775A; --ok-soft:#E3F3EC; --warn:#A35A00; --warn-soft:#FBF0DC;
  --jw:#12775A; --h:#A35A00; --bh:#6A3FC4; --lc:#B0425B;
  --f:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--f);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:820px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:10px;padding-block:12px 4px}
.brand{font-weight:700;font-size:17px;letter-spacing:-.01em;white-space:nowrap}
#clock{font-variant-numeric:tabular-nums}
.sync{margin-left:auto;font-size:12px;color:var(--faint);display:flex;align-items:center;gap:5px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--faint);display:inline-block}
.sync.ok i{background:var(--ok)}
.tabs{display:grid;grid-template-columns:repeat(6,1fr);max-width:720px}
.tabs button{background:none;border:0;padding:10px 2px 9px;font-weight:500;font-size:14px;color:var(--muted);border-bottom:2px solid transparent;cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--fg)}
main{padding-block:18px 80px}
header .wrap{max-width:1400px}
main.wide{max-width:1400px}
main.wide .lead,main.wide h1{max-width:820px}
@media (min-width:900px){main.wide .gb{font-size:12.5px}main.wide .gb .gt{font-size:11px}main.wide .ghead>div{font-size:14px}main.wide .kpis{max-width:820px}main.wide .todo{max-width:820px}}
h1{font-size:22px;line-height:1.25;margin:4px 0 6px;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:12px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:28px 0 10px}
h2:first-child{margin-top:2px}
.lead{color:var(--muted);font-size:14px;margin:0 0 14px}
.muted{color:var(--muted)} .small{font-size:13px}
/* overview */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.kpi b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.kpi span{font-size:12.5px;color:var(--muted)}
.bar{height:4px;background:var(--soft2);border-radius:4px;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.todo{border:1px solid var(--warn-soft);background:var(--warn-soft);border-radius:12px;padding:10px 14px;margin-top:10px;font-size:14px}
.todo b{color:var(--warn)}
.todo ul{margin:6px 0 0;padding-left:18px}
.day{margin-top:22px}
.dayh{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--fg);padding-bottom:6px;margin-bottom:2px}
.dayh b{font-size:16px}
.dayh span{font-size:13px;color:var(--muted)}
.row{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left}
.row:hover{background:var(--soft)}
.row.static{cursor:default}.row.static:hover{background:none}.row.static .ti b{font-weight:500}
.row .tm{font:500 13.5px var(--mono);font-variant-numeric:tabular-nums}
.row .ti{min-width:0}
.row .ti b{font-weight:600;font-size:14.5px;display:block;line-height:1.35}
.row .ti span{font-size:12.5px;color:var(--muted)}
.row.dim .ti b{color:var(--muted);font-weight:500}
.row.att .tm{color:var(--ok)}
.chips{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.chip{font-size:11px;font-weight:600;letter-spacing:.03em;padding:2px 7px;border-radius:20px;background:var(--soft2);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)}.chip.acc{background:var(--accent-soft);color:var(--accent)}.chip.warn{background:var(--warn-soft);color:var(--warn)}
.vd{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:4px;vertical-align:1px}
.vd.JW{background:var(--jw)}.vd.H{background:var(--h)}.vd.BH{background:var(--bh)}.vd.LC{background:var(--lc)}
.nowline{display:flex;align-items:center;gap:8px;color:#D1342F;font:600 12px var(--mono);padding:2px 0}
.nowline::after{content:"";flex:1;border-top:2px solid #D1342F}
.chip.now{background:#FDE8E7;color:#D1342F}
.brk{display:grid;grid-template-columns:52px 1fr;gap:12px;padding:5px 4px;font-size:12.5px;color:var(--muted);border-bottom:1px solid var(--line);background:var(--soft)}
.brk .tm{font:12.5px var(--mono);color:var(--muted)}
.gwrap{overflow-x:auto;margin-top:12px;border:1px solid var(--line);border-radius:12px}
.grid{min-width:480px}
.grid.one{min-width:0}
.grid.one .gb{font-size:13px}.grid.one .gb .gt{font-size:11px}
.ghead{display:grid;grid-template-columns:34px repeat(var(--cols,4),1fr);border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:2}
.ghead>div{font-size:12.5px;font-weight:600;text-align:center;padding:7px 2px}
.ghead>div.today{color:#D1342F}
.tbdrow{position:static}
.tbdrow>div{padding:4px 2px}
.gtbd{display:grid;gap:3px;align-content:start}
.gbody{display:grid;grid-template-columns:34px repeat(var(--cols,4),1fr);position:relative}
.gaxis{position:relative}
.gh{position:absolute;left:0;right:0;font:10.5px var(--mono);color:var(--faint);text-align:center;transform:translateY(-6px)}
.gcol{position:relative;border-left:1px solid var(--line);background-image:repeating-linear-gradient(to bottom,var(--line) 0,var(--line) 1px,transparent 1px,transparent 90px)}
.gcol.today{background-color:#FFF8F7}
.gb{position:absolute;border-radius:6px;padding:3px 5px;font-size:11px;line-height:1.25;text-align:left;overflow:hidden;cursor:pointer;border:1px solid transparent;color:var(--fg);font-weight:500}
.gb .gt{font:10px var(--mono);color:var(--muted);margin-right:3px}
.gb{z-index:1}.gb .gi{position:absolute;top:3px;left:5px;right:4px;bottom:2px;overflow:hidden}.gb.brk2{z-index:0}
.gb.vJW{background:#E3F3EC;border-color:#BFE3D2}.gb.vH{background:#FBF0DC;border-color:#F0D9AE}.gb.vBH{background:#EEE7FB;border-color:#D7C8F4}.gb.vLC{background:#FBE6EB;border-color:#F2C6D1}
.gb.must{border-width:2px;border-color:var(--fg)}
.gb.opt{background:var(--bg);border-style:dashed;border-color:var(--faint);color:var(--muted)}
.gb.done{opacity:.75}
.gb.brk2{background:var(--soft);color:var(--faint);cursor:default;font-size:10px;border-color:transparent}
.gnow{position:absolute;left:0;right:0;border-top:2px solid #D1342F;z-index:1}
.glegend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.glegend i{margin-right:4px}
.walk{font-size:12px;color:var(--warn);padding:4px 0 4px 68px}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.seg button{border:1px solid var(--line);background:var(--bg);border-radius:20px;padding:6px 12px;cursor:pointer;font-size:13.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:#fff}
.chk{display:inline-flex;gap:6px;align-items:center;font-size:13.5px;color:var(--muted);cursor:pointer}
/* session page */
.back{background:none;border:0;color:var(--accent);cursor:pointer;padding:0;font-size:14px;margin-bottom:10px}
.meta{font-size:13.5px;color:var(--muted)}
.toggles{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 6px}
.tg{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 12px;cursor:pointer;font-size:14px;font-weight:500}
.tg::before{content:"";width:14px;height:14px;border-radius:4px;border:1.5px solid var(--faint)}
.tg.on{border-color:var(--accent);color:var(--accent)}
.tg.on::before{background:var(--accent);border-color:var(--accent);box-shadow:inset 0 0 0 2px #fff}
.tg.ok.on{border-color:var(--ok);color:var(--ok)}.tg.ok.on::before{background:var(--ok);border-color:var(--ok)}
.alts{font-size:13.5px;color:var(--muted);margin-top:6px}
.alts button{background:none;border:0;color:var(--accent);cursor:pointer;padding:0;font-size:13.5px;text-decoration:underline}
.box{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:12px}
.box.soft{background:var(--soft);border-color:var(--soft)}
.sum{font-size:14.5px;color:var(--body);line-height:1.55}
textarea{width:100%;min-height:110px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#FCFCFD;resize:vertical;line-height:1.5;font-size:14.5px}
textarea.big{min-height:170px}
textarea:focus{background:#fff;border-color:var(--accent)}
.saved{font-size:12px;color:var(--faint);min-height:16px;margin-top:3px}
details.it{border-bottom:1px solid var(--line);scroll-margin-top:120px}
details.it>summary{list-style:none;display:grid;grid-template-columns:auto 1fr auto;gap:10px;padding:10px 2px;cursor:pointer;align-items:start}
details.it>summary::-webkit-details-marker{display:none}
details.it>summary .tt{font-size:14.5px;line-height:1.4;min-width:0}
details.it[open]>summary .tt{font-weight:600}
.dot{width:9px;height:9px;border-radius:50%;margin-top:6px;border:1.5px solid var(--faint)}
.dot.M{background:var(--accent);border-color:var(--accent)}.dot.S{border-color:var(--accent)}
.flags{display:flex;gap:4px;align-items:center;padding-top:2px}
.loc{font:12px var(--mono);color:var(--muted);white-space:nowrap}
.dotb{border:0;background:none;padding:4px 6px;margin:-4px -6px;cursor:pointer;display:flex;align-items:flex-start}
.dotb .dot{width:12px;height:12px;margin-top:4px}
.dotb:hover .dot{box-shadow:0 0 0 3px var(--accent-soft)}
.ord{font:500 12px var(--mono);color:var(--muted);margin-right:8px;white-space:nowrap}
.wlist{display:grid;gap:4px}
.wi{display:grid;grid-template-columns:78px 1fr;gap:8px;font-size:13.5px;align-items:start}
.wt{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);padding-top:2px}
.lnk{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;text-align:left;font-size:inherit}
.pchip{border:1px solid var(--line);background:var(--bg);border-radius:20px;padding:2px 9px;font-size:12.5px;cursor:pointer;margin:2px 2px 0 0;color:var(--fg)}
.sheet{position:fixed;z-index:31;left:0;right:0;bottom:0;margin:0 auto;max-width:560px;background:var(--bg);border-radius:16px 16px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.18);padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:10px;max-height:90vh;overflow-y:auto}

.scrim{position:fixed;inset:0;background:rgba(20,24,32,.35);z-index:30}
.fab{position:fixed;z-index:6;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));border:0;background:var(--fg);color:#fff;border-radius:24px;padding:11px 16px;font-weight:600;font-size:14px;box-shadow:0 6px 18px rgba(0,0,0,.18);cursor:pointer}
.ib{padding:0 2px 14px 21px;display:grid;gap:10px}
.ib .sum{margin:0}
.bl{background:var(--accent-soft);border-radius:8px;padding:8px 10px;font-size:14px}
.acts{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ab{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:5px 10px;cursor:pointer;font-size:13px;font-weight:500;text-decoration:none;color:var(--fg);display:inline-flex;gap:5px;align-items:center}
.ab.on{background:var(--fg);border-color:var(--fg);color:#fff}
.ab.okon{background:var(--ok);border-color:var(--ok);color:#fff}
.blk{margin-top:6px}
.blk>summary{list-style:none;cursor:pointer;padding:10px 0;display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line)}
.blk>summary::-webkit-details-marker{display:none}
.blk>summary b{font-size:14.5px}
.blk>summary span{font-size:12.5px;color:var(--muted);text-align:right}
/* library */
.search{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);margin-bottom:8px}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
select{padding:7px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);max-width:100%;font-size:13.5px}
.ent{border-bottom:1px solid var(--line);padding:12px 2px}
.ent .nm{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ent .nm b{font-size:15px}
.ent .d{font-size:14px;color:var(--body);margin-top:3px}
.ent .w{font-size:13px;color:var(--muted);margin-top:3px}
.more{display:block;margin:14px auto;padding:8px 16px;border:1px solid var(--line);border-radius:10px;background:var(--bg);cursor:pointer}
.empty{color:var(--muted);padding:16px;text-align:center;border:1px dashed var(--line);border-radius:12px;font-size:14px}
.now{border:1px solid var(--accent);border-radius:12px;padding:12px 14px;margin-bottom:14px}
.now .lbl{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.now b{display:block;font-size:17px;margin-top:2px}
.copyarea{width:100%;min-height:240px;font:12.5px/1.5 var(--mono)}
.rep h3{font-size:15px;margin:16px 0 4px}
.rep p{margin:2px 0;font-size:14px;color:var(--body);white-space:pre-wrap}
@media (max-width:520px){.brk{grid-template-columns:44px 1fr;gap:8px}.sync span{display:none}#clock{font-size:12px}.row{grid-template-columns:44px 1fr;}.row .chips{grid-column:2;justify-content:flex-start}.walk{padding-left:56px}.kpi{padding:8px 10px}.kpi b{font-size:17px}.kpi span{font-size:11.5px}.tabs button{font-size:13px}}
</style>

-Action Models", "a": "PeihuanNi; Zeyu Zhu; Weifan Guan; Gang Li; Zitao Mo; Minnan Pei; Tielong Liu; Junwen Si; Qinghao Hu; Peisong Wang; Jian Cheng", "k": ["Robot foundation models and general-purpose knowledge systems", "Robot manipulation", "Token pruning and adaptive computation for embodied AI", "Efficient vision-language-action models"], "kind": "P", "pdf": "", "ps": 2, "b": 86, "talk": "", "tier": "S", "why": "Action-centric eval of token pruning", "top": ["Policy eval & safety bounds", "VLA testing", "Efficient/real-time"]}, {"id": "uoFfrJHHq8", "t": "AcroRL: Learning Aggressive Quadrotor Inversion using Bidirectional Thrust", "a": "Gabriel Rodriguez; Henri Sayag; Abhishek Rathod; John Stecklein; Siddharth Saha; Christopher Barngrover; Wennie Tabib", "k": ["Reinforcement learning for physical robot control", "Geometric control", "Aerial robotics"], "kind": "P", "pdf": "https://arxiv.org/pdf/2605.24301v1", "ps": 2, "b": 219, "talk": "", "tier": "", "why": "", "top": []}, {"id": "2vsTg6WU2p", "t": "Action Chunk Scheduling for Batched Robot Policy Serving", "a": "Rohan Bansal; David He; Nadun Ranawaka Arachchige; Zhenyang Chen; Soobum Kim; Kexin Rong; Danfei Xu", "k": ["Robot systems, hardware, and sensors for learning", "Robot foundation models and general-purpose knowledge systems", "Inference, serving, and deployment"], "kind": "P", "pdf": "https://arxiv.org/pdf/2608.00337v1", "ps": 2, "b": 16, "talk": "", "tier": "S", "why": "Batched policy serving", "top": ["VLA testing", "Efficient/real-time"], "sum": "Large robot policies such as VLAs are too heavy for on-board compute, so a remote GPU must serve a fleet of robots. The authors built a serving system, Armory, and found ordinary batching fails when robots consume action chunks at different rates. Their scheduling algorithm accounts for this and raises system throughput by up to 18% in real-world experiments."}, {"id": "wRLEgpRnVR", "t": "ActionCodec: What Makes for Good Action Tokenizers", "a": "Zibin Dong models for anomaly recognition / introspection", "top": ["Motion control & safety", "Policy eval & safety bounds", "World models"]}, {"id": "2qcSjfv9pr", "t": "ADEPT: Accelerating Dexterity via Pre-Training and Post-Training using Reinforcement Learning", "a": "Jayjun Lee; Jessica Yin; Muhammad Asif Rana; Nicholas Blauch; Octi Zhang; Sam Mady; Mohak Bhardwaj; Nima Fazeli; Nathan D. Ratliff; Karl Van Wyk; Ankur Handa", "k": ["Sim-to-real transfer", "Robot manipulation", "Multi-fingered dexterous manipulation"], "kind": "P", "pdf": "https://arxiv.org/pdf/2608.19182v2", "ps": 3, "b": 122, "talk": "", "tier": "", "why": "", "top": []}, {"id": "tsWZwXGz5P", "t": "AdvDex: Learning Dexterous Manipulation from Human Demonstrations via Joint-Aligned Actions and Adversarial Learning", "a": "Zhiyue Zhao; Jingyi Wu; Hairuo Liu; Mingyu Liu; Liyang Li; Hengdi ZHANG; Tong He; Zhengxue Cheng", "k": ["Learning representations for robotic perception and control"], "kind": "P", "pdf": "https://arxiv.org/pdf/2608.14028v1", "ps": 3, "b": 53, "talk": "", "tier": "", "why": "", "top": []}, {"id": "Gr9nFtFTjn", "t": "AgileDP: Quantizing Diffusion Policy via Dynamic Scaling and Reweighted Distillation", "a": "Jiyeon Joung; Seungseop Lee; Namyoon Kim; Jaeheung Park; Keunwoo Jang", "k": ["Imitation learning (behavioral cloning, inverse RL)", "Robot manipulation", "Quantization", "Knowledge distillation"], "kind": "P", "pdf": "", "ps": 2, "b": 19, "talk": "", "tier": "S", "why": "Quantized diffusion policy", "top": ["Training frontier", "RL", "Efficient/real-time"]}, {"id": "m0Zqqi9Lfr", "t": "AI Coaching for Accelerating Human Skill Development with Reinforcement Learning", "a": "Wei Wang; Enlin Gu; Antonio Loquercio; Haimin Hu; Rahul Mangharam", "k": ["Human-robot interaction and natural language instruction", "Reinforcement learning for physical robot control", "AI coaching for human motor-skill development", "Shared autonomy"], "kind": "P", "pdf": "https://arxiv.org/pdf/2606.25337v1", "ps": 1, "b": 78, "talk": "", "tier": "", "why": "", "top": []}, {"id": "MCTsPd3H0q", "t": "ALIGN: Aligning Condition Estimation and Expression in Advantage-Conditioned Behavior Cloning", "a": "Zechen Wang; Zhenqi Qiu; Houlong Xiong; Suohang Zhang; Yiyu Ren; Wanting Xu; Hongfei Niu; Chengyang He; GE SUN; Ran Cheng; Qian Zhu", "k": ["Robot manipulation", "Imitation learning (behavioral cloning, inverse RL)"], "kind": "P", "pdf": "https://arxiv.org/pdf/2610.26455v1", "ps": 2, "b": 66, "talk": "", "tier": "", "why": "", "top": []}, {"id": "8iFziu27Yy", "t": "AM-Bench: A Modular Simulation Suite and Benchmark for Aerial Manipulation Policy Learning", "a": "Yutong Wang; Dongjae Lee; Xiaofeng Guo; Yuanzhu Zhan; Yufei Jiang; Bavin Saravanan; Muqing Cao; Jia Xie; Chenyang Mao; Sebastian Scherer; Junyi Geng; Guanya Shi", "k": ["Benchmarks and datasets for robot learning", "Robot manipulation", "Aerial manipulation"], "kind": "P", "pdf": "https://arxiv.org/pdf/2609.00641v1", "ps": 2, "b": 223, "talk": "", "tier": "", "why": "", "top": []}, {"id": "Sh0dG0HwVK", "t": "Ambient Diffusion Policy: Imitation Learning from Suboptimal Data in Robotics", "a": "Adam Wei; Nicholas Pfaff; Thomas Cohn; Arif Kerem Dayi; Constantinos Costis Daskalakis; Giannis Daras; Russ Tedrake", "k": ["Imitation learning (behavioral cloning, inverse RL)", "Robot manipulation", "Learning from suboptimal data", "Properties of robot data and action diffusion"], "kind": "P", "pdf": "https://arxiv.org/pdf/2606.12365v1", "ps": 3, "b": 77, "talk": "", "tier": "S", "why": "IL from suboptimal data", "top": ["Training frontier", "RL", "Deformable"], "sum": "High-quality robot demonstrations are expensive, while lower-quality or out-of-distribution data is plentiful, and co-training often mixes its useful and harmful features. Ambient Diffusion Policy restricts the suboptimal data to only the high and low diffusion-time steps during training. Tested on four kinds of suboptimal data and six tasks, it beats co-training baselines by up to 33% at Open X-Embodiment scale."}, {"id": "0o1c1Xxn1m", "t": "AmodalBox: Automated 3D Bounding Box Annotation under Partial Visibility", "a": "In-Jae Lee; Namtae Kim; Robert Exley; Kwonyoung Ryu; Jaesik Park", "k": ["Autonomous driving and flight", "Multimodal perception, sensor fusion, and robot vision", "Automated Annoation", "Open-vocabulary 3D Object Detection"], "kind": "P", "pdf": "", "ps": 1, "b": 189, "talk": "", "tier": "", "why": "", "top": []}, {"id": "eGZ6YMFVzU", "t": "An Adaptive Slow-Fast Framework for Real-Time Anomaly Detection in Autonomous Driving", "a": "Zhenyu Zong; Yuchen Wang; Jiangtao Kong; Xiaochang Li; Lui Sha; Huajie Shao", "k": ["Autonomous driving and flight", "Benchmarks and datasets for robot learning", "Anomaly Detection"], "kind": "P", "pdf": "", "ps": 3, "b": 219, "talk": "", "tier": "", "why": "", "top": []}, {"id": "nXfwmrzXzz", "t": "An Agentic Framework for Proactive Robots with Procedural Assistance Memory", "a": "Dohyun Lee; Minho Park; Jeonghoon Park; Dongyoon Hwang; Junha Hyung; Sungwon Hwang; Byungkun Lee; Jaegul Choo", "k": ["Robot foundation models and general-purpose knowledge systems", "Human-robot interaction and natural language instruction"], "kind": "P", "pdf": "https://arxiv.org/pdf/2610.21211v1", "ps": 1, "b": 76, "talk": "", "tier": "", "why": "", "top": []}, {"id": "Vv1WXMkSTD", "t": "An Empirical Study of Data-Loading Bottlenecks (and Non-Bottlenecks) in Robotic Imitation Learning", "a": "Mrinal Jain; Arpit Gupta; Animesh Garg", "k": ["Robot systems, hardware, and sensors for learning", "Imitation learning (behavioral cloning, inverse RL)"], "kind": "P", "pdf": "", "ps": 3, "b": 93, "talk": "", "tier": "S", "why": "Data-loading bottlenecks in IL", "top": ["RL"]}, {"id": "Q53ayGo2IE", "t": "Anchor3R: Streaming 3D Reconstruction with Transient Anchors for Long-Horizon Visual Mapping", "a": "Peilin Tao; Chong Cheng; yuansen du; Caiwei Song; Zhengqing Chen; Xiaoyang Guo; Wei Yin; Weiqiang Ren; Qian Zhang; Hainan Cui; Shuhan Shen", "k": ["Multimodal perception, sensor fusion, and robot vision", "Robot foundation models and general-purpose knowledge systems", "Robot Visual Mapping", "Streaming Feed-forward 3D Reconstruction"], "kind": "S", "pdf": "https://arxiv.org/pdf/2606.05035v2", "ps": 3, "b": 228, "talk": "S8", "tier": "S", "why": "Streaming 3D reconstruction", "top": ["Perception & vision", "VLA testing", "Long-horizon", "Efficient/real-time"], "sum": "Streaming 3D reconstruction models tend to drift over long runs because they predict poses in fixed or accumulated coordinates. Anchor3R predicts window-relative poses and local geometry in the current frame, then links overlapping predictions in a relative-pose graph with loop-aware motion averaging. Trained on 48-frame sequences, it generalizes to streams over 10,000 frames with bounded GPU memory and beats streaming baselines."}, {"id": "FGyOl5tNGl", "t": "Anchoring Attention in Clutter: Mask-Guided Latent Distillation for Vision-Language-Action Towards Dexterous Grasping", "a": "Xuanyu Zhang; He Li; Xinxiang Lou; Lu Chen; Yuxiang Cui; Zhongxiang Zhou; Rong Xiong", "k": ["Learning representations for robotic perception and control", "Robot manipulation"], "kind": "P", "pdf": "", "ps": 3, "b": 132, "talk": "", "tier": "", "why": "", "top": []}, {"id": "dYOnmedjXv", "t": "AnyDexRT: Calibration-Efficient Dexterous Hand Retargeting with Few-Shot Human Guidance", "a": "Chenxi Wang; Feng Ying; Hongjie Fang; Shangning Xia; Lixin Yang; Chuan Wen; Cewu Lu", "k": ["Robot systems, hardware, and sensors for learning", "Dexterous Hand Retargeting", "Teleoperation"], "kind": "P", "pdf": "", "ps": 3, "b": 42, "talk": "", "tier": "", "why": "", "top": []}, {"id": "iOU9zkASbg", "t": "AnyRank: Reliable Anytime Policy Ranking via Sequential Testing", "a": "Apurva Badithela; David Snyder; Tenny Yin; Jade Sceats; George J. Pappas; Nikolai Matni; Masha Itkina; Haruki Nishimura; Anirudha Majumdar", "k": ["Policy evaluation, adversarial scenarios generation, and red teaming"], "kind": "P", "pdf": "https://arxiv.org/pdf/2610.14603v2", "ps": 2, "b": 113, "talk": "", "tier": "M", "why": "Anytime policy ranking with sequential statistical tests — evaluation method", "top": ["Policy eval & safety bounds"], "sum": "Comparing robot policies with few costly hardware trials often gives wrong rankings. AnyRank is a sequential testing method that spends trials on policies that are hard to separate, yields a ranking at any stopping point with bounded error, and can use priors from experts, held-out tests, or simulation. It needed up to 50% fewer hardware evaluations than existing rigorous methods."}, {"id": "0w0ylGezd5", "t": "AnyWorld: Factorized Egocentric World Models for Cross-Embodiment Generalization", "a": "Cheng Chen; Jerry Bai; Jiacheng Wei; Boyu Chen; Xiaoji Zheng; Fan Wu; Minghao Yang; Tianrun Chen; Xiaoyu Yue; Ruixiao Ma; Yixiao Ge; Guosheng Lin; Fayao Liu", "k": ["Robotic data generation"], "kind": "P", "pdf": "https://arxiv.org/pdf/2608.29242v2", "ps": 3, "b": 8, "talk": "", "tier": "", "why": "", "top": []}, {"id": "j5QcZcRrda", "t": "Approximate Imitation Learning for Event-based Quadrotor Flight in Cluttered Environments", "a": "Nico Messikommer; Jiaxu Xing; Leonard Bauersfeld; Marco Cannici; Elie Aljalbout; Davide Scaramuzza", "k": ["Imitation learning (behavioral cloning, inverse RL)", "Autonomous driving and flight", "Event Cameras"], "kind": "P", "pdf": "https://arxiv.org/pdf/2603.07578v3", "ps": 2, "b": 221, "talk": "", "tier": "", "why": "", "top": []}, {"id": "8TvqhVkrMd", "t": "APT: Action Expert Pretraining Improves Instruction Generalization of Vision-Language-Action Policies", "a": "Kechun Xu; Zhenjie Zhu; Anzhe Chen; Rong Xiong; Yue Wang", "k": ["Robot foundation models and general-purpose knowledge systems", "Robot manipulation", "Vision-Language-Action Models", "Instruction Generalization"], "kind": "P", "pdf": "https://arxiv.org/pdf/2606.12366v2", "ps": 2, "b": 21, "talk": "", "tier": "", "why": "", "top": []}, {"id": "xXnpKl2IgD", "t": "ArticFlow: Action-Conditioned Flow Matching for Skeleton-Free Articulated Generation", "a": "Jiong Lin; Jinchen Ruan; Hod Lipson", "k": ["Robotic data generation", "Learning representations for robotic perception and control", "Articulated 3D generation", "Point Cloud Flow matching"], "kind": "P", "pdf": "", "ps": 3, "b": 82, "talk": "", "tier": "", "why": "", "top": []}, {"id": "FKKr8jKS29", "t": "Articulated 3D Scene Graphs for Open-World Mobile Manipulation", "a": "Martin Büchner; Adrian Röfer; Tim Engelbracht; Tim Welschehold; Zuria Bauer; Hermann Blum; Marc Pollefeys; Abhinav Valada", "k": ["Multimodal perception, sensor fusion, and robot vision", "Learning representations for robotic perception and control, 3D scene graphs", "Mobile manipulation"], "kind": "S", "pdf": "https://arxiv.org/pdf/2602.16356v2", "ps": 2, "b": 174, "talk": "S5", "tier": "", "why": "", "top": [], "sum": "MoMa-SG builds 3D scene graphs from RGB-D video that capture how objects move. It tracks object motion, estimates revolute and prismatic joints, and links containers to the items inside them, so a robot can predict articulation before manipulating. It was evaluated on two datasets and run on a quadruped and a mobile manipulator; no numeric result is given in the abstract."}, {"id": "IjnCc1OZnJ", "t": "Artificial Foveated Perception for Mitigating Shortcut Learning in Robotic Foundation Models", "a": "Xiatao Sun; Yuan Zhuang; Mateo Sanchez Lopez Negrete; Matei-Victor Coldea; Chen Liang; Haoyang Zhang; Che Liu; Ziyao Zeng; Shawn Li; Qian Wang; Fei Miao; Daniel Rakita", "k": ["Multimodal perception, sensor fusion, and robot vision", "Robot foundation models and general-purpose knowledge systems", "Shortcut Learning", "Generalizability"], "kind": "P", "pdf": "https://arxiv.org/pdf/2607.10655v3", "ps": 1, "b": 24, "talk": "", "tier": "S", "why": "Foveated perception vs shortcut learning", "top": ["Perception & vision", "VLA testing", "Efficient/real-time"], "sum": "Fine-tuned robotic foundation models can fail under small changes in layout, lighting, or distractors because of shortcut learning. Artificial Foveated Perception is a lightweight module that predicts masks over task-relevant objects, the robot, and key regions to guide attention during fine-tuning only. It improves generalization and shortens fine-tuning on four simulated models and a real pi0.5 robot; no numbers are given."}, {"id": "JI9u9A9JJO", "t": "ArtManip: Category-Level Articulated In-Hand Manipulation", "a": "Yang Yang; Tengyu Liu; Puhao Li; Zeyuan Chen; Yuyang Li; Xingwan Wang; Yingying Wu; Zhaopeng Cui; Siyuan Huang", "k": ["Robot manipulation", "Sim-to-real transfer", "In-Hand Manipulation"], "kind": "P", "pdf": "https://arxiv.org/pdf/2609.12498v1", "ps": 2, "b": 129, "talk": "", "tier": "", "why": "", "top": []}, {"id": "HfHTPpDBYr", "t": "Asking Smarter Questions: Targeted Active Preference Learning for Underspecified Rewards", "a": "Helena Merker; Nick Walker; Andreea Bobu", "k": ["Human-robot interaction and natural language instruction", "Active preference learning"], "kind": "P", "pdf": "https://arxiv.org/pdf/2610.22285v1", "ps": 1, "b": 82, "talk": "", "tier": "", "why": "", "top": []}, {"id": "Eb5TKtrt2X", "t": "Assembling Two Parts in One Hand", "a": "Liuao Pei; Tianyue Wu; Hui Zhang; Ping Luo; Jie Song", "k": ["Reinforcement learning for physical robot control", "Robot manipulation", "Dexterous manipulation", "Sim-to-real reinforcement learning"], "kind": "P", "pdf": "https://arxiv.org/pdf/2609.10137v1", "ps": 3, "b": 121, "talk": "", "tier": "S", "why": "Two-part assembly in one hand", "top": ["Dexterous/contact-rich", "RL"], "sum": "The paper studies assembling two rigid parts (a bottle, syringe and marker) with a single dexterous hand, without a second arm or fixture. Reinforcement learning is guided by a goal pose, a finger-role reward and a human reference pose, with domain randomization and sensor history to cope with occlusion. Policies trained only in simulation transfer zero-shot to hardware with one camera; no numbers are reported."}, {"id": "0HLj8l0bB4", "t": "AssemLM: A Spatial Reasoning Multimodal Large Language Model for Robotic Assembly", "a": "Zhi Jing; Jinbin Qiao; ouyang lu; Jicong Ao; Shuang Qiu; Huazhe Xu; Yu-Gang Jiang; Chenjia Bai", "k": ["Robot foundation models and general-purpose knowledge systems", "Benchmarks and datasets for robot learning"], "kind": "P", "pdf": "https://arxiv.org/pdf/2604.08983v2", "ps": 3, "b": 125, "talk": "", "tier": "", "why": "", "top": [], "sum": "A spatial multimodal LLM for robotic assembly that combines assembly manuals, point clouds and text instructions to predict 6D assembly poses. A dedicated point-cloud encoder feeds fine geometric and rotational features into the LLM. Introduces AssemBench (900K+ samples with 6D pose labels); reports state-of-the-art pose reasoning and multi-step real-robot assembly."}, {"id": "JiMWz6U93i", "t": "AsyncVLA: An Asynchronous VLA for Fast and Robust Navigation on the Edge", "a": "Noriaki Hirose; Catherine Glossop; Dhruv Shah; Sergey Levine", "k": ["Robot foundation models and general-purpose knowledge systems", "Robot navigation and locomotion"], "kind": "P", "pdf": "https://arxiv.org/pdf/2602.13476v1", "ps": 1, "b": 142, "talk": "", "tier": "", "why": "", "top": []}, {"id": "dPgz9Kssgo", "t": "ATHENA: Accelerated Multi-Task Heterogeneous Influence Functions for Robot Data Curation", "a": "Tao Xu; Jiaxin Wang; Runhao Zhang; Jiayi Guan; Xianchao Zeng; Weixi Song; Xinyu Zhou; ZheTao Chen; Guang Chen; Yong-Lu Li", "k": ["Imitation learning (behavioral cloning, inverse RL)", "Data Curation", "Influence Functions"], "kind": "P", "pdf": "https://arxiv.org/pdf/2606.16208v1", "ps": 3, "b": 94, "talk": "", "tier": "S", "why": "Influence functions for data curation", "top": ["Training frontier", "RL"], "sum": "Influence functions, which estimate how much each demonstration affects outcomes, are too expensive for billion-parameter VLA models across many tasks. ATHENA speeds them up using a Kronecker gradient structure and a randomized low-rank Hessian approximation, balancing influence across 50 tasks. It computes influence about 313 times faster and matches or beats full-data fine-tuning with 50% of demonstrations in simulation and 66.7% on six real tasks."}, {"id": "DpOVq6nE2d", "t": "ATOM-Bench: A Real-World Benchmark for Atomic Skills and Compositional Generalization in Manipulation Policies", "a": "Zenan Wu; Bingqing Wei; Lu Liu; Zheqi He; Wang Xi; liujiakang; lizehui; Guocai Yao; Jing-Shu Zheng; Xi Yang; Yongtao Wang", "k": ["Benchmarks and datasets for robot learning", "Robot manipulation"], "kind": "S", "pdf": "https://arxiv.org/pdf/2606.16826v1", "ps": 3, "b": 107, "talk": "S6", "tier": "S", "why": "Real-world atomic-skill benchmark", "top": ["Policy eval & safety bounds"], "sum": "ATOM-Bench is a real-world tabletop benchmark meant to separate fine motor failures from failures at recombining skills. It has 30 atomic tasks, 24 held-out compositional tasks and 3,000 human demonstrations, plus two new metrics. Across 2,700 rollouts of five policies, instruction grounding was fine but fine motor skills, counting and filtering were weak, and atomic skill did not reliably transfer to compositions."}, {"id": "Afq9dTKP09", "t": "Attention from Action, for Action: Emergent Visual Bottlenecks for Policy Learning", "a": "Zheyu Zhuang; Ruiyu Wang; Nick Heppert; Johannes Fabian Hahn; Abhinav Valada; Florian T. Pokorny; Danica Kragic", "k": ["Imitation learning (behavioral cloning, inverse RL)", "Robot manipulation", "Region of Interest"], "kind": "P", "pdf": "https://arxiv.org/pdf/2608.13422v2", "ps": 1, "b": 31, "talk": "", "tier": "", "why": "", "top": []}, {"id": "CPY2RsdnjI", "t": "AURORA: Active Uncertainty-Driven Re-Orientation for In-Hand Reconstruction", "a": "Feiyu Zhao; Yuetong Li; Chenxi Xiao", "k": ["Probabilistic learning and uncertainty in robotics", "Multimodal perception, sensor fusion, and robot vision", "Active In-Hand Object Reconstruction"], "kind": "P", "pdf": "https://arxiv.org/pdf/2609.08493v1", "ps": 3, "b": 133, "talk": "", "tier": "", "why": "", "top": []}, {"id": "8CDEvBQA6x", "t": "AutoDex: An Automated Real-World System for Dexterous Grasping Data Collection", "a": "Mingi Choi; Gunhee Kim; Jisoo Kim; Taeksoo Kim; Taeyun Ha; Jongbin Lim; Hanbyul Joo", "k": ["Robotic data generation", "Robot systems, hardware, and sensors for learning"], "kind": "P", "pdf": "https://arxiv.org/pdf/2606.23689v1", "ps": 2, "b": 128, "talk": "", "tier": "", "why": "", "top": []}, {"id": "2LNbCnzTQk", "t": "Automating the Design of Embodied Agent Architectures", "a": "Jian Zhou; Sihao Lin; Jin Li; Shuai Fu; Gengze Zhou; Qi Wu", "k": ["Combination of learning and planning in robotics", "Task and motion planning", "Embodied Agent Architecture Search", "Embodied Agent"], "kind": "P", "pdf": "https://arxiv.org/pdf/2606.30111v3", "ps": 1, "b": 228, "talk": "", "tier": "", "why": "", "top": []}, {"id": "Z35baC5jBe", "t": "AWLS: Advantage-Weighted Latent Steering for One-Step Generative Robotic Manipulation Policies", "a": "Jiahong Tang; Jiaju He; Zhiyuan Yang; Ruyang Han; Haiyue Zhu", "k": ["Robot manipulation", "Imitation learning (behavioral cloning, inverse RL), generative policies, latent steering"], "kind": "P", "pdf": "https://arxiv.org/pdf/2610.27736v1", "ps": 2, "b": 28, "talk": "", "tier": "", "why": "", "top": []}, {"id": "JQvRoFU5aS", "t": "Back to the Familiar Future: Failure Recovery for VLA Policies via Pre-Imagined Milestone Selection", "a": "Suyeon Shin; Juwon Kim; Hyeonbin Park; Hyunseo Kim; Hyundo Lee; Hyung-Sin Kim; Byoung-Tak Zhang", "k": ["Combination of learning and planning in robotics", "Vision-Language-Action Models", "Failure Recovery"], "kind": "P", "pdf": "https://arxiv.org/pdf/2606.09258v1", "ps": 2, "b": 96, "talk": "", "tier": "S", "why": "VLA failure recovery", "top": ["Policy eval & safety bounds", "VLA testing", "Planning & optimization"], "sum": "VLA policies can drift off course during manipulation, and re-planning from those states often makes actions unstable. B2FF generates future milestone states from the clean initial observation, then picks one during recovery as a fixed visual target, with no retraining of the low-level action generator. On LIBERO tests with injected failures, average success rose from 56.3% to 74.0%."}, {"id": "uHhNEb0OSW", "t": "Barrier-Constrained Guidance For Real-time Asynchronous VLA Execution", "a": "Wenbo Yu; Jifan Li; Wenke Xia; Yuchen Li; Yizhuo Zhang; Pei Ren; Zhengping Che; Di Hu", "k": ["Robot manipulation", "Real-time inference"], "kind": "P", "pdf": "https://arxiv.org/pdf/2610.14997v1", "ps": 2, "b": 6, "talk": "", "tier": "S", "why": "Barrier-constrained guidance for real-time async VLA — safe execution", "top": ["VLA testing", "Efficient/real-time"], "sum": "Running a robot policy asynchronously, predicting the next action chunk while the current one executes, creates a mismatch at chunk boundaries. FreeBar is a training-free plugin that adds a barrier-style consistency constraint between chunks, solved in closed form. It raises success rates by 10 to 15 percent on average over naive asynchronous execution and cuts per-chunk latency by more than 45 percent versus RTC."}, {"id": "y1uP4arjzC", "t": "BarrierFormer: Transformer-Guided Predictive Barrier Enforcement for Safe Robot Control", "a": "Anandsingh Chauhan; Kunal Garg", "k": ["Robot safety, alignment, and safe learning-based systems", "Model-based and model-free learning for robotic control", "Control Barrier Function", "Predictive Control"], "kind": "P", "pdf": "https://arxiv.org/pdf/2609.23896v1", "ps": 1, "b": 207, "talk": "", "tier": "S", "why": "Predictive barrier enforcement for safe robot control — motion control safety", "top": ["Motion control & safety", "Dexterous/contact-rich"], "sum": "BarrierFormer targets robot safety control, where standard barrier functions only check the current step and model predictive control needs a known model and heavy online computation. It trains a transformer that predicts future rollouts and corrects a nominal controller, with no online optimization. It beats RL, diffusion, MPC and transformer baselines on safety rate and latency in navigation tasks; no numbers are given."}, {"id": "Unsv9DsbfO", "t": "BayesFP: Posterior Estimation with Flow-Based Policy Priors via Feynman-Kac Sampling", "a": "Sreevardhan Sirigiri; Weiming Zhi; Fabio Ramos", "k": ["Imitation learning (behavioral cloning, inverse RL)", "Inference time policy steering", "Constrained Generative Policies"], "kind": "P", "pdf": "https://arxiv.org/pdf/2606.21014v3", "ps": 2, "b": 72, "talk": "", "tier": "", "why": "", "top": []}, {"id": "El4EDBhqCG", "t": "Bayesian Active Learning for Intent Disambiguation in Interactive Robot Planning", "a": "Huao Li; Carson Sobolewski; Augustinos D Saravanos; Yew Teck Tan; John Karigiannis; Chuchu Fan", "k": ["Human-robot interaction and natural language instruction", "Combination of learning and planning in robotics", "Bayesian Optimization", "Signal Temporal Logic"], "kind": "S", "pdf": "https://arxiv.org/pdf/2609.34270v1", "ps": 3, "b": 103, "talk": "S6", "tier": "", "why": "", "top": [], "sum": "Robots often get ambiguous instructions, and LLM-led clarification dialogues fail in predictable ways. This work treats clarification as active learning over Signal Temporal Logic task specifications: LLMs propose candidate specs and questions, while Bayesian optimization tracks uncertainty about user intent and selects the most informative question. Across four domains it reports higher task satisfaction and fewer clarification rounds than LLM baselines, without giving specific numbers."}, {"id": "JydY4anB01", "t": "Before Parc Fermé: RL-Time Pruning for Efficient Embodied LLMs in Autonomous Driving", "a": "Luca Benfenati; Ali Azimi; Matteo Risso; Fabio Carapellese; Daniele Jahier Pagliari; Alessio Burrello", "k": ["Reinforcement learning for physical robot control", "Autonomous driving and flight", "Large Language Models", "Training-Time Pruning"], "kind": "P", "pdf": "https://arxiv.org/pdf/2605.31256v2", "ps": 3, "b": 217, "talk": "", "tier": "", "why": "", "top": []}, {"id": "Tjg1ZvCdXU", "t": "Behavior Uncloning: Distilling Mode Redirection into Policy Weights without Inference-Time Steering", "a": "Hao Wang; Jiuzhou Lei; Dayou Li; Bangya Liu; Minghui Zheng; Manling Li; Ruohan Zhang; Zhiwen Fan", "k": ["Imitation learning (behavioral cloning, inverse RL)", "Learning representations for robotic perception and control"], "kind": "P", "pdf": "https://arxiv.org/pdf/2606.29201v3", "ps": 2, "b": 79, "talk": "", "tier": "", "why": "", "top": []}, {"id": "cfzFrOJmKA", "t": "Being-H0.5: Scaling Human-Centric Robot Learning for Cross-Embodiment Generalization", "a": "Hao Luo; Ye Wang; Wanpeng Zhang; Sipeng Zheng; Ziheng Xi; Chaoyi Xu; Haiweng Xu; Haoqi Yuan; Chi Zhang; Yiqing Wang; Yicheng Feng; Zongqing Lu", "k": ["Robot foundation models and general-purpose knowledge systems"], "kind": "O", "pdf": "", "ps": 1, "b": 67, "talk": "O1", "tier": "", "why": "", "top": []}, {"id": "GseuCgLNtO", "t": "Belt-Finger: An Affordable Soft Belt-Driven Gripper for Dexterous In-Hand Manipulation", "a": "Boya Zhang; Andreas Zell; Georg Martius", "k": ["Hardware design and optimization", "Robot manipulation", "Grasping"], "kind": "P", "pdf": "https://arxiv.org/pdf/2606.20193v1", "ps": 3, "b": 120, "talk": "", "tier": "", "why": "", "top": []}, {"id": "MWHlzlo4UD", "t": "Benchmarking Real-World Robotic Manipulation through Stochastic Challenges", "a": "Elias Gläßer; Gülhan Şikaroğlu; Pavlo Kupyn; Marc Pollefeys; Zuria Bauer; Hermann Blum", "k": ["Benchmarks and datasets for robot learning", "Robot manipulation"], "kind": "P", "pdf": "", "ps": 2, "b": 110, "talk": "", "tier": "S", "why": "Real-world benchmarking with stochastic challenges", "top": ["Policy eval & safety bounds"]}, {"id": "7hdkIcfGRw", "t": "Beyond Imitation: Reinforcement Learning-Based Sim-Real Co-Training for VLA Models", "a": "Liangzhi Shi; Shuaihang Chen; Feng Gao; Yinuo Chen; Kang Chen; Tonghe Zhang; Hongzhi Zang; Jiakai Zhou; Weinan Zhang; Chao Yu; Yu Wang", "k": ["Robot foundation models and general-purpose knowledge systems", "Sim-Real Co-Training", "Reinforcement Learning"], "kind": "P", "pdf": "https://arxiv.org/pdf/2602.12628v4", "ps": 3, "b": 64, "talk": "", "tier": "S", "why": "RL sim-real co-training for VLA", "top": ["VLA testing", "Training frontier", "Dexterous/contact-rich", "RL", "Efficient/real-time"], "sum": "Most sim-real co-training for VLA models uses supervised fine-tuning, treating simulation as fixed demonstrations. RL-Co first warm-starts on mixed real and simulated demonstrations, then fine-tunes with reinforcement learning in simulation, with a supervised loss on real data to limit forgetting. On four real tabletop tasks, real-world success rose 24% on OpenVLA and 20% on pi0.5 over baselines."}, {"id": "5fZzu1zWzG", "t": "Beyond Monotonic Progress: Retry-Supervised Value Learning for Robot Imitation", "a": "Xinyao Qin; Junjie Lu; Kaixin Wang; Chuheng Zhang; Sinjae Kang; Kimin Lee; Min Xu; Bin Liang; Jun Yang; Li Zhao", "k": ["Imitation learning (behavioral cloning, inverse RL)", "Robot Value Learning"], "kind": "P", "pdf": "https://arxiv.org/pdf/2606.24633v2", "ps": 2, "b": 81, "talk": "", "tier": "", "why": "", "top": []}, {"id": "Y6pog6YGIX", "t": "Beyond Semantic Classes: Online Physical Parameter Estimation via Embedding-Conditioned Gaussian Mixtures", "a": "Alexander Borca-Tasciuc; Prayag Sharma; Franck Djeumou", "k": ["Probabilistic learning and uncertainty in robotics", "Autonomous driving and flight"], "kind": "P", "pdf": "", "ps": 3, "b": 112, "talk": "", "tier": "", "why": "", "top": []}, {"id": "C08KksTfEx", "t": "Beyond the End-Effector: Learning Whole-Arm Contact Manipulation from Human Demonstrations", "a": "Bo-Ruei Huang; Daniel Seita; Erdem Biyik", "k": ["Robot manipulation", "Combination of learning and planning in robotics"], "kind": "P", "pdf": "https://arxiv.org/pdf/2610.17802v1", "ps": 3, "b": 58, "talk": "", "tier": "", "why": "", "top": []}, {"id": "ODnu3ohjEQ", "t": "BiDexGrasp: Coordinated Bimanual Dexterous Grasps across Object Geometries and Sizes", "a": "Mu Lin; Yi-Lin Wei; Jiaxuan Chen; Yuhao Lin; Shuoyu Chen; Zhizhao Liang; Jiangran Lyu; Jiayi Chen; Xiaoyi Fan; Chengyi Xing; Yansong Tang; He Wang; Wei-Shi Zheng", "k": ["Robot manipulation", "Robotic data generation", "Dexterous Grasping"], "kind": "S", "pdf": "https://arxiv.org/pdf/2604.06589v2", "ps": 2, "b": 122, "talk": "S3", "tier": "", "why": "", "top": [], "sum": "BiDexGrasp tackles the lack of data and models for two-handed dexterous grasping. The authors built a two-stage annotation pipeline yielding 9.53 million grasps over 6,351 objects sized 30 to 80 cm, plus a generative framework with a bimanual coordination module and size-adaptive generation. They report better results in simulation and real-world tests, without giving a specific metric."}, {"id": "bLQynefrlp", "t": "Bimanual Robot Manipulation via Multi-Agent In-Context Learning", "a": "Alessio Palma; Indro Spinelli; Vignesh Prasad; Luca Scofano; Yufeng Jin; Georgia Chalvatzaki; Fabio Galasso", "k": ["Robot manipulation", "Robot foundation models and general-purpose knowledge systems", "Bimanual Manipulation", "In-Context Learning"], "kind": "P", "pdf": "https://arxiv.org/pdf/2604.20348v3", "ps": 1, "b": 119, "talk": "", "tier": "", "why": "", "top": []}, {"id": "keuUzk1RSd", "t": "BiRoAD: Learning Shared and Role-Adaptive Representations for Bimanual Manipulation", "a": "Yan Shen; Yuchen Liu; Feng Jiang; Hangtian Hu; Xiaoqi Li; Shu Chen; Ruihai Wu; Hao Dong", "k": ["Robot manipulation", "Imitation learning (behavioral cloning, inverse RL)", "Bimanual Manipulation"], "kind": "P", "pdf": "https://arxiv.org/pdf/2609.23445v1", "ps": 1, "b": 136, "talk": "", "tier": "", "why": "", "top": []}, {"id": "mHCqiRUiHi", "t": "BitVLA: 1-bit Vision-Language-Action Models for Robotics Manipulation", "a": "Hongyu Wang; Chuyan Xiong; Ruiping Wang; Xilin CHEN", "k": ["Robot manipulation", "Robot foundation models and general-purpose knowledge systems", "Efficiency", "Quantization"], "kind": "S", "pdf": "https://arxiv.org/pdf/2506.07530v2", "ps": 1, "b": 59, "talk": "S2", "tier": "S", "why": "1-bit VLA", "top": ["VLA testing", "Efficient/real-time"], "sum": "Large vision-language-action models are too big for edge devices. BitVLA uses ternary weights (-1, 0, 1) on a 1-bit language model, with a distillation method that compresses the vision encoder to 1.58-bit weights. The abstract reports performance matching the full-precision OpenVLA-OFT baseline while cutting model memory by 11.0x and end-to-end latency by 4.4x."}, {"id": "TlWfBm8jtZ", "t": "Blind Dexterous Grasping via Real2Sim2Real Tactile Policy Learning", "a": "Shengcheng Luo; Xiyan Huang; Zhe Xu; Wanlin Li; Ziyuan Jiao; Chenxi Xiao", "k": ["Robot systems, hardware, and sensors for learning", "Sim-to-real transfer", "Dexterous Manipulation"], "kind": "P", "pdf": "https://arxiv.org/pdf/2606.11767v2", "ps": 2, "b": 152, "talk": "", "tier": "", "why": "", "top": []}, {"id": "KHjJ1z5m4y", "t": "Box Trajectories as Compact State Representations for World Action Models", "a": "Qinxi Yu; Wenzhou Ding; Gloria X. Wang; Albert J. Zhai; Shenlong Wang", "k": ["Robot manipulation", "Learning representations for robotic perception and control"], "kind": "P", "pdf": "https://arxiv.org/pdf/2610.17526v1", "ps": 3, "b": 13, "talk": "", "tier": "", "why": "", "top": []}, {"id": "YnMZwXZ68A", "t": "BridgeSim: Unveiling the OL-CL Gap in End-to-End Autonomous Driving", "a": "Seth Z. Zhao; Luobin Wang; Hongwei Ruan; Yuxin Bao; Yilan Chen; Ziyang Leng; Abhijit Ravichandran; Honglin He; Zewei Zhou; xu han; Abhishek Peri; Zhiyu Huang; Pranav Desai; Henrik I Christensen; Jiaqi Ma; Bolei Zhou", "k": ["Autonomous driving and flight", "Policy evaluation, adversarial scenarios generation, and red teaming"], "kind": "P", "pdf": "https://arxiv.org/pdf/2604.10856v1", "ps": 3, "b": 206, "talk": "", "tier": "", "why": "", "top": []}, {"id": "VEsQVsxMMw", "t": "Building Scalable Real-World Robot Data Generation via Compositional Simulation", "a": "Yiran Qin; Jiahua Ma; Li Kang; Wenzhan Li; Yihang Jiao; Xin Wen; Xiufeng Song; Heng Zhou; Zhemeng Zhang; Zhenfei Yin; Xihui Liu; Philip Torr; Ruimao Zhang", "k": ["Robotic data generation", "Task and motion planning"], "kind": "P", "pdf": "https://arxiv.org/pdf/2604.11386v1", "ps": 3, "b": 86, "talk": "", "tier": "", "why": "", "top": []}, {"id": "u2dtQWAFQo", "t": "CA-GMT: Contact-Aware Low-Rank Adaptation of Motion Tracking for Whole-Body Teleoperation", "a": "Sang-Hun Kim; Hanbyel Cho; Sunkyum yoo; Donghan Koo", "k": ["Reinforcement learning for physical robot control", "Sim-to-real transfer", "Teleoperation"], "kind": "P", "pdf": "", "ps": 2, "b": 206, "talk": "", "tier": "", "why": "", "top": []}, {"id": "7BXJJYw05E", "t": "CAN AI PERCEIVE PHYSICAL DANGER AND INTERVENE?", "a": "Abhishek Jindal; Dmitry Kalashnikov; R. Alex Hofer; Oscar Chang; Divya Garikapati; Anirudha Majumdar; Pierre Sermanet; Vikas Sindhwani", "k": ["Robot safety, alignment, and safe learning-based systems"], "kind": "P", "pdf": "https://arxiv.org/pdf/2509.21651v2", "ps": 1, "b": 229, "talk": "", "tier": "S", "why": "Can AI perceive physical danger and intervene?", "top": ["Motion control & safety"], "sum": "Foundation models may fail to notice physical dangers, such as an overloaded box or a hot drink handed to a child. The authors build a benchmark from real injury stories and safety rules, with generated images and videos of situations turning unsafe, to test risk detection and intervention decisions. They also train models to reason about stated safety constraints, reaching top constraint-satisfaction results; no score is given."}, {"id": "oq5Byppu7Q", "t": "CAP: Continuously Adaptive Perception-Blind Humanoid Locomotion via Learned Denoising", "a": "Hongjin Chen; Zijun Xu; Shihao Ma; Yi Zhao; Xilai Liu; Ke Ma; Wei Zhang; Chunyang Xie; Pengfei Li; Jieru Zhao; Wenchao Ding", "k": ["Robot navigation and locomotion", "Learning representations for robotic perception and control, humanoid locomotion, world models"], "kind": "P", "pdf": "https://arxiv.org/pdf/2609.11553v1", "ps": 3, "b": 170, "talk": "", "tier": "", "why": "", "top": []}, {"id": "7cfCazwFp6", "t": "Catch Me If You Can: Real-Time Feedback Denoising for Responsive VLAs", "a": "Yiheng Ji; Xingru Zhou; Luis Sentis; Mingyo Seo", "k": ["Robot manipulation"], "kind": "P", "pdf": "https://arxiv.org/pdf/2609.21022v1", "ps": 2, "b": 5, "talk": "", "tier": "S", "why": "Responsive VLAs", "top": ["VLA testing", "Efficient/real-time"], "sum": "Diffusion-based VLA models usually execute action chunks open-loop, so they react poorly when objects move mid-task. VLA-Feedback runs diffusion planning slowly and applies a light correction to each action using the newest observation at a high rate, without rerunning the full model. Average success on dynamic simulation tasks rose from 27.5 to 85.0 percent, matching GR00T on static LIBERO tasks."}, {"id": "TTJ3uxLcxL", "t": "Chameleon: Control-Indexed Prospective Memory for Visuomotor Manipulation", "a": "Xinying Guo; Chenxi Jiang; Hyun Bin Kim; Yuhang Han; Ying Sun; YANG XIAO; Jianfei Yang", "k": ["Imitation learning (behavioral cloning, inverse RL)", "Robot manipulation"], "kind": "P", "pdf": "https://arxiv.org/pdf/2603.24576v2", "ps": 1, "b": 38, "talk": "", "tier": "", "why": "", "top": []}, {"id": "gqmJ7SIK5Q", "t": "CHIP: Adaptive Compliance for Humanoid Control through Hindsight Perturbation", "a": "Sirui Chen; Zi-ang Cao; Zhengyi Luo; Fernando Castañeda; Chenran Li; Tingwu Wang; Ye Yuan; Linxi Fan; Karen Liu; Yuke Zhu", "k": ["Reinforcement learning for physical robot control", "Model-based and model-free learning for robotic control", "Humanoid", "Force control"], "kind": "P", "pdf": "https://arxiv.org/pdf/2512.14689v2", "ps": 3, "b": 191, "talk": "", "tier": "", "why": "", "top": []}, {"id": "mwJwAQ0CXT", "t": "CHORUS: Decentralized Multi-Embodiment Collaboration with One VLA Policy", "a": "Ria Doshi; Tian Gao; Annie S Chen; Chelsea Finn; Jeannette Bohg", "k": ["Robot foundation models and general-purpose knowledge systems", "Imitation learning (behavioral cloning, inverse RL)", "Multi-robot collaboration", "Vision-language-action models"], "kind": "P", "pdf": "https://arxiv.org/pdf/2606.12352v1", "ps": 1, "b": 72, "talk": "", "tier": "", "why": "", "top": []}, {"id": "dngZLI0SlV", "t": "Chunk-wise Model-based Policy Optimization", "a": "Weixi Song; Donglin Wang; Yong-Lu Li", "k": ["Model-based and model-free learning for robotic control", "Reinforcement learning for physical robot control"], "kind": "S", "pdf": "https://arxiv.org/pdf/2610.14564v1", "ps": 1, "b": 109, "talk": "S2", "tier": "", "why": "", "top": [], "sum": "Model-based reinforcement learning suffers from compounding errors, slow inference, and unstable backpropagation through time because the model is called repeatedly. This work optimizes a chunk-based policy using a chunk world model that predicts multi-step rollouts in one pass. It was tested on 19 high-dimensional humanoid tasks and a real quadruped walking deployment; no specific numbers are reported."}, {"id": "GeENMbQXhi", "t": "CLAP: Direct VLM-to-VLA Adaptation via Language-Action Grounding", "a": "Yuri Ishitoya; Jeremy Siburian; Masashi Hamaya; Haruto Suzuki; Kuniaki Saito; Toshihiko Fukushima; Cristian Camilo Beltran-Hernandez; Mai Nishimura", "k": ["Robot foundation models and general-purpose knowledge systems", "Robot manipulation"], "kind": "P", "pdf": "https://arxiv.org/pdf/2607.08974v1", "ps": 2, "b": 23, "talk": "", "tier": "", "why": "", "top": []}, {"id": "HT8whUVp22", "t": "CLIFT: Turning Gemini Robotics On-Device into Humanoid Specialists via Non-Invasive Closed-Loop Iterative Fine-Tuning", "a": "Yuxin Chen; Hari Srikanth; Nathan Jew; Menglin Wu; Pengcheng Wang; Junli Ren; Masayoshi Tomizuka; Peng Xu; Jinyu Xie; Thomas Tian", "k": ["Robot foundation models and general-purpose knowledge systems"], "kind": "P", "pdf": "https://arxiv.org/pdf/2607.29172v1", "ps": 3, "b": 178, "talk": "", "tier": "", "why": "", "top": []}, {"id": "7KV78k8rcv", "t": "Cloak: Zero-Shot Cross-Embodiment Manipulation by Masking the End-Effector from the VLA", "a": "Michael Piseno; Guy Tevet; Karen Liu", "k": ["Learning representations for robotic perception and control", "Robot foundation models and general-purpose knowledge systems"], "kind": "P", "pdf": "https://arxiv.org/pdf/2606.22836v2", "ps": 2, "b": 33, "talk": "", "tier": "", "why": "", "top": []}, {"id": "e9OQ6xsma9", "t": "Closing the Loop in Humanoid VLA: Persistent 3D Object Tokens for Verifiable Loco-Manipulation", "a": "Peng Ren; Haoyang Ge; Jiang Zhao; Cong Huang; Yukun Shi; Feixiang Ren; Pei Chi; Kai Chen", "k": ["Robot manipulation", "Human-robot interaction and natural language instruction", "Humanoid Loco-Manipulation", "Vision-Language-Action"], "kind": "P", "pdf": "https://arxiv.org/pdf/2607.18016v2", "ps": 2, "b": 200, "talk": "", "tier": "", "why": "", "top": []}, {"id": "yyitbtz7rQ", "t": "CMP: Robust Whole-Body Tracking for Loco-Manipulation via Competence Manifold Projection", "a": "Ziyang Cheng; Haoyu Wei; Hang Yin; Xiuwei Xu; Bingyao Yu; Jie Zhou; Jiwen Lu", "k": ["Reinforcement learning for physical robot control", "Robot manipulation", "Whole-body control", "Out-of-distribution robustness"], "kind": "S", "pdf": "https://arxiv.org/pdf/2604.07457v2", "ps": 3, "b": 202, "talk": "S7", "tier": "", "why": "", "top": [], "sum": "Whole-body control policies for legged mobile manipulators track end-effector poses well but often fail on out-of-distribution inputs such as sensor noise or infeasible commands. Competence Manifold Projection uses a frame-wise safety check, a safety estimator, and a latent space linking geometry to safety probability to keep the policy within its competent range. In typical out-of-distribution cases it raises survival rate up to 10 times while losing under 10% tracking performance."}, {"id": "DgA5zlu7Ck", "t": "CMRDF: Morphology-Conditioned Reachability Fields for Task-Space Robot Policy Transfer", "a": "Ziyun Yang; Jinde Chen; Shiyang Xie; Shangqi Guo", "k": ["Combination of learning and planning in robotics", "Task and motion planning", "Morphology-conditioned reachability", "SE(3) pose repair"], "kind": "P", "pdf": "", "ps": 1, "b": 215, "talk": "", "tier": "", "why": "", "top": []}, {"id": "tegLlXBRCU", "t": "Coarse-to-Control: Action-Token Planning for Vision-Language-Action Models", "a": "Jinhao wu; Shiduo Zhang; Yicheng Liu; Xiaopeng Yu; Sixian Li; Siyin Wang; Hang Zhao; Jingjing Gong; Xipeng Qiu", "k": ["Robot manipulation", "Vision-Language-Action Model", "Action Tokenization", "Planning"], "kind": "P", "pdf": "https://arxiv.org/pdf/2606.07107v1", "ps": 1, "b": 12, "talk": "", "tier": "", "why": "", "top": []}, {"id": "Hi8mV09nOi", "t": "CoFL-S: Spatially Queryable Sector Flow Fields for Local Language-Conditioned Navigation", "a": "Haokun Liu; Zhaoqi MA; Yicheng Chen; Wentao Zhang; masaki kitagawa; XIONGZICEN; Jinjie Li; MOJU ZHAO", "k": ["Learning representations for robotic perception and control", "Robot navigation and locomotion", "Vision-Language Navigation", "Flow Field Policy"], "kind": "P", "pdf": "https://arxiv.org/pdf/2607.02222v2", "ps": 3, "b": 215, "talk": "", "tier": "", "why": "", "top": []}, {"id": "xm8LPYlbxA", "t": "CoGeL: Constraint-to-Geometry Learning from Demonstrations and Failures for Safe Long-Horizon Robot Navigation", "a": "Jumman Hossain; Nirmalya Roy", "k": ["Reinforcement learning for physical robot control", "Robot navigation and locomotion", "Robot Learning", "Safe Long-Horizon Navigation"], "kind": "P", "pdf": "", "ps": 1, "b": 169, "talk": "", "tier": "", "why": "", "top": []}, {"id": "ffIOVlfRQN", "t": "CoLA: Robust Collaborative Perception with Linear Global Spatial Alignment", "a": "Jing Zhang; Xiaobo Zhou", "k": ["Learning representations for robotic perception and control", "Multimodal perception, sensor fusion, and robot vision", "Multi-Agent Perception", "Spatial Misalignment"], "kind": "P", "pdf": "", "ps": 1, "b": 184, "talk": "", "tier": "", "why": "", "top": []}, {"id": "lSrxDURLdG", "t": "Collaborative Planning for UAV-UGV Teams under Operational Constraints via Masked Error-bounded Neuro-Symbolic Diffusion", "a": "Zihao Deng; Qianhuang Li; Maggie Wigness; John G. Rogers III; Donghyun Kim; Hao Zhang", "k": ["Task and motion planning", "Heterogeneous Multi-Robot Planning", "Neuro-Symbolic Diffusion"], "kind": "S", "pdf": "https://arxiv.org/pdf/2610.18850v1", "ps": 3, "b": 229, "talk": "S8", "tier": "", "why": "", "top": [], "sum": "This paper plans joint missions for drones and ground vehicles, where drones have limited battery energy and ground vehicles are restricted to certain roads. The proposed method, MEND, is a masked diffusion planner whose action choices are filtered by a logic-based check so only allowed actions are picked. It reports improved planning in simulation, real maps and physical robots, but gives no specific numbers."}, {"id": "cJGMjQlgz5", "t": "Combining Constrained Sampling and Reinforcement Learning for Manipulation", "a": "Marc Toussaint; Cornelius V. Braun; Armand Jordana; Sayantan Auddy; Eckart Cobo-Briesewitz; Denis Shcherba; Tilman Burghoff; Justin Carpentier", "k": ["Robot manipulation"], "kind": "S", "pdf": "https://arxiv.org/pdf/2602.08557v2", "ps": 2, "b": 167, "talk": "S4", "tier": "", "why": "", "top": [], "sum": "Reinforcement learning for contact-rich manipulation often fails to discover complex strategies through exploration alone. The authors add a new state sampler that produces diverse, physically constrained contact configurations, and use it for RL resets together with projected interpolation and curriculum learning. They report outperforming standard RL and other reset methods, without giving a specific figure in the abstract."}, {"id": "Y55iJjxMsh", "t": "Compositional Diffusion Policy for Vision–Language–Action Agents", "a": "Yuxuan Xu; Jianzhe Gao; Hanlin Kong; Zhen Yin; Yonggen Ling; Wenguan Wang", "k": ["Robot manipulation", "Imitation learning (behavioral cloning, inverse RL)", "Vision–Language–Action agents", "Compositional Generalization"], "kind": "P", "pdf": "", "ps": 1, "b": 20, "talk": "", "tier": "", "why": "", "top": []}, {"id": "9SnXCYklB0", "t": "CompVLA: A Variable Compliance Vision-Language-Action Model for Contact-rich Manipulation", "a": "Jongmin Kim; Junsu HA; Che-Sang Park; Minchang Song; Hyeokju Jeong; Himchan Hwang; Jianlong Fu; Frank C. Park", "k": ["Robot foundation models and general-purpose knowledge systems", "Robot manipulation", "Vision-Language-Action Model", "Compliance control"], "kind": "P", "pdf": "https://arxiv.org/pdf/2609.23614v1", "ps": 3, "b": 144, "talk": "", "tier": "S", "why": "Variable-compliance VLA", "top": ["Motion control & safety", "VLA testing", "Dexterous/contact-rich", "Efficient/real-time"], "sum": "Current vision-language-action models output only motion commands, so they struggle in contact-rich tasks where the robot must also control how it yields to forces. CompVLA adds a Compliance Expert that predicts time-varying stiffness and virtual displacement, executed through impedance control. It reports the best average success rate across several contact-rich tasks against standard and compliance-aware baselines, without giving a specific score."}, {"id": "NzvfxoRvOC", "t": "Constrained Whole-Body Tracking for Humanoid Robots", "a": "Daniel Morton; Pranit Mohnot; Marco Pavone", "k": ["Robot safety, alignment, and safe learning-based systems", "Reinforcement learning for physical robot control"], "kind": "P", "pdf": "https://arxiv.org/pdf/2606.00374v2", "ps": 2, "b": 204, "talk": "", "tier": "", "why": "", "top": []}, {"id": "MjpidVjNMS", "t": "Constraint-Decomposed Impedance Control from Generative Policy for Articulated Object Manipulation", "a": "Kyungseo Park; Byeongdo Lim; Jungbin Lim; Minseok Choi; Frank C. Park", "k": ["Robot manipulation", "Robot safety, alignment, and safe learning-based systems", "Articulated object manipulation", "Impedance control"], "kind": "S", "pdf": "https://arxiv.org/pdf/2610.16316v1", "ps": 2, "b": 168, "talk": "S4", "tier": "S", "why": "Impedance control from a generative policy — learning + compliance", "top": ["Motion control & safety"], "sum": "Robot policies often violate the motion constraints of doors, drawers and bolts, and good impedance gains are hard to pick. This work runs a generative policy several times, applies PCA to the end-effector twists to find the feasible motion subspace, and builds 6x6 impedance gain matrices from it. It reports lower constraint-violating contact loads than uniform impedance while still finishing tasks; no numbers are given."}, {"id": "Jq0aPlIS34", "t": "ContactGuard: Pre-Contact Execution Monitoring with Action-Conditioned Latent World Models", "a": "Gehan Zheng; Matthew Johnson-Roberson; Weiming Zhi", "k": ["Imitation learning (behavioral cloning, inverse RL)", "Video models and latent world models for robot learning"], "kind": "P", "pdf": "https://arxiv.org/pdf/2608.13438v1", "ps": 3, "b": 21, "talk": "", "tier": "S", "why": "Pre-contact execution monitoring with latent world models — safety before contact", "top": ["Policy eval & safety bounds", "World models", "RL"], "sum": "ContactGuard tries to catch contact failures before they happen on wrist-camera robots. A world model trained on unlabeled trajectories predicts, in a compact latent space, what a planned action chunk will cause, and a small failure probe decides whether to abort. The policy is unchanged. It predicts failure better than ablations, though no numbers are given."}, {"id": "WxBKiMUZtI", "t": "ContactMimic: Humanoid Object Interaction via Contact Control", "a": "Xinyao Li; Xialin He; Runpei Dong; Saurabh Gupta", "k": ["Reinforcement learning for physical robot control"], "kind": "P", "pdf": "https://arxiv.org/pdf/2607.08742v1", "ps": 2, "b": 215, "talk": "", "tier": "", "why": "", "top": []}, {"id": "MTZ4eKUP94", "t": "Continual Learning for 6-DoF Grasp Synthesis via Experience and Demonstrations", "a": "Giulio Schiavi; Andrei Cramariuc; Michael Pantic; Roland Siegwart", "k": ["Robot manipulation", "Grasping", "Continual Learning"], "kind": "P", "pdf": "https://arxiv.org/pdf/2610.01301v1", "ps": 2, "b": 135, "talk": "", "tier": "", "why": "", "top": []}, {"id": "2xR8oasJuM", "t": "Continual Quadruped Robots Coordination via Sementic Skill Discover", "a": "Daoqing Wang; Yuchen Xiao; Weixuan Huang; Zhilong Zhang; Shenghua Wan; Meng Li; Lei Yuan; Yang Yu", "k": ["Reinforcement learning for physical robot control", "Robot navigation and locomotion", "Continual Robot Learning", "Multi-Robot Coordination"], "kind": "P", "pdf": "https://arxiv.org/pdf/2606.08102v2", "ps": 3, "b": 194, "talk": "", "tier": "", "why": "", "top": []}, {"id": "c9tCcHtVcS", "t": "Control-Ready Uncertainty for Trajectory Diffusion", "a": "Zhiwei Xue; Kam Jia Yue; Jinhang Qiu; Yifeng Cheng; Ege Gursoy; Jiaming Wang; Vincent bonnet; Harold Soh", "k": ["Probabilistic learning and uncertainty in robotics", "Learning representations for robotic perception and control", "Diffusion", "MPPI"], "kind": "S", "pdf": "https://arxiv.org/pdf/2610.12431v1", "ps": 3, "b": 102, "talk": "S6", "tier": "S", "why": "Control-ready uncertainty for trajectory diffusion — bridge to controllers", "top": ["Perception & vision", "Policy eval & safety bounds"], "sum": "Getting uncertainty from diffusion trajectory models normally needs many samples, which is too slow for real-time control. SCOPE is a lightweight add-on that learns a precision matrix around each predicted trajectory, giving per-timestep covariance. The authors report faster uncertainty estimates and better closed-loop results on forecasting, navigation, Maze2D and Franka Panda tasks, without giving specific numbers."}, {"id": "7ymfgWpcWw", "t": "ControlTac: Scaling Tactile Data with Physically Controlled Tactile Image Generation", "a": "Dongyu Luo; Kelin Yu; Amir Hossein Shahidzadeh; Cornelia Fermuller; Yiannis Aloimonos; Ruohan Gao", "k": ["Multimodal perception, sensor fusion, and robot vision", "Robotic data generation", "Tactile Sensing", "Tactile Data Augmentation for Visuo-Tactile Robot Learning"], "kind": "P", "pdf": "https://arxiv.org/pdf/2505.20498v3", "ps": 3, "b": 139, "talk": "", "tier": "", "why": "", "top": []}, {"id": "v4QUDwGroQ", "t": "COOL: Curiosity-Driven Object Ownership Learning for Personalized Robotic Assistance", "a": "Samira Huber; Ruben Hammele; Soren Pirk", "k": ["Human-robot interaction and natural language instruction", "Task and motion planning"], "kind": "P", "pdf": "https://arxiv.org/pdf/2610.09358v1", "ps": 1, "b": 77, "talk": "", "tier": "", "why": "", "top": []}, {"id": "da5VPQA7G7", "t": "CoopUQ: Robust Multi-Robot Social Navigation via Uncertainty-Aware Cooperative Forecasting", "a": "Zehao Wang; Jianpeng Yao; Yuping Wang; Yiping Li; Jiaqi Li; Zhixu Li; Kanghoon Lee; Jinfeng Wang; Cong Liu; Zhaowei Tan; Jinkyoo Park; Jiachen Li", "k": ["Reinforcement learning for physical robot control", "Learning representations for robotic perception and control"], "kind": "P", "pdf": "https://arxiv.org/pdf/2610.26852v1", "ps": 1, "b": 152, "talk": "", "tier": "", "why": "", "top": []}, {"id": "msKuD5tWYj", "t": "CoPark: Learning Reactive Parking via Self-Play", "a": "Jiarong Wei; Yanxing Chen; Sinuo Song; Yin Wu; Anna Rehr; Abhinav Valada", "k": ["Autonomous driving and flight", "Combination of learning and planning in robotics"], "kind": "P", "pdf": "https://arxiv.org/pdf/2606.04149v2", "ps": 3, "b": 225, "talk": "", "tier": "", "why": "", "top": []}, {"id": "qKU6lifnPU", "t": "CoRE-VLA: Towards Scalable and Robust Vision-Language-Action Modeling via Conditional Routing of Experts", "a": "Haozhe Zhang; Sixian Li; Yifei Zhang; Zezheng Huai; Hao Chen; Chunhua Shen; Jingjing Gong; Xipeng Qiu", "k": ["Robot foundation models and general-purpose knowledge systems", "Robot manipulation"], "kind": "P", "pdf": "https://arxiv.org/pdf/2607.03693v2", "ps": 1, "b": 3, "talk": "", "tier": "", "why": "", "top": []}, {"id": "ojMvvFKk6t", "t": "CoReMatch: Recurrent Continuous Coordinate Refinement for Real-Time Robotic Feature Matching", "a": "Robert J. Wang; Charles Ling; Boyu Wang", "k": ["Learning representations for robotic perception and control", "Multimodal perception, sensor fusion, and robot vision", "Feature Matching", "Coordinate Refinement"], "kind": "P", "pdf": "", "ps": 1, "b": 180, "talk": "", "tier": "S", "why": "Real-time feature matching", "top": ["Perception & vision", "Efficient/real-time"]}, {"id": "pTqOGquuCh", "t": "CoSMO: Conformal Semantic Mapping for Open-World Safe Robot Navigation", "a": "Shuqi Wang; Yiwei Zheng; Pingrui Zhang; Yue Gao; Xiang Yin", "k": ["Robot safety, alignment, and safe learning-based systems", "Robot navigation and locomotion", "Conformal Prediction"], "kind": "P", "pdf": "https://arxiv.org/pdf/2610.18321v1", "ps": 1, "b": 168, "talk": "", "tier": "", "why": "", "top": []}, {"id": "qbninLImrj", "t": "CostNav: A Navigation Benchmark for Real-World Economic-Cost Evaluation of Physical AI Agents", "a": "Haebin Seong; Sungmin Kim; Yongjun Cho; Myunchul Joe; Geunwoo Kim; Yu Been Park; Sunhoo Kim; Samwoo Seong; Yoonshik Kim; Suhwan Choi; Jaeyoon Jung; Jiyong Youn; Jin Myung Kwak; Sunghee Ahn; Jaemin Lee; Younggil Do; Seungyeop Yi; Woojin Cheong; Minhyeok Oh; Minchan Kim; Seongjae Kang; Youngjae Yu; Yunsung Lee", "k": ["Benchmarks and datasets for robot learning"], "kind": "P", "pdf": "https://arxiv.org/pdf/2511.20216v7", "ps": 1, "b": 166, "talk": "", "tier": "", "why": "", "top": []}, {"id": "WeNTfF2Rks", "t": "CoStream: Composing Simple Behaviors for Generalizable Complex Manipulation", "a": "Haonan Chen; Yuxiang Ma; Stephen Tian; Xiaoshen Han; Wenlong Huang; Feiyang Wu; Yunzhu Li; Jiajun Wu; Edward H Adelson; Yilun Du", "k": ["Robot foundation models and general-purpose knowledge systems", "Combination of learning and planning in robotics", "Behavior Composition"], "kind": "P", "pdf": "https://arxiv.org/pdf/2606.26423v2", "ps": 1, "b": 133, "talk": "", "tier": "", "why": "", "top": []}, {"id": "AY4totylcx", "t": "CounterAlign: Counterfactual Supervision for Vision-Language-Action Models", "a": "Haru Kondoh; Kei Ota; Asako Kanezaki; Yueh-Hua Wu", "k": ["Robot foundation models and general-purpose knowledge systems", "Robot manipulation", "Offline Reinforcement Learning"], "kind": "P", "pdf": "https://arxiv.org/pdf/2608.21740v1", "ps": 2, "b": 31, "talk": "", "tier": "", "why": "", "top": []}, {"id": "uZalcCyrVl", "t": "Counterfactual Video Generation Enables Scalable Humanoid Loco-Manipulation", "a": "Zihan Wang; Zhen Wu; Pieter Abbeel; Rocky Duan; Jitendra Malik; Carmelo Sferrazza; Karen Liu; Guanya Shi; Angjoo Kanazawa", "k": ["Video models and latent world models for robot learning", "Reinforcement learning for physical robot control", "Real-to-Sim-to-Real; Real2Sim2Real"], "kind": "P", "pdf": "https://arxiv.org/pdf/2609.38172v1", "ps": 2, "b": 184, "talk": "", "tier": "", "why": "", "top": []}, {"id": "zDGliNPeBL", "t": "Coupled Local and Global World Models for Efficient First Order RL", "a": "Joseph Amigo; Rooholla Khorrambakht; Nicolas Mansard; Ludovic Righetti", "k": ["Reinforcement learning for physical robot control", "Model-based and model-free learning for robotic control", "World Models", "Robot Manipulation"], "kind": "P", "pdf": "https://arxiv.org/pdf/2602.06219v3", "ps": 3, "b": 27, "talk": "", "tier": "", "why": "", "top": []}, {"id": "QJI3N7JzBc", "t": "Coverage Aware Active Evaluation for Failure Discovery with Paired Systems", "a": "Anjali Parashar; Rachel Luo; Apoorva Sharma; Sushant Veer; Edward Schmerling; Carson Sobolewski; Mingxin Yu; Chuchu Fan", "k": ["Policy evaluation, adversarial scenarios generation, and red teaming", "Probabilistic learning and uncertainty in robotics", "Testing & Evaluation", "Adaptive Experiment Design"], "kind": "P", "pdf": "https://arxiv.org/pdf/2608.13719v1", "ps": 2, "b": 111, "talk": "", "tier": "S", "why": "Active evaluation for failure discovery — policy evaluation", "top": ["Policy eval & safety bounds"], "sum": "Finding rare failures in autonomous systems is costly when real tests are limited and simulator failures often don't transfer. This method pairs many proxy tests with few real ones, learns a local risk predictor to correct the proxy, and picks scenarios likely to fail and diverse. Across driving, manipulation and quadruped tasks it finds up to twice as many failures as random and active-learning baselines."}, {"id": "84ea2xeP60", "t": "COWBOY: A Scalable Sim-to-Real Framework for Learning Contextual Whole-Body Manipulation", "a": "Jiahui Yang; Jason Jingzhou Liu; Muxin Liu; Andrew E. Wang; Kenneth Shaw; Deepak Pathak; Ruslan Salakhutdinov", "k": ["Sim-to-real transfer", "Robot manipulation", "Mobile Manipulation"], "kind": "P", "pdf": "https://arxiv.org/pdf/2610.28948v1", "ps": 1, "b": 135, "talk": "", "tier": "", "why": "", "top": []}, {"id": "GVDQtVONA1", "t": "CrowdMAPS: Crowdsourcing Multiple Actions per State for Real-World Robot Imitation Learning", "a": "Yilong Song; Harshvardhan Chandirasekar; Karthik Desingh; Chen Zhu-Tian", "k": ["Robotic data generation", "Imitation learning (behavioral cloning, inverse RL)", "Robot manipulation"], "kind": "P", "pdf": "", "ps": 3, "b": 92, "talk": "", "tier": "", "why": "", "top": []}, {"id": "2NBZAh51If", "t": "CS-Pi: Constraint-Satisying Flow Policy Sampling", "a": "Soumojit Bhattacharya; Oliver Kroemer; Shubham Tulsiani", "k": ["Robot manipulation", "Flow matching policies", "VLA"], "kind": "P", "pdf": "", "ps": 1, "b": 213, "talk": "", "tier": "S", "why": "Constraint-satisfying sampling from flow policies — hard constraints at inference", "top": ["Motion control & safety", "VLA testing", "Training frontier"]}, {"id": "o4lQTMHyTc", "t": "Cue the Flow: Steering Flow-Matching Policies for Open-World Delivery Manipulation", "a": "Haoxuan Wang; Griffin Galimi; Junhua Huang; Selina Song; Wayne Wu; Yan Yan; Bolei Zhou", "k": ["Robot manipulation", "Imitation learning (behavioral cloning, inverse RL)"], "kind": "P", "pdf": "https://arxiv.org/pdf/2609.38989v1", "ps": 3, "b": 74, "talk": "", "tier": "", "why": "", "top": []}, {"id": "wiovp2zRWA", "t": "Current as Touch: Proprioceptive Contact Feedback for Compliant Dexterous Manipulation", "a": "Chenyang Ma; Yunchao Yao; Zhenyu Wei; Ruogu Li; Daniel Szafir; Mingyu Ding", "k": ["Robot systems, hardware, and sensors for learning", "Robot manipulation", "Dexterous manipulation", "Compliance Control"], "kind": "P", "pdf": "https://arxiv.org/pdf/2607.03529v1", "ps": 2, "b": 154, "talk": "", "tier": "S", "why": "Motor current as touch", "top": ["Motion control & safety", "Dexterous/contact-rich"], "sum": "Compliant dexterous manipulation usually relies on sensors that are costly, fragile and hard to fit on cheap hands. This framework uses motor current and joint states, which reflect actuator torque, to predict a compliance reference position for a standard PD controller, so position error yields an appropriate grip force without extra sensors. Experiments on several hands report stable grasping and safer teleoperation; no numbers are given."}, {"id": "Mnggg9cnbh", "t": "Cyclops: LiDAR as a Camera That Dreams in Color", "a": "Wei Gao; Jian Shu; Mingle Zhao; Maani Ghaffari; David Kong; Cheng-zhong Xu; Hui Kong", "k": ["Multimodal perception, sensor fusion, and robot vision", "Robotic data generation", "LiDAR as a Camera", "LiDAR Intensity"], "kind": "P", "pdf": "https://arxiv.org/pdf/2608.16264v2", "ps": 1, "b": 187, "talk": "", "tier": "", "why": "", "top": []}, {"id": "T3IOHvur0R", "t": "C³ache: Accelerating World Action Models with Cross Inference Chunk Cache", "a": "Weisen Zhao; Lam Christopher Nguyen; Zhicong Lu; Yuzhang Shang", "k": ["Video models and latent world models for robot learning", "World Action Models", "Acceleration and Cache for Efficiency"], "kind": "P", "pdf": "", "ps": 3, "b": 34, "talk": "", "tier": "", "why": "", "top": []}, {"id": "mR4L9LaUGJ", "t": "DAM-VLA: Decoupled Asynchronous Multimodal Vision Language Action model", "a": "Pankhuri Vanjani; Zhuoyue Li; Jakub Suliga; Moritz Reuss; Gianluca Geraci; Xinkai Jiang; Rudolf Lioutikov", "k": ["Robot foundation models and general-purpose knowledge systems", "Robot manipulation", "Multimodal perception"], "kind": "P", "pdf": "https://arxiv.org/pdf/2606.12105v1", "ps": 2, "b": 12, "talk": "", "tier": "", "why": "", "top": []}, {"id": "JwpvRd730L", "t": "Damage-Aware Quadruped Locomotion: Zero-Shot Adaptation to Motor Failures via Pain-Inspired Reinforcement Learning", "a": "Jiwei Sun; Jingyu XU; Zhuang Zhang; Ronghua Hu; Xingxing Zhang; Hua Yang", "k": ["Reinforcement learning for physical robot control", "Fault-tolerant legged locomotion", "Quadruped robots"], "kind": "P", "pdf": "", "ps": 3, "b": 187, "talk": "", "tier": "", "why": "", "top": []}, {"id": "hSRtOgnkTM", "t": "DAVATaR: Depth-Aware Visually Augmented Tactile Learning Across the Air-Water Interface", "a": "Bowen Jiang; Siqi Shang; Rahul Ajay Iyer; Ashwin Prakash; Lillian Chin; Roberto Martín-Martín", "k": ["Multimodal perception, sensor fusion, and robot vision", "Robot systems, hardware, and sensors for learning"], "kind": "S", "pdf": "", "ps": 2, "b": 162, "talk": "S4", "tier": "", "why": "", "top": []}, {"id": "gn0kBXdK0G", "t": "DeCAL: Towards Physically-Grounded Dexterous Vision-Language-Action Models via Contact-Aware Latent Co-Imagination", "a": "Yankai Fu; Ning Chen; Junkai Zhao; Heng Zhang; Guocai Yao; Pengwei Wang; Zhongyuan Wan
