], "kind": "P", "pdf": "https://arxiv.org/pdf/2604.09487v4", "ps": 3, "b": 108, "talk": "", "tier": "", "why": "", "top": []}, {"id": "8gqhCYKrxR", "t": "SimFoundry: Modular and Automated Scene Generation for Policy Learning and Evaluation", "a": "Nadun Ranawaka Arachchige; Josiah Wong; Wei-Lin Pai; Wei-Teng Chu; Tianyuan Dai; Masoud Moghani; Hang Yin; Yunfan Jiang; Wesley Durbano; Brandon Bryce Huynh; Yu Fang; Danfei Xu; Ruohan Zhang; Li Fei-Fei; Linxi Fan; Bowen Wen; Ajay Mandlekar; Yuke Zhu", "k": ["Sim-to-real transfer", "Policy evaluation, adversarial scenarios generation, and red teaming, real-to-sim, simulation"], "kind": "P", "pdf": "https://arxiv.org/pdf/2606.28276v4", "ps": 3, "b": 81, "talk": "", "tier": "", "why": "", "top": []}, {"id": "aRtb8NIgc3", "t": "SIMPLE: Simulation-Based Policy Learning and Evaluation for Humanoid Loco-manipulation", "a": "Songlin Wei; Zhenhao Ni; Jie Liu; Zhenyu Zhao; Junjie Ye; Hongyi Jing; Junkai Xia; Michael Leong; Xiawei Liu; Liang Heng; Di Huang; Yue Wang", "k": ["Robot foundation models and general-purpose knowledge systems", "Policy evaluation, adversarial scenarios generation, and red teaming", "Humanoid Loco-Manipulation", "Simulation-based Evaluation"], "kind": "P", "pdf": "https://arxiv.org/pdf/2606.08278v2", "ps": 2, "b": 186, "talk": "", "tier": "", "why": "", "top": []}, {"id": "CqkIkio00K", "t": "Simultaneous Forward and Inverse Human-in-the-Loop Optimization", "a": "Kyeongwon Park; Steven H. Collins", "k": ["Human-robot interaction and natural language instruction", "Imitation learning (behavioral cloning, inverse RL)", "Physical human-robot interaction", "Preference learning"], "kind": "P", "pdf": "https://arxiv.org/pdf/2609.22630v2", "ps": 1, "b": 222, "talk": "", "tier": "", "why": "", "top": []}, {"id": "UZnHsKKAAB", "t": "SkillWeaver: Agentic Exploration over Neural Interaction Skills for Scalable Robot Data Generation", "a": "He Zhu; Lusen Zhao; Kwan Man Cheng; Katerina Fragkiadaki", "k": ["Robotic data generation", "Sim-to-real transfer", "VLM-Guided Skill Search"], "kind": "P", "pdf": "https://arxiv.org/pdf/2609.36171v1", "ps": 3, "b": 90, "talk": "", "tier": "", "why": "", "top": []}, {"id": "cHCwUratwL", "t": "SkillX: Unified Multi-Skill Policy Learning for Humanoid Soccer", "a": "Zhangchen Ye; Enxuan Ruan; Yifei Bao; Runhan Huang; Jiankun Yang; Jiakang Jin; Yixiao Huo; Pengyuan Wang; Yinan Han; Huaxing Huang; Wenhao Cui; Yiming Li; Xiaoyu Tian", "k": ["Reinforcement learning for physical robot control", "Robot navigation and locomotion", "Multi-Task Learning"], "kind": "P", "pdf": "https://arxiv.org/pdf/2609.06718v2", "ps": 2, "b": 178, "talk": "", "tier": "", "why": "", "top": []}, {"id": "hgRIVs5QZU", "t": "SKIP: Sparse Keyframe Interpolation Paradigm for Efficient Embodied World Models", "a": "Ziheng He; Yixiang Chen; Ning Yang; Zhanqian Wu; Qisen Ma; Yuan Xu; Jiabing Yang; Peiyan Li; Xiangnan Wu; Xiaofeng Wang; Zheng Zhu; Jing Liu; Nianfeng Liu; Yan Huang", "k": ["Video models and latent world models for robot learning", "Robotic data generation", "Sparse-to-dense video generation", "Event-preserving keyframe selection"], "kind": "P", "pdf": "https://arxiv.org/pdf/2606.00664v1", "ps": 3, "b": 35, "talk": "", "tier": "", "why": "", "top": []}, {"id": "anfRreNqMN", "t": "SlipSense: Multimodal Tactile Learning for Low-Latency and Generalized Slip Detection", "a": "Tong Jian; Aditya Thurvas Senthil Kumar; Xinyi Li; Ziling Chen; Tianyu Dai; Ali Sengul; Matteo Grimaldi; Wenjie Lu; Saleh Nabi; Tao Yu", "k": ["Multimodal perception, sensor fusion, and robot vision", "Robot systems, hardware, and sensors for learning", "Slip Detection", "Multimodal Tactile Sensing"], "kind": "P", "pdf": "https://arxiv.org/pdf/2609.15910v1", "ps": 3, "b": 137, "talk": "", "tier": "S", "why": "Low-latency slip detection", "top": ["Perception & vision", "Dexterous/contact-rich", "Efficient/real-time"], "sum": "Tactile slip detectors often neglect detection delay and don't transfer well across robots. SlipSense combines pressure maps from a 32x32 sensor array with high-rate accelerometer vibration, using attention and causal prediction. It reaches 96.7% macro F1 with under 1.6% false positives, detects 76% of slips within 23.1 ms, and transfers zero-shot to a Tesollo dexterous hand."}, {"id": "hf8X30fAtz", "t": "Social Humanoid: Socially Responsive Human–Humanoid Interaction", "a": "Vongani Hlavutelo Maluleke; James Ni; Kie Horiuchi; Lea Wilken; Jiahui Lei; Evonne Ng; Roei Herzig; Jitendra Malik; Trevor Darrell; Angjoo Kanazawa", "k": ["Human-robot interaction and natural language instruction"], "kind": "P", "pdf": "", "ps": 2, "b": 195, "talk": "", "tier": "", "why": "", "top": []}, {"id": "JWkaXdmqKb", "t": "SOLO: Stable Omni-terrain Long-Horizon Perceptive Humanoid Locomotion", "a": "Pihai Sun; Gang Han; Jingkai SUN; Jiahao Ma; Zeran Su; Zelin Tao; Peiran Liu; Shuai Shi; Wei Cui; Zifan Wang; Jialin Yu; Wen Zhao; Kangning Yin; Jiaxu Wang; Jiahang Cao; Lingfeng Zhang; Hao Cheng; Jian Tang; Qiang Zhang; Yijie Guo", "k": ["Robot navigation and locomotion", "Perceptive Humanoid Locomotion"], "kind": "P", "pdf": "https://arxiv.org/pdf/2608.26583v2", "ps": 3, "b": 168, "talk": "", "tier": "", "why": "", "top": []}, {"id": "nYkpEYmvbg", "t": "SPAN-Nav: Generalized Spatial Awareness for Embodied Navigation", "a": "Jiahang Liu; Tianyu Xu; Jiawei Chen; Lu Yue; Jiazhao Zhang; Zhiyong Wang; Minghan Li; Qisheng Zhao; Anqi Li; Qi Su; Zhizheng Zhang; He Wang", "k": ["Robot navigation and locomotion", "Robot foundation models and general-purpose knowledge systems"], "kind": "P", "pdf": "", "ps": 1, "b": 145, "talk": "", "tier": "", "why": "", "top": []}, {"id": "GX5xey9ade", "t": "SPARC: Reliable Spatial Annotations from Robot Demonstrations at Scale", "a": "Nils Blank; Paul Mattes; Maximilian Xiling Li; Jakub Suliga; Thomas Roth; Moritz Reuss; Pankhuri Vanjani; Rudolf Lioutikov", "k": ["Robot foundation models and general-purpose knowledge systems", "Benchmarks and datasets for robot learning"], "kind": "P", "pdf": "https://arxiv.org/pdf/2606.13497v2", "ps": 3, "b": 89, "talk": "", "tier": "", "why": "", "top": []}, {"id": "jeNVGuJQrb", "t": "SPARK: Simple Post-training for Adapting pRetrained Knowledge to Robot Control", "a": "Taekyung Kim; Jeongeun Park; Byeongho Heo; Sungjoon Choi; Sangdoo Yun; Dongyoon Han", "k": ["Learning representations for robotic perception and control"], "kind": "P", "pdf": "", "ps": 1, "b": 1, "talk": "", "tier": "", "why": "", "top": []}, {"id": "LfugZN8AN2", "t": "Sparse Autoencoders Reveal Interpretable and Steerable Features in VLA Models", "a": "Aiden Swann; Lachlain McGranahan; Hugo Buurmeijer; Monroe David Kennedy; Mac Schwager", "k": ["Robot foundation models and general-purpose knowledge systems", "Mechanistic Interpretability"], "kind": "P", "pdf": "https://arxiv.org/pdf/2603.19183v2", "ps": 2, "b": 38, "talk": "", "tier": "S", "why": "Sparse autoencoders: interpretable/steerable VLA features — inspection tools", "top": ["VLA testing", "Efficient/real-time"], "sum": "It is unclear when or why vision-language-action models generalize. The authors train sparse autoencoders on hidden activations to find interpretable features, label them as general primitives or episode-specific memorization, and steer behavior in LIBERO simulation and on real DROID hardware. No numbers are given; amplifying general features produces matching behavior and ablating them hurts performance."}, {"id": "ey3y7lxWY1", "t": "Spatially Conditioned Diffusion Policy: Learning Precise and Robust Manipulation with a Single RGB Camera", "a": "Seoyoon Kim; Kanghyun Kim; Dongwoo Ko; Young Jin Heo; Min Jun Kim", "k": ["Imitation learning (behavioral cloning, inverse RL)", "Learning representations for robotic perception and control"], "kind": "P", "pdf": "https://arxiv.org/pdf/2606.14535v2", "ps": 2, "b": 70, "talk": "", "tier": "S", "why": "Precise manipulation from a single RGB camera — precision + perception", "top": ["Perception & vision", "Precision", "Training frontier", "RL"], "sum": "Single-camera robot policies struggle to capture fine interaction detail and find relevant image regions. Spatially Conditioned Diffusion Policy uses end-effector trajectories as attention anchors, sampling image features along them inside the diffusion process. It beats strong single-view baselines in simulation, matches multi-camera baselines, and handles precise tasks and distractors on real robots. No specific numbers are stated."}, {"id": "pWDT36r945", "t": "SPOT: Spatial Perception-Oriented Long-Horizon Humanoid Teleoperation", "a": "Lixing Fang; Ziyan Xiong; Sunli Chen; Zhiyang Dou; Chuang Gan", "k": ["Robotic data generation"], "kind": "P", "pdf": "https://arxiv.org/pdf/2609.07933v1", "ps": 2, "b": 210, "talk": "", "tier": "", "why": "", "top": []}, {"id": "4IT3fcnny2", "t": "SSR: Scaling Surefooted and Symmetric Humanoid Traversal Toward the Open World", "a": "Ruiqi Yu; Yiwen Wang; Yuan Hao; Jun WU; Qiuguo Zhu", "k": ["Reinforcement learning for physical robot control", "Robot navigation and locomotion", "Open-World Humanoid Traversal"], "kind": "P", "pdf": "https://arxiv.org/pdf/2605.30770v1", "ps": 3, "b": 163, "talk": "", "tier": "", "why": "", "top": []}, {"id": "rAyG2MJka5", "t": "STARS: From Spatiotemporal Dynamics to Social Representations in Human-Robot Interaction", "a": "Nathan Tsoi; Michael Joseph Munje; Tejas Oberoi; Rishab Maheshwari; Pengen Zheng; Tanush Chauhan; Peter Stone; Joydeep Biswas", "k": ["Human-robot interaction and natural language instruction", "Learning representations for robotic perception and control", "Social Robotics", "Graph Neural Networks"], "kind": "P", "pdf": "https://arxiv.org/pdf/2609.40245v3", "ps": 1, "b": 74, "talk": "", "tier": "", "why": "", "top": []}, {"id": "9ih6YlxhI5", "t": "Start Right, Arrive Right: Asynchronous Execution via Initial Noise Selection", "a": "Trong-Bao Ho; Quang Tan Nguyen; Thien-Loc Ha; Nguyen Gia Binh; Viet-Thanh Nguyen; Long Dinh; Minh Nhat VU; Duy Minh Ho Nguyen; An Thai Le; Vien Anh Ngo", "k": ["Learning representations for robotic perception and control", "Robot foundation models and general-purpose knowledge systems, asynchronous inference speedup for VLA"], "kind": "P", "pdf": "https://arxiv.org/pdf/2606.19774v2", "ps": 2, "b": 9, "talk": "", "tier": "S", "why": "Async execution via noise selection", "top": ["Perception & vision", "VLA testing", "Efficient/real-time"], "sum": "Flow-based action-chunk policies are too slow for real-time control, and asynchronous execution causes mismatches at chunk boundaries. PAINT is training-free: it finds a suitable starting noise through backward Euler inversion and builds the next chunk with a repainting rule. Across 12 simulated and 6 real tasks it performs roughly on par with RTC with better prefix consistency; no scores are given."}, {"id": "MQlY5j6pnd", "t": "Static In, Dynamic Out: Counterfactual Action Augmentation for Moving Object Manipulation", "a": "Woo Chul Shin; Zhenyang Chen; Alfred Cueva; Nadun Ranawaka Arachchige; Yingyan Celine Lin; Benjamin Joffe; Shreyas Kousik; Danfei Xu", "k": ["Imitation learning (behavioral cloning, inverse RL)", "Robot manipulation"], "kind": "P", "pdf": "https://arxiv.org/pdf/2607.27890v2", "ps": 1, "b": 139, "talk": "", "tier": "", "why": "", "top": []}, {"id": "3KzmpJQUpy", "t": "Steering Autoregressive Vision-Language-Action Policies via Action Token Intervention", "a": "Jason Chan; Jonathan C. Kao", "k": ["Human-robot interaction and natural language instruction", "Learning representations for robotic perception and control"], "kind": "P", "pdf": "https://arxiv.org/pdf/2606.15021v1", "ps": 2, "b": 25, "talk": "", "tier": "", "why": "", "top": []}, {"id": "9uM5JbXz4T", "t": "StressDream: Steering Video World Models for Robust Policy Evaluation and Improvement", "a": "Junwon Seo; Sushant Veer; Ran Tian; Wenhao Ding; Apoorva Sharma; Karen Leung; Edward Schmerling; Marco Pavone; Andrea Bajcsy", "k": ["Video models and latent world models for robot learning", "Policy evaluation, adversarial scenarios generation, and red teaming", "Inference-time Steering"], "kind": "P", "pdf": "https://arxiv.org/pdf/2606.00267v2", "ps": 3, "b": 36, "talk": "", "tier": "M", "why": "Video world models used to stress-test policies — eval", "top": ["Policy eval & safety bounds", "World models"], "sum": "Policy evaluation with video world models usually samples typical futures, so rare but serious failures are missed. StressDream optimizes the initial noise of a diffusion world model, guided by a vision-language model and a plausibility term, to generate risky but realistic outcomes such as task failures. It is shown for driving and manipulation; the abstract states no numerical result."}, {"id": "FVPhDDjumI", "t": "STRIPS-WM: Learning Grounded Propositional STRIPS-style World Models from Images", "a": "Abhiroop Ajith; Constantinos Chamzas", "k": ["Combination of learning and planning in robotics", "Visual Task Planning"], "kind": "P", "pdf": "https://arxiv.org/pdf/2606.06832v2", "ps": 3, "b": 31, "talk": "", "tier": "", "why": "", "top": []}, {"id": "vVIVf2E7KG", "t": "Structured Perception Representations for Off-road Dynamics Learning", "a": "Micah Nye; Samuel Triest; Matthew Sivaprakasam; Isaiah Adu; Sebastian Scherer; Wenshan Wang", "k": ["Learning representations for robotic perception and control", "Robot navigation and locomotion", "Dynamics modeling", "Off-road navigation"], "kind": "P", "pdf": "https://arxiv.org/pdf/2610.22900v1", "ps": 3, "b": 223, "talk": "", "tier": "", "why": "", "top": []}, {"id": "psNqjklVOK", "t": "SuperMimic: Scaling Humanoid Whole-Body Control with One Differentiable World Model", "a": "Qiayuan Liao; Yiyang Shao; Junfeng Long; Kevin Zakka; Roberto Horowitz; Pieter Abbeel; Koushil Sreenath", "k": ["Reinforcement learning for physical robot control", "Model-based and model-free learning for robotic control", "Humanoid"], "kind": "O", "pdf": "https://arxiv.org/pdf/2610.28480v1", "ps": 2, "b": 217, "talk": "O7", "tier": "", "why": "", "top": [], "sum": "Scaling humanoid whole-body control to large motion datasets is costly with model-free reinforcement learning. SuperMimic learns one differentiable world model of shared dynamics from simulator logs, then trains the tracking policy jointly through short imagined rollouts. In 3 hours on one GPU it beats a baseline trained 7 days on 128 GPUs, using over 1000x fewer GPU-hours and failing on 25 of 129,514 motions versus 179."}, {"id": "pENAQ22Jh1", "t": "SuperSuit: An Isomorphic Bimodal Interface for Scalable Mobile Manipulation", "a": "Tongqing Chen; Hang Wu; Jiasen Wang; Xiaotao Li", "k": ["Robot systems, hardware, and sensors for learning", "Robot manipulation"], "kind": "P", "pdf": "https://arxiv.org/pdf/2603.06280v2", "ps": 1, "b": 124, "talk": "", "tier": "", "why": "", "top": []}, {"id": "dFblf2sS7M", "t": "Supervise What Survives: Geometry-Guided VLA Adaptation from Synthetic Robot Videos", "a": "Danze Chen; Yanzhe Chen; Huang Qiming; Zhijun Cao; Chen Gao; Mike Zheng Shou", "k": ["Robot manipulation", "Learning representations for robotic perception and control", "Vision-Language-Action Models", "Synthetic Robot Videos"], "kind": "P", "pdf": "https://arxiv.org/pdf/2606.24448v1", "ps": 3, "b": 78, "talk": "", "tier": "", "why": "", "top": []}, {"id": "QoUwcaTc3d", "t": "SurgVIL: Scaling Surgical Robot Imitation Learning with Open-source Surgical Videos", "a": "Xinhao Chen; Juo-Tung Chen; Nigel Nelson; Antony Goldenberg; Jesse Haworth; Sean D. Huver; Axel Krieger", "k": ["Imitation learning (behavioral cloning, inverse RL)", "Robotic data generation", "Surgical Robotics"], "kind": "P", "pdf": "https://arxiv.org/pdf/2608.16058v2", "ps": 3, "b": 76, "talk": "", "tier": "M", "why": "Surgical imitation learning from open-source surgical videos", "top": ["Surgical/medical", "Training frontier", "RL"], "sum": "Surgical robot learning needs video paired with robot motion, but kinematic data is rarely available. SurgVIL trains on kinematically labeled phantom demonstrations plus open-source surgical videos, whose robot motion is estimated as weak supervision. Tested with ACT, pi0 and GR00T-H backbones on two da Vinci tasks, the added videos improve generalization to real tissue and out-of-distribution settings. The abstract gives no specific figures."}, {"id": "Wp9ex57Z2k", "t": "SwingBot: Learning Whole-Body Brachiation for Humanoid Robots", "a": "Yujie Xiong; Peng Zhai; Taixian Hou; Quancheng Qian; Cunwang Liu; Kangmai Hu; Long Yang; Zhiyan Dong; Lihua Zhang", "k": ["Reinforcement learning for physical robot control"], "kind": "P", "pdf": "https://arxiv.org/pdf/2609.10283v3", "ps": 2, "b": 211, "talk": "", "tier": "", "why": "", "top": []}, {"id": "6pHgTk73zs", "t": "SynthICL: Scalable In-context Imitation Learning with Synthetic Data", "a": "Cheng Qian; Ruomeng Fan; Yifei Ren; Yilong Wang; Edward Johns", "k": ["Robot manipulation", "Imitation learning (behavioral cloning, inverse RL)", "In-context imitation learning", "Sim-to-real Transfer"], "kind": "P", "pdf": "https://arxiv.org/pdf/2606.08154v1", "ps": 3, "b": 79, "talk": "", "tier": "", "why": "", "top": []}, {"id": "IbO5qWFXuh", "t": "T(R,O) Grasp++: Cross-Embodiment Dexterous Grasping in Cluttered Environments at Scale", "a": "Xin Fei; Zhixuan Xu; Huaicong Fang; Fangjun Chen; Mu Zhaoyu; Yang Rui; Zhexi Luo; Lin Shao", "k": ["Robot manipulation", "Robotic data generation", "Dexterous Grasping", "Generative Models"], "kind": "P", "pdf": "https://arxiv.org/pdf/2610.25410v1", "ps": 2, "b": 118, "talk": "", "tier": "", "why": "", "top": []}, {"id": "KdaClHHEUt", "t": "T-Rex: Tactile-Reactive Dexterous Manipulation", "a": "Dantong Niu; Zhuoyang Liu; Zekai Wang; Boning Shao; Zhao-Heng Yin; Anirudh Pai; Yuvan Sharma; Stefano Saravalle; Ruijie Zheng; Jing Wang; Ryan Punamiya; Mengda Xu; Yuqi Xie; Yunfan Jiang; Letian Fu; Konstantinos Kallidromitis; Matteo Gioia; Junyi Zhang; Jiaxin Ge; Haiwen Feng; Fabio Galasso; Wei Zhan; David M. Chan; Yutong Bai; Roei Herzig; Jiahui Lei; Li Fei-Fei; Ken Goldberg; Jitendra Malik; Pieter Abbeel; Yuke Zhu; Danfei Xu; Linxi Fan; Trevor Darrell", "k": ["Multimodal perception, sensor fusion, and robot vision", "Learning representations for robotic perception and control", "Tactile", "Dexterous Manipulation"], "kind": "P", "pdf": "https://arxiv.org/pdf/2606.17055v2", "ps": 3, "b": 135, "talk": "", "tier": "", "why": "", "top": []}, {"id": "H7b56xK590", "t": "TacCoRL: Integrating Tactile Feedback into VLA via Simulation", "a": "Siyu Ma; Yuqi Liang; Chang Yu; Yunuo Chen; Hao Su; Yixin Zhu; Yin Yang; Chenfanfu Jiang", "k": ["Sim-to-real transfer", "Robot manipulation", "Tactile Feedback", "Vision-Language-Action Models"], "kind": "P", "pdf": "https://arxiv.org/pdf/2606.11743v1", "ps": 2, "b": 149, "talk": "", "tier": "", "why": "", "top": []}, {"id": "TH0fdttVB0", "t": "TacStyle: Personalizing Tactile Robot Policies using Structured Behavior Representations", "a": "Kevin Robledo; Matías I. Torres Galaz; Kumar Dixhant Rai; Shelly Sara Ulman; Tasmia Tasrin; Heramb Nemlekar", "k": ["Human-robot interaction and natural language instruction", "Imitation learning (behavioral cloning, inverse RL)", "Personalization", "Latent representation"], "kind": "P", "pdf": "https://arxiv.org/pdf/2606.14862v1", "ps": 2, "b": 139, "talk": "", "tier": "", "why": "", "top": []}, {"id": "h26AmTGnfu", "t": "Tactile Curiosity Drives Robot Interaction", "a": "Klemens Iten; Alexander Proshkin; Bhavya Sukhija; Stelian Coros; Andreas Krause; Pieter Abbeel; Carmelo Sferrazza", "k": ["Probabilistic learning and uncertainty in robotics", "Tactile sensing", "Exploration"], "kind": "P", "pdf": "https://arxiv.org/pdf/2609.40134v3", "ps": 3, "b": 148, "talk": "", "tier": "", "why": "", "top": []}, {"id": "aGLO1l8SNB", "t": "TactileStep: Sole Tactile Learning for Regulating Foot--Terrain Interaction in Humanoid Locomotion", "a": "Zizhuo Wang; Ming-Ju Lee; Shaoting Zhu; Haozhe Lou; Hang Zhao; Yiming Li", "k": ["Robot navigation and locomotion"], "kind": "S", "pdf": "https://arxiv.org/pdf/2609.28959v1", "ps": 3, "b": 197, "talk": "S7", "tier": "", "why": "", "top": [], "sum": "Humanoid parkour policies can succeed while still landing hard, touching edges, or standing unsteadily, and most humanoids lack touch sensing. TactileStep feeds foot-sole pressure into locomotion control, using simulated tactile data matched to a real insole and contact-phase rewards. On a Unitree G1 and in simulation it cut peak touchdown force up to 48.8%, impact noise up to 30.1 dB, and raised stance contact area up to 23.8%."}, {"id": "xn8Hwa4hpq", "t": "TACTX: Learning Shared Tactile Representations Across Diverse Sensors", "a": "Junsung Park; Sachin Bhadang; Carmelo Sferrazza; Sha Yi; Xiaolong Wang", "k": ["Learning representations for robotic perception and control", "Robot manipulation", "Tactile Representation Learning", "Cross-Sensor Transfer"], "kind": "P", "pdf": "https://arxiv.org/pdf/2606.31236v1", "ps": 2, "b": 140, "talk": "", "tier": "", "why": "", "top": []}, {"id": "Ti3oK55n1H", "t": "TAM: Torque Adaptation Module for Robust Motion Transfer in Manipulation", "a": "Dongwon Son; Florian Shkurti; Jason Lee; Naman Shah; Beomjoon Kim; Dieter Fox", "k": ["Sim-to-real transfer", "Robot manipulation"], "kind": "S", "pdf": "https://arxiv.org/pdf/2606.06218v3", "ps": 2, "b": 169, "talk": "S4", "tier": "S", "why": "Torque adaptation module for motion transfer — motion control", "top": ["Motion control & safety"], "sum": "Policies often transfer poorly between robots because of sim-to-real gaps, unknown payloads or hardware differences. The Torque Adaptation Module sits between the low-level controller and the torque interface, using proprioceptive history to output residual torque corrections, and is trained in randomized simulation only. On a real Franka Panda it beats online system identification and RMA baselines; no figures are given."}, {"id": "AilV1LyfXF", "t": "TAPESTRY: A Single Backbone for Video Generation and Robot Control", "a": "Jeremy A. Collins; Seungjae Lee; Rachanon Wachakorn; Krishnan Srinivasan; Animesh Garg; Vitor Campagnolo Guizilini; Paarth Shah", "k": ["Video models and latent world models for robot learning", "Robot manipulation", "Video Generation", "Representation Learning"], "kind": "P", "pdf": "", "ps": 3, "b": 6, "talk": "", "tier": "", "why": "", "top": []}, {"id": "WvR13cRtRf", "t": "TARC: Time-Adaptive Robotic Control", "a": "Arnav Sukhija; Lenart Treven; Jin Cheng; Florian Dorfler; Stelian Coros; Andreas Krause", "k": ["Reinforcement learning for physical robot control"], "kind": "S", "pdf": "https://arxiv.org/pdf/2510.23176v2", "ps": 1, "b": 62, "talk": "S2", "tier": "S", "why": "Time-adaptive robotic control — control timing", "top": ["Dexterous/contact-rich", "RL"], "sum": "Robot controllers usually run at a fixed high rate, wasting computation when fine feedback is not needed. TARC is a reinforcement learning framework where the policy outputs both an action and how long to hold it, under limits on control switches. On an RC car, a Unitree Go1 quadruped and a simulated VLA, it matches high-frequency controllers at under half the control rate."}, {"id": "6T2ebANGy5", "t": "Targeting World Models to Compromise Robot Learning Pipelines", "a": "Ethan Rathbun; Ahmed Agha; Saaduddin Mahmud; Christopher Amato; Alina Oprea; Eugene Bagdasarian", "k": ["Video models and latent world models for robot learning", "Policy evaluation, adversarial scenarios generation, and red teaming", "Data Security"], "kind": "S", "pdf": "https://arxiv.org/pdf/2606.09499v2", "ps": 1, "b": 54, "talk": "S2", "tier": "S", "why": "Attacks on world-model pipelines", "top": ["Policy eval & safety bounds", "World models"], "sum": "World models that synthesize training data or simulate environments open a hidden route for data poisoning. The attacks embed malicious prompts or harmful dynamics in teleoperated datasets that look benign, activating only when a world model turns them into dangerous synthetic trajectories. They worked against action-conditioned and text-conditioned world models, including an end-to-end backdoor in a downstream deep RL policy. No numeric result is given."}, {"id": "ODfnFGIIe3", "t": "Task-Aware Environment Augmentation for Reliable Navigation via Shielded Conditional Diffusion", "a": "Bharawee Phoompho; Gokul Puthumanaillam; Yan Miao; Ruben Hernandez; Tim Bretl; Sayan Mitra; Melkior Ornik", "k": ["Autonomous driving and flight", "Combination of learning and planning in robotics", "Environment Augmentation", "Trajectory Planning"], "kind": "P", "pdf": "https://arxiv.org/pdf/2606.15154v1", "ps": 1, "b": 154, "talk": "", "tier": "", "why": "", "top": []}, {"id": "aZ2Ojk8zxd", "t": "Task-Space Imitation Guidance for Efficient Reinforcement Learning", "a": "Salar Asayesh; Hossein Darani; Todd Cao; Evgeny Andriyash; Mani Ranjbar", "k": ["Reinforcement learning for physical robot control", "Robot manipulation", "Imitation Guidance"], "kind": "P", "pdf": "https://arxiv.org/pdf/2610.07527v2", "ps": 1, "b": 89, "talk": "", "tier": "", "why": "", "top": []}, {"id": "VY6U0drX88", "t": "TBD-VLA: Temporal Block Diffusion Vision Language Action Model", "a": "Sung-Wook Lee; Xuhui Kang; Yen-Ling Kuo", "k": ["Imitation learning (behavioral cloning, inverse RL)", "Robot manipulation", "Vision Language Action model", "Block Diffusion"], "kind": "P", "pdf": "https://arxiv.org/pdf/2606.07895v1", "ps": 1, "b": 11, "talk": "", "tier": "", "why": "", "top": []}, {"id": "loMfT7cfYl", "t": "TDC: Sim-to-Real Transferable Directional Compliance for Contact-Rich Manipulation", "a": "Yifei Yang; Anzhe Chen; Zhenjie Zhu; Kechun Xu; Yunxuan Mao; YufeiWei; Lu Chen; Rong Xiong; Yue Wang", "k": ["Sim-to-real transfer", "Imitation learning (behavioral cloning, inverse RL)", "Contact-rich manipulation"], "kind": "P", "pdf": "https://arxiv.org/pdf/2602.14174v2", "ps": 3, "b": 143, "talk": "", "tier": "", "why": "", "top": []}, {"id": "G2Ja89f1e8", "t": "Teaching Robots Like Dogs: Learning Navigation in Cluttered Scenes from Luring, Gesture, and Speech", "a": "Taerim Yoon; Dongho Kang; Jin Cheng; Fatemeh Zargarbashi; Yijiang Huang; Min Sung Ahn; Stelian Coros; Sungjoon Choi", "k": ["Human-robot interaction and natural language instruction", "Robot navigation and locomotion", "Learning from Demonstration"], "kind": "P", "pdf": "", "ps": 1, "b": 165, "talk": "", "tier": "", "why": "", "top": []}, {"id": "RS2INStAhX", "t": "Telescopes are Optomechanical Robots: Training Compositional Visuomotor Policies for Coordinated Control", "a": "Justin Fletcher", "k": ["Reinforcement learning for physical robot control", "Multimodal perception, sensor fusion, and robot vision", "Robotics for scientific instruments", "Optomechanical control"], "kind": "P", "pdf": "", "ps": 1, "b": 107, "talk": "", "tier": "S", "why": "Telescopes as optomechanical robots: coordinated precision control", "top": ["Perception & vision", "Dexterous/contact-rich", "RL"]}, {"id": "FVZKpmPHV8", "t": "TEMPO: Learning Temporal Context for Dynamic Robot Manipulation", "a": "Zhenyang Feng; Jimin Heo; Erik B. Sudderth; Unnat Jain", "k": ["Learning representations for robotic perception and control", "Robot foundation models and general-purpose knowledge systems", "Dynamic manipulation"], "kind": "O", "pdf": "https://arxiv.org/pdf/2609.16864v1", "ps": 1, "b": 48, "talk": "O2", "tier": "S", "why": "Oral: temporal context for dynamic manipulation", "top": ["Perception & vision", "VLA testing", "Efficient/real-time"], "sum": "VLA models handle slow quasi-static manipulation well but struggle with dynamic tasks because a single observation hides object motion. TEMPO adds a motion summary from a frozen video foundation model and a compact proprioceptive history to a pretrained model without changing its backbone. On the Bottle Handover task, success rises from 44 percent to 74 percent."}, {"id": "USCrYWxsUc", "t": "TEXEDO : Test Time Scaling for Controller-aware Language-conditioned Humanoid Motion Generation", "a": "Jianuo Cao; Yuxin Chen; Yuzhen Song; Masayoshi Tomizuka; Chenran Li; Thomas Tian", "k": ["Human-robot interaction and natural language instruction"], "kind": "P", "pdf": "https://arxiv.org/pdf/2606.22998v2", "ps": 3, "b": 175, "talk": "", "tier": "", "why": "", "top": []}, {"id": "EL8hXhrhFK", "t": "TextOp: Real-time Interactive Text-Driven Humanoid Robot Motion Generation and Control", "a": "Weiji Xie; Jiakun Zheng; Jinrui Han; Jiyuan Shi; Weinan Zhang; Chenjia Bai; Xuelong Li", "k": ["Reinforcement learning for physical robot control", "Human-robot interaction and natural language instruction", "Humanoid Whole-body Control", "Interactive Motion Generation"], "kind": "P", "pdf": "https://arxiv.org/pdf/2602.07439v1", "ps": 3, "b": 173, "talk": "", "tier": "", "why": "", "top": []}, {"id": "qH1h7UkK0k", "t": "The Imitator Game: Benchmarking Robot Imitative Ability Beyond Action Prediction", "a": "Xunzhe Zhou; Yiyang Cai; Fengyi Wang; Ran Ju; Hanxiang Ren; Ruizhe Liu; Yu Zhang; Qian Luo; Feng Chen; Pei Zhou; Yi Ma; Yanchao Yang", "k": ["Benchmarks and datasets for robot learning", "Robot manipulation", "Learning from Human Video", "Imitative Capability Benchmark"], "kind": "P", "pdf": "https://arxiv.org/pdf/2608.22301v1", "ps": 2, "b": 88, "talk": "", "tier": "", "why": "", "top": []}, {"id": "VxUazHdUwe", "t": "The Speedup Paradox: Rethinking Inference Optimization in Embodied Tasks", "a": "Yujin Wang; Junli Chen; Yixuan Li; Shunan Dong; Huazhong Yang; Yongpan Liu; Hongyang Jia", "k": ["Robot systems, hardware, and sensors for learning", "Robot foundation models and general-purpose knowledge systems", "Lightweight Embodied Models", "Hardware-Software Co-design"], "kind": "P", "pdf": "", "ps": 2, "b": 18, "talk": "", "tier": "S", "why": "Speedup paradox: inference optimization in embodied tasks — real-time", "top": ["VLA testing", "Planning & optimization", "Efficient/real-time"]}, {"id": "U620dzd51N", "t": "Think Proprioceptively: State-Grounded Visual Token Selection for VLA Policies", "a": "Fangyuan Wang; Peng ZHOU; JiamingQi; Shipeng Lyu; Chengyang He; David Navarro-Alarcon; Guodong Guo", "k": ["Robot foundation models and general-purpose knowledge systems", "Imitation learning (behavioral cloning, inverse RL)", "Vision-Language-Action model", "Robot manipulation"], "kind": "P", "pdf": "https://arxiv.org/pdf/2602.06575v2", "ps": 1, "b": 27, "talk": "", "tier": "", "why": "", "top": []}, {"id": "fGWkovHMQE", "t": "ThinkingVLA: Interleaved Vision and Language Reasoning for Robotic Manipulation", "a": "Tianyi Lu; Hui Zhang; Zijie Diao; Junke Wang; Shengqi Xu; Xingyao Lin; Guojin Zhong; Ziyi Ye; Peng Wang; Zuxuan Wu; Yu-Gang Jiang", "k": ["Robot manipulation", "Robot foundation models and general-purpose knowledge systems"], "kind": "P", "pdf": "https://arxiv.org/pdf/2606.17937v1", "ps": 1, "b": 13, "talk": "", "tier": "", "why": "", "top": []}, {"id": "PJuQx9kBg5", "t": "To Route or to Adapt? Multi-Expert Diffusion Planners in Unseen Regions", "a": "Yun Li; Ehsan Javanmardi; Simon Thompson; JIACHEN GONG; Qunli Zhang; Zifan Zeng; Shiming Liu; Peng Wang; Yidu Zhang; Manabu Tsukada", "k": ["Autonomous driving and flight", "Policy evaluation, adversarial scenarios generation, and red teaming", "Geographic out-of-distribution generalisation", "Deployment-time adaptation of diffusion trajectory planners"], "kind": "P", "pdf": "", "ps": 2, "b": 44, "talk": "", "tier": "", "why": "", "top": []}, {"id": "9w3PEC3XLg", "t": "TopoRetarget: Interaction-centric retarget for dexterous manipulation", "a": "jielin wu; Shenzhe Yao; Guanqi He; Xiaohan Liu; Zhaoqing Zeng; Xiangrui Jiang; Han Yang; Wentao Zhang; Hang Zhao", "k": ["Robot manipulation", "Reinforcement learning for physical robot control", "Motion Retargeting"], "kind": "P", "pdf": "", "ps": 3, "b": 45, "talk": "", "tier": "", "why": "", "top": []}, {"id": "1JcOSLXzHB", "t": "TopoUrbanBench: Group-Structural Compliance Evaluation for Urban Robot Navigation", "a": "Haun jo; Hakbin Kim; Mooyeol Baek; Hwiyeon Yoo; Jaeuk Shin; Chanmi You; Seunghyun Lee; Seong-heum Kim; Sunwook Choi", "k": ["Benchmarks and datasets for robot learning", "Robot navigation and locomotion"], "kind": "P", "pdf": "", "ps": 1, "b": 150, "talk": "", "tier": "", "why": "", "top": []}, {"id": "ZDnuAR0GMn", "t": "TOPReward: Token Probabilities as Hidden Zero-Shot Rewards for Robotics", "a": "Shirui Chen; Cole Harrison; Ying-Chun Lee; Angela Jin Yang; Jason Ren; Lillian J. Ratliff; Jiafei Duan; Dieter Fox; Ranjay Krishna", "k": ["Reinforcement learning for physical robot control", "Video models and latent world models for robot learning", "Reward models", "Progress estimation"], "kind": "P", "pdf": "https://arxiv.org/pdf/2602.19313v2", "ps": 1, "b": 94, "talk": "", "tier": "", "why": "", "top": []}, {"id": "ALlLaCTHKQ", "t": "Touch2Trace: Tactile-Driven Imitation Learning for Dexterous Cable Tracing", "a": "Matteo Grimaldi; David Klee; Ziling Chen; Tong Jian; Wonju Lee; Wenjie Lu; Tao Yu; Saleh Nabi", "k": ["Robot manipulation", "Robot systems, hardware, and sensors for learning", "Deformable object", "Tactile sensing"], "kind": "P", "pdf": "https://arxiv.org/pdf/2609.15921v1", "ps": 3, "b": 136, "talk": "", "tier": "S", "why": "Tactile cable tracing", "top": ["Dexterous/contact-rich", "Deformable"], "sum": "Touch2Trace tackles dexterous cable tracing, where a hand feeds a cable through its fingers with repeated pinch-and-curl motions. It uses a tactile encoder pretrained on a custom 32x32 sensor and a small transformer policy trained by behavior cloning, running at 60 Hz. Versus a proprioception-only baseline, success rose from 0% to 93%, and the policy transferred zero-shot to unseen cables."}, {"id": "OnGdMFJg2i", "t": "Towards Human-level Dexterous Teleoperation", "a": "Puhao Li; Zeyuan Chen; Yingying Wu; Pengkun Wei; Yuyang Li; Tianyu Wang; Jiaxiao Shi; Mingrui Yu; Baoxiong Jia; Song-Chun Zhu; Tengyu Liu; Siyuan Huang", "k": ["Robot manipulation", "Sim-to-real transfer", "Dexterous teleoperation"], "kind": "P", "pdf": "https://arxiv.org/pdf/2607.11481v1", "ps": 3, "b": 44, "talk": "", "tier": "S", "why": "Human-level dexterous teleop", "top": ["Dexterous/contact-rich"], "sum": "Current teleoperation struggles to control object motion through dynamic hand-object contact, so robot hands fall short of human in-hand dexterity. TeleDexter is a hand-object co-tracking controller trained with single-stage reinforcement learning on subgoals derived from human motion, and it transfers zero-shot to a real robot. It reaches a 75% average success rate across seven dexterous tasks on two hands, while all baselines consistently fail."}, {"id": "0HnCTHL4fw", "t": "Towards Human-like Physical Intelligence: Lifelong Vision-Language-Action Learning for Robotic Manipulation", "a": "Yao He; Gan Sun; Wenqi Liang; Fazeng Li; Yang Cong", "k": ["Robot manipulation", "Lifelong Learning", "Vision--Language--Action Models"], "kind": "P", "pdf": "https://arxiv.org/pdf/2607.14852v2", "ps": 1, "b": 34, "talk": "", "tier": "", "why": "", "top": []}, {"id": "FP3mCkMV24", "t": "Towards Professional Tennis Styles for Humanoid Robots with Adaptive Motion Planning and Tracking", "a": "Tao Huang; Ruofei Liu; Junli Ren; Huayi Wang; Feiyu Jia; Yukai Qi; Kangning Yin; Weishuai Zeng; Ting Wu; Ruoli Dai; Lipeng Chen; Kailin Li; guanwuli; Jingbo Wang; Lei Han; Jiangmiao Pang", "k": ["Reinforcement learning for physical robot control", "Sim-to-real transfer", "Humanoid Tennis"], "kind": "P", "pdf": "https://arxiv.org/pdf/2608.20087v1", "ps": 2, "b": 180, "talk": "", "tier": "", "why": "", "top": []}, {"id": "aPppmSJzb5", "t": "TRACE: Trajectory-Routed Causal Memory for Delayed-Evidence Visuomotor Imitation", "a": "Zihao Li; Ranpeng Qiu; Yincong Chen; Guoqiang Ren; Weiming Zhi", "k": ["Imitation learning (behavioral cloning, inverse RL)", "Model-based and model-free learning for robotic control"], "kind": "P", "pdf": "https://arxiv.org/pdf/2606.14551v3", "ps": 1, "b": 37, "talk": "", "tier": "S", "why": "Causal memory for delayed evidence", "top": ["Long-horizon", "RL"], "sum": "Autonomous robots sometimes must act on a cue they can no longer see, so identical-looking situations call for different actions. TRACE adds a fixed-size latent memory to visuomotor imitation policies, storing task-relevant visual and state evidence and using order-sensitive trajectory features as keys for writing and retrieval. It beats short-history and recurrent-memory baselines on real long-horizon tasks; no figures are given."}, {"id": "OOCwc3Dn5d", "t": "Training Controllable World Models via Action Influence Maximization", "a": "Samuel M Bateman; Tenny Yin; Chongyi Zheng; Lei Huang; Brian Wang; Jaime Fernández Fisac; Dhruv Shah", "k": ["Video models and latent world models for robot learning", "Reinforcement learning for physical robot control"], "kind": "P", "pdf": "https://arxiv.org/pdf/2610.27387v1", "ps": 3, "b": 37, "talk": "", "tier": "S", "why": "Controllable world models", "top": ["World models", "Dexterous/contact-rich", "RL"], "sum": "Video world models trained on successful expert demos often ignore the commanded action, since the data rarely shows how actions change outcomes. Action Influence Maximization actively collects data that increases how much actions affect predictions. In pixel-based manipulation, 500 actively gathered episodes added to 3,000 demos matched a model trained on 300,000 expert episodes, an 85x data reduction."}, {"id": "LwMNsyCnCk", "t": "Training Generalist Navigation Policies via Action Self-Distillation", "a": "Bowen Feng; Keqin Wang; Yulong Yang; Amogh Joshi; Christine Allen-Blanchette; Dhruv Shah; Felix Heide", "k": ["Robot navigation and locomotion", "Robot foundation models and general-purpose knowledge systems"], "kind": "P", "pdf": "https://arxiv.org/pdf/2610.17593v1", "ps": 1, "b": 164, "talk": "", "tier": "", "why": "", "top": []}, {"id": "9I9DPyr2f9", "t": "Training Robots to Reason in Natural Language via Reinforcement Learning", "a": "Lehong Wu; Yuxiao Qu; Zheyuan Hu; Ivan Zhang; Limin Wei; Zackory Erickson; Aviral Kumar", "k": ["Robot foundation models and general-purpose knowledge systems", "Reinforcement learning for physical robot control", "Reasoning", "Long-horizon robot manipulation"], "kind": "P", "pdf": "", "ps": 1, "b": 101, "talk": "", "tier": "", "why": "", "top": []}, {"id": "0mUj0bXuJh", "t": "Trajectory-Level Automatic Curriculum Learning for Legged Locomotion on Unstructured Terrain", "a": "Rocky Liu; Tengyu Liu; Baoxiong Jia; Fangwei Zhong; Xinyi Tong; Hongzhao Xie; Siyuan Huang", "k": ["Learning representations for robotic perception and control", "Reinforcement learning for physical robot control"], "kind": "P", "pdf": "https://arxiv.org/pdf/2608.16164v1", "ps": 3, "b": 185, "talk": "", "tier": "", "why": "", "top": []}, {"id": "e9ZYAwJqFR", "t": "Trajectory-Level Redirection Attacks on Vision-Language-Action Models", "a": "Gokul Puthumanaillam; Vardhan Dongre; Pranay Thangeda; Hooshang Nayyeri; Dilek Hakkani-Tür; Melkior Ornik", "k": ["Robot safety, alignment, and safe learning-based systems", "Robot foundation models and general-purpose knowledge systems", "Natural language instruction", "Adversarial attacks"], "kind": "P", "pdf": "https://arxiv.org/pdf/2606.12978v2", "ps": 2, "b": 98, "talk": "", "tier": "S", "why": "Trajectory-level redirection attacks on VLAs — adversarial testing", "top": ["Motion control & safety", "Policy eval & safety bounds", "VLA testing", "Efficient/real-time"], "sum": "Vision-language-action robot policies can be steered by a text prompt that looks like the intended task but pushes the final physical outcome toward an attacker's goal. The authors define a prompt-only threat model and an on-policy search that uses rollouts to find near-benign redirecting prompts. They test it in simulation and on hardware. The summary gives no specific numbers."}, {"id": "yPkDKkOD11", "t": "Transformer Transformer: A Unified Model for Motion-Conditioned Robot Co-design", "a": "Huy Ha; Karen Liu; Shuran Song", "k": ["Hardware design and optimization", "Robot manipulation", "Cross-embodiment Control"], "kind": "P", "pdf": "https://arxiv.org/pdf/2607.25798v1", "ps": 2, "b": 116, "talk": "", "tier": "", "why": "", "top": []}, {"id": "Tk20sRMzhv", "t": "Transformer-Based Trajectory Prescription for sEMG-Optimizing Robot-Mediated Rehabilitation", "a": "Gabriel Parra; Kimia Khoshnami; Daniel S. Brown; Laura A. Hallock", "k": ["Human-robot interaction and natural language instruction", "Model-based and model-free learning for robotic control"], "kind": "P", "pdf": "", "ps": 1, "b": 81, "talk": "", "tier": "S", "why": "Robot-mediated rehabilitation", "top": ["Planning & optimization"]}, {"id": "98pbD92mEI", "t": "TRIAD Planner : Three-Level Robust Imitation Learning for Autonomous Driving", "a": "Jiyun Kim; Ahmad Mouri Zadeh Khaki; Kyunghwan Choi", "k": ["Autonomous driving and flight", "Imitation learning (behavioral cloning, inverse RL)", "Robust Planning"], "kind": "S", "pdf": "", "ps": 3, "b": 226, "talk": "S8", "tier": "", "why": "", "top": []}, {"id": "0PThTAIwPD", "t": "Trust-Calibrated VLA Policy Post-Training with Evolving Imagination", "a": "Wenzhan Li; Yiran Qin; Heng Zhou; Huirui Wang; Yulan Guo; Ruimao Zhang", "k": ["Video models and latent world models for robot learning", "Model-based and model-free learning for robotic control"], "kind": "P", "pdf": "https://arxiv.org/pdf/2610.16517v1", "ps": 1, "b": 35, "talk": "", "tier": "S", "why": "Trust-calibrated VLA post-training", "top": ["Perception & vision", "VLA testing", "Training frontier", "World models"], "sum": "Imitation-pretrained VLA models often need reinforcement learning after deployment, but real-world interaction is costly and simulators can be inaccurate. MERL optimizes the policy alongside a continually updated world model and reward estimator, using trust scores to limit imagined data. It reaches 79.7% average success on perturbed LIBERO-PRO, learns some skills 10.9% faster than model-free, and gets 80.0% on two real tasks with 50 demonstrations each."}, {"id": "6DFI1qPxPg", "t": "TTT-Parkour: Rapid Test-Time Training for Perceptive Legged Humanoid Parkour", "a": "Shaoting Zhu; Baijun Ye; Jiaxuan Wang; Jiakang Chen; Ziwen Zhuang; Linzhan Mou; Runhan Huang; Hang Zhao", "k": ["Reinforcement learning for physical robot control", "Robot navigation and locomotion", "Test-time training", "Perceptive locomotion"], "kind": "P", "pdf": "", "ps": 3, "b": 160, "talk": "", "tier": "", "why": "", "top": []}, {"id": "gUSryIAaeN", "t": "TUTOR: Learning Recovery from Policy-Induced Deviations", "a": "Kai Ma; Hang Su; Chengyang Ying; Ruyi Gan; Hao Wang; Jun Zhu", "k": ["Reinforcement learning for physical robot control", "Robot manipulation", "Vision-language-action models", "Human-in-the-loop robot learning"], "kind": "P", "pdf": "", "ps": 3, "b": 73, "talk": "", "tier": "S", "why": "Recovery from policy-induced deviations", "top": ["VLA testing", "Dexterous/contact-rich", "RL"]}, {"id": "BKafd0mNwy", "t": "Uncertainty-Aware Neural Time Fields for Safe Online Motion Planning in Unknown Environments", "a": "Albus Dongchen Fang; Gokul Prabhakaran; Ahmed H Qureshi", "k": ["Combination of learning and planning in robotics", "Probabilistic learning and uncertainty in robotics"], "kind": "P", "pdf": "", "ps": 1, "b": 210, "talk": "", "tier": "", "why": "", "top": []}, {"id": "mlF6DhhBNF", "t": "Understanding and Mitigating the Video-Action Generalization Gap via Temporal Ratio", "a": "Utkarsh Aashu Mishra; Yongxin Chen; Danfei Xu; Yang Liu; Xi Chen; Jiayuan Mao", "k": ["Video models and latent world models for robot learning", "Imitation learning (behavioral cloning, inverse RL)", "Compositional Generalization"], "kind": "P", "pdf": "https://arxiv.org/pdf/2607.08127v1", "ps": 3, "b": 18, "talk": "", "tier": "", "why": "", "top": []}, {"id": "eIwbKQS5pz", "t": "Unified Condition-Action Modeling for Accurate One-Step Action Generation", "a": "Xinyu Zhou; Zikun Cai; Kuangji Zuo; Gen Li; Boyu Ma; Yanshuo Lu; Yutong Song; Mingqi Yuan; Jiayu Chen; Jianfei Yang", "k": ["Learning representations for robotic perception and control", "Imitation learning (behavioral cloning, inverse RL)"], "kind": "P", "pdf": "https://arxiv.org/pdf/2608.16153v4", "ps": 2, "b": 67, "talk": "", "tier": "S", "why": "Accurate one-step action generation", "top": ["Perception & vision", "Precision", "RL", "Efficient/real-time"], "sum": "Manipulation policies must be accurate and fast, but diffusion and flow policies often treat conditioning inputs as secondary. UCA-Flow puts observation, timestep and interval inputs together with action tokens in one transformer sequence, with a two-pass training signal, for one-step action generation. It gains 9.3 points in average success over the strongest baseline and runs 45.6x faster than DP3 and 2.3x faster than MP1."}, {"id": "EfgCnZgmvN", "t": "Unified Motion-Action Modeling for Heterogeneous Robot Learning", "a": "Yunhao Cao; Shitong Liu; Chao Feng; Meryl Zhang; Xuanchen Lu; Andrew Owens; Kuan Fang", "k": ["Robot manipulation", "Robot foundation models and general-purpose knowledge systems", "Imitation Learning", "World Modeling"], "kind": "P", "pdf": "https://arxiv.org/pdf/2606.16917v3", "ps": 1, "b": 15, "talk": "", "tier": "", "why": "", "top": []}, {"id": "R1fgJZLFnx", "t": "Unified Whole-Body Control for Quadrupedal Tactile-Informed Loco-Manipulation", "a": "Muqun Hu; Yuhao Zhou; Kabir Ray Malik; Chi Lin; Won Suk Lee; Yu She; Yan Gu", "k": ["Reinforcement learning for physical robot control", "Robot systems, hardware, and sensors for learning", "Tactile Quadrupedal Policy"], "kind": "P", "pdf": "https://arxiv.org/pdf/2607.10132v2", "ps": 2, "b": 201, "talk": "", "tier": "", "why": "", "top": []}, {"id": "o03EddNo6r", "t": "UniFlow: A Unified Multi-Modal Policy for Robot Manipulation", "a": "Ge Yan; Shun Iwase; Yuzhi Fan; Dieter Fox; Sergey Zakharov; Katherine Liu", "k": ["Imitation learning (behavioral cloning, inverse RL)", "Learning representations for robotic perception and control"], "kind": "P", "pdf": "", "ps": 2, "b": 71, "talk": "", "tier": "", "why": "", "top": []}, {"id": "ar3eWq6mh4", "t": "UniIntervene: Agentic Intervention for Efficient Real-World Reinforcement Learning", "a": "Haoyuan Deng; Yitong Gao; Lin Yudong; Haichao Liu; Zhenyu Wu; Ziwei Wang", "k": ["Robot manipulation", "Reinforcement learning for physical robot control"], "kind": "P", "pdf": "https://arxiv.org/pdf/2606.12372v1", "ps": 1, "b": 90, "talk": "", "tier": "", "why": "", "top": []}, {"id": "h4x4aofBgS", "t": "UniLab: A Heterogeneous Architecture for Robot RL Beyond GPU-Dominant Paradigms", "a": "Yufei Jia; Zhanxiang Cao; Mingrui Yu; Heng Zhang; Shenyu Chen; Dixuan Jiang; Meng Li; Xiaofan Li; Yiyang Liu; junzhe wu; Zheng Li; xilin fang; Ting-Yu Tsui; Shengcheng Fu; Haoyang Li; Anqi Wang; Zifan Wang; Dongjie Zhu; Chenyu Cao; Zhenbiao Huang; Ziang Zheng; Jie Lu; Xin Ma; 魏正阳; Xiang Zhao; Tianyue Zhan; He Ye; Yuxiang Chen; Yizhou Jiang; Yue Li; Haizhou Ge; Yuhang Dong; Fan Jia; Ziheng Zhang; Meng Zhang; Xiwa Deng; Zhixing Chen; Hanyang Shao; Chenxin Dong; Yixuan Li; Yizhi Chen; Bokui Chen; Kaifeng Zhang; Hanqing Cui; Yusen Qin; Ruqi Huang; Lei Han; Tiancai Wang; Xiang Li; Yue Gao; Guyue Zhou", "k": ["Reinforcement learning for physical robot control", "Sim-to-real transfer", "Infrastructure for robot reinforcement learning"], "kind": "P", "pdf": "https://arxiv.org/pdf/2605.30313v3", "ps": 3, "b": 70, "talk": "", "tier": "", "why": "", "top": []}, {"id": "S3FVTypVnZ", "t": "UniLatent: Cross-Embodiment Transfer via Latent Observation Alignment", "a": "Yufei Ding; Yi Du; Weiduo Yuan; Hao Jiang; Dylan Goetting; Lawrence Yunliang Chen; Daniel Seita; Yue Wang", "k": ["Learning representations for robotic perception and control", "Robot manipulation", "Cross-embodiment transfer", "Visual Representation Alignment"], "kind": "P", "pdf": "", "ps": 2, "b": 34, "talk": "", "tier": "", "why": "", "top": []}, {"id": "FLxpmRskLG", "t": "Universal Manipulation Exoskeleton: Learning Compliant Whole-body Policies with Real-time Torque Feedback", "a": "Litian Liang; Jingxi Xu; Xinda Qi; Yujun Cai; Houzhu Ding; Luqi Wang; Zhixin Sun; Jyh-Herng Chow; Ming Yang; Mark Cutkosky", "k": ["Robot systems, hardware, and sensors for learning"], "kind": "P", "pdf": "https://arxiv.org/pdf/2606.14218v1", "ps": 3, "b": 40, "talk": "", "tier": "", "why": "", "top": []}, {"id": "CtcahYuPBL", "t": "UniVTAC: A Unified Simulation Platform for Visuo-Tactile Manipulation Data Generation, Learning, and Benchmarking", "a": "Baijun Chen; Weijie Wan; Tianxing Chen; Congsheng Xu; Xianda Guo; Yuanyang Qi; Haojie Zhang; Fangyuan Shi; Longyan Wu; Tianling Xu; Yizhe Wu; Rui Li; Xiaokang Yang; Ping Luo; Wei Sui; Yao Mu", "k": ["Benchmarks and datasets for robot learning", "Multimodal perception, sensor fusion, and robot vision, visuo-tactile"], "kind": "P", "pdf": "https://arxiv.org/pdf/2602.10093v1", "ps": 2, "b": 138, "talk": "", "tier": "", "why": "", "top": []}, {"id": "oias4zZRUn", "t": "Unleashing Infinite Motion: Scaling Expressive Quadrupedal Motion via Generative Video Priors", "a": "Youzhi Liu; Li Gao; Yifei Qian; Liu Liu; Yang Cai; Tang Wenbin", "k": ["Benchmarks and datasets for robot learning", "Robotic data generation"], "kind": "P", "pdf": "https://arxiv.org/pdf/2606.28237v2", "ps": 3, "b": 154, "talk": "", "tier": "", "why": "", "top": []}, {"id": "8klpl3FXjN", "t": "Unsupervised Actuator Networks as a Residual World Model for Humanoid Control", "a": "Nolan Fey; Khai Nguyen; Yash Prabhu; Gabriel B. Margolis; Pulkit Agrawal", "k": ["Sim-to-real transfer", "Reinforcement learning for physical robot control"], "kind": "P", "pdf": "", "ps": 3, "b": 180, "talk": "", "tier": "", "why": "", "top": []}, {"id": "DMljKr2f4O", "t": "VertexCBF: Improving Neural Control Barrier Functions with Vertex-Restricted Control Search", "a": "Bojan Derajic; Sebastian Bernhard; Wolfgang Hönig", "k": ["Robot safety, alignment, and safe learning-based systems", "Neural Control Barrier Functions", "Learning-Based Safe Control"], "kind": "P", "pdf": "https://arxiv.org/pdf/2609.12831v2", "ps": 1, "b": 206, "talk": "", "tier": "S", "why": "Neural CBFs with vertex search", "top": ["Motion control & safety", "Planning & optimization"], "sum": "Existing control barrier function design methods can be ineffective, hard to scale, or overly conservative. VertexCBF trains a neural network on a stationary Hamilton-Jacobi value function, with supervision from a GPU-parallel tree search restricted to control polytope vertices and a residual form that keeps the barrier below the constraint function. Across 15 systems and a hardware pedestrian-avoidance test, it recovers large safe sets where baselines fail or are conservative."}, {"id": "Alu9eLT93i", "t": "VIGOR-MPC: Vision-Guided Objective Regulation MPC", "a": "Jelena Trisovic; Rahel Rickenbach; Marek Landert; Panagiotis Minos; Melanie N. Zeilinger", "k": ["Learning representations for robotic perception and control", "Imitation learning (behavioral cloning, inverse RL)", "Model Predictive Control", "Vision-Based Control"], "kind": "P", "pdf": "https://arxiv.org/pdf/2610.20333v1", "ps": 3, "b": 224, "talk": "", "tier": "S", "why": "Vision-guided MPC", "top": ["Motion control & safety", "Perception & vision", "RL"], "sum": "Vision-only robot control is hard because camera input is noisy and occluded, and shares compute with planning, limiting the horizon. VIGOR-MPC uses a long-horizon teacher with full state knowledge in simulation to train a lightweight short-horizon controller that infers cost parameters from vision. In autonomous racing it generalizes to unseen tracks, nears the teacher's lap times, and cuts per-step computation by over 90 percent."}, {"id": "ult1vxdeUb", "t": "Visible Touch: Rendering Contact for Visuomotor Policies", "a": "Metin Alp Dogan; Edward Sun; Feng Xu; Daniel Wu; Allen Peng; Dennis Hong; Yuchen Cui", "k": ["Learning representations for robotic perception and control", "Robot systems, hardware, and sensors for learning", "Vision-Language-Action Models", "Contact-Rich Manipulation"], "kind": "S", "pdf": "https://arxiv.org/pdf/2609.14156v2", "ps": 2, "b": 165, "talk": "S4", "tier": "", "why": "", "top": [], "sum": "Most manipulation policies, including pretrained vision-language-action models, use only vision and proprioception, and existing touch add-ons need special hardware or non-image architectures. Visible Touch renders contact signals in the same spatial frame as the camera view so image-based policies can use them unchanged, and includes an open-source, low-cost magnetic contact sensor. On LIBERO, a BC-Transformer's average success rose 15.7 percentage points in the two-view setting, with similar gains reported for fine-tuned VLAs."}, {"id": "dE7KjOl8yu", "t": "VisionSIM: Beyond Idealized Sensors — A Multi-Modal Simulator for Robot Perception", "a": "Sacha Jungerman; Kaustubh Sadekar; Avery Gump; Sriram Narayanan; Shantanu Gupta; Bhuyashi Deka; Srinivasa Narasimhan; Atul Ingle; Mohit Gupta", "k": ["Robotic data generation"], "kind": "S", "pdf": "", "ps": 3, "b": 97, "talk": "S8", "tier": "S", "why": "Multi-modal perception simulator", "top": ["Perception & vision"]}, {"id": "xaGVjPTxtr", "t": "VISTA: Vision-Grounded and Physics-Validated Adaptation of UMI data for VLA Training", "a": "Siyuan Yang; Linzheng Guo; ouyang lu; Zhaxizhuoma; Zhang Daoran; Xinmiao Wang; Ting Xiao; Fangzheng YAN; Zhijun Chen; Yan Ding; Chenjia Bai; Xuelong Li", "k": ["Robot foundation models and general-purpose knowledge systems"], "kind": "P", "pdf": "https://arxiv.org/pdf/2606.04708v2", "ps": 3, "b": 55, "talk": "", "tier": "", "why": "", "top": []}, {"id": "PCVxUMrP6N", "t": "ViTaForce: Pairwise Visuo--Tactile--Force Representation Learning for Contact-Rich Imitation Learning", "a": "YueYang Wang; Chaofan Xu", "k": ["Multimodal perception, sensor fusion, and robot vision", "Learning representations for robotic perception and control", "Contact-Rich Manipulation"], "kind": "P", "pdf": "", "ps": 2, "b": 157, "talk": "", "tier": "S", "why": "Visuo-tactile-force representations", "top": ["Perception & vision", "Dexterous/contact-rich"]}, {"id": "mg7X6SFE75", "t": "VLA-FAIL: Efficient Task Failure Detection for Finetuned Vision-Language-Action Models", "a": "Florian Seligmann; Emiliyan Gospodinov; Enes Ulas Dincer; Gerhard Neumann", "k": ["Robot safety, alignment, and safe learning-based systems", "Robot foundation models and general-purpose knowledge systems", "Failure Detection", "Vision-Language-Action Models"], "kind": "P", "pdf": "https://arxiv.org/pdf/2606.21386v2", "ps": 2, "b": 92, "talk": "", "tier": "S", "why": "Fast task-failure detection for fine-tuned VLAs — runtime monitoring", "top": ["Motion control & safety", "Policy eval & safety bounds", "VLA testing", "Efficient/real-time"], "sum": "Finetuned vision-language-action models can behave unpredictably in unfamiliar situations, and existing failure detectors are costly, architecture-specific, or need failure data. VLA-FAIL combines two lightweight detectors: a Mahalanobis-distance check for unusual internal features and a check for disagreement between overlapping action chunks. It claims early, reliable detection, often beating costlier baselines; no numbers are given."}, {"id": "qMAfkDMTOy", "t": "VLK: Learning Humanoid Loco-Manipulation from Synthetic Interactions in Reconstructed Scenes", "a": "Yen-Jen Wang; Jiaman Li; Sirui Chen; Takara E. Truong; Pei Xu; Pieter Abbeel; Rocky Duan; Koushil Sreenath; Angjoo Kanazawa; Carmelo Sferrazza; Guanya Shi; Karen Liu", "k": ["Robotic data generation", "Sim-to-real transfer", "Humanoid Loco-Manipulation", "Vision-Language-Kinematics"], "kind": "P", "pdf": "https://arxiv.org/pdf/2606.30645v1", "ps": 2, "b": 189, "talk": "", "tier": "", "why": "", "top": []}, {"id": "dhh4gmm3NK", "t": "VLM-Guided Contact Retargeting and Generative Partner Modeling for Humanoid-Human Interaction", "a": "Yuto Shibata; Kotaro Amaya; Kashu Yamazaki; Lalit Jayanti; Yoshimitsu Aoki; Mariko Isogawa; Katerina Fragkiadaki", "k": ["Human-robot interaction and natural language instruction", "Learning representations for robotic perception and control", "Humanoid"], "kind": "P", "pdf": "https://arxiv.org/pdf/2610.28523v1", "ps": 2, "b": 196, "talk": "", "tier": "", "why": "", "top": []}, {"id": "RmP7m64fQ6", "t": "VLS: Steering Pretrained Robot Policies via Vision–Language Models", "a": "Shuo Liu; Ishneet Sukhvinder Singh; Yiqing Xu; Jiafei Duan; Ranjay Krishna", "k": ["Robot manipulation", "Combination of learning and planning in robotics", "Foundation model in Robotics", "Inference time steering"], "kind": "P", "pdf": "https://arxiv.org/pdf/2602.03973v1", "ps": 2, "b": 24, "talk": "", "tier": "", "why": "", "top": []}, {"id": "sF3YZbbTNX", "t": "VoLo: A Physical Orchestrator for Open-Vocabulary Long-Horizon Manipulation", "a": "Siyi Chen; Hugo Hadfield; Alex Zook; Mikaela Angelina Uy; Chan Hee Song; Erwin Coumans; Xuning Yang; Faisal Ladhak; Qing Qu; Stan Birchfield; Jonathan Tremblay; Valts Blukis", "k": ["Robot manipulation", "Benchmarks and datasets for robot learning", "Long-horizon Open-vocabulary", "Agentic"], "kind": "P", "pdf": "https://arxiv.org/pdf/2606.07723v1", "ps": 1, "b": 131, "talk": "", "tier": "S", "why": "Long-horizon orchestrator", "top": ["Policy eval & safety bounds", "Long-horizon"], "sum": "The paper addresses open-ended, long, multi-step manipulation in cluttered scenes, where a robot must plan, monitor progress and recover from failures. VoLoAgent is a vision-language model that treats a vision-language-action model as an interruptible tool, steering it mid-execution alongside other vision models and action primitives. It reports clear gains over single-model and tool-based baselines with real-robot validation; no numbers given."}, {"id": "UMHg65UHcY", "t": "VoxAfford: Multi-Scale Voxel-Token Fusion for Open-Vocabulary 3D Affordance Detection", "a": "Haowen Sun; Shaolong Zhang; Mingyang Li; Chengzhong Ma; Xinzhe Chen; Qiongjie Cui; Xingyu Chen; Zeyang Liu; Xuguang Lan", "k": ["Multimodal perception, sensor fusion, and robot vision", "Affordance"], "kind": "P", "pdf": "https://arxiv.org/pdf/2605.01365v1", "ps": 1, "b": 130, "talk": "", "tier": "", "why": "", "top": []}, {"id": "gTazI5D0Fj", "t": "W2A: Distilling World Priors into Action Models for Real-Time Robotic Control", "a": "Xiaopeng Zhang; Mu Yongjin; Yueyang Weng; Chengzhi zhao; Yanjie Li", "k": ["Video models and latent world models for robot learning", "Robot manipulation", "World Action Model", "Distillation"], "kind": "P", "pdf": "", "ps": 2, "b": 4, "talk": "", "tier": "S", "why": "Real-time world priors", "top": ["Training frontier", "World models", "Efficient/real-time"]}, {"id": "u2oeVtdVX8", "t": "Walk Like This: Stylized Locomotion for Physics-Based Characters through Example-Driven Diffusion", "a": "Joshua Aurand; Agon Serifi; Sammy Christen; Ruben Grandia; Espen Knoop; Marco Hutter; Moritz Bächer", "k": ["Reinforcement learning for physical robot control", "Robot navigation and locomotion", "Motion generation"], "kind": "P", "pdf": "https://arxiv.org/pdf/2610.18147v1", "ps": 3, "b": 182, "talk": "", "tier": "", "why": "", "top": []}, {"id": "PjzSYChBzg", "t": "WAM-Nav: Asymmetric Latent World-Action Modeling for Unified Visual Navigation", "a": "Ning Yang; Yan Huang; Kaiwen Peng; Ziheng He; Kai Wang; Cui Miao; Kailin Lyu; guo li; Xiaofeng Wang; Zheng Zhu; Jing Liu; Nianfeng Liu", "k": ["Robot navigation and locomotion", "Video models and latent world models for robot learning", "Embodied Visual Navigation", "World Action Model"], "kind": "P", "pdf": "https://arxiv.org/pdf/2606.04907v2", "ps": 1, "b": 144, "talk": "", "tier": "", "why": "", "top": []}, {"id": "1u6oriJJcU", "t": "WAM-STEP: Self-Improving World-Action Models Through Efficient Post-Training", "a": "Hengtao Li; Yifan Chang; Xiaofeng Wang; Xinyu Zhou; Guosheng Zhao; MingMing Yu; Angyuan Ma; Haodong Yan; Chaojun Ni; Weihua Su; Xingang Wang; Pengxiang Ding; Haoang Li; Zheng Zhu", "k": ["Video models and latent world models for robot learning", "Robot foundation models and general-purpose knowledge systems"], "kind": "P", "pdf": "", "ps": 3, "b": 3, "talk": "", "tier": "", "why": "", "top": []}, {"id": "oX3ErTz3rv", "t": "WAM-TTT: Steering World-Action Models by Watching Human Play at Test Time", "a": "Yusen Feng; Bingchen Han; Jiangran Lyu; Kai Liu; Yixin Zheng; Yuxuan Wan; Weiheng Liu; Sun Han; Ruiqin Li; Yulong Zhang; Fangfu Liu; Xuesong Shi; Yizhou Wang; Libin Liu; Zhizheng Zhang; He Wang", "k": ["Robot manipulation"], "kind": "P", "pdf": "https://arxiv.org/pdf/2607.06988v2", "ps": 3, "b": 7, "talk": "", "tier": "", "why": "", "top": []}, {"id": "yaYM35u9Su", "t": "WARP-RM: A Warp-Augmented Relative Progress Reward Model for Data Curation", "a": "Justin Yu; Andrew Goldberg; Kavish Kondap; Karim El-Refai; Ethan Ransing; Qianzhong Chen; Mac Schwager; Fred Shentu; Philipp Wu; Ken Goldberg", "k": ["Imitation learning (behavioral cloning, inverse RL)", "Robot manipulation", "Data Curation", "Reward Modeling"], "kind": "P", "pdf": "https://arxiv.org/pdf/2606.28320v4", "ps": 3, "b": 68, "talk": "", "tier": "S", "why": "Progress reward for data curation", "top": ["Training frontier", "RL"], "sum": "Teleoperated demonstrations are uneven, with pauses and redos, and existing progress reward models need noisy time labels or costly subtask annotations. WARP is self-supervised: it replays successful demonstrations at varied speeds and in reverse to make progress targets, and trains a model to predict signed normalized displacement. WARP-BC uses it to filter and reweight action chunks, raising successful T-shirt folds per unit time by up to about 18 times over vanilla behavior cloning."}, {"id": "5zw401UEGd", "t": "WARP: Whole-Body Retargeting for Learning from Offline Human Demonstrations", "a": "Zhenyang Chen; Chuizheng Kong; Chuye Zhang; Yuanshao Yang; Lawrence Y. Zhu; Shreyas Kousik; Danfei Xu", "k": ["Robotic data generation", "Imitation learning (behavioral cloning, inverse RL)"], "kind": "P", "pdf": "https://arxiv.org/pdf/2606.29940v2", "ps": 3, "b": 39, "talk": "", "tier": "", "why": "", "top": []}, {"id": "XKZ7YJEfr4", "t": "WARPED: Wrist-Aligned Rendering for Robot Policy Learning from Egocentric Human Demonstrations", "a": "Harry Freeman; Chung Hee Kim; Jenny Wang; George Kantor", "k": ["Robot manipulation", "Robotic data generation", "Learning from Human Demonstration"], "kind": "P", "pdf": "https://arxiv.org/pdf/2604.10809v2", "ps": 3, "b": 52, "talk": "", "tier": "", "why": "", "top": []}, {"id": "ndhpQ86iXs", "t": "Watch, Recall, Act: Always-On Robots in Concurrent Embodied Streams", "a": "Ding Yi; Peiwen Sun; Chenchu Rong; Jianan Wang; Xili Dai; Xiangyu Yue; Xi Lin", "k": ["Multimodal perception, sensor fusion, and robot vision", "Robotic data generation", "Streaming Video Model"], "kind": "P", "pdf": "https://arxiv.org/pdf/2609.28429v2", "ps": 1, "b": 49, "talk": "", "tier": "", "why": "", "top": []}, {"id": "334wtBsPIG", "t": "Water-Filling Allocation and Phase Transitions in Action-Conditioned Multimodal Information Bottlenecks", "a": "YUHAO LIAO; Zijian Zeng; Huiming Yang; Dingding", "k": ["Multimodal perception, sensor fusion, and robot vision", "Robot manipulation"], "kind": "P", "pdf": "", "ps": 2, "b": 161, "talk": "", "tier": "", "why": "", "top": []}, {"id": "RdvH11pAfJ", "t": "What Are We Actually Benchmarking in Robot Manipulation?", "a": "Tianchong Jiang; Xiangshan Tan; Samuel Wheeler; Luzhe Sun; Tewodros W. Ayalew; Matthew Walter", "k": ["Benchmarks and datasets for robot learning", "Policy evaluation, adversarial scenarios generation, and red teaming, benchmark validity audit"], "kind": "O", "pdf": "https://arxiv.org/pdf/2606.04233v1", "ps": 1, "b": 116, "talk": "O3", "tier": "M", "why": "Oral: what manipulation benchmarks really measure — core for policy evaluation / policy evaluation", "top": ["Policy eval & safety bounds"], "sum": "Scores from one fixed benchmark setup are often read as evidence of general manipulation skill. The authors pair a diagnostic with each of four failure modes and audit LIBERO, CALVIN, SimplerEnv, RoboCasa, and RoboTwin 2.0. A 0.09B probe with no language encoder scores at or near state of the art on LIBERO, and LIBERO and CALVIN fail more diagnostics than the other two."}, {"id": "HBHR1GxaS0", "t": "What Do You Need for Compositional Generalization in Diffusion Planning?", "a": "Quentin Clark; Florian Shkurti", "k": ["Combination of learning and planning in robotics", "Imitation learning (behavioral cloning, inverse RL)"], "kind": "P", "pdf": "https://arxiv.org/pdf/2505.18083v3", "ps": 2, "b": 20, "talk": "", "tier": "", "why": "", "top": [], "sum": "Studies when diffusion planners trained by behavior cloning can stitch training sub-trajectories into new behaviors. Finds two required properties, positional equivariance and local receptiveness, and uses them to explain architecture, data and inference choices (replanning, augmentation, data scale). Proposes Eq-Net, which shows strong compositional generalization in navigation and manipulation."}, {"id": "f3Dic5dJnz", "t": "What is the Better Curriculum: Controller-Shaped Grasping Behavior for Contact Force-Sensitive Manipulation", "a": "Ziyan Feng; Zizhao Yuan; Yulong Fu; Yuxin He; Zhiyuan Zhang; Zhengjie Zhang; JINNI ZHOU; Renjing Xu; Qiang Nie", "k": ["Robot manipulation", "Multimodal perception, sensor fusion, and robot vision", "Controller-Shaped Grasping Behavior", "Force-Sensitive Manipulation"], "kind": "P", "pdf": "https://arxiv.org/pdf/2609.25887v1", "ps": 3, "b": 140, "talk": "", "tier": "S", "why": "Controller-shaped force-sensitive grasping", "top": ["Motion control & safety", "Perception & vision", "Dexterous/contact-rich"], "sum": "Fragile objects can be damaged by forces under one newton, and manual demonstrations rarely keep grip force in the narrow safe range. The authors use a deterministic 25 Hz tactile reflex controller as the teacher, then train tactile-free policies on its demonstrations. With ACT this gave 95% stable grasps on a plastic cup; under random disturbances the policy alone failed 45% of trials, while a deployed reflex arbiter kept all grasps."}, {"id": "lsfM8TzuH2", "t": "What Makes Video World Model Latents Action-Relevant: Prediction over Reconstruction", "a": "Jewon Yeom; Hanseul Kim; Jeongjae Park; Sungmok Jung; Jaejin Lee; Taesup Kim", "k": ["Video models and latent world models for robot learning", "Learning representations for robotic perception and control, action-relevant representations, inverse dynamics"], "kind": "P", "pdf": "https://arxiv.org/pdf/2606.07687v1", "ps": 3, "b": 11, "talk": "", "tier": "S", "why": "Action-relevant video latents", "top": ["Perception & vision", "World models"], "sum": "The authors ask which pretraining methods give video world model latents that are useful for predicting actions. They compare many encoder types with a shared inverse-dynamics probe and find temporal video pretraining matters more than pixel reconstruction accuracy. Video-pretrained self-supervised encoders gave the best balance of visual fidelity and action prediction; no specific numbers are stated."}, {"id": "8QEFjWSgyu", "t": "What Objects Enable, Not What They Are: Functional Latent Spaces for Affordance Reasoning", "a": "Rohan Siva; Neel P. Bhatt; Yunhao Yang; Seoyoung Lee; Nishant Gadde; Christian Ellis; Alvaro Velasquez; Zhangyang Wang; ufuk topcu", "k": ["Combination of learning and planning in robotics", "Learning representations for robotic perception and control", "Uncertainty Quantification", "Robot Planning"], "kind": "P", "pdf": "https://arxiv.org/pdf/2606.05533v1", "ps": 1, "b": 128, "talk": "", "tier": "", "why": "", "top": []}, {"id": "4dqRAd2sNp", "t": "When One Step Is Enough: An Empirical Study of Euler Integration in Flow-Matching Policies", "a": "Shivakanth Sujit; Luca Nunziante; Rousslan Fernand Julien Dossa; Kai Arulkumaran", "k": ["Robot foundation models and general-purpose knowledge systems", "Policy evaluation, adversarial scenarios generation, and red teaming", "Vision-Language Action models", "Flow Matching policies"], "kind": "P", "pdf": "", "ps": 1, "b": 111, "talk": "", "tier": "S", "why": "One-step Euler in flow policies", "top": ["Policy eval & safety bounds", "VLA testing", "Training frontier", "Efficient/real-time"]}, {"id": "jQAOksG9Bd", "t": "When Robots Sleep: Offline Skill Consolidation for Shared-Policy Robot Learning", "a": "Nethmi Jayasinghe; Diana Gontero; Amit Ranjan Trivedi", "k": ["Learning representations for robotic perception and control", "Model-based and model-free learning for robotic control"], "kind": "P", "pdf": "https://arxiv.org/pdf/2606.17493v1", "ps": 2, "b": 80, "talk": "", "tier": "", "why": "", "top": []}, {"id": "4pwzyVBjXY", "t": "When Should a Robot Replan? Regret-Guided Update Scheduling in Time-Varying MDPs", "a": "Negin Musavi; Gokul Puthumanaillam; Ruben Hernandez; William Schafer; Melkior Ornik", "k": ["Model-based and model-free learning for robotic control", "Combination of learning and planning in robotics", "Theoretical foundations of robot learning"], "kind": "P", "pdf": "https://arxiv.org/pdf/2606.16972v1", "ps": 1, "b": 226, "talk": "", "tier": "", "why": "", "top": []}, {"id": "HmdwOezjlQ", "t": "When Vision Overrides Language: Evaluating and Mitigating Counterfactual Failures in VLAs", "a": "Yu Fang; Yuchun Feng; Dong Jing; Jiaqi Liu; Yue Yang; Zhenyu Wei; Daniel Szafir; Mingyu Ding", "k": ["Benchmarks and datasets for robot learning", "Robot foundation models and general-purpose knowledge systems"], "kind": "S", "pdf": "https://arxiv.org/pdf/2602.17659v2", "ps": 1, "b": 114, "talk": "S1", "tier": "S", "why": "Counterfactual failures when vision overrides language — VLA testing", "top": ["Policy eval & safety bounds", "VLA testing", "Efficient/real-time"], "sum": "Vision-language-action models often ignore the instruction and follow visual shortcuts from training. The authors build LIBERO-CF, a benchmark of alternative instructions, and propose Counterfactual Action Guidance, a training-free dual-branch inference method comparing the policy against a vision-only module. On pi0.5 it raises language-following accuracy by 9.7 percent and under-observed task success by 3.6 percent."}, {"id": "AO1shrWa8H", "t": "Where Should Action Generation Begin? A Learnable Source Prior for Generative Robot Policies", "a": "Meipo Dai; Qiyuan Zhuang; He-Yang Xu; Ying-Jie Shuai; Yijun Wang; Qi Dou; Xiu-Shen Wei", "k": ["Robot manipulation", "Imitation learning (behavioral cloning, inverse RL)"], "kind": "P", "pdf": "https://arxiv.org/pdf/2606.17408v1", "ps": 2, "b": 74, "talk": "", "tier": "", "why": "", "top": []}, {"id": "x05Rf7L7H4", "t": "Where Small Mistakes Matter: Quantifying State Criticality for Imitation Learning", "a": "Yusuf Umut Ciftci; Joonwon Kang; Ajay Suresha Sathya; Somil Bansal", "k": ["Imitation learning (behavioral cloning, inverse RL)", "Data Quality"], "kind": "P", "pdf": "https://arxiv.org/pdf/2610.17709v1", "ps": 3, "b": 106, "talk": "", "tier": "S", "why": "Quantifying state criticality: where small mistakes matter — precision + safety", "top": ["RL"], "sum": "Imitation learning treats all demonstration states equally, though a few critical states can cause failure if the action is slightly wrong. The authors define criticality as the worst-case value drop from a bounded action perturbation and train an adversary and a critic (SCRIM) to score states. Scores reweight behavior cloning and pick compact demonstration subsets, improving simulated and real manipulation; no figures are given."}, {"id": "3jf63cW3cJ", "t": "Where Success Breaks: Failure-Boundary Learning for Robust Vision-Language-Action Models", "a": "Yanzhe Chen; Zhijun Cao; Mike Zheng Shou", "k": ["Robot manipulation", "Reinforcement learning for physical robot control"], "kind": "P", "pdf": "https://arxiv.org/pdf/2609.06114v2", "ps": 2, "b": 114, "talk": "", "tier": "M", "why": "Failure-boundary learning for VLAs — safety boundaries of policies", "top": ["Policy eval & safety bounds", "VLA testing", "Dexterous/contact-rich", "RL"], "sum": "Vision-language-action models fine-tuned on expert demonstrations learn what success looks like but not where it stops being reliable. The proposed DLS method starts from a few real demonstrations plus simulated co-training, finds failure boundaries with digital twin rollouts, and shapes the policy's flow dynamics using simulator progress signals. It beats supervised fine-tuning and online RL baselines on real robots; no numbers are stated."}, {"id": "u56Z5KqtkI", "t": "Why Does Action Chunking Improve Behavioral Cloning Performance in Robotic Control?", "a": "Filippo Lazzati; Kyle Stachowicz; William Chen; Alberto Maria Metelli; Andrew Wagenmaker; Sergey Levine", "k": ["Imitation learning (behavioral cloning, inverse RL)", "Theoretical foundations of robot learning", "Action Chunking"], "kind": "P", "pdf": "https://arxiv.org/pdf/2608.02547v1", "ps": 2, "b": 77, "talk": "", "tier": "S", "why": "Why action chunking helps BC — ACT theory", "top": ["RL"], "sum": "This paper asks why action chunking helps behavioral cloning. Simulated and real-robot experiments show common explanations fail; the gains come from more non-Markovian expressivity, less compounding error, and an implicit ensembling effect. Building on this, the authors propose an explicit ensemble policy class that they say clearly outperforms standard action chunking in many domains. The abstract gives no specific numbers."}, {"id": "N1gnyxWW2f", "t": "Wiggle and Go! System Identification for Zero-Shot Dynamic Rope Manipulation", "a": "Arthur Jakobsson; Abhinav Mahajan; Karthik Pullalarevu; Krishna Suresh; Yunchao Yao; Yuemin Mao; Bardienus Pieter Duisterhof; Shahram Najam Syed; Jeffrey Ichnowski", "k": ["Sim-to-real transfer", "Robot manipulation"], "kind": "P", "pdf": "https://arxiv.org/pdf/2604.22102v2", "ps": 2, "b": 53, "talk": "", "tier": "S", "why": "Rope system ID", "top": ["Deformable"], "sum": "Dynamic rope manipulation tolerates little error, and existing methods need large real datasets or repeated real-world tuning. Wiggle and Go estimates a rope's key properties from a brief safe wiggle, then uses them to guide trajectory optimization for new goals without retraining. In real tests it hit 3D targets with 3.55 cm average error versus 15.29 cm for baselines."}, {"id": "cQPnBRGgWM", "t": "WireCraft: A Simulation Benchmark for Industrial DLO Manipulation", "a": "Chongyu Zhu; Ramy ElMallah; Hyegang Kim; Zachary Tang; Jiachen Rao; Artem Arutyunov; Seungyeon Ha; Chi-Guhn Lee", "k": ["Benchmarks and datasets for robot learning", "Robot manipulation", "Deformable Linear Objects"], "kind": "S", "pdf": "https://arxiv.org/pdf/2606.18097v3", "ps": 2, "b": 50, "talk": "S5", "tier": "S", "why": "Industrial DLO benchmark", "top": ["Policy eval & safety bounds", "Deformable"], "sum": "Wire and cable tasks are hard to benchmark because the objects are deformable and existing benchmarks are hardware-specific or lack industrial fixtures. WireCraft is a configurable simulation benchmark with three industrial task families and two physics models, comparing RL, imitation and VLA policies, with UR5 real-robot data. Full-state policies exceed 82% success on a task per family; mixing sim data with real demos adds 15-65 points on the real robot."}, {"id": "AmQH2hU9Gs", "t": "WM-Craftnet: World Synesthesia Model for Robust and Generalizable Dexterous In-Hand Manipulation", "a": "Jie Yin; Zeyuan Zhao; Xiaojing Tan; Yang Liu; Chiyu Wang; Xinyang Gu", "k": ["Robot manipulation", "Sim-to-real transfer", "World model", "Visuotactile perception"], "kind": "S", "pdf": "", "ps": 2, "b": 131, "talk": "S3", "tier": "", "why": "", "top": []}, {"id": "aPosmVaV9y", "t": "Workspace Models: Lightweight Robotic Memory via Saliency-Driven Supervision", "a": "Nitish Dashora; Douglas Chen; Idan Shenfeld; John Marangola; Pulkit Agrawal; Max Simchowitz", "k": ["Learning representations for robotic perception and control", "Imitation learning (behavioral cloning, inverse RL)", "Long-horizon Memory for Manipulation"], "kind": "P", "pdf": "https://arxiv.org/pdf/2609.20820v3", "ps": 1, "b": 46, "talk": "", "tier": "", "why": "", "top": []}, {"id": "Bshs9HDDiu", "t": "World Action Models are Zero-shot Policies", "a": "Seonghyeon Ye; Yunhao Ge; Kaiyuan Zheng; Shenyuan Gao; Sihyun Yu; George Kurian; Suneel Indupuru; You Liang Tan; Chuning Zhu; Jiannan Xiang; Ayaan Naveed Malik; Kyungmin Lee; William Liang; Nadun Ranawaka Arachchige; Jiasheng Gu; Yinzhen Xu; Guanzhi Wang; Fengyuan Hu; Avnish Narayan; Johan Bjorck; Jing Wang; Gwanghyun Kim; Dantong Niu; Ruijie Zheng; Yuqi Xie; Jimmy Wu; Qi Wang; Ryan Julian; Danfei Xu; Yilun Du; Yevgen Chebotar; Scott Reed; Jan Kautz; Yuke Zhu; Linxi Fan; Joel Jang", "k": ["Video models and latent world models for robot learning", "Robot foundation models and general-purpose knowledge systems", "World Action Model"], "kind": "O", "pdf": "https://arxiv.org/pdf/2602.15922v1", "ps": 1, "b": 51, "talk": "O2", "tier": "S", "why": "Oral: world action models as zero-shot policies — world models frontier", "top": ["VLA testing", "World models", "Efficient/real-time"], "sum": "Current vision-language-action models grasp meaning well but struggle with unfamiliar physical motions in new settings. DreamZero builds on a pretrained video diffusion model and learns by predicting future video frames and actions together from mixed robot data. In real-robot tests, it more than doubled generalization to new tasks and environments compared with state-of-the-art alternatives."}, {"id": "WaIPZtSrpq", "t": "World In Your Hands: A Large-scale Dataset for Learning Ego-centric Robotic Manipulation In-the-Wild", "a": "Yupeng Zheng; Jichao Peng; Weize Li; Yuhang Zheng; Xiang Li; Yujie Jin; Songen Gu; Julong Wei; Guanhua Zhang; Ruiling Zheng; Ke Wu; Ming Cao; Zhenhong Zou; Kaige Li; Mingmin Yang; Pengfei Li; Feiyu Zhu; Hengjie Si; Wang Fu; Likun Wang; Ruiwen Yao; Jieru Zhao; yilun chen; Wenchao Ding", "k": ["Benchmarks and datasets for robot learning", "Robot manipulation", "Robotic Manipulation", "Ego-centric Dataset"], "kind": "P", "pdf": "", "ps": 3, "b": 88, "talk": "", "tier": "", "why": "", "top": []}, {"id": "OIhLrULoIq", "t": "World-Language-Action Model for Unified World Modeling, Language Reasoning, and Action Synthesis", "a": "Yi Yang; Zhihong Liu; Siqi Kou; Yiyang Chen; Yanzhe Hu; Jianbo Zhou; Boyuan Zhao; Zhijie Wei; XIA Xiao; Xueqi Li; Pengfei Liu; Zhijie Deng", "k": ["Video models and latent world models for robot learning", "Imitation learning (behavioral cloning, inverse RL)"], "kind": "P", "pdf": "https://arxiv.org/pdf/2606.05979v1", "ps": 1, "b": 56, "talk": "", "tier": "", "why": "", "top": []}, {"id": "w1x9MHo93E", "t": "Worlds in One Demo: A Synthetic Data Engine for Learning Open-World Mobile Manipulation", "a": "Lingxiao Guo; Huanyu Li; Guanya Shi", "k": ["Robotic data generation", "Robot manipulation", "Open-world Mobile Manipulation"], "kind": "P", "pdf": "https://arxiv.org/pdf/2607.13154v2", "ps": 1, "b": 198, "talk": "", "tier": "", "why": "", "top": []}, {"id": "QHIz2k4E88", "t": "WoVR: World Models as Reliable Simulators for Post-Training VLA Policies with RL", "a": "Zhennan Jiang; Shangqing Zhou; Yutong Jiang; Zefang Huang; Mingjie Wei; YUHUI CHEN; Tianxing Zhou; Zhen Guo; Hao Lin; Quanlu Zhang; Yu Wang; Dongbin Zhao; Haoran Li; Chao Yu", "k": ["Video models and latent world models for robot learning", "Model-based and model-free learning for robotic control"], "kind": "P", "pdf": "h
