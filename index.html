 regularization", "top": ["RL"], "sum": "Cheap passive leader arms lack restoring forces, so redundant joints drift and recorded demonstrations become inconsistent. The authors add a low-cost adjustable module with a clutch and a 3D-printed spiral spring that pulls each joint toward a neutral pose, acting like joint-space L2 regularization. On Block Stacking, downstream success rose to 73.3% from 36.7% without the module."}, {"id": "cCI6zZIcEw", "t": "HARP-Bench: Benchmarking Robot Manipulation Around Active Humans", "a": "Qinhong Zhou; Riley Zong; Chunru Lin; Diyi Hu; Shivraj Singh Bhatti; Hongxin Zhang; Lin Qiu; Hanqing Zeng; Chuang Gan", "k": ["Benchmarks and datasets for robot learning", "Human-robot interaction and natural language instruction"], "kind": "P", "pdf": "", "ps": 2, "b": 89, "talk": "", "tier": "", "why": "", "top": []}, {"id": "ghx1d6PQUR", "t": "HARP-VLA: Human-Robot Aligned Representation Learning for Vision-Language-Action Model", "a": "Xiang Zhu; Puzhen Yuan; Yichen Liu; Jianyu Chen", "k": ["Robot foundation models and general-purpose knowledge systems", "Learning representations for robotic perception and control"], "kind": "P", "pdf": "https://arxiv.org/pdf/2605.31234v2", "ps": 1, "b": 17, "talk": "", "tier": "", "why": "", "top": []}, {"id": "JhdmNwpT4o", "t": "HEFT: Heavy Load Full-size Humanoid Teleoperation with Privileged Motion Guidance and Windowed Payload Curriculum", "a": "Chenxin Liu; Qingzhou Lu; Guangxiao Yang; Xuanyang Shi; Chenghan Yang; Yanjiang Guo; Jianyu Chen", "k": ["Reinforcement learning for physical robot control", "Humanoids", "Whole-body Teleoperation"], "kind": "P", "pdf": "", "ps": 2, "b": 212, "talk": "", "tier": "", "why": "", "top": []}, {"id": "59kpavSqlw", "t": "HelpMeOut: A Neuropsychology-Grounded Benchmark for Error-Aware Monitoring of Household Task Execution", "a": "Haoran Wang; Jingwei Huang; Anqing Duan; Ho Seok Ahn; Bruce A. MacDonald", "k": ["Benchmarks and datasets for robot learning", "Human-robot interaction and natural language instruction", "Assistive Robotics", "Error-Aware Monitoring"], "kind": "P", "pdf": "https://arxiv.org/pdf/2610.17694v1", "ps": 2, "b": 90, "talk": "", "tier": "S", "why": "Error-aware monitoring benchmark", "top": ["Policy eval & safety bounds"], "sum": "Household robot benchmarks assume humans do tasks correctly, ignoring structured errors made by cognitively impaired people and older adults. HelpMeOut offers 20,000 paired activity episodes covering nine neuropsychology-based error types, where agents must detect errors in streaming activity early. Learned, symbolic, change-point, and frontier LLM baselines all performed poorly, often missing errors; no numeric result is given."}, {"id": "gbchkYm28k", "t": "HERO: Learning Humanoid End-Effector Control for Visual Whole-Body Open-Vocabulary Object Grasping", "a": "Runpei Dong; Ziyan Li; Arjun Gupta; Xialin He; Saurabh Gupta", "k": ["Robot systems, hardware, and sensors for learning", "Robot manipulation", "Humanoid Visual Manipulation", "End-Effector Control"], "kind": "P", "pdf": "https://arxiv.org/pdf/2602.16705v4", "ps": 2, "b": 203, "talk": "", "tier": "", "why": "", "top": []}, {"id": "0DopZPPLvw", "t": "Heterogeneous Tactile Transformer", "a": "Jianxin Bi; QIANG WANG; Jayaram Reddy; Lin Kelvin; Soibkhon Khajikhanov; Ruihan Gao; Harold Soh", "k": ["Learning representations for robotic perception and control", "Multimodal perception, sensor fusion, and robot vision", "Tactile Perception", "Contact-Rich Manipulation"], "kind": "P", "pdf": "https://arxiv.org/pdf/2606.29948v2", "ps": 2, "b": 141, "talk": "", "tier": "", "why": "", "top": []}, {"id": "Zts11nHGLq", "t": "Hierarchical Planning with Latent World Models", "a": "Wancong Zhang; Basile Terver; Artem Zholus; Soham Chitnis; Harsh Sutaria; Mido Assran; Randall Balestriero; Amir Bar; Yann LeCun; Nicolas Ballas", "k": ["Video models and latent world models for robot learning", "Combination of learning and planning in robotics"], "kind": "P", "pdf": "https://arxiv.org/pdf/2604.03208v3", "ps": 3, "b": 1, "talk": "", "tier": "S", "why": "Hierarchical planning with latent WMs", "top": ["World models", "Planning & optimization"], "sum": "World-model planners struggle on long multi-stage tasks because errors accumulate and search grows intractable. HWM learns world models at several time scales in a shared latent space, uses long-horizon predictions as subgoals, and compresses action sequences into latent macro-actions. On real Franka pick-and-place it succeeds 70 percent of the time from one goal image versus 0 percent for single-level planning, with up to 3x less planning compute."}, {"id": "ORKJlyLOHv", "t": "Hierarchical Residual Policy Learning for Real-World Mobile Manipulation with Sparse Human Guidance", "a": "Zhefei Gong; Hefeifei Jiang; Zehao Wang; Jiachen Li", "k": ["Reinforcement learning for physical robot control", "Robot manipulation", "Real-world reinforcement learning", "Human-robot interaction"], "kind": "P", "pdf": "https://arxiv.org/pdf/2610.20607v1", "ps": 1, "b": 123, "talk": "", "tier": "", "why": "", "top": []}, {"id": "AGM5ZQRjOT", "t": "HiFun: a Hierarchical Framework for Efficient Functional Dexterous Manipulation Learning", "a": "Linyi Huang; Guowei HUAI; Weibin Liu; Shulong Jiang; Ping Tan; Weixuan Zhang; Hui Zhang; Jie Song", "k": ["Reinforcement learning for physical robot control", "Dexterous Manipulation", "Multi-fingered Hand Manipulation"], "kind": "P", "pdf": "https://arxiv.org/pdf/2610.19518v1", "ps": 2, "b": 125, "talk": "", "tier": "", "why": "", "top": []}, {"id": "O7LrmASsJS", "t": "Hiking in the Wild: A Scalable Perceptive Legged Parkour Framework for Humanoid Robots", "a": "Shaoting Zhu; Ziwen Zhuang; Mengjie Zhao; Kun-Ying Lee; Hang Zhao", "k": ["Robot navigation and locomotion", "Reinforcement learning for physical robot control", "Humanoid locomotion", "Perceptive locomotion"], "kind": "P", "pdf": "https://arxiv.org/pdf/2601.07718v2", "ps": 3, "b": 161, "talk": "", "tier": "", "why": "", "top": []}, {"id": "lTLiSuIBAj", "t": "HiPHI: A Large-Scale Benchmark for High-Precision Human Motion and Object-Interaction", "a": "Jiahao Ji; Ji Ma; Runhan Zhang; Runyi Yu; Wenjia Wang; Weiheng Chi; Qianqian Peng; Weichao Yan; Yongfei GU; Ye Tian; Ting Wu; Longwei Li; Chun Yuan; Ruoli Dai; Lei Han", "k": ["Benchmarks and datasets for robot learning"], "kind": "P", "pdf": "https://arxiv.org/pdf/2608.16222v2", "ps": 2, "b": 108, "talk": "", "tier": "", "why": "", "top": []}, {"id": "0ua1KHFIUD", "t": "HiRE: Hindsight Reward Editing for Policy Finetuning", "a": "Haoyi Niu; Zhengtao Han; Yufeng Ji; Zhongyu Li; Koushil Sreenath", "k": ["Reinforcement learning for physical robot control", "Robot manipulation", "Reward Specification", "Policy Finetuning"], "kind": "P", "pdf": "https://arxiv.org/pdf/2609.27068v1", "ps": 1, "b": 97, "talk": "", "tier": "", "why": "", "top": []}, {"id": "l8hOz8loVg", "t": "HLO-AMP: Hierarchical Loco-Manipulation from Object-Aware Motion Priors", "a": "Jean Pierre Sleiman; Bilal Hammoud; He Li; Jonathan Foster; Sylvain Bertrand; Jessica K. Hodgins; Farbod Farshidian", "k": ["Reinforcement learning for physical robot control", "Sim-to-real transfer", "Whole-Body Loco-Manipulation", "Hierarchical Reinforcement Learning"], "kind": "P", "pdf": "", "ps": 2, "b": 213, "talk": "", "tier": "", "why": "", "top": []}, {"id": "iIanOcE27q", "t": "How Firm Should a Grasp Be?", "a": "Matthew Beveridge; Shree K. Nayar", "k": ["Robot manipulation", "Multimodal perception, sensor fusion, and robot vision", "Material Recognition", "Tactile Sensing and Force Control"], "kind": "P", "pdf": "https://arxiv.org/pdf/2610.11221v1", "ps": 3, "b": 131, "talk": "", "tier": "", "why": "", "top": []}, {"id": "pPrwDHXw93", "t": "How to Build an Efficient VLA: A Design Space Study for Modular Vision-Language-Action Models", "a": "Luoyang Sun; Guoyang Xia; Fengfa Li; Lei Ren; Xinyu Cui; Haifeng Zhang; Fangxiang Feng; Kaike Zhang; Kun Zhan; Xie Yan; Jun Wang; Cheng Deng", "k": ["Robot foundation models and general-purpose knowledge systems"], "kind": "P", "pdf": "", "ps": 2, "b": 13, "talk": "", "tier": "S", "why": "Efficient VLA design space", "top": ["VLA testing", "Efficient/real-time"]}, {"id": "lGOsJtsr5q", "t": "How to Learn from What a Human Would Avoid? Intervention-Aware World Models with Real-World RL for Dexterous Manipulation", "a": "Jiaju Yin; Zhenhui Zhang; Lixin Xu; Heng Zhang; Jun Shao; Yating Feng; Arash Ajoudani; Renjing Xu", "k": ["Robot manipulation", "Reinforcement learning for physical robot control", "Human-in-the-loop reinforcement learning", "World model"], "kind": "P", "pdf": "https://arxiv.org/pdf/2609.06009v1", "ps": 3, "b": 127, "talk": "", "tier": "", "why": "", "top": []}, {"id": "DzAZfcPUiP", "t": "How to Peel with a Knife: Aligning Fine-Grained Manipulation with Human Preference", "a": "Toru Lin; Shuying Deng; Zhao-Heng Yin; Pieter Abbeel; Jitendra Malik", "k": ["Robot manipulation", "Imitation learning (behavioral cloning, inverse RL)", "Learning from Human Preference"], "kind": "P", "pdf": "https://arxiv.org/pdf/2603.03280v1", "ps": 1, "b": 68, "talk": "", "tier": "S", "why": "Fine-grained peeling with a knife", "top": ["Precision", "RL"], "sum": "Tasks like knife peeling have subjective quality that a fixed reward cannot capture. The authors first train a base policy by force-aware imitation learning, then finetune it with preferences using a reward that mixes task metrics and human feedback. With roughly 50 to 200 demonstrations, average success on cucumbers, apples and potatoes exceeds 90%, and finetuning adds up to 40%."}, {"id": "587eUkwa7d", "t": "How Well Do Latent World Models Understand Partially Observable Safety Constraints?", "a": "Matthew Kim; Kensuke Nakamura; Andrea Bajcsy", "k": ["Video models and latent world models for robot learning", "Robot safety, alignment, and safe learning-based systems", "Multimodal perception, sensor fusion and robot vision"], "kind": "P", "pdf": "https://arxiv.org/pdf/2510.06492v3", "ps": 3, "b": 29, "talk": "", "tier": "S", "why": "Do latent WMs understand safety constraints?", "top": ["Motion control & safety", "Perception & vision", "World models"], "sum": "Latent world models can propose unsafe actions when their state omits safety-critical information, such as temperature while cooking. The authors define two diagnostics, a mutual-information measure of safety observability and a rollout-based measure of future predictability, and mitigations using privileged multimodal supervision and conformal risk calibration. On a Franka Research 3 cooking setup, safety improved under partial observability but the robot became more conservative. No numbers are given."}, {"id": "kpX1KOfNI5", "t": "HuG: Learning Humanoid Whole-Body Affordance-Aware Grasping with Active Perception", "a": "Xuanbin Peng; Lai Wei; Yuze Zhai; Qingyuan Yu; Keyi Wang; Jianglong Ye; Xiaolong Wang", "k": ["Robot manipulation", "Robotic data generation", "Humanoid Wholebody Grasping", "Active Perception"], "kind": "P", "pdf": "", "ps": 2, "b": 190, "talk": "", "tier": "", "why": "", "top": []}, {"id": "LOvZujpKxN", "t": "Human-like autonomy emerges from self-play and a pinch of human data", "a": "Daphne Cornelisse; Julian Hunt; Zixu Zhang; Waël Doulazmi; Kevin Joseph; Jaime Fernández Fisac; Eugene Vinitsky", "k": ["Autonomous driving and flight", "Model-based and model-free learning for robotic control", "Self-play Reinforcement Learning", "Multi-agent systems"], "kind": "P", "pdf": "https://arxiv.org/pdf/2606.19370v2", "ps": 3, "b": 60, "talk": "", "tier": "", "why": "", "top": []}, {"id": "h1yqzSoZ49", "t": "Human2Any: Human-to-Robot Transfer via Constraint-Aware Compositional Planning", "a": "Shuo Cheng; Chuye Zhang; Alfred Cueva; Caelan Reed Garrett; Ajay Mandlekar; Danfei Xu", "k": ["Robot manipulation", "Combination of learning and planning in robotics", "Learning from Human Videos", "Motion Generation"], "kind": ation learning (behavioral cloning, inverse RL)", "Learning representations for robotic perception and control, policy representation, implicit neural representations"], "kind": "P", "pdf": "https://arxiv.org/pdf/2606.12200v1", "ps": 2, "b": 76, "talk": "", "tier": "", "why": "", "top": []}, {"id": "AhpH1nGaUp", "t": "Improving Robotic Generalist Policies via Flow Reversal Steering", "a": "Andy Tang; William Chen; Andrew Wagenmaker; Chelsea Finn; Sergey Levine", "k": ["Robot foundation models and general-purpose knowledge systems", "Reinforcement learning for physical robot control", "Diffusion steering", "Generalist robotic policies"], "kind": "P", "pdf": "https://arxiv.org/pdf/2606.13675v2", "ps": 2, "b": 39, "talk": "", "tier": "", "why": "", "top": []}, {"id": "Nfz7oM0Vwz", "t": "InCoM: Intent-Driven Perception and Structured Coordination for Mobile Manipulation", "a": "Jiahao Liu; Cui Wenbo; Zhongpu Xia; Yongliang Wang; Haoran Li; Dongbin Zhao", "k": ["Imitation learning (behavioral cloning, inverse RL)", "Multimodal perception, sensor fusion, and robot vision", "Mobile Manipulation"], "kind": "P", "pdf": "https://arxiv.org/pdf/2602.23024v7", "ps": 1, "b": 122, "talk": "", "tier": "", "why": "", "top": []}, {"id": "bC8Sv8wTTL", "t": "Inference-time Policy Steering via Vision and Touch", "a": "Yilin Wu; Zilin Si; Zeynep Temel; Oliver Kroemer; Andrea Bajcsy", "k": ["Robot manipulation", "Multimodal perception, sensor fusion, and robot vision", "Inference-Time Policy Steering", "Visuo-Tactile Latent World Model"], "kind": "P", "pdf": "https://arxiv.org/pdf/2606.14981v1", "ps": 2, "b": 160, "talk": "", "tier": "", "why": "", "top": []}, {"id": "NCeeEHy8d5", "t": "Inference-Time Robot Behavior Steering through Physically-Aware Reconfiguration of Task-Structure", "a": "Yiyuan Pan; Hanjiang Hu; Shangtao Li; Xusheng Luo; Changliu Liu", "k": ["Combination of learning and planning in robotics", "Robot manipulation", "Inference-Time Behavior Steering", "Neuro-Symbolic Learning"], "kind": "P", "pdf": "https://arxiv.org/pdf/2606.26588v2", "ps": 2, "b": 26, "talk": "", "tier": "", "why": "", "top": []}, {"id": "93leGzRaPV", "t": "InfiniDanceRobot: A Streaming and Closed-Loop Music-driven Dance Generation for Humanoid Robot", "a": "Jinlu Zhang; Chenguang Li; Chunze Lin; Yu-Hui Wen; Liping Jing; He Wang; Li Yi; Yizhou Wang", "k": ["Task and motion planning", "Sim-to-real transfer"], "kind": "P", "pdf": "", "ps": 3, "b": 176, "talk": "", "tier": "", "why": "", "top": []}, {"id": "H5QWMBcNSU", "t": "Information-Theoretic Constraints for Continual Vision-Language-Action Alignment", "a": "Libang Zhao; Qixin Zeng; Hongyin Zhang; Donglin Wang", "k": ["Robot foundation models and general-purpose knowledge systems", "Learning representations for robotic perception and control, continual learning", "Vision language action"], "kind": "P", "pdf": "https://arxiv.org/pdf/2603.13335v1", "ps": 2, "b": 43, "talk": "", "tier": "", "why": "", "top": []}, {"id": "Kakzp9Lr9V", "t": "Instant-Fold: In-Context Imitation Learning for Deformable Object Manipulation", "a": "Yilong Wang; Cheng Qian; Edward Johns", "k": ["Imitation learning (behavioral cloning, inverse RL)", "Learning representations for robotic perception and control", "Deformable Object Manipulation"], "kind": "P", "pdf": "https://arxiv.org/pdf/2606.04269v2", "ps": 2, "b": 51, "talk": "", "tier": "S", "why": "In-context deformable IL", "top": ["Perception & vision", "RL", "Deformable"], "sum": "Deformable object manipulation is hard because object state is high-dimensional, partly visible, and tasks are long with several valid strategies. Instant-Fold learns deformation-aware features by temporal contrastive pretraining, then a flow-matching transformer conditioned on one human demonstration predicts actions without gradient updates. Trained only in simulation, it generalizes across folding strategies and runs on physical robots without retraining; no metrics are given."}, {"id": "6RJsxVCnhB", "t": "IntentNav: Learning Spatial-Visual Object Navigation from Human Demonstrations", "a": "Yuxin Cai; Zongtai Li; Maonan Wang; Muyi Bao; Haokun Zhu; RUOFEI BAI; Ding Zhao; Zirui Li; Wenshan Wang; Wei-Yun Yau; Ji Zhang; Chen Lv", "k": ["Robot navigation and locomotion", "Imitation learning (behavioral cloning, inverse RL)", "Object navigation", "Vision-language navigation"], "kind": "P", "pdf": "https://arxiv.org/pdf/2606.08029v1", "ps": 1, "b": 162, "talk": "", "tier": "", "why": "", "top": []}, {"id": "ddzWaOmWZE", "t": "Intercepting the Future: Latent-Space Predictive World Model for Dynamic VLA Manipulation", "a": "Shahram Najam Syed; Arthur Jakobsson; Haoran Hao; Jeffrey Ichnowski", "k": ["Robot manipulation", "Video models and latent world models for robot learning", "Vision Language Action Models", "Dynamic Manipulation"], "kind": "P", "pdf": "https://arxiv.org/pdf/2606.02486v2", "ps": 3, "b": 20, "talk": "", "tier": "", "why": "", "top": []}, {"id": "CKVUqG4YQf", "t": "Judge, Then Act: A Critic-Centric Vision Language Action Framework for Autonomous Driving", "a": "Lijin Yang; Zhongzhan Huang; Jianing Huang; Shu Liu; Hao Yang", "k": ["Autonomous driving and flight"], "kind": "P", "pdf": "", "ps": 3, "b": 210, "talk": "", "tier": "", "why": "", "top": []}, {"id": "tU2SHEG4to", "t": "Just Learn It: A Data-Harvesting Protocol for Empirical Learning of Effective Assistance Torques in Coupled Systems", "a": "Jonathan Tseng; Six Skov; Keenon Werling; Steven H. Collins; Scott Delp; Karen Liu", "k": ["Robotic data generation", "Robot systems, hardware, and sensors for learning", "Exoskeletons"], "kind": "P", "pdf": "", "ps": 3, "b": 153, "talk": "", "tier": "", "why": "", "top": []}, {"id": "aKjXDWnmzc", "t": "Kamino: GPU-based Simulation of Rigid Multi-Body Physics with Kinematic Loops", "a": "Vassilios Tsounis; Guirec Maloisel; Christian Schumacher; Ruben Grandia; Agon Serifi; David Müller; Chris Amevor; Tobias Widmer; Moritz Bächer", "k": ["Reinforcement learning for physical robot control", "Robotic data generation", "Robot Simulation", "Kinematic Loops"], "kind": "S", "pdf": "https://arxiv.org/pdf/2603.16536v2", "ps": 3, "b": 98, "talk": "S7", "tier": "S", "why": "GPU sim for kinematic loops", "top": ["Dexterous/contact-rich", "RL"], "sum": "Simulators often turn closed kinematic loops into trees with extra constraints, which limits fidelity for methods like reinforcement learning. Kamino is a GPU physics solver written in Python with NVIDIA Warp that handles loops natively, batches different robots together, and resolves contact without simplifying. The authors trained a walking policy for DR Legs, a biped with six nested loops, using 4,096 parallel environments on one GPU."}, {"id": "ik1SfLQgZA", "t": "KlaskTron-IL: A Contact-Rich Adversarial Imitation Learning Benchmark with a Validated Sim-to-Real Bridge", "a": "Nicklas Sohm; Aswin Ramachandran; Raffaello D'Andrea", "k": ["Benchmarks and datasets for robot learning", "Imitation learning (behavioral cloning, inverse RL)", "Adversarial multi-agent imitation learning", "Sim-to-real transfer"], "kind": "P", "pdf": "", "ps": 3, "b": 149, "talk": "", "tier": "", "why": "", "top": []}, {"id": "mday00WZFr", "t": "Koopman DCM: Unstable Eigenfunctions as Data-driven Representations for Legged Balancing", "a": "Stéphane Caron", "k": ["Learning representations for robotic perception and control"], "kind": "P", "pdf": "https://arxiv.org/pdf/2607.18760v2", "ps": 3, "b": 183, "talk": "", "tier": "", "why": "", "top": []}, {"id": "BXNVzGSYFe", "t": "KPGrasp: Scalable Keypoint Flow Matching for Dexterous Grasp Generation", "a": "Yuansen Huang; Jiayi Chen; Haoran Liu; Yubin Ke; Bing Han; Jiangran Lyu; Mi Yan; Li Yi; He Wang", "k": ["Robot manipulation", "Learning representations for robotic perception and control", "Dexterous Grasp Generation"], "kind": "S", "pdf": "https://arxiv.org/pdf/2606.09314v2", "ps": 2, "b": 134, "talk": "S3", "tier": "", "why": "", "top": [], "sum": "Learned dexterous grasp generators often need tuned contact losses or expensive test-time refinement. KPGrasp uses a flow-matching Transformer that predicts grasps as 3D hand keypoints in the object's point cloud frame, trained with only a standard flow-matching loss. On the Dexonomy benchmark it reaches a 76.3% success rate, 47.4% above the strongest comparable baseline, with penetration reduced to 2.4 mm."}, {"id": "PLNJ3a6Yht", "t": "LadderMan: Learning Humanoid Perceptive Ladder Climbing", "a": "Siheng Zhao; Yuanhang Zhang; Ziqi Lu; Pieter Abbeel; Rocky Duan; Koushil Sreenath; Yue Wang; Karen Liu; Guanya Shi", "k": ["Reinforcement learning for physical robot control", "Sim-to-real transfer", "Robot Ladder Climbing", "Humanoid Perceptive Loco-Manipulation"], "kind": "S", "pdf": "https://arxiv.org/pdf/2606.05873v1", "ps": 3, "b": 195, "talk": "S7", "tier": "", "why": "", "top": [], "sum": "Ladder climbing is hard for humanoids because rungs are sparse, whole-body coordination is demanding, and small perception or control errors cause falls. The authors train several climbing experts from one reference motion, then distill them into one depth-based visuomotor policy using imitation and reinforcement learning, with vision foundation models narrowing the simulation-to-real depth gap. A dual-agent policy adds teleoperated tasks on the ladder. Zero-shot real-robot transfer is reported, with no numbers."}, {"id": "YZ4p3WbWKX", "t": "Language as a Sensor: Calibrated Spatial Belief Estimation in 3D Scenes from Natural Language", "a": "Aryan Naveen; Jason Xinyu Liu; Luca Carlone; Andreea Bobu", "k": ["Multimodal perception, sensor fusion, and robot vision", "Probabilistic learning and uncertainty in robotics", "Bayesian Inference"], "kind": "P", "pdf": "https://arxiv.org/pdf/2606.08666v1", "ps": 1, "b": 195, "talk": "", "tier": "", "why": "", "top": []}, {"id": "wMrKZ9eYBg", "t": "LAPT-Scale: Scaling Embodied Policies with Latent Action Pre-Training on Human Videos", "a": "Zhiyuan Xiang; Peidong Liu; Mingyang Li; Jiawei Li; Wenhow Li; Wenbo Ding; Xiang Deng", "k": ["Robot foundation models and general-purpose knowledge systems", "Learning representations for robotic perception and control", "Latent action learning from human videos for robot policy pre-training", "Scaling robot policies with human-video supervision"], "kind": "P", "pdf": "https://arxiv.org/pdf/2610.13732v1", "ps": 2, "b": 60, "talk": "", "tier": "", "why": "", "top": []}, {"id": "PniGejQAdF", "t": "Large Video Planner Enables Generalizable Robot Control", "a": "Boyuan Chen; Tianyuan Zhang; Haoran Geng; Caiyi Zhang; Peihao Li; Kiwhan Song; William T. Freeman; Jitendra Malik; Pieter Abbeel; Russ Tedrake; Vincent Sitzmann; Yilun Du", "k": ["Video models and latent world models for robot learning"], "kind": "P", "pdf": "https://arxiv.org/pdf/2512.15840v2", "ps": 1, "b": 57, "talk": "", "tier": "", "why": "", "top": []}, {"id": "A9tBpzFsWI", "t": "LateMatch: Breaking the Interaction Bottleneck via Cacheable Matching for Efficient Visual Localization", "a": "Mohammad Omama; Aeyan Ashraf; Sandeep P. Chinchali", "k": ["Learning representations for robotic perception and control", "Multimodal perception, sensor fusion, and robot vision", "Feature-matching", "Localization"], "kind": "P", "pdf": "https://arxiv.org/pdf/2610.25358v1", "ps": 1, "b": 181, "talk": "", "tier": "", "why": "", "top": []}, {"id": "mw8BgE8ADo", "t": "LaWAM: Latent World Action Models for Efficient Dynamics-Aware Robot Policies", "a": "Jialei Chen; Kai Wang; Kang Chen; Shuaihang Chen; Feng Gao; Wenhao Tang; Zhiyuan Li; Weilin Liu; Zhuyu Yao; Boxun Li; Yuanbo Xu; Chao Yu", "k": ["Robot manipulation", "Video models and latent world models for robot learning", "World Action Models", "VLAs"], "kind": "P", "pdf": "https://arxiv.org/pdf/2606.15768v1", "ps": 2, "b": 1, "talk": "", "tier": "", "why": "", "top": []}, {"id": "Av4ykyMvpX", "t": "LCLA: Language-Conditioned Latent Alignment for Vision-Language Navigation", "a": "Nitesh Subedi; Adam Haroon; Samuel Tetteh; Prajwal Koirala; Cody Fleming; Soumik Sarkar", "k": ["Learning representations for robotic perception and control", "Sim-to-real transfer", "Vision Language Navigation", "Foundation Models"], "kind": "P", "pdf": "https://arxiv.org/pdf/2602.07629v2", "ps": 1, "b": 143, "talk": "", "tier": "", "why": "", "top": []}, {"id": "F5KmQJCC8X", "t": "LDP: Shaping Latent Spaces for Diffusion-Based Robotic Manipulation", "a": "Zhexuan Zhou; Yichen Lai; Jinhao Zhang; Huizhe Li; Youmin Gong; Jie Mei", "k": ["Robot manipulation", "Imitation learning (behavioral cloning, inverse RL)"], "kind": "P", "pdf": "", "ps": 2, "b": 69, "talk": "", "tier": "", "why": "", "top": []}, {"id": "menElmunwi", "t": "Learning Adaptive Solvers for Distributed Factor Graph Optimization on Matrix Lie Groups", "a": "Jaeho Shin; Maani Ghaffari; Yulun Tian", "k": ["Multimodal perception, sensor fusion, and robot vision", "Learning to optimize", "Matrix Lie groups"], "kind": "P", "pdf": "https://arxiv.org/pdf/2607.08735v1", "ps": 1, "b": 204, "talk": "", "tier": "S", "why": "Adaptive factor-graph solvers on Lie groups", "top": ["Perception & vision", "Planning & optimization"], "sum": "Distributed robot perception splits large geometric optimization across robots, but solvers need manual tuning and mostly handle rigid-body pose graphs. DeepCORD unrolls a parallel accelerated Riemannian optimizer and learns a self-supervised policy that tunes solver settings by stage and communication conditions, for general matrix Lie groups. On real SE(3) and SL(4) tests it reaches lower objective values than baselines in most benchmarks."}, {"id": "03qRtmw4qx", "t": "Learning Additively Compositional Latent Actions for Embodied AI", "a": "Hangxing Wei; Xiaoyu Chen; Chuheng Zhang; Tim Pearce; Jianyu Chen; Alex Lamb; Li Zhao; Jiang Bian", "k": ["Learning representations for robotic perception and control", "Latent Action Models"], "kind": "P", "pdf": "https://arxiv.org/pdf/2604.03340v1", "ps": 1, "b": 21, "talk": "", "tier": "", "why": "", "top": []}, {"id": "jnEHLRyWTZ", "t": "Learning Beyond What Humans Can Demonstrate", "a": "Yuchen Song; Aditya Mittal; Unnat Jain", "k": ["Imitation learning (behavioral cloning, inverse RL)", "Human-robot interaction and natural language instruction", "Dexterous Manipulation", "LLM for Robotics"], "kind": "P", "pdf": "https://arxiv.org/pdf/2609.24996v1", "ps": 1, "b": 117, "talk": "", "tier": "", "why": "", "top": []}, {"id": "4uXhlSOnz5", "t": "Learning Contact Representation for Leg Odometry", "a": "Emre Girgin; Cagri Kilic", "k": ["Learning representations for robotic perception and control", "Probabilistic learning and uncertainty in robotics", "Leg Odometry", "Contact Estimation"], "kind": "P", "pdf": "https://arxiv.org/pdf/2606.05501v2", "ps": 1, "b": 192, "talk": "", "tier": "", "why": "", "top": []}, {"id": "Gpc0nCixhZ", "t": "Learning Coordinated Visuomotor Box-Pushing from Solo Demonstrations", "a": "Ryusei Matsumoto; Mei Kinjo; Yoko Sasaki; Keisuke Okumura", "k": ["Imitation learning (behavioral cloning, inverse RL), multi-robot imitation learning, resource constrained deployment"], "kind": "P", "pdf": "https://arxiv.org/pdf/2610.05677v1", "ps": 1, "b": 83, "talk": "", "tier": "", "why": "", "top": []}, {"id": "Qgk0k192w6", "t": "Learning Decomposed Visibility for Efficient Active Exploration of Cluttered Scenes", "a": "Suyun Lee; Minsoo Choi; Jihwan Gong; Unghui Nam; Minji Bae; Byonghyo Shim", "k": ["Learning representations for robotic perception and control", "Combination of learning and planning in robotics", "Active exploration", "Cluttered scene reconstruction"], "kind": "P", "pdf": "", "ps": 3, "b": 69, "talk": "", "tier": "", "why": "", "top": []}, {"id": "DEPCm83K5I", "t": "Learning Dexterous Manipulation Using Contact Wrench Guidance From Human Demonstration", "a": "Xinghao Zhu; Zixi Liu; Shalin Jain; Chenran Li; Milad Noori; Michael Andres Lin; Huihua Zhao; John Welsh; Wei Liu; Tingwu Wang; Xingye Da; Zhengyi Luo; Vishal Kulkarni; Naema Bhatti; Yuke Zhu; Linxi Fan; Bowen Wen; Danfei Xu; Soha Pouya; Yan Chang", "k": ["Robot manipulation", "Model-based and model-free learning for robotic control", "Dexterous manipulation", "Learning from human demonstrations"], "kind": "P", "pdf": "https://arxiv.org/pdf/2607.00033v2", "ps": 3, "b": 47, "talk": "", "tier": "", "why": "", "top": []}, {"id": "wALhOwQWnx", "t": "Learning Functional Compliance in Whole-body Manipulation", "a": "Gio Huh; Yue Zhuo; Zehua Wang; Alan Yu; Yibo Cheng; Yanbing Han; Gabriel B. Margolis; Ge Yang", "k": ["Reinforcement learning for physical robot control"], "kind": "P", "pdf": "", "ps": 2, "b": 207, "talk": "", "tier": "", "why": "", "top": []}, {"id": "l0bwpzWRKy", "t": "Learning Human Intention for Robotic Manipulation", "a": "Chengyang Li; Kaiyi Xiong; Yuan Xu; Lei Qian; Yizhou Wang; Wentao Zhu", "k": ["Robot manipulation"], "kind": "S", "pdf": "", "ps": 2, "b": 170, "talk": "S3", "tier": "", "why": "", "top": []}, {"id": "5b4j0e21aJ", "t": "Learning Loco-Manipulation From SMPC Demonstrations With Sparse Offline-to-Online RL", "a": "Martin Schuck; Maks Sorokin; Simone Manni; Duy Ta; Angela P. Schoellig; Marco Hutter; Simon Le Cleac'h; Jan Brüdigam", "k": ["Model-based and model-free learning for robotic control", "Robot manipulation", "Sample-based MPC", "Whole-Body Manipulation"], "kind": "S", "pdf": "https://arxiv.org/pdf/2608.12063v1", "ps": 3, "b": 201, "talk": "S7", "tier": "", "why": "", "top": [], "sum": "Training reinforcement learning controllers for combined walking and manipulation usually needs slow, hand-tuned reward design. The authors generate large offline datasets with sampling-based model predictive control in simulation, then train an off-policy RL agent using only sparse task rewards. The learned policies can outperform the original controller and run on an arm-equipped Spot quadruped and a G1 humanoid; no numbers are given."}, {"id": "n0v95NpvyY", "t": "Learning Non-Myopic Quadrotor Pursuit in Cluttered Environments via Differentiable Physics", "a": "Yixuan Lou; Yubo Dong; Zhonghan Tang; Yilu Zhao; Pengfei han; Yuhang Tang; Bin Zhao", "k": ["Combination of learning and planning in robotics", "Autonomous driving and flight"], "kind": "P", "pdf": "", "ps": 2, "b": 227, "talk": "", "tier": "", "why": "", "top": []}, {"id": "QLhHHolka7", "t": "Learning Object Manipulation from Scratch via Contrastive Interaction", "a": "Tongle Shen; Caleb Chuck; Fan Feng; Biwei Huang", "k": ["Reinforcement learning for physical robot control", "Theoretical foundations of robot learning"], "kind": "P", "pdf": "https://arxiv.org/pdf/2606.11525v1", "ps": 1, "b": 138, "talk": "", "tier": "", "why": "", "top": []}, {"id": "3hsq75Gmr9", "t": "Learning Physics-Guided Residual Dynamics for Deformable Object Simulation", "a": "Shivansh Patel; Kaifeng Zhang; Sanjay Pokkali; Svetlana Lazebnik; Yunzhu Li", "k": ["Robot manipulation", "Sim-to-real transfer", "Deformable objects simulation", "Residual dynamics"], "kind": "S", "pdf": "https://arxiv.org/pdf/2607.13451v1", "ps": 2, "b": 45, "talk": "S5", "tier": "S", "why": "Physics-guided residual deformable sim", "top": ["Deformable"], "sum": "Predicting how deformable objects move is hard but matters for manipulation. The authors propose a hybrid model that pairs an optimizable spring-mass simulator with a neural network correcting its predictions, using a velocity-based formulation and a sliding-window transformer. It is reported as more accurate than purely physics-based and purely learned methods on real deformable objects; no specific numbers are given."}, {"id": "cauTGdv8L0", "t": "Learning Robust Visuomotor Policies via Dynamics Alignment", "a": "Dohyeok Lee; Jung Min Lee; Munkyung Kim; Seokhun Ju; Jin Woo Koo; Kyungjae Lee; Dohyeong Kim; Taehyun Cho; Tapomayukh Bhattacharjee; Jungwoo Lee", "k": ["Imitation learning (behavioral cloning, inverse RL)", "Robot manipulation"], "kind": "P", "pdf": "https://arxiv.org/pdf/2510.27114v2", "ps": 3, "b": 114, "talk": "", "tier": "", "why": "", "top": []}, {"id": "79jC3quhGp", "t": "Learning to Assist: Collaborative VLAs for Implicit Human-Robot Collaboration", "a": "Leo Xu; Letian Li; Alex Cuellar; Michael Hagenow", "k": ["Human-robot interaction and natural language instruction"], "kind": "P", "pdf": "https://arxiv.org/pdf/2606.12475v2", "ps": 1, "b": 71, "talk": "", "tier": "", "why": "", "top": []}, {"id": "vA3t8YK04w", "t": "Learning to be Different: Component Specialization for Compositional Diffusion Policies", "a": "Alec Laprevotte; Haonan Chen; Xiaoshen Han; Yilun Du", "k": ["Robot manipulation", "Imitation learning (behavioral cloning, inverse RL)", "Diffusion Policy", "Multitask Learning"], "kind": "P", "pdf": "https://arxiv.org/pdf/2610.27194v1", "ps": 2, "b": 78, "talk": "", "tier": "", "why": "", "top": []}, {"id": "yeAKwjw5Xa", "t": "Learning to Feel the Future: DreamTacVLA for Contact-Rich Manipulation", "a": "Guo Ye; Zexi Zhang; Xu Zhao; Shang Wu; Haoran Lu; Shihan Lu; Han Liu", "k": ["Robot manipulation", "Imitation learning (behavioral cloning, inverse RL)", "Tactile Manipulation"], "kind": "P", "pdf": "https://arxiv.org/pdf/2512.23864v4", "ps": 2, "b": 144, "talk": "", "tier": "", "why": "", "top": []}, {"id": "tXUfbhgQg2", "t": "Learning Unions of Convex Sets via Invertible Latent Decomposition for Path Planning", "a": "Taerim Yoon; Dongho Kang; Kisang Park; Junha Cha; Stelian Coros; Sungjoon Choi", "k": ["Combination of learning and planning in robotics", "Robot safety, alignment, and safe learning-based systems", "Latent Convex Decomposition", "Invertible Neural Networks"], "kind": "P", "pdf": "https://arxiv.org/pdf/2606.12027v1", "ps": 1, "b": 211, "talk": "", "tier": "", "why": "", "top": []}, {"id": "NWlhQeCX3L", "t": "Learning Visuomotor Quadrotor Flight Through Dynamic Narrow Gaps via Differentiable Simulation", "a": "Riccardo Bianco; Yunfan Ren; Jiaxu Xing; Davide Scaramuzza", "k": ["Model-based and model-free learning for robotic control", "Task and motion planning"], "kind": "P", "pdf": "", "ps": 2, "b": 220, "talk": "", "tier": "", "why": "", "top": []}, {"id": "z47bcul4Zk", "t": "Learning What to Say to Your VLA: Mostly Harmless Vision Language Action Model Steering", "a": "Hyun Joe Jeong; Gokul Swamy; Andrea Bajcsy", "k": ["Robot foundation models and general-purpose knowledge systems", "Human-robot interaction and natural language instruction", "Vision-language-action models", "Policy Steering"], "kind": "S", "pdf": "https://arxiv.org/pdf/2606.12299v2", "ps": 1, "b": 64, "talk": "S1", "tier": "", "why": "", "top": [], "sum": "Vision-Language-Action models respond inconsistently to similar instructions, and some skills may not be reachable by prompting alone. The authors find effective language sequences interactively, distill them into a test-time steering policy, and use a conformally calibrated predictor to decide when steering helps. No fine-tuning is needed. On training environments, performance rose 24.7% in simulation and 65.0% on hardware."}, {"id": "656PH9MVla", "t": "Learning While Deploying: Fleet-Scale Reinforcement Learning for Generalist Robot Policies", "a": "Yi Wang; Xinchen Li; Pengwei Xie; Pu Yang; Buqing Nie; Yunuo Cai; Zhang Qinglin; Chendi Qu; Jeffrey Wu; JianHeng Song; Xinlin Ren; Jingshun Huang; Mingjie Pan; Siyuan Feng; Zhi Chen; Jianlan Luo", "k": ["Reinforcement learning for physical robot control", "Robot foundation models and general-purpose knowledge systems"], "kind": "P", "pdf": "https://arxiv.org/pdf/2605.00416v4", "ps": 1, "b": 85, "talk": "", "tier": "S", "why": "Fleet-scale RL", "top": ["VLA testing", "Dexterous/contact-rich", "RL", "Efficient/real-time"], "sum": "Pretrained robot policies trained on fixed demonstrations often fail under real deployment conditions. Learning While Deploying continually improves a vision-language-action model from fleet autonomous attempts and human corrections, using a robust value-estimation method (DIVL) and a policy-extraction method (QAM) for flow-based action generators. Across eight real tasks on 16 dual-arm robots, average success reached 95%, with the largest gains on the longest tasks."}, {"id": "S0rbnmOkit", "t": "Learning with Object-centric Representations of Tactile Interactive Perception for Robot Manipulation", "a": "Xinyi Yang; Zilin Si; Zhuowei Xu; Zeynep Temel; Oliver Kroemer", "k": ["Learning representations for robotic perception and control", "Robot manipulation", "Tactile sensing", "Interactive perception"], "kind": "P", "pdf": "https://arxiv.org/pdf/2609.33235v1", "ps": 3, "b": 138, "talk": "", "tier": "", "why": "", "top": []}, {"id": "N77om40jWL", "t": "Leave It Better Than Found: Value-Guided Cooperation in Sequential Tasks", "a": "Mario Gomez Andreu; Michael Amir; Antonio Marino; Tianxu An; Marco Hutter; Amanda Prorok", "k": ["Task and motion planning", "Combination of learning and planning in robotics", "Multi-Agent Systems", "Sequential Tasks"], "kind": "S", "pdf": "", "ps": 2, "b": 171, "talk": "S3", "tier": "", "why": "", "top": []}, {"id": "0jY75QYDMn", "t": "LEGS: Fine-Tuning Teleop-Free VLAs for Humanoid Loco-manipulation in an Embodied Gaussian Splatting World", "a": "Hojune Kim; Timothy Chen; Jiankai Sun; Lars Osterberg; Qianzhong Chen; Ke Wang; Mac Schwager", "k": ["Sim-to-real transfer", "Robot foundation models and general-purpose knowledge systems", "Humanoid", "Vision Language Action Model"], "kind": "P", "pdf": "https://arxiv.org/pdf/2606.01458v2", "ps": 2, "b": 199, "talk": "", "tier": "", "why": "", "top": []}, {"id": "802PZFmFGd", "t": "LEMCA: LLM-Guided Synthesis of Efficient Mode-Switching Control Architectures", "a": "Arjun Krishna; Vincent Pacelli; Dinesh Jayaraman", "k": ["Robot foundation models and general-purpose knowledge systems"], "kind": "P", "pdf": "https://arxiv.org/pdf/2609.21319v1", "ps": 1, "b": 227, "talk": "", "tier": "", "why": "", "top": []}, {"id": "kB0KO1Wife", "t": "Light-WAM: Efficient World Action Models with State-Fusion Action Decoding", "a": "Ziang Li; Dongzhou Cheng; Yibin Wang; Shiyue Wang; Xiaoyang Xu; Lingxuan Weng; Juan Wang; Jiaqi Wang", "k": ["Video models and latent world models for robot learning"], "kind": "P", "pdf": "https://arxiv.org/pdf/2606.08242v1", "ps": 1, "b": 55, "talk": "", "tier": "", "why": "", "top": []}, {"id": "7qMRpmvhZL", "t": "Lights, Camera, Malfunction: When Illumination Robustness Leaves VLA Models Blind to Color", "a": "Marino Watanabe; Takami Sato; Kentaro Yoshioka", "k": ["Policy evaluation, adversarial scenarios generation, and red teaming", "Vision-Language-Action Models", "Adversarial Robustness"], "kind": "P", "pdf": "https://arxiv.org/pdf/2607.14698v1", "ps": 2, "b": 100, "talk": "", "tier": "S", "why": "VLA illumination robustness failure", "top": ["Policy eval & safety bounds", "VLA testing"], "sum": "VLA models can fail under small lighting changes. The authors' FLARE attack uses optimized spotlights to drive task success to zero without model access, and common augmentation defenses can teach models to ignore color. Their ChromaGuard training keeps color sensitivity, reaching 92.5 percent success on color-dependent tasks under attack on a physical 6-DoF robot, versus 97.5 percent without attack."}, {"id": "FsgXevFLkn", "t": "LiMA: Bridging Long-term Imagination to Real-time Dexterous Manipulation via Asynchronous  Diffusion", "a": "Ning Chen; Yankai Fu; Junkai Zhao; Qianpu Sun; Guocai Yao; Pengwei Wang; Zhongyuan Wang; Shanghang Zhang", "k": ["Video models and latent world models for robot learning", "Robot manipulation", "Diffusion Models for robot learning", "Dual-System manipulation"], "kind": "P", "pdf": "https://arxiv.org/pdf/2609.28431v1", "ps": 3, "b": 126, "talk": "", "tier": "", "why": "", "top": []}, {"id": "eRpTR7EEC1", "t": "LIME: Learning Intent-aware Camera Motion from Egocentric Video", "a": "Boyang Sun; Jiajie Li; Yung-Hsu Yang; Chenyangguang Zhang; Tim Engelbracht; Sunghwan Hong; Cesar Cadena; Marc Pollefeys; Hermann Blum", "k": ["Robot navigation and locomotion", "Learning representations for robotic perception and control", "Active Perception"], "kind": "P", "pdf": "https://arxiv.org/pdf/2607.02417v2", "ps": 1, "b": 176, "talk": "", "tier": "", "why": "", "top": []}, {"id": "SBGylS4zwM", "t": "LiquidLab:  Benchmarking Robotic Automation for Liquid Operation in Laboratory", "a": "Yuzhou Wang; Longqi Li; Yang Liu; Yuanhao Wang; Shuyong Gao; Shengyuan Wang; Tianyang Wang; Yue Yao; Min Xu", "k": ["Benchmarks and datasets for robot learning"], "kind": "P", "pdf": "", "ps": 2, "b": 109, "talk": "", "tier": "", "why": "", "top": []}, {"id": "1uKIsrjCvt", "t": "Localized Visual Feature Aggregation via Focus Pooling for Visuomotor Policies", "a": "Ruiyu Wang; Zheyu Zhuang; Danica Kragic; Florian T. Pokorny", "k": ["Imitation learning (behavioral cloning, inverse RL)", "Attention Pooling"], "kind": "P", "pdf": "https://arxiv.org/pdf/2609.08408v1", "ps": 1, "b": 30, "talk": "", "tier": "", "why": "", "top": []}, {"id": "sS9FjkKKsm", "t": "LoComposition: Terrain-Adaptive Energy-Efficient Quadruped Locomotion without Gait Priors", "a": "Loukas Kordos; Leonard T. Franz; Simon Rappenecker; Oliver Hausdörfer; Angela P. Schoellig; Pavel Kolev; Georg Martius", "k": ["Reinforcement learning for physical robot control", "Sim-to-real transfer", "Quadrupedal locomotion", "Energy-efficient rough-terrain locomotion"], "kind": "P", "pdf": "https://arxiv.org/pdf/2606.15896v2", "ps": 3, "b": 157, "talk": "", "tier": "", "why": "", "top": []}, {"id": "n31eEof0k3", "t": "Long-Horizon Manipulation via Trace-Conditioned VLA Planning", "a": "Isabella Liu; An-Chieh Cheng; Rui Yan; Geng Chen; Ri-Zhao Qiu; Xueyan Zou; Sha Yi; Hongxu Yin; Xiaolong Wang; Sifei Liu", "k": ["Robot foundation models and general-purpose knowledge systems", "Robot manipulation"], "kind": "P", "pdf": "https://arxiv.org/pdf/2604.21924v1", "ps": 1, "b": 36, "talk": "", "tier": "S", "why": "Trace-conditioned long-horizon VLA", "top": ["VLA testing", "Long-horizon", "Planning & optimization", "Efficient/real-time"], "sum": "Long multi-step manipulation is hard for vision-language-action policies because errors accumulate. LoHo-Manip pairs a task-management vision-language model, which repeatedly predicts the remaining subtask list and a 2D keypoint trace, with a VLA executor that follows the trace. It reports gains in long-horizon success, robustness and generalization in simulation and on a real Franka robot, without specific numbers."}, {"id": "hWuk4y2AeR", "t": "Long-Horizon Multi-Object Rearrangement via Distilled Tree Search over Continuous Actions", "a": "Kallol Saha; Yining Hong; Amber Li; Yejin Choi; Maxim Likhachev; David Held", "k": ["Combination of learning and planning in robotics", "Robot manipulation", "Robot Learning", "Tree Search"], "kind": "O", "pdf": "https://arxiv.org/pdf/2610.25785v1", "ps": 2, "b": 176, "talk": "O6", "tier": "S", "why": "Oral: long-horizon rearrangement via tree search", "top": ["Training frontier", "Long-horizon", "Planning & optimization"], "sum": "Long-horizon manipulation is hard because learned policies accumulate errors, while search-based planning is too costly in continuous action spaces. DISCO runs tree search in a physics simulator guided by a learned policy and value function, then periodically distills the search results back into the model so it acts without simulation at test time. It outperforms imitation learning, reinforcement learning and search baselines on rearrangement tasks; no numbers are given."}, {"id": "4M7C3PsA78", "t": "Look Before You Move: Agent-Interface-Aligned Supervision for Open-World Mobile Manipulation", "a": "Ronghe Qiu; Teli Ma; Jiaming Zhou; Zeying Gong; Yiting He; Qiang HUANG; Junwei Liang", "k": ["Robot navigation and locomotion", "Combination of learning and planning in robotics", "Open-world mobile manipulation", "Vision-language model agents"], "kind": "P", "pdf": "https://arxiv.org/pdf/2610.15572v1", "ps": 1, "b": 125, "talk": "", "tier": "", "why": "", "top": []}, {"id": "2AOAVWqGC6", "t": "LSPR: Init-Anchored Score-Based Multi-Camera Calibration for Indoor Robot Manipulation", "a": "Weifan Mao; Tianyu Wang; Yanwei Fu", "k": ["Multimodal perception, sensor fusion, and robot vision"], "kind": "P", "pdf": "", "ps": 1, "b": 183, "talk": "", "tier": "S", "why": "Multi-camera calibration", "top": ["Perception & vision"]}, {"id": "QsmD0Pq7uP", "t": "LUCID: Learning Embodiment-Agnostic Intent Models from Unstructured Human Videos for Scalable Dexterous Robot Skill Acquisition", "a": "Harsh Gupta; Guanya Shi; Wenzhen Yuan", "k": ["Robot manipulation", "Reinforcement learning for physical robot control", "Learning from human videos", "Sim-to-real transfer"], "kind": "P", "pdf": "https://arxiv.org/pdf/2606.11628v1", "ps": 3, "b": 54, "talk": "", "tier": "", "why": "", "top": []}, {"id": "L8ATlveWKT", "t": "MaD-PF: Modular and Differentiable Particle Filter for Cross-Environment SE(3) LiDAR Localization", "a": "Jonathan Hungerbühler; Felix Jahncke; Edoardo Ghignone; Maurice Brunner; Moritz Wagner; Andreas Blum; Andrea Carron; Johannes Betz; Michele Magno", "k": ["Multimodal perception, sensor fusion, and robot vision", "Field Robotics", "Differentiable Localization"], "kind": "P", "pdf": "", "ps": 1, "b": 188, "talk": "", "tier": "", "why": "", "top": []}, {"id": "BxW31Dilgn", "t": "MAESTRO: Orchestrating Robotics Modules with Coding Agents for Zero-Shot Generalist Robots", "a": "Junyao Shi; Rujia Yang; Kaitian Chao; Bingqing Selina Wan; Yifei Simon Shao; Jiahui Lei; Jianing Qian; Long Le; Pratik Chaudhari; Kostas Daniilidis; Chuan Wen; Dinesh Jayaraman", "k": ["Robot foundation models and general-purpose knowledge systems", "Robot manipulation", "VLM coding agents for robot manipulation", "Modular generalist manipulation"], "kind": "P", "pdf": "", "ps": 1, "b": 203, "talk": "", "tier": "", "why": "", "top": []}, {"id": "r7ZN8cPEcj", "t": "MAGMA-GEN: Validated Recovery Supervision from Ambiguous Failures via Counterfactual Re-Execution", "a": "Loan BERNAT; Matthieu Grard; Ariane Herbulot; Florent Lamiraux", "k": ["Human-robot interaction and natural language instruction", "Combination of learning and planning in robotics", "Data Generation", "Robot Manipulation"], "kind": "P", "pdf": "https://arxiv.org/pdf/2609.20056v1", "ps": 2, "b": 97, "talk": "", "tier": "S", "why": "Recovery supervision from failures", "top": ["Policy eval & safety bounds", "Planning & optimization"], "sum": "Hierarchical robots on long tasks fail in ways that hide whether the cause was the high-level decision, partial observation or execution. MAGMA-GEN uses a privileged coach to guess an early decision error and propose local fixes, keeping only those that improve progress when re-run from the same state. It reports better success and recovery than distillation and trajectory-repair baselines in simulation and on a real robot, without numbers."}, {"id": "Tk1gtgOESR", "t": "MAPO: Mixture of Experts with Alternating Policy Optimization for Universal Humanoid Motion Tracking", "a": "Seonghyeon Lim; Hyeonwoo Lee; Mincheol Kim; Kimin Lee; Hyun Myung", "k": ["Reinforcement learning for physical robot control"], "kind": "P", "pdf": "", "ps": 3, "b": 190, "talk": "", "tier": "", "why": "", "top": []}, {"id": "IY6ti85pg0", "t": "MARCH: Model-Assisted Reinforcement Learning for the Perceptive Control of Humanoids over Sparse Footholds", "a": "Codrin Crismariu; Ryan K. Cosner", "k": ["Reinforcement learning for physical robot control", "Model-based and model-free learning for robotic control", "Bipedal Locomotion"], "kind": "P", "pdf": "https://arxiv.org/pdf/2606.10288v2", "ps": 3, "b": 167, "talk": "", "tier": "", "why": "", "top": []}, {"id": "Ih059VNeWq", "t": "MaskWAM: Unifying Mask Prompting and Prediction for World-Action Models", "a": "Hanyang Yu; Haitao Lin; Jingbo Zhang; Wenyao Zhang; Chenghao Gu; Heng Li; Ping Tan", "k": ["Video models and latent world models for robot learning", "Imitation learning (behavioral cloning, inverse RL)", "World Action Models", "Robotic Manipulation"], "kind": "P", "pdf": "https://arxiv.org/pdf/2606.13515v1", "ps": 3, "b": 14, "talk": "", "tier": "", "why": "", "top": []}, {"id": "zr63f3tmyq", "t": "MAST-VLA: Skill-Conditioned Adaptation with Trajectory-Affordance Priors for Multi-Skill Robot Manipulation", "a": "Jiachi Yang; Zhiyi Xu; Hongquan Zhang; Xin Tan; Zhizhong Zhang; Jingyu Gong; Yuan Xie", "k": ["Robot manipulation", "Learning representations for robotic perception and control", "Multi-Task Learning", "Affordance learning"], "kind": "P", "pdf": "", "ps": 2, "b": 40, "talk": "", "tier": "", "why": "", "top": []}, {"id": "d0ltfevDaD", "t": "MDF++: Visuo-Tactile World Action Model with End-to-end Representation Learning", "a": "Zixuan Huang; Jinhao Yu; Zachary S. Charlick; Dmitry Berenson", "k": ["Learning representations for robotic perception and control", "Video models and latent world models for robot learning", "Visuo-tactile policy learning", "Contact-rich robot manipulation"], "kind": "P", "pdf": "", "ps": 2, "b": 158, "talk": "", "tier": "", "why": "", "top": []}, {"id": "bqXyS2gKba", "t": "Mechanistic Interpretability for End-to-End Self-Driving", "a": "Manav Gagvani; Benjamin Namikas; Sivamurugan Velmurugan; Nysa Kumar; Shrey Sharma; Thomas Peterson; Pratyush Mathur; Hyunseo Chang; Rohan Paleja", "k": ["Learning representations for robotic perception and control", "Autonomous driving and flight"], "kind": "P", "pdf": "", "ps": 3, "b": 214, "talk": "", "tier": "", "why": "", "top": []}, {"id": "5TiiTY1fK3", "t": "MEM: Multi-Scale Embodied Memory for Vision Language Action Models", "a": "Marcel Torne; Karl Pertsch; Homer Walke; Kyle Vedder; Suraj Nair; brian ichter; Allen Z. Ren; Haohuan Wang; Jiaming Tang; Kyle Stachowicz; Karan Dhabalia; Michael Robert Equi; Quan Vuong; Jost Tobias Springenberg; Sergey Levine; Chelsea Finn; Danny Driess", "k": ["Robot foundation models and general-purpose knowledge systems", "Robot manipulation", "Memory"], "kind": "S", "pdf": "https://arxiv.org/pdf/2603.03596v2", "ps": 1, "b": 42, "talk": "S1", "tier": "S", "why": "Multi-scale embodied memory", "top": ["VLA testing", "Long-horizon", "Efficient/real-time"], "sum": "Policies that only see a short window of past observations struggle with long, multi-stage tasks. MEM combines compressed short-term video memory with text-based long-term memory at different levels of detail. This lets policies complete tasks lasting up to fifteen minutes, such as cleaning a kitchen, though the abstract gives no specific benchmark numbers."}, {"id": "dSbtHPqFj9", "t": "Memory Anchors for Continual Robot Learning", "a": "Max Du; Zhanyi Sun; Chen Xu; Paarth Shah; Masha Itkina; Shuran Song", "k": ["Imitation learning (behavioral cloning, inverse RL), robotic continual learning, catastrophic forgetting"], "kind": "P", "pdf": "https://arxiv.org/pdf/2608.26545v1", "ps": 1, "b": 50, "talk": "", "tier": "", "why": "", "top": []}, {"id": "f9grq4Ncx9", "t": "Memory-augmented Action-conditioned World Model for Robot Manipulation", "a": "Zirui Zheng; Jiaqian Yu; Xiongfeng Peng; jun shi; Mingyi Li; Chao Zhang; Weiming Li; Dong Wang; Huchuan Lu; Xu Jia", "k": ["Video models and latent world models for robot learning", "Robot manipulation"], "kind": "O", "pdf": "", "ps": 1, "b": 53, "talk": "O2", "tier": "S", "why": "Oral: memory-augmented world model", "top": ["World models", "Long-horizon"]}, {"id": "aITDcHSCTW", "t": "MemoryVAM: Integrating Memory into Video Action Model for Robot Manipulation", "a": "Yuxin Jiang; Chang Yu; Yunuo Chen; Xiang Feng; Yin Yang; Nishank Gite; Chenfanfu Jiang", "k": ["Video models and latent world models for robot learning", "Robot foundation models and general-purpose knowledge systems", "Episodic Memory", "Long-Horizon Tasks"], "kind": "P", "pdf": "https://arxiv.org/pdf/2606.20679v1", "ps": 1, "b": 58, "talk": "", "tier": "", "why": "", "top": []}, {"id": "Br2rXixvyN", "t": "MESA: An Evaluation Framework for Compositional, Semantic, and Spatial Generalization in Robotics", "a": "Albert Wilcox; Frank Chang; Nhi Nguyen; Aishani Chakraborty; Jeremy A. Collins; Vaibhav Saxena; Benjamin Joffe; Siddharth Karamcheti; Animesh Garg", "k": ["Benchmarks and datasets for robot learning", "Robot foundation models and general-purpose knowledge systems"], "kind": "P", "pdf": "", "ps": 2, "b": 102, "talk": "", "tier": "S", "why": "Eval framework for generalization", "top": ["Policy eval & safety bounds", "VLA testing", "Efficient/real-time"], "sum": "Existing manipulation benchmarks are either too narrow to tell strong methods apart or too broad for controlled experiments. MESA offers five evaluation suites covering in-distribution performance plus four generalization axes, a demonstration generator built on MimicGen (MESA-Gen), and a bimanual version (BiMESA). The best of seven baselines reaches only 52% success on MESA and 49% on BiMESA, and rankings broadly match RoboArena scores."}, {"id": "JbpsGhdjs9", "t": "MeshMimic: Geometry-Aware Humanoid Motion Learning through 3D Scene Reconstruction", "a": "Qiang Zhang; Jiahao Ma; Peiran Liu; Shuai Shi; Zeran Su; Zifan Wang; Jingkai SUN; Wei Cui; Jialin Yu; Gang Han; Wen Zhao; Kangning Yin; Jiaxu Wang; Jiahang Cao; Lingfeng Zhang; Pihai Sun; Hao Cheng; Yiding Ji; Junwei Liang; Jian Tang; Renjing Xu; Yijie Guo", "k": ["Imitation learning (behavioral cloning, inverse RL)", "Robotic data generation", "SIM-to-REAL-to-SIM"], "kind": "P", "pdf": "https://arxiv.org/pdf/2602.15733v1", "ps": 3, "b": 165, "talk": "", "tier": "", "why": "", "top": []}, {"id": "GqqwqejrTq", "t": "MessyMem: Learning-from-Doing Memory for Mobile Manipulation", "a": "Anuva Banwasi; William Muckelroy III; Priya Sundaresan; Linfeng Zhao; Jeannette Bohg; Cherie Ho", "k": ["Combination of learning and planning in robotics", "Robot foundation models and general-purpose knowledge systems", "Mobile manipulation", "Interaction-grounded memory"], "kind": "P", "pdf": "https://arxiv.org/pdf/2609.15976v2", "ps": 1, "b": 45, "talk": "", "tier": "", "why": "", "top": []}, {"id": "nBwRDRUdMc", "t": "MessyNav: Zero-Shot Navigation via Manipulation in Messy Environments", "a": "Kenneth Llontop; Cherie Ho; Dylan Zhou; Anuva Banwasi; Priya Sundaresan; Carlota Parés Morlans; Jeannette Bohg", "k": ["Combination of learning and planning in robotics", "Robot foundation models and general-purpose knowledge systems", "Interactive Navigation", "Mobile Manipulation"], "kind": "P", "pdf": "", "ps": 1, "b": 155, "talk": "", "tier": "", "why": "", "top": []}, {"id": "qQs6JndxfZ", "t": "Meta-Ctrl: Guaranteed Plan Generation by Decoupling Syntactic and Semantic Constraints", "a": "Gwen Yidou-Weng; Edward Sun; Tianyi Ma; Metin Alp Dogan; Benjie Wang; Allen Peng; Guy Van den Broeck; Yuchen Cui", "k": ["Task and motion planning", "Combination of learning and planning in robotics", "Constrained Decoding", "Formal Guarantee"], "kind": "S", "pdf": "https://arxiv.org/pdf/2608.22149v3", "ps": 3, "b": 104, "talk": "S6", "tier": "S", "why": "Guaranteed plan generation", "top": ["Motion control & safety", "Policy eval & safety bounds", "Long-horizon", "Planning & optimization"], "sum": "Plans from language models are fluent but often violate the syntax and semantic rules needed to execute them. Meta-Ctrl uses constrained decoding over a compact vocabulary of grounded action tokens to enforce syntax, preconditions and ordering, cutting memory from over 107 TB to under 2 GB. A small open model reaches the top subgoal success on WAH-NL, beating GPT-4, with guaranteed valid plans on a real robot."}, {"id": "PAtsmTswIr", "t": "Mind the Gap: Rethinking I/O Design for Contact-Rich Visuomotor Policy Learning", "a": "Xu Cuijie; Shurui Zheng; Su Zihao; Zhongchen Jian; Yuanfan Xu; Tinghao Yi; Jian Wang; Xudong Zhang; Yu Wang; Jincheng Yu", "k": ["Learning representations for robotic perception and control", "Imitation learning (behavioral cloning, inverse RL)"], "kind": "P", "pdf": "https://arxiv.org/pdf/2602.08776v2", "ps": 3, "b": 146, "talk": "", "tier": "S", "why": "I/O design for contact-rich visuomotor policies", "top": ["Perception & vision", "Dexterous/contact-rich", "RL"], "sum": "The paper asks which inputs and outputs a contact-rich policy should use, since teleoperation logs can record the robot's executed state, the leader's commands, or both. Dual-State Conditioning takes both as input and predicts future commands, so their mismatch can signal contact, latency or payload. It is reported to beat execution-only and command-only baselines on real tasks; no numbers are given."}, {"id": "FK33gnkKgF", "t": "Mind the Phase: Effective Rank and Representation Health in Legged Locomotion", "a": "Felipe Andrade G. Tommaselli; Ricardo V. Godoy; Thiago Henrique Segreto Silva; Juliano Decico Negri; MARCELO BECKER", "k": ["Learning representations for robotic perception and control", "Reinforcement learning for physical robot control", "Representation Learning", "Legged Locomotion"], "kind": "P", "pdf": "https://arxiv.org/pdf/2609.06958v2", "ps": 3, "b": 188, "talk": "", "tier": "", "why": "", "top": []}, {"id": "mzGjyghofG", "t": "MIND-Grasp: Multi-View Imagination-Guided Next-Best-Action Discovery for Occlusion-Aware Grasping", "a": "Qilin Wu; Weichao Sun", "k": ["Learning representations for robotic perception and control", "Robot manipulation", "Multi-View Reconstruction", "Occlusion-Aware Grasp"], "kind": "P", "pdf": "", "ps": 3, "b": 129, "talk": "", "tier": "", "why": "", "top": []}, {"id": "nG11dAaFIX", "t": "Minimal-Intervention Target Retrieval in Cluttered Scenes with Grasp-Conditioned Dependency Graphs", "a": "Wanhao Niu; Qiyan Ke; Yuan Sun; Chongrui Zhang; Huaidong Zhou; Yongfeng Rong; Shuang Zhang; Fuchun Sun", "k": ["Robot manipulation", "Benchmarks and datasets for robot learning", "Cluttered Manipulation", "Grasping"], "kind": "P", "pdf": "", "ps": 3, "b": 130, "talk": "", "tier": "", "why": "", "top": []}, {"id": "Glj2RSQIS4", "t": "MIRROR: Reflecting Hidden Symmetries from Offline Robot Interaction Data", "a": "Shiqi Liu; Yihang Yao; Peide Huang; Mengdi Xu; Ding Zhao", "k": ["Robot manipulation", "Symmetry Discovery", "Equivariant Policy Learning"], "kind": "P", "pdf": "https://arxiv.org/pdf/2610.17422v1", "ps": 3, "b": 116, "talk": "", "tier": "", "why": "", "top": []}, {"id": "f5329HhijI", "t": "Mixture of Frames Policy: Multi-Frame Action Denoising for Bimanual Mobile Manipulation", "a": "Dian Wang; Jisang Park; Xiaomeng Xu; Han Zhang; Shuran Song; Jeannette Bohg", "k": ["Imitation learning (behavioral cloning, inverse RL)", "Robot manipulation"], "kind": "P", "pdf": "https://arxiv.org/pdf/2607.11884v1", "ps": 1, "b": 120, "talk": "", "tier": "", "why": "", "top": []}, {"id": "w3g5PWur7i", "t": "MobiAgent: Dual-Loop Recursive Policy Self-Improvement for Long-Horizon Mobile Manipulation", "a": "Chenzhi Liu; Yue Zhang; Jiehong Lin; Jianan Wang; Bo Wang; Zhongrui Wang; Xiaojuan Qi", "k": ["Combination of learning and planning in robotics", "Robot foundation models and general-purpose knowledge systems"], "kind": "P", "pdf": "https://arxiv.org/pdf/2610.03476v1", "ps": 1, "b": 200, "talk": "", "tier": "", "why": "", "top": []}, {"id": "uKRtsLLqs6", "t": "MoDex: Towards Universal Multi-Object Dexterous Grasping", "a": "Jing Xiong; Jiale Xie; Haoqi Yuan; Chaoyi Xu; Zongqing Lu", "k": ["Robot manipulation", "Reinforcement learning for physical robot control", "Multi-object grasping"], "kind": "P", "pdf": "https://arxiv.org/pdf/2610.23888v1", "ps": 2, "b": 127, "talk": "", "tier": "", "why": "", "top": []}, {"id": "wKRawikMuG", "t": "Modular Sensory Stream for Integrating Physical Feedback in Vision-Language-Action Models", "a": "Jimin Lee; Huiwon Jang; Myungkyu Koo; Jungwoo Park; Jinwoo Shin", "k": ["Robot manipulation", "Robot foundation models and general-purpose knowledge systems"], "kind": "P", "pdf": "https://arxiv.org/pdf/2604.23272v2", "ps": 1, "b": 33, "talk": "", "tier": "", "why": "", "top": []}, {"id": "bjPoaczBRX", "t": "MoFlo: Language-Conditioned Flow Matching for Policy Mobilization", "a": "Daichi Yashima; Yusuke Takagi; Koki Seno; Rui Suzuki; Kirato Sakata; Shuhei Kurita; Komei Sugiura", "k": ["Learning representations for robotic perception and control"], "kind": "P", "pdf": "", "ps": 3, "b": 75, "talk": "", "tier": "", "why": "", "top": []}, {"id": "Q6xWLHyg6x", "t": "MolmoAct2: Action Reasoning Models for Real-World Deployment", "a": "Haoquan Fang; Jiafei Duan; Donovan Clay; Sam Wang; Shuo Liu; Weikai Huang; Xiang Fan; Wei-Chuan Tsai; Shirui Chen; Yi Ru Wang; Shanli Xing; Jaemin Cho; Jae Sung Park; Ainaz Eftekhar; Peter Sushko; Karen Farley; Angad Wadhwa; Cole Harrison; Winson Han; Ying-Chun Lee; Eli VanderBilt; Rose Hendrix; Suveen Ellawela; Lucas Ngoo; Joyce Chai; Jason Ren; Ali Farhadi; Dieter Fox; Ranjay Krishna", "k": ["Robot foundation models and general-purpose knowledge systems", "Robot manipulation", "Open science models", "Robotics Foundation Models"], "kind": "S", "pdf": "https://arxiv.org/pdf/2605.02881v2", "ps": 1, "b": 28, "talk": "S1", "tier": "", "why": "", "top": [], "sum": "Existing vision-language-action robot controllers are often closed, tied to costly hardware, slow when reasoning, or unreliable. MolmoAct2 is an open model combining the MolmoER spatial-reasoning backbone, a flow-matching action expert, the OpenFAST action tokenizer, and MolmoThink, which updates depth reasoning only for changed scene regions to cut latency. It outperforms Pi-05 on 7 benchmarks, and MolmoER beats GPT-5 and Gemini Robotics ER-1.5 on 13 embodied-reasoning benchmarks."}, {"id": "c4Z0Y8gvnI", "t": "MolmoB0T: Large-Scale Simulation Enables Zero-Shot Manipulation", "a": "Abhay Deshpande; Maya Guru; Rose Hendrix; Snehal Jauhri; Ainaz Eftekhar; Rohun Tripathi; Max Argus; Jordi Salvador; Haoquan Fang; Matthew Wallingford; Wilbert Pumacay; Yejin Kim; Quinn Pfeifer; Ying-Chun Lee; Piper Wolters; Omar Rayyan; Mingtong Zhang; Jiafei Duan; Karen Farley; Winson Han; Eli VanderBilt; Dieter Fox; Ali Farhadi; Georgia Chalvatzaki; Dhruv Shah; Ranjay Krishna", "k": ["Sim-to-real transfer", "Robotic data generation", "Robot manipulation"], "kind": "O", "pdf": "https://arxiv.org/pdf/2603.16861v2", "ps": 1, "b": 196, "talk": "O3", "tier": "S", "why": "Oral: large-scale sim for zero-shot manipulation", "top": [], "sum": "Sim-trained robot policies are usually assumed to need real-world data or fine-tuning. The authors built MolmoBot-Engine, an open-source pipeline that procedurally generates simulated data, producing 1.8 million trajectories and three policy models. On real tabletop pick-and-place across four settings, the MolmoBot model succeeded 79.2% of the time versus 39.2% for pi0.5, with no real-world training data."}, {"id": "SMBnET3Mz9", "t": "Monkey See, Can Monkey Do? A Benchmark for Evaluating Robot Skill Learning by Observation", "a": "Weiwei Gu; Anmol Gupta; Anant Sah; Ryan Sam Varghese; Lalitha Vanam; Prabhath Adireddi; Peter Karkus; Nakul Gopalan", "k": ["Benchmarks and datasets for robot learning", "Imitation learning (behavioral cloning, inverse RL)", "Learning from observation", "Learning from human demonstrations"], "kind": "P", "pdf": "https://arxiv.org/pdf/2609.08209v4", "ps": 2, "b": 106, "talk": "", "tier": "", "why": "", "top": []}, {"id": "xOhVCWilYJ", "t": "More than a Point: Adaptive Affordance Heatmaps as VLM Grounding Interfaces for Robotics", "a": "Xinyu Shao; TANG YANZHE; Pengwei Xie; Long ZENG; Xiu Li", "k": ["Learning representations for robotic perception and control", "Robot manipulation", "Spatial Grounding", "Language-Guided Manipulation"], "kind": "P", "pdf": "", "ps": 1, "b": 126, "talk": "", "tier": "", "why": "", "top": []}, {"id": "v24DO7JOuN", "t": "MoRE: Mixture-of-Experts for Multi-Physics Robotic World Models", "a": "Ziyu Zhu; Shaowei Liu; Albert J. Zhai; Henry Che; Wei-Chiu Ma; Shenlong Wang", "k": ["Robot foundation models and general-purpose knowledge systems", "Video models and latent world models for robot learning"], "kind": "S", "pdf": "", "ps": 1, "b": 52, "talk": "S2", "tier": "", "why": "", "top": []}, {"id": "X7QOq3QotA", "t": "MorFiC: Fixing Value Miscalibration for Zero-Shot Quadruped Transfer", "a": "Prakhar Mishra; Amir Hossain Raj; Xuesu Xiao; Dinesh Manocha", "k": ["Reinforcement learning for physical robot control", "Robot navigation and locomotion", "Quadrupedal Locomotion Generalization"], "kind": "P", "pdf": "https://arxiv.org/pdf/2603.14554v2", "ps": 3, "b": 155, "talk": "", "tier": "", "why": "", "top": []}, {"id": "YQoaLlpDD3", "t": "Morphology-Conditioned World Model for Cross-Embodiment Quadrupedal Locomotion", "a": "Mohamad H. Danesh; Chenhao Li; Amin Abyaneh; Anas Houssaini; Kirsty Ellis; Glen Berseth; Marco Hutter; Hsiu-Chin Lin", "k": ["Model-based and model-free learning for robotic control", "Robot navigation and locomotion"], "kind": "P", "pdf": "https://arxiv.org/pdf/2604.08780v2", "ps": 3, "b": 156, "talk": "", "tier": "", "why": "", "top": []}, {"id": "k2QZxbcSbQ", "t": "MosaicIMU: Composing Carrier Experts for Generalizable Neural Inertial Odometry", "a": "Junye Zou; Huiyi Yan; Xinning Xu; Xiaolei Li; Pengkun Zhou; Jinhui Zhang; Ziyang Meng", "k": ["Robot navigation and locomotion", "Robot systems, hardware, and sensors for learning"], "kind": "S", "pdf": "https://arxiv.org/pdf/2606.09355v1", "ps": 3, "b": 227, "talk": "S8", "tier": "", "why": "", "top": [], "sum": "Learning-based inertial odometry often works only on the carrier type it was trained on when external sensing is unreliable. MosaicIMU uses a carrier-conditioned mixture of experts with a prototype-based router, feeding velocity and uncertainty estimates into a history-aware extended Kalman filter. Against learning-based baselines it cuts average absolute trajectory error by 40% and 10-second relative trajectory error by 34%."}, {"id": "XJgz1iK29G", "t": "MotionDisco: Motion Discovery for Extreme Humanoid Loco-manipulation", "a": "Ilyass Taouil; Michal Ciebielski; Shafeef Omar; Haizhou Zhao; Angela Dai; Aaron M. Johnson; Majid Khadiv", "k": ["Combination of learning and planning in robotics", "Task and motion planning", "Humanoid loco-manipulation", "Motion discovery through evolutionary program search"], "kind": "P", "pdf": "https://arxiv.org/pdf/2606.06139v1", "ps": 2, "b": 198, "talk": "", "tier": "", "why": "", "top": []}, {"id": "oKJnHTluoA", "t": "MotionVLA: Injecting Geometric Motion into Vision-Language-Action Model", "a": "Shanglin Yuan; Weiheng Zhao; Xianda Guo; Wei Sui; Li Yu; Wenyu Liu; Xinggang Wang", "k": ["Multimodal perception, sensor fusion, and robot vision", "Learning representations for robotic perception and control, 4D motion representation for robot learning"], "kind": "P", "pdf": "https://arxiv.org/pdf/2606.08288v1", "ps": 1, "b": 26, "talk": "", "tier": "", "why": "", "top": []}, {"id": "0HS0to0eVo", "t": "MPC-Injection: Biasing Off-Policy Locomotion RL Toward Controller-Induced Behavior Basins", "a": "Roy Xing; Seyoung Ree; Brian Plancher", "k": ["Reinforcement learning for physical robot control", "Combination of learning and planning in robotics", "Locomotion", "Model predictive control"], "kind": "P", "pdf": "https://arxiv.org/pdf/2606.26392v2", "ps": 3, "b": 193, "talk": "", "tier": "", "why": "", "top": []}, {"id": "hPz010j4EA", "t": "Multi-GraspLLM: Multimodal LLM for Multi-Hand Semantic Guided Grasp Generation", "a": "Haosheng Li; Weixin Mao; Weipeng DENG; Chenyu Meng; Haoqiang Fan; Tiancai Wang; Osamu Yoshie; Ping Tan; Hongan Wang; Xiaoming Deng", "k": ["Multimodal perception, sensor fusion, and robot vision, semantic grasp generation", "Large language models"], "kind": "P", "pdf": "", "ps": 2, "b": 120, "talk": "", "tier": "", "why": "", "top": []}, {"id": "b2gSINMX3R", "t": "Multi-Resolution Tactile Imitation Learning for Contact-Rich Robotic Manipulation", "a": "Rickmer Krohn; Erik Helmut; Niklas Funk; Jan Peters; Vignesh Prasad; Georgia Chalvatzaki", "k": ["Multimodal perception, sensor fusion, and robot vision", "Imitation learning (behavioral cloning, inverse RL)", "Touch sensing for robotic manipulation"], "kind": "P", "pdf": "https://arxiv.org/pdf/2606.06281v2", "ps": 2, "b": 143, "talk": "", "tier": "", "why": "", "top": []}, {"id": "NEtxISu52Q", "t": "Multisensory Continual Learning: Adapting Pretrained Visuomotor Policies to Force", "a": "Jaden Clark; Changhao Wang; Yihuai Gao; Seongheon Hong; Hojung Choi; Mark Cutkosky; Yifan Hou; Shuran Song", "k": ["Imitation learning (behavioral cloning, inverse RL)", "Video models and latent world models for robot learning", "Multisensory Learning", "Continual Learning"], "kind": "P", "pdf": "https://arxiv.org/pdf/2606.30988v4", "ps": 3, "b": 147, "talk": "", "tier": "", "why": "", "top": []}, {"id": "GFxjqZVSND", "t": "M³P-R1: Reinforcement Learning for Large Language Model Guided Multi-Modal Motion Planning via MIP Code Generation", "a": "Xingpeng Sun; zherong pan; Kai Cheng; Xindi Tang; Syed Talha Bukhari; Aniket Bera", "k": ["Human-robot interaction and natural language instruction", "Robot foundation models and general-purpose knowledge systems", "Multi-Modal Motion Planning", "LLM for Robot Planning"], "kind": "P", "pdf": "https://arxiv.org/pdf/2609.18669v1", "ps": 1, "b": 100, "talk": "", "tier": "S", "why": "LLM-guided MIP motion planning", "top": ["VLA testing", "Dexterous/contact-rich", "Planning & optimization", "RL", "Efficient/real-time"], "sum": "Robot motion planning must handle both continuous movement and discrete mode switches, which is hard to solve efficiently. M3P-R1 uses reinforcement learning to fine-tune a language model to write Python code that builds mixed-integer programming models, with the solver outcome as the reward. The abstract does not state a main quantitative result."}, {"id": "uhnmcdamCa", "t": "NAC: Neural Action Codec for Vision-Language-Action Models", "a": "Ahad Jawaid; Yu Xiang", "k": ["Learning representations for robotic perception and control", "Robot foundation models and general-purpose knowledge systems", "VLA", "Action Tokenizer"], "kind": "P", "pdf": "https://arxiv.org/pdf/2606.21372v2", "ps": 1, "b": 9, "talk": "", "tier": "", "why": "", "top": []}, {"id": "hJv9yhbgxR", "t": "Native Memory Compression for Long-Horizon Robotic Manipulation", "a": "Ziye Wang; Modi Shi; Chaojun Ni; Jiazhi Yang; Mengdi Li; Zhizhong Su; Tianwei Lin; Hongyang Li", "k": ["Robot manipulation", "Imitation learning (behavioral cloning, inverse RL)"], "kind": "P", "pdf": "https://arxiv.org/pdf/2607.06678v2", "ps": 1, "b": 41, "talk": "", "tier": "", "why": "", "top": []}, {"id": "60tPXLIFyM", "t": "Navigating the Clutter: Waypoint-Based Bi-Level Planning for Multi-Robot Systems", "a": "Jiabao Ji; Yongchao Chen; Yang Zhang; Ramana Rao Kompella; Chuchu Fan; Gaowen Liu; Shiyu Chang", "k": ["Combination of learning and planning in robotics", "Robot navigation and locomotion"], "kind": "P", "pdf": "https://arxiv.org/pdf/2604.21138v1", "ps": 1, "b": 172, "talk": "", "tier": "", "why": "", "top": []}, {"id": "0rvhGgRYjx", "t": "NavVerse: Benchmarking Indoor-to-Outdoor Embodied Navigation in Continuous Robot Simulation", "a": "Junzhe Wu; Yue Hu; Zeyu Han; Po-Hsun Chang; Yinan Dong; Behrad Rabiei; Junwoon Lee; Maani Ghaffari", "k": ["Benchmarks and datasets for robot learning", "Robot navigation and locomotion", "Autonomous Navigation"], "kind": "P", "pdf": "https://arxiv.org/pdf/2607.19695v1", "ps": 1, "b": 156, "talk": "", "tier": "", "why": "", "top": []}, {"id": "yzejD0WIk9", "t": "Neuromorphic Control of a Flapping-Wing Robot on Resource-Constrained Hardware", "a": "Rim El Filali; Chenrui Feng; Chao Gao; Weibin Gu", "k": ["Imitation learning (behavioral cloning, inverse RL)", "Robot navigation and locomotion", "Neuromorphic computing", "Flapping-wing micro aerial vehicle"], "kind": "P", "pdf": "", "ps": 2, "b": 222, "talk": "", "tier": "", "why": "", "top": []}, {"id": "19iADsbO9A", "t": "Never Too Late for Force: Accelerating VLA Post-Training with Reactive Force Injection", "a": "Yi Wang; Wendi Chen; Zimo Wen; Han Xue; Xueqi Li; Wenye Yu; Zhijie Chen; Hao Yang; Jun Lv; Chuan Wen; Cewu Lu", "k": ["Multimodal perception, sensor fusion, and robot vision", "Robot manipulation", "Force-augmented policies", "Online post-training"], "kind": "S", "pdf": "https://arxiv.org/pdf/2607.14236v3", "ps": 2, "b": 148, "talk": "S4", "tier": "S", "why": "Force injection for VLA post-training", "top": ["Perception & vision", "VLA testing", "Training frontier", "Dexterous/contact-rich"], "sum": "Vision-based pretrained policies can fail in contact-rich manipulation when occlusion, depth ambiguity or small force errors push execution off the demonstration distribution. LIFT adds a force-reactive action module using recent 6D end-effector forces, plus an online imitation loop learning from human-corrected rollouts. It learns faster and ends higher than vision-only DAgger on towel folding, book insertion and ring placement; no numbers given."}, {"id": "r8MOxo93Mv", "t": "Noise-Invariant Spatial Encoding for 3D Manipulation Policies under Depth Corruption", "a": "Zhiyuan Yang; Jiaju He; Ruiteng Zhao; Anqi Cheng; Haiyue Zhu; Kezhi Mao", "k": ["Multimodal perception, sensor fusion, and robot vision", "Learning representations for robotic perception and control", "Depth-sensor noise robustness, 3D manipulation policies"], "kind": "S", "pdf": "https://arxiv.org/pdf/2610.24674v1", "ps": 2, "b": 175, "talk": "S5", "tier": "S", "why": "3D policies robust to depth corruption — perception robustness", "top": ["Perception & vision", "Policy eval & safety bounds"], "sum": "Depth cameras give noisy readings near transparent, reflective, thin or textureless objects, and 3D manipulation policies degrade sharply, even if trained on noisy depth. NISE adds multi-view self-supervision and a Gaussian 3D attention that models position uncertainty. It improves robustness in simulation and on real robots while keeping clean-depth performance. No specific numbers are given."}, {"id": "5cXsYqAjNs", "t": "NovaPlan: Zero-Shot Long-Horizon Manipulation via Closed-Loop Video Language Planning", "a": "Jiahui Fu; Junyu Nan; Lingfeng Sun; Hongyu Li; Jianing Qian; Yilun Du; Jennifer L. Barry; Kris Kitani; George Konidaris", "k": ["Robot foundation models and general-purpose knowledge systems", "Video models and latent world models for robot learning", "Robot manipulation", "Combination of planning and learning in robotics"], "kind": "P", "pdf": "https://arxiv.org/pdf/2602.20119v2", "ps": 1, "b": 132, "talk": "", "tier": "S", "why": "Closed-loop video-language planning", "top": ["VLA testing", "World models", "Long-horizon", "Planning & optimization", "Efficient/real-time"], "sum": "Zero-shot robot systems that combine vision-language models with video generators often make physically implausible plans whose errors compound over long tasks. NovaPlan has a VLM split tasks into steps and reject video plans that fail verification, converts accepted plans to actions with a hybrid flow representation, and recovers from failures with small non-grasping corrections such as fingertip pokes. It beats earlier zero-shot methods; no numbers are stated."}, {"id": "F4IB3mxHbO", "t": "NTR: Neural Token Reconstruction for Scene Token Bottleneck in End-to-End Driving", "a": "Jiahui Li; JIAWEI SUN; RenZixiang; Liu Ming; Jiamin Shi; Ruiteng Zhao; Zhiyang Liu; Liying LIU; Zuoguan Wang; Kaidi Yang", "k": ["Autonomous driving and flight", "Learning representations for robotic perception and control", "End-to-End Plannning"], "kind": "P", "pdf": "https://arxiv.org/pdf/2605.31116v1", "ps": 3, "b": 213, "talk": "", "tier": "", "why": "", "top": []}, {"id": "dKRgZYcdRV", "t": "Object-Centric Conditioning for Visuomotor Flow Matching", "a": "Jijie Li; Xu Yang; Junhong Zou; Chunhai Zhao; Chaoyang Zhao; Zhen Lei; Xiangyu Zhu", "k": ["Learning representations for robotic perception and control", "Robot manipulation"], "kind": "P", "pdf": "https://arxiv.org/pdf/2609.24155v2", "ps": 1, "b": 110, "talk": "", "tier": "", "why": "", "top": []}, {"id": "tAXtXe4Oqd", "t": "Object-Centric Residual RL for Zero-Shot Sim-to-Real VLA Enhancement", "a": "Kinam Kim; Namiko Saito; Heecheol Kim; Katsushi Ikeuchi; Jaegul Choo; Yasuyuki Matsushita", "k": ["Sim-to-real transfer", "Robot manipulation"], "kind": "P", "pdf": "https://arxiv.org/pdf/2606.18953v1", "ps": 3, "b": 65, "talk": "", "tier": "S", "why": "Residual RL sim-to-real", "top": ["VLA testing", "RL"], "sum": "VLA imitation policies often fail at precise contact, and residual RL fixes have trouble crossing the sim-to-real gap. The authors train a residual policy in simulation on object poses with added noise and dropout, and align simulated and real VLAs by replaying the same teleoperation demonstrations in simulation. On five real Franka Research 3 tasks, zero-shot success rose from 42% to 76%."}, {"id": "G6vrRbO3NE", "t": "Observe Before You Alert: Belief-State Driver Alerting with Vision–Language Models", "a": "Yuhang Wang; Lingyao Li; Hao Zhou", "k": ["Robot safety, alignment, and safe learning-based systems", "Autonomous driving and flight", "Driving Alert System", "Driving safety benchmark"], "kind": "P", "pdf": "", "ps": 3, "b": 216, "talk": "", "tier": "", "why": "", "top": []}, {"id": "NnFdATGR3L", "t": "ObstaDiff: Generalizable Diffusion Policy Learning via Obstacle-aware Representations", "a": "Jiawen Wang; Kevin Yao; M. Khalid Jawed", "k": ["Imitation learning (behavioral cloning, inverse RL)", "Learning representations for robotic perception and control", "Diffusion policy", "Obstacle-aware robot manipulation"], "kind": "P", "pdf": "https://arxiv.org/pdf/2609.10918v1", "ps": 2, "b": 83, "talk": "", "tier": "", "why": "", "top": []}, {"id": "oJTM5ysEeJ", "t": "OdorSpaces: Visual-Olfactory Embodied Navigation in 3D Environments", "a": "Changyeon Lee; Kelin Yu; Zheng Wei; Shuna Ni; Ruohan Gao", "k": ["Multimodal perception, sensor fusion, and robot vision", "Odor Navigation", "Smell Sensing"], "kind": "P", "pdf": "", "ps": 1, "b": 157, "talk": "", "tier": "", "why": "", "top": []}, {"id": "r27erS063s", "t": "OmniContact: Chaining Meta-Skills via Contact Flow for Generalizable Humanoid Loco-Manipulation", "a": "Runyi Yu; Xiaoyi Lin; Ji Ma; Yinhuai Wang; Koukou Luo; Jiahao Ji; Huayi Wang; Wenjia Wang; Runhan Zhang; Ping Tan; Ting Wu; Ruoli Dai; Qifeng Chen; Lei Han", "k": ["Reinforcement learning for physical robot control", "Combination of learning and planning in robotics", "Humanoid Loco-Manipulaton"], "kind": "P", "pdf": "https://arxiv.org/pdf/2606.26201v1", "ps": 2, "b": 192, "talk": "", "tier": "", "why": "", "top": []}, {"id": "PEWWDUL10X", "t": "OmniGuide: Universal Spatial Guidance Fields for Enhancing Generalist Robot Policies", "a": "Yunzhou Song; Long Le; Yong-Hyun Park; Jie Wang; Junyao Shi; Lingjie Liu; Jiatao Gu; Eric Eaton; Dinesh Jayaraman; Kostas Daniilidis", "k": ["Robot foundation models and general-purpose knowledge systems"], "kind": "P", "pdf": "", "ps": 1, "b": 32, "talk": "", "tier": "", "why": "", "top": []}, {"id": "vG6UymddY4", "t": "OmniTacTune: Policy-Agnostic Real-World RL for Tactile Residual Adaptation of Visual Policies", "a": "Kelin Yu; Haode Zhang; Harish Ravichandar; Yunhai Han; Ruohan Gao", "k": ["Multimodal perception, sensor fusion, and robot vision", "Reinforcement learning for physical robot control", "Real-world RL", "Learn from Human"], "kind": "P", "pdf": "https://arxiv.org/pdf/2607.03723v1", "ps": 2, "b": 150, "talk": "", "tier": "S", "why": "Tactile residual RL", "top": ["Perception & vision", "Dexterous/contact-rich", "RL"], "sum": "Visual robot policies often fail at contact-rich tasks because they lack touch information, and tactile data is costly and hard to transfer. OmniTacTune first learns tactile awareness from autonomous rollouts of a base policy
