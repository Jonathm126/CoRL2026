g; Shanghang Zhang", "k": ["Multimodal perception, sensor fusion, and robot vision", "Imitation learning (behavioral cloning, inverse RL)", "Tactile VLA", "Dexterous Manipulation"], "kind": "P", "pdf": "https://arxiv.org/pdf/2609.09119v1", "ps": 2, "b": 159, "talk": "", "tier": "", "why": "", "top": []}, {"id": "PNSqN6Bng7", "t": "Decision-Centric Counterfactual Preference Optimization for Vision-Language-Action Post-Training", "a": "Maocheng Bai; YangJiang; LiaoDaLei; Shengrong Li; WangLin; ShuaihaoWu; Jiashuo Bai", "k": ["Robot foundation models and general-purpose knowledge systems", "Video models and latent world models for robot learning", "Vision-language-action policy optimization", "Counterfactual preference learning for robot manipulation"], "kind": "P", "pdf": "", "ps": 1, "b": 93, "talk": "", "tier": "", "why": "", "top": []}, {"id": "BV0T1o1ZIL", "t": "Demystifying When and Why VLAs Fail in Contact-Rich Tasks and How to Fix Them", "a": "Carlota Parés Morlans; Nils Kuhn; Y. Isabel Liu; Alberta Longhini; Jeannette Bohg", "k": ["Robot manipulation", "Multimodal perception, sensor fusion, and robot vision, contact-rich manipulation, vision-language-action models"], "kind": "S", "pdf": "https://arxiv.org/pdf/2608.01402v2", "ps": 2, "b": 166, "talk": "S4", "tier": "M", "why": "Why VLAs fail in contact-rich tasks and how to fix — eval + contact", "top": ["Perception & vision", "VLA testing", "Dexterous/contact-rich"], "sum": "The paper studies why vision-language-action models fail at contact-rich manipulation. It finds two causes: a training mismatch in flow-matching policies and the odd structure of force signals. A targeted fix for each, combined as FACT, reached 66% average success over about 2,500 real-world rollouts on five tasks, versus 41% for the best prior baseline."}, {"id": "xombt7ofur", "t": "DepthWorld: 3D World Model for Robot Manipulation", "a": "Jai Bardhan; Josef Sivic; Vladimir Petrik", "k": ["Video models and latent world models for robot learning, 3D World Models"], "kind": "P", "pdf": "https://arxiv.org/pdf/2610.08780v1", "ps": 3, "b": 24, "talk": "", "tier": "S", "why": "3D world model for manipulation", "top": ["Perception & vision", "World models"], "sum": "Video-based robot world models trained on RGB alone produce frames that are not consistent in 3D. The authors build DROID-3D, a calibrated dataset with dense metric depth, and train DepthWorld, a Stable Video Diffusion model predicting multi-view RGB and depth with a frozen VAE. Adding depth supervision improves RGB prediction by 1.48 dB PSNR over an RGB-only baseline at equal training budget."}, {"id": "yMD1ykviND", "t": "DeTac: Dual-branch Decoupling of Texture and Force Signals in Vision-Based Tactile Sensors", "a": "Zhirui Zhang; Yunkai Tang; Jiahang Li; Fan Fei; Jinnuo Zhang; Kairan Ding; Jieji Ren; Yandong Guo; Boxin Shi", "k": ["Multimodal perception, sensor fusion, and robot vision"], "kind": "S", "pdf": "https://arxiv.org/pdf/2610.16463v1", "ps": 2, "b": 156, "talk": "S4", "tier": "", "why": "", "top": [], "sum": "Marker-based tactile sensors mix surface texture and contact force in one image, and earlier mask-and-inpaint separation methods suffer from mask sizing, error accumulation, and no real paired training data. DeTac is a two-branch generative model that produces separate clean shading and marker images from one mixed input, with whole-image synthesis and mutual supervision. It claims better decoupling, surface reconstruction, and force estimation, but gives no specific numbers."}, {"id": "suRtJLXVxI", "t": "Dex-X: Learning Visual-Tactile Dexterous Manipulation From Human Demonstration with Simulated Interaction", "a": "Ruoqu Chen; Feixiang Ruan; Liu Cao; Zihao Wang; Botian Xu; Shiqin Tong; Jiajun Liu; Wanli Xing; Kaifeng Zhang; Mengdi Xu", "k": ["Reinforcement learning for physical robot control", "Sim-to-real transfer"], "kind": "P", "pdf": "", "ps": 2, "b": 151, "talk": "", "tier": "", "why": "", "top": []}, {"id": "Qa1Uu7lc8n", "t": "Dex4D: Task-Agnostic Point Track Policy for Zero-Shot Dexterous Manipulation", "a": "Yuxuan Kuang; Sungjae Park; Katerina Fragkiadaki; Shubham Tulsiani", "k": ["Robot manipulation", "Reinforcement learning for physical robot control", "Dexterous Grasping and Manipulation", "Perception and Perceptual Learning"], "kind": "P", "pdf": "https://arxiv.org/pdf/2602.15828v2", "ps": 3, "b": 118, "talk": "", "tier": "", "why": "", "top": []}, {"id": "KDuIgyXUtd", "t": "DexFLEX: Contact-Aware Foundation Controller for Command-Guided Dexterity", "a": "Weikang Wan; Zeyu Lai; Jianyu Hou; Yuchen Zhou; Jiawei Fu; Henrik I Christensen; Hao Su", "k": ["Learning representations for robotic perception and control", "Robot manipulation", "Dexterous Manipulation", "Sim-to-Real"], "kind": "P", "pdf": "https://arxiv.org/pdf/2610.14372v1", "ps": 3, "b": 145, "talk": "", "tier": "", "why": "", "top": []}, {"id": "zMbOvWpUUw", "t": "DexHandover: Learning Bimanual Dexterous Handovers from Large-Scale Synthetic Data", "a": "Yulong Zhang; Jingfan Qing; Zhibin Li; Jianran Liu; Libin Liu", "k": ["Robot manipulation", "Robotic data generation"], "kind": "P", "pdf": "", "ps": 2, "b": 137, "talk": "", "tier": "", "why": "", "top": []}, {"id": "sIe2LX2HaF", "t": "DexNinja: Learning Robust Dexterous Cutting Policy with a Real-to-Sim-to-Real Data Engine", "a": "Haozhe Lou; Runyi Yang; Wanqi Zhong; Caiyun Liu; Yicheng Liu; Wenhao Liu; Wenlong Ma; Jiawei Xia; Kanzhi Wu; Danda Pani Paudel; Luc Van Gool; Hang Zhao; Yiming Li", "k": ["Robotic data generation", "Robot manipulation"], "kind": "P", "pdf": "https://arxiv.org/pdf/2610.17208v1", "ps": 3, "b": 117, "talk": "", "tier": "S", "why": "Robust cutting policy", "top": ["Dexterous/contact-rich"], "sum": "Learning food cutting from real trials is wasteful, and simulators often mismatch real physics. DexNinja reconstructs objects from real captures, randomizes physical parameters, and generates augmented dexterous episodes in a differentiable simulator with tactile and deformable cutting. With tens of real demos plus hundreds of augmented episodes, slicing success exceeds 60%, a gain of over 20% from augmentation, and it generalizes to unseen shapes."}, {"id": "MYYKl10JKD", "t": "DexRoam: Enabling Mobile Dexterous Manipulation from Egocentric Human Demonstrations", "a": "Rui Zhou; Yibo Yuan; Junkai Zhao; Fangyuan Zhao; Xiaoguang Zhao; Shanghang Zhang; Sirui Han", "k": ["Robot manipulation", "Imitation learning (behavioral cloning, inverse RL)"], "kind": "P", "pdf": "", "ps": 2, "b": 58, "talk": "", "tier": "", "why": "", "top": []}, {"id": "z5cgS0XgeK", "t": "Dexterity-BEV: Aligning 3D World and Actions for Generalizable Robot Policies Learning", "a": "Huayi Zhou; Wei Gao; Dekun Lu; Ruiji Liu; Zhanqi Zhang; Ziyang Zhang; Jian Chen; Wenlve Zhou; Sheng Xu; Shumin Li; Kangyi Guo; shichen Xu; Zixin Huang; Yongyi Su; Kui Jia", "k": ["Robot manipulation", "Learning representations for robotic perception and control, 3D VLA Models", "Spatial-Temporal Alignment"], "kind": "P", "pdf": "https://arxiv.org/pdf/2606.02274v2", "ps": 3, "b": 124, "talk": "", "tier": "", "why": "", "top": []}, {"id": "gQFYIM5dJy", "t": "Diagnosing Compositional Generalization in Sequential Robot Tasks", "a": "Yixiao Wang; Cheng-En Wu; Lingfeng Sun; Pengcheng Wang; Xiang Ji; Boyuan Liang; Guojian Zhan; Masayoshi Tomizuka", "k": ["Imitation learning (behavioral cloning, inverse RL)"], "kind": "S", "pdf": "https://arxiv.org/pdf/2607.29687v2", "ps": 1, "b": 115, "talk": "S1", "tier": "S", "why": "Diagnosing compositional generalization", "top": ["Policy eval & safety bounds", "RL"], "sum": "Sequential robot tasks need policies that recombine known instruction parts, but demonstrating every combination is too costly. The authors split the generalization gap into three types of shift to study when sparse training data suffices. Fine-tuning on one demonstration per task raised out-of-distribution success from 0.4% to 54.7%, suggesting failures come mainly from instruction steering, not missing skills."}, {"id": "4soIQrXqxj", "t": "DiffMorphGrasp: A Diffusion Framework Conditioned on Hand Morphology for Cross-Embodiment Grasp Generation", "a": "Zhiyuan Wu; Xiangyu Zhang; Zhuo Chen; Jiankang Deng; Rolandos Alexandros Potamias; Shan Luo", "k": ["Robot manipulation", "Learning representations for robotic perception and control", "Robot grasping", "Cross-embodiment"], "kind": "P", "pdf": "https://arxiv.org/pdf/2602.00915v2", "ps": 2, "b": 119, "talk": "", "tier": "", "why": "", "top": []}, {"id": "HbuX1Fe8bl", "t": "Diffusion ReRoll: Revisable Denoising for Robotic Sequential Prediction", "a": "Seonsoo Kim; Seongil Hong; Jun-Gill Kang", "k": ["Combination of learning and planning in robotics", "Imitation learning (behavioral cloning, inverse RL)", "Diffusion", "Sequential Prediction"], "kind": "S", "pdf": "https://arxiv.org/pdf/2607.19919v2", "ps": 1, "b": 112, "talk": "S2", "tier": "", "why": "", "top": [], "sum": "Diffusion-based sequence predictors for robots usually denoise in one pass, so parts of a plan cannot revise each other. Diffusion ReRoll re-noises only regions that reach a noise threshold while the rest keep denoising, letting them be refined with whole-horizon context. It raises average success 21% over Diffusion Forcing on OGBench PointMaze and AntMaze, and improves on Diffusion Policy by 56.5% on LIBERO-10."}, {"id": "VVdYxLGhxH", "t": "DIQL:Distributional Implicit Q Learning for Offline to Online Reinforcement Learning", "a": "Weiran Liao; C F Maximilian Nagy; Ge Li; Onur Celik; Hongyi Zhou; Andreas Loehr; Qian Wang; Longrui Chen; Yucheng Tang; Tao Chen; Gerhard Neumann", "k": ["Reinforcement learning for physical robot control", "Offline to Online Reinforcement Learning"], "kind": "P", "pdf": "", "ps": 1, "b": 86, "talk": "", "tier": "", "why": "", "top": []}, {"id": "14GtmKGuCf", "t": "Direct Action-Head Injection of A Grounded 3D Point Unlocks Spatial and Task Generalization", "a": "Shiang-Feng Tsai; Jin-Cheng Jhang; Yen-Ling Tai; Jia-Hong Lai; Shih-Yun Wong; KangTung-Hsu; Yi-Ting Chen; Min Sun", "k": ["Imitation learning (behavioral cloning, inverse RL)", "Vision-Language-Action Models"], "kind": "P", "pdf": "https://arxiv.org/pdf/2606.27663v2", "ps": 2, "b": 22, "talk": "", "tier": "", "why": "", "top": []}, {"id": "r2uaBmvWgH", "t": "DIRECT: When and Where Should You Allocate Test-Time Compute in Embodied Planners?", "a": "Jadelynn Dao; Milan Ganai; Yasmina Abukhadra; Ajay Sridhar; Mozhgan Nasr Azadani; Katie Z Luo; Clark Barrett; Jiajun Wu; Chelsea Finn; Marco Pavone", "k": ["Robot foundation models and general-purpose knowledge systems", "Hierarchical Embodied Planning", "Test-Time Compute"], "kind": "P", "pdf": "https://arxiv.org/pdf/2606.12402v2", "ps": 2, "b": 2, "talk": "", "tier": "", "why": "", "top": []}, {"id": "xL2eR7x00h", "t": "Discovering Control Symmetries via Transition Manifold Tangency", "a": "Myriam Schoenenberger; Kee-Eung Kim", "k": ["Learning representations for robotic perception and control", "Symmetry discovery"], "kind": "P", "pdf": "", "ps": 3, "b": 115, "talk": "", "tier": "", "why": "", "top": []}, {"id": "lorikYEkAx", "t": "DiscreteRTC: Discrete Diffusion Policies are Natural Asynchronous Executors", "a": "Pengcheng Wang; Kaiwen Hong; Chensheng Peng; Katherine Rose Driggs-Campbell; Masayoshi Tomizuka; Chenfeng Xu; Chen Tang", "k": ["Theoretical foundations of robot learning", "Imitation learning (behavioral cloning, inverse RL)"], "kind": "P", "pdf": "https://arxiv.org/pdf/2604.25050v3", "ps": 2, "b": 7, "talk": "", "tier": "S", "why": "Discrete diffusion async execution", "top": ["Training frontier", "RL", "Efficient/real-time"], "sum": "Pauses between action chunks hurt dynamic tasks, and real-time chunking for flow-matching policies needs inference-time corrections and extra compute. DiscreteRTC uses discrete diffusion policies that fill in masked tokens, so bridging chunks is built in. On a real hockey defense task it reports 65% higher success than flow-matching RTC, using about 0.7x the compute of generating from scratch."}, {"id": "XnIdgAtBX7", "t": "Disentangling Spurious Correlations in Vision-Language-Action Models via Predicting Domain-Invariant Latent Lookahead", "a": "Junghyun Kim; Ngseo Kim; Chungwoo Lee; Seoyeon Lee; Woo-Jeong Baek; Adam Zhou; Chip Huyen; Jun Ki Lee; Gi-Cheon Kang; Byoung-Tak Zhang", "k": ["Learning representations for robotic perception and control", "Video models and latent world models for robot learning", "Vision-Language-Action Models", "Shortcut Learning"], "kind": "P", "pdf": "https://arxiv.org/pdf/2609.37165v1", "ps": 1, "b": 23, "talk": "", "tier": "", "why": "", "top": []}, {"id": "TscNG5Wcwn", "t": "Diversity You Can Actually Measure: A Fast, Model-Free Diversity Metric for Robotics Datasets", "a": "Sreevardhan Sirigiri; Nathan Samuel de Lara; Christopher Agia; Florian Shkurti; Fabio Ramos", "k": ["Imitation learning (behavioral cloning, inverse RL)", "Data Diversity"], "kind": "O", "pdf": "https://arxiv.org/pdf/2603.11634v2", "ps": 1, "b": 199, "talk": "O3", "tier": "S", "why": "Oral: fast diversity metric for datasets", "top": ["RL", "Efficient/real-time"], "sum": "Measuring diversity in robot demonstration datasets is hard because trajectories vary in length and observations are high-dimensional. The authors extend entropy measures using a signature-kernel Gram matrix and introduce FAKTUAL, a model-free method that picks a fixed-size, highest-entropy subset of demonstrations. It beats random selection on downstream success in simulated and real tasks at much lower compute cost than recent curation methods."}, {"id": "sitHOFsi2x", "t": "Do as I Do: Dexterous Manipulation Data from Everyday Human Videos", "a": "Bhawna Paliwal; Haritheja Etukuru; William Liang; Pieter Abbeel; Nur Muhammad Mahi Shafiullah; Jitendra Malik", "k": ["Robotic data generation", "Robot manipulation", "Dexterous manipulation", "Learning from human videos"], "kind": "P", "pdf": "https://arxiv.org/pdf/2606.19333v1", "ps": 3, "b": 51, "talk": "", "tier": "", "why": "", "top": []}, {"id": "dykg3Ed5Wy", "t": "Do Rigid-Body Simulators Dream of Soft Robots? Learning Contact-Rich Manipulation for Tendon-Driven Continuum Robots", "a": "Chengnan Shentu; Nicholas Baldassini; Tongjia Zheng; Priyanka Rao; Jessica Burgner-Kahrs", "k": ["Sim-to-real transfer", "Robot manipulation", "Soft robotics", "Simulation for Robot Learning"], "kind": "P", "pdf": "https://arxiv.org/pdf/2606.22397v1", "ps": 3, "b": 109, "talk": "", "tier": "S", "why": "Contact-rich learning for tendon-driven continuum robots — surgical-style kinematics", "top": ["Dexterous/contact-rich"], "sum": "Simulators for contact-rich manipulation with soft continuum robots are scarce. The authors model a tendon-driven continuum robot in MuJoCo, train imitation policies from simulated teleoperation, and deploy them without fine-tuning on a physical 3-segment robot mounted on a 7-DoF arm for two tasks. They claim this is the first such sim-to-real transfer; no numeric result is given."}, {"id": "ZyLuLA1Tsy", "t": "Don't Run with Scissors: Pruning Breaks VLA Models but They Can Be Recovered", "a": "Jason Jabbour; Dong-Ki Kim; Max Olan Smith; Jay Patrikar; Radhika Ghosal; Youhui Wang; Ali-akbar Agha-mohammadi; Vijay Janapa Reddi; Shayegan Omidshafiei", "k": ["Robot foundation models and general-purpose knowledge systems", "Robot systems, hardware, and sensors for learning", "Vision-Language-Action (VLA) Models", "Pruning"], "kind": "P", "pdf": "", "ps": 2, "b": 17, "talk": "", "tier": "S", "why": "Pruning breaks VLAs", "top": ["VLA testing", "Efficient/real-time"], "sum": "Pruning VLA models to fit small edge robots sharply cuts task success and raises safety violations. The authors explain this fragility with spectral analysis, then propose GLUESTICK, a training-free fix that adds a one-time corrective term, blending dense and pruned weights, to each pruned layer. It recovers up to 100% of task success, restores near-dense safety, saves up to 5 GB of memory and runs up to 1.75x faster."}, {"id": "LqUR3gxKdH", "t": "DreamStream: Towards Policy-Oriented Generative Simulation for End-to-End Driving", "a": "Ziyang Leng; Sicheng Mo; Seth Z. Zhao; Haoyuan Cai; Yu Zeng; Rowan Thomas McAllister; Bolei Zhou", "k": ["Autonomous driving and flight", "Video models and latent world models for robot learning"], "kind": "P", "pdf": "https://arxiv.org/pdf/2609.26792v1", "ps": 3, "b": 208, "talk": "", "tier": "", "why": "", "top": []}, {"id": "ZwUhb2fAWb", "t": "Drifting on Demand: A Profiled-Likelihood Transformer for Online Parameter Estimation", "a": "Alex Matsumura; Jonathan Y.M. Goh", "k": ["Autonomous driving and flight", "Model-based and model-free learning for robotic control", "Online parameter estimation", "Vehicle dynamics"], "kind": "P", "pdf": "", "ps": 3, "b": 111, "talk": "", "tier": "", "why": "", "top": []}, {"id": "B7gccZTJyE", "t": "DriveMA: Driving Vision-Language-Action Models with verifiable Meta-Actions", "a": "Weicheng Zheng; Yixin Huang; Qiao Sun; Derun Li; Hang Zhao", "k": ["Autonomous driving and flight"], "kind": "P", "pdf": "https://arxiv.org/pdf/2605.31271v2", "ps": 3, "b": 211, "talk": "", "tier": "", "why": "", "top": []}, {"id": "9ccdcInkM9", "t": "DriveMLP: When Training Strategy Outperforms Model Complexity in Autonomous Driving", "a": "Alessandro Canevaro; Julian Schmidt; Hang Yu; Ye Jin; Sajad Marvi; Georg Martius; Julian Jordan", "k": ["Autonomous driving and flight", "Imitation learning (behavioral cloning, inverse RL)", "Demonstration-based Reinforcement Learning", "Ego-vehicle planning"], "kind": "P", "pdf": "https://arxiv.org/pdf/2610.29676v1", "ps": 3, "b": 209, "talk": "", "tier": "", "why": "", "top": []}, {"id": "fHzDEYENPF", "t": "Driving, Fast or Slow? Neuro-Symbolic Guidance for Motion Prediction in Multi-Modal Ground Mobility", "a": "Simon Kohaut; Felix Divo; Julius Hahnewald; Benedict Flade; Julian Eggert; Kristian Kersting; Devendra Singh Dhami", "k": ["Robot safety, alignment, and safe learning-based systems", "Probabilistic learning and uncertainty in robotics", "Motion Forecasting", "Neuro-Symbolic Systems"], "kind": "O", "pdf": "https://arxiv.org/pdf/2606.15251v2", "ps": 2, "b": 218, "talk": "O4", "tier": "", "why": "", "top": [], "sum": "Motion predictors for mixed traffic (pedestrians, bikes, cars, trucks) are mostly black boxes that ignore explicit traffic rules. TraCS adds probabilistic first-order logic to existing predictors, converts plain-language regulations into logic automatically, and uses a learned confidence score to limit the logic when it may be wrong. It improves on strong backbones on Argoverse 2, with no exact number stated."}, {"id": "X2mRYIgshj", "t": "DualSpace-VLA: Coupling Cartesian-Space Motion Intent with Joint-Space Execution in Vision-Language-Action Policies", "a": "Yanan Hao; Wenjiang Xu; Pengfei Yi; Wanting Li; Yaxiong Wu", "k": ["Learning representations for robotic perception and control", "Robot manipulation", "Vision-Language-Action Models", "Action Space Design"], "kind": "P", "pdf": "", "ps": 1, "b": 5, "talk": "", "tier": "", "why": "", "top": []}, {"id": "OckqYiY2QM", "t": "EagleVLA: Towards Onboard Real-Time Robot Control via Foresight-Aligned Asynchronous Inference", "a": "Zebin Yang; Qi Wang; Yunhe Wang; Xiurui Guo; Bo Yu; Shaoshan Liu; Jiafeng Xu; Hao Dong; Meng Li", "k": ["Robot systems, hardware, and sensors for learning", "Robot manipulation", "VLA Asynchronous Inference", "Low-power Edge Computing"], "kind": "S", "pdf": "https://arxiv.org/pdf/2607.12659v6", "ps": 1, "b": 60, "talk": "S2", "tier": "S", "why": "Onboard real-time VLA", "top": ["VLA testing", "Efficient/real-time"], "sum": "VLA models are too heavy for low-power onboard hardware, and asynchronous inference causes perception-execution misalignment. EagleVLA predicts future environment representations so the action model plans for a later step, adds confidence-based scheduling, and uses a llama.cpp-based engine. On a Jetson Orin it gets 9.85x and 6.19x higher control frequency than PyTorch and vla.cpp, and beats VLASH by 14.8 percent on LIBERO."}, {"id": "eioQ9vJ6Oj", "t": "Echo in the Steps: Learning Perceptive Humanoid Parkour with Gated Memory", "a": "Ming-Ju Lee; Zizhuo Wang; Shaoting Zhu; Haozhe Lou; Hang Zhao; Yiming Li", "k": ["Robot navigation and locomotion"], "kind": "P", "pdf": "https://arxiv.org/pdf/2609.28960v1", "ps": 3, "b": 162, "talk": "", "tier": "", "why": "", "top": []}, {"id": "QGzgVP8RnK", "t": "Efficient and Reliable Teleoperation through Real-to-Sim-to-Real Shared Autonomy", "a": "Shuo Sha; Yixuan Wang; Binghao Huang; Antonio Loquercio; Yunzhu Li", "k": ["Imitation learning (behavioral cloning, inverse RL)", "Human-robot interaction and natural language instruction", "Shared Autonomy", "Real-to-Sim-to-Real"], "kind": "S", "pdf": "https://arxiv.org/pdf/2603.17016v2", "ps": 2, "b": 56, "talk": "S3", "tier": "S", "why": "Reliable teleoperation via real-to-sim-to-real shared autonomy — teleop/shared autonomy", "top": ["RL", "Efficient/real-time"], "sum": "Fine contact-rich teleoperation is slow and error-prone. The authors fit a simple nearest-neighbor operator model from under five minutes of real data, use it in simulation to train a residual copilot policy with reinforcement learning, then deploy it on tasks like nut threading and peg insertion. It reportedly helps novices succeed and experienced operators work faster; no specific numbers are given."}, {"id": "c7BvD59RpP", "t": "Efficient On-policy Visual-RL via Stochastic Decoupled Policy Gradient", "a": "Haoxiang You; Yilang Liu; Davis Zong; Qian Wang; Teeratham Vitchutripop; Qi Wang; Daniel Rakita; Ian Abraham", "k": ["Reinforcement learning for physical robot control", "Benchmarks and datasets for robot learning", "Visual RL", "Perceptive Humanoid Locomotion"], "kind": "P", "pdf": "https://arxiv.org/pdf/2605.26478v1", "ps": 3, "b": 61, "talk": "", "tier": "", "why": "", "top": []}, {"id": "JV472m0zgq", "t": "Ego2Robot: Scalable Robot Data Synthesis from Egocentric Human Data", "a": "Ye Wang; Pei Lin; Xiong-Hui Chen; Haoqi Yuan; Zhixuan Liang; Yiyang Huang; Anzhe Chen; Zixing Lei; Jie Zhang; Tao Zhang; Haoyang Li; Tong Zhang; Chenxi Xiao; Ziyuan Jiao; Qin Jin", "k": ["Robotic data generation", "Imitation learning (behavioral cloning, inverse RL)", "Ego2robot", "Egocentric Data"], "kind": "S", "pdf": "https://arxiv.org/pdf/2608.02580v1", "ps": 2, "b": 55, "talk": "S3", "tier": "", "why": "", "top": [], "sum": "Generalizable manipulation policies need large, varied demonstrations, and it was unclear whether retargeted egocentric human video could help pretrain vision-language-action models at scale. Ego2Robot converts human videos into robot data through action retargeting, robot-arm visual synthesis, and multi-level quality filtering, yielding 18,561 hours across 15 robot morphologies. Joint pretraining with real robot data reportedly improves out-of-distribution performance; no specific figures are given."}, {"id": "drlpFld34L", "t": "EgoEngine: From Egocentric Human Videos to High-Fidelity Dexterous Robot Demonstrations", "a": "Yangcen Liu; Shuo Cheng; Xinchen Yin; Woo Chul Shin; Alfred Cueva; Yiran Yang; Zhenyang Chen; Chuye Zhang; Danfei Xu", "k": ["Imitation learning (behavioral cloning, inverse RL)", "Robotic data generation", "Dexterous Manipulation"], "kind": "P", "pdf": "https://arxiv.org/pdf/2606.12604v1", "ps": 2, "b": 57, "talk": "", "tier": "", "why": "", "top": []}, {"id": "TmKLynfHXr", "t": "EgoHTR: Egocentric 4D Demonstrations of Human Terrain Traversal", "a": "Alex Brandes; Haig Conti Georges Sajelian; Manthan Patel; Dominik Hollidt; Chenhao Li; Matthias Heyrman; Oliver Hausdörfer; Manuel Kaufmann; Xi Wang; Jonas Frey; Angela P. Schoellig; Christian Holz; Marc Pollefeys; Marco Hutter", "k": ["Benchmarks and datasets for robot learning", "Reinforcement learning for physical robot control"], "kind": "P", "pdf": "https://arxiv.org/pdf/2607.13472v1", "ps": 3, "b": 164, "talk": "", "tier": "", "why": "", "top": []}, {"id": "WF4X17Al2r", "t": "EgoScale: Scaling Dexterous Manipulation with Diverse Egocentric Human Data", "a": "Ruijie Zheng; Dantong Niu; Yuqi Xie; Jing Wang; Mengda Xu; Yunfan Jiang; Fernando Castañeda; Fengyuan Hu; You Liang Tan; Letian Fu; Trevor Darrell; Furong Huang; Yuke Zhu; Danfei Xu; Linxi Fan", "k": ["Robot foundation models and general-purpose knowledge systems", "Robot manipulation"], "kind": "O", "pdf": "https://arxiv.org/pdf/2602.16710v1", "ps": 2, "b": 54, "talk": "O5", "tier": "", "why": "", "top": [], "sum": "EgoScale asks whether large-scale human video can help robots learn fine dexterous manipulation. It pretrains a vision-language-action model on about 20,854 hours of action-annotated egocentric human video, then fine-tunes with a small stage of aligned human-robot data. On a 22-degree-of-freedom robotic hand, the final policy raises average success rate by 54% over a baseline without human pretraining."}, {"id": "EfkPQTtjky", "t": "EgoWAM: World Action Models Beyond Pixels with In-the-Wild Egocentric Human Data", "a": "Baoyu Li; Xinchen Yin; Mengying Lin; Yixin Zhang; Danfei Xu", "k": ["Video models and latent world models for robot learning", "Imitation learning (behavioral cloning, inverse RL)", "Learning from Human Data", "Robot Manipulation"], "kind": "P", "pdf": "https://arxiv.org/pdf/2607.08436v2", "ps": 2, "b": 62, "talk": "", "tier": "", "why": "", "top": []}, {"id": "iy5oCeLdEF", "t": "ELA: End-to-End Latent Action Policy Learning from Video Demonstrations", "a": "Cheng-Chun Hsu; Peter Stone", "k": ["Video models and latent world models for robot learning", "Imitation learning (behavioral cloning, inverse RL)", "Latent Action Modeling", "Learning from Videos"], "kind": "P", "pdf": "", "ps": 1, "b": 16, "talk": "", "tier": "", "why": "", "top": []}, {"id": "6BQ9NdqznS", "t": "ELAN4D: Embodiment-Centric 4D Supervision for Vision-Language-Action Models via Plug-and-Play Adaptation", "a": "Zeyuan He; Bowen Yang; Zhirui Fang; Keru Zhou; Lei Jiang; Jingjing Qian; Fan Mo; Junchi Yan; Philip Torr; Xiu Li; Li Jiang; Jialin Yu", "k": ["Robot manipulation", "Imitation learning (behavioral cloning, inverse RL)", "Vision-Language-Action models, 4D prediction"], "kind": "P", "pdf": "https://arxiv.org/pdf/2605.30484v2", "ps": 2, "b": 32, "talk": "", "tier": "", "why": "", "top": []}, {"id": "wXv81vB0Xt", "t": "ELASTIC: Efficiently Learning to Adaptively Scale Test-Time Compute for Generative Control Policies", "a": "Andrew Zou Li; Gokul Swamy; Yonatan Bisk; Andrea Bajcsy", "k": ["Combination of learning and planning in robotics", "Reinforcement learning for physical robot control", "Test-Time Scaling"], "kind": "P", "pdf": "https://arxiv.org/pdf/2606.31132v1", "ps": 2, "b": 3, "talk": "", "tier": "S", "why": "Adaptive test-time compute", "top": ["Training frontier", "Dexterous/contact-rich", "Planning & optimization", "RL", "Deformable", "Efficient/real-time"], "sum": "It is hard to decide how to split test-time compute between more denoising steps and more sampled candidate actions. ELASTIC trains a reinforcement learning meta-policy over a frozen robot policy that picks steps and parallel samples at each denoising step. It beats fixed scaling baselines at equal compute in simulation, and on a real pi-0.5 task matches best-of-10 success with 34% lower latency."}, {"id": "2Z8xQxrlsY", "t": "EmbodiSteer: Steering Embodiment-Agnostic Visuomotor Policies with Joint-Space Guidance for Zero-Shot Cross-Embodiment Deployment", "a": "Shihefeng Wang; Kangchen Lv; Mingrui Yu; Xiang Li", "k": ["Robot manipulation", "Imitation learning (behavioral cloning, inverse RL)", "Cross-Embodiment Deployment", "Whole-Body Collision Avoidance"], "kind": "S", "pdf": "https://arxiv.org/pdf/2606.12965v2", "ps": 1, "b": 65, "talk": "S1", "tier": "", "why": "", "top": [], "sum": "Cartesian end-effector control lets one policy serve many robots but ignores arm geometry, causing collisions in tight spaces. EmbodiSteer is a training-free method that guides diffusion sampling in the target robot's joint space, applying collision-aware corrections at each denoising step. Across nine simulated robots, it cut collisions by 46.1 percentage points and raised task success by 28.5 points versus Cartesian-only execution."}, {"id": "XY8QpMSxvq", "t": "Emergent Control via Prior-Based Free Energy Minimization", "a": "Manish Kolachalam; Rani Malhotra", "k": ["Model-based and model-free learning for robotic control"], "kind": "S", "pdf": "", "ps": 3, "b": 72, "talk": "S6", "tier": "", "why": "", "top": []}, {"id": "nzYChkCtvT", "t": "Enabling Robust Cloth Manipulation via Inference-Time Simulator-in-the-Loop Refinement", "a": "Xin Liu; Yulin Li; Ziming Li; Pengyu Jing; Zhenhao Huang; Bingyang Zhou; Ziqiu Zeng; Siyuan Luo; Chenkun Qi; Fan Shi", "k": ["Robot manipulation", "Combination of learning and planning in robotics", "Deformable Object Manipulation", "Simulator-in-the-Loop Optimization"], "kind": "S", "pdf": "https://arxiv.org/pdf/2606.24552v2", "ps": 2, "b": 48, "talk": "S5", "tier": "S", "why": "Cloth via sim-in-the-loop", "top": ["Planning & optimization", "Deformable"], "sum": "Cloth manipulation is hard because fabric is difficult to model and track, and simulator-based refinement has mostly worked for rigid objects. The authors use the FLASH deformable simulator at inference time to test many action sequences in parallel. A real-to-sim module trained on synthetic data estimates cloth state from one RGB image, and a planner refines a pretrained policy's actions. Real-robot success exceeds baselines; no figures are given."}, {"id": "NZrwlgnR4X", "t": "Energy-Based Policy Orchestration", "a": "Weirui Ye; Yen-Jen Wang; Elvis Hsieh; Zhiyang Dou; Shibo Zhao; Pieter Abbeel; Yilun Du; Leslie Pack Kaelbling; Tomás Lozano-Pérez", "k": ["Combination of learning and planning in robotics", "Robot manipulation"], "kind": "P", "pdf": "", "ps": 1, "b": 225, "talk": "", "tier": "", "why": "", "top": []}, {"id": "E5lvpA2Glx", "t": "Enhancing Robotic Control Robustness through Generative Visual Model", "a": "Zhehao Dong; Xiaofeng Wang; Zheng Zhu; Yirui Wang; Yang Wang; YuKun Zhou; Boyuan Wang; Chaojun Ni; Runqi Ouyang; Wenkang Qin; Xinze Chen; Yun Ye; Guan Huang; Zhen Lu; Yue Yang", "k": ["Robotic data generation", "Sim-to-real transfer"], "kind": "P", "pdf": "https://arxiv.org/pdf/2509.22407v3", "ps": 3, "b": 23, "talk": "", "tier": "", "why": "", "top": []}, {"id": "0cK9Wf9Eeq", "t": "ENPIRE: Agentic Robot Policy Self-Improvement in the Real World", "a": "Wenli Xiao; Jia Xie; Tonghe Zhang; Haotian Lin; Letian Fu; Haoru Xue; Jalen Lu; Yi Yang; Cunxi Dai; Zi Wang; Jimmy Wu; Guanzhi Wang; S. Shankar Sastry; Ken Goldberg; Linxi Fan; Yuke Zhu; Guanya Shi", "k": ["Robot foundation models and general-purpose knowledge systems", "Robot manipulation", "Autoresearch", "Coding Agent"], "kind": "P", "pdf": "https://arxiv.org/pdf/2606.19980v2", "ps": 1, "b": 202, "talk": "", "tier": "", "why": "", "top": []}, {"id": "40CsfPl2cq", "t": "Equivariant Visual-Tactile Diffusion Policy for Contact-Rich Manipulation", "a": "WONG Lik Hang Kenny; Yiyao Ma; Xiu-Shen Wei; Zelong Tan; Zhuheng Song; Dongsheng Xie; Kai Chen; Qi Dou", "k": ["Learning representations for robotic perception and control"], "kind": "P", "pdf": "https://arxiv.org/pdf/2610.03333v1", "ps": 3, "b": 142, "talk": "", "tier": "S", "why": "Equivariant visuo-tactile diffusion", "top": ["Perception & vision", "Training frontier", "Dexterous/contact-rich"], "sum": "Contact-rich manipulation needs costly expert demonstrations, so sample efficiency matters. VISTA is a visuotactile diffusion policy that maps visual and tactile inputs onto spherical tokens, fuses touch into the visual directions, and rotates the fused representation by gripper orientation to keep actions spatially consistent. It improves data efficiency over strong baselines in simulation and real experiments; no figures are given."}, {"id": "jAbjN3n1jr", "t": "ESCAPE: Egocentric Sensing for Collision Avoidance and Policy Execution", "a": "Weiqing Shen; Wenhao Huang; Baokang Zhang; Shuo Shang; Yanmiao Hu; Haojun Li; Yifan Han; Wenzhao Lian", "k": ["Combination of learning and planning in robotics", "Sim-to-real transfer"], "kind": "P", "pdf": "https://arxiv.org/pdf/2610.23943v1", "ps": 1, "b": 209, "talk": "", "tier": "", "why": "", "top": []}, {"id": "8FGH4qAdNB", "t": "EventVLA: Event-Driven Visual Evidence Memory for Long-Horizon Vision-Language-Action Policies", "a": "Ganlin Yang; Zhangzheng Tu; Yuqiang Yang; Sitong Mao; Junyi Dong; Tianxing Chen; Jiaqi Peng; Jing Xiong; Jiafei Cao; Jifeng Dai; Wengang Zhou; Yao Mu; Tai Wang", "k": ["Robot foundation models and general-purpose knowledge systems", "Robot manipulation", "Memory-requiring Robotic Manipulation", "Robotic Benchmark"], "kind": "P", "pdf": "https://arxiv.org/pdf/2606.20092v3", "ps": 1, "b": 40, "talk": "", "tier": "", "why": "", "top": []}, {"id": "oMvcKDFLRA", "t": "EvoDrive: Pareto Evolution for Safety-Critical Autonomous Driving via Self-Improving LLM Agents", "a": "Tong Nie; Yuewen Mei; Yihong Tang; Junlin He; Jie Deng; Jian Sun; Wei Ma", "k": ["Autonomous driving and flight", "Policy evaluation, adversarial scenarios generation, and red teaming"], "kind": "P", "pdf": "https://arxiv.org/pdf/2606.03678v2", "ps": 3, "b": 218, "talk": "", "tier": "", "why": "", "top": []}, {"id": "qF26obIUEX", "t": "EVOLVE: Egocentric Vision-based  Humanoid Loco-Manipulation via Demonstration Editing", "a": "Feiyang Xie; Yuhui Fu; Haoqi Yuan; Zongqing Lu", "k": ["Robot manipulation", "Reinforcement learning for physical robot control", "Humanoid Robot"], "kind": "P", "pdf": "", "ps": 2, "b": 191, "talk": "", "tier": "", "why": "", "top": []}, {"id": "HeUmGQaw3M", "t": "EvoPlan: Evolutionary Neuro-Symbolic Robot Planning with Spatio-Temporal Guarantees", "a": "Bhavya Sai Nukapotula; Samin Moosavi; Haoze Wang; Luke Duncan; Diya Shakkottai; Varun Murali; Srinivas Shakkottai", "k": ["Task and motion planning", "Robot safety, alignment, and safe learning-based systems", "Neuro-symbolic planning", "Spatio-temporal guarantees"], "kind": "P", "pdf": "https://arxiv.org/pdf/2607.06724v1", "ps": 1, "b": 223, "talk": "", "tier": "", "why": "", "top": []}, {"id": "QFFjW11NYa", "t": "ExecGap: Exploiting Command-Execution Gap for Patch Attacks on Vision-Language-Action Models", "a": "Keke Tang; Guolin Qiu; Tianyu Hao; Daizong Liu; Yikai Zhang; Peican Zhu; Zhihong Tian", "k": ["Policy evaluation, adversarial scenarios generation, and red teaming", "Robot safety, alignment, and safe learning-based systems"], "kind": "P", "pdf": "", "ps": 2, "b": 99, "talk": "", "tier": "S", "why": "Patch attacks on VLAs via command-execution gap — adversarial testing", "top": ["Motion control & safety", "Policy eval & safety bounds", "VLA testing"]}, {"id": "gk8bvFSZq3", "t": "ExpertGen: Scalable Sim-to-Real Expert Policy Learning from Imperfect Behavior Priors", "a": "Zifan Xu; Ran Gong; Maria Vittoria Minniti; Kausik Sivakumar; Ahmet Salih Gundogdu; Eric Rosen; Riedana Yan; Tushar Kusnur; Zixing Wang; Di Deng; Peter Stone; Xiaohan Zhang; Karl Schmeckpeper", "k": ["Robotic data generation", "Reinforcement learning for physical robot control", "Offline-to-online reinforcement learning"], "kind": "P", "pdf": "https://arxiv.org/pdf/2603.15956v4", "ps": 3, "b": 85, "talk": "", "tier": "", "why": "", "top": []}, {"id": "W443fVglzC", "t": "Explore Where It Matters: Targeted Exploration for Efficient Rover Adaptation", "a": "Jacob Levy; Arthur Bouton; Tristan D. Hasseler; Hari Nayar; David Fridovich-Keil", "k": ["Sim-to-real transfer", "Model-based and model-free learning for robotic control", "Online Adaptation", "Targeted Exploration"], "kind": "P", "pdf": "", "ps": 1, "b": 108, "talk": "", "tier": "", "why": "", "top": []}, {"id": "PW8egEb2no", "t": "Exploring the Intrinsic Geometry of Diffusion Models with Constrained Inverse Kinematics", "a": "Phone Thiha Kyaw; Miguel Rogel-García; Jonathan Kelly", "k": ["Theoretical foundations of robot learning", "Learning representations for robotic perception and control", "Generative Models for Robotics", "Constrained Inverse Kinematics"], "kind": "P", "pdf": "https://arxiv.org/pdf/2606.26408v4", "ps": 1, "b": 217, "talk": "", "tier": "", "why": "", "top": []}, {"id": "U3Nmrhun8B", "t": "EXPO-FT: Sample-Efficient Reinforcement Learning Finetuning for Vision-Language-Action Models", "a": "Perry Dong; Kuo-Han Hung; Tian Gao; Dorsa Sadigh; Chelsea Finn", "k": ["Reinforcement learning for physical robot control"], "kind": "P", "pdf": "https://arxiv.org/pdf/2605.25477v2", "ps": 1, "b": 98, "talk": "", "tier": "S", "why": "RL fine-tuning for VLAs", "top": ["VLA testing", "Dexterous/contact-rich", "RL", "Efficient/real-time"], "sum": "Pretrained VLA policies generalize but are not reliable enough, and existing reinforcement learning either ignores pretrained knowledge or needs too many samples. EXPO-FT is a stable, sample-efficient RL finetuning system, tested on string-light routing, pool shots and flower insertion. It reached 30 of 30 successes on every task using an average of 19.1 minutes of online robot data."}, {"id": "X4i3kSa2kd", "t": "ExtremControl: Low-Latency Humanoid Teleoperation with Scaled Velocity Feedforward", "a": "Ziyan Xiong; Lixing Fang; Junyun Huang; Kashu Yamazaki; Hao Zhang; Chuang Gan", "k": ["Reinforcement learning for physical robot control"], "kind": "P", "pdf": "https://arxiv.org/pdf/2602.11321v4", "ps": 2, "b": 209, "talk": "", "tier": "", "why": "", "top": []}, {"id": "aILPNAxgHb", "t": "Eye, Robot: Learning Expressive Gaze Dynamics via a VLM-Guided Transformer-VAE", "a": "Yuhang Hu; Junlin Lyu; Yuan Fang; Xiaoying Shen; Lechen Zhang; Jiong Lin; Judah Goldfeder; Steven Tian; Hod Lipson", "k": ["Human-robot interaction and natural language instruction"], "kind": "P", "pdf": "https://arxiv.org/pdf/2610.19635v1", "ps": 1, "b": 80, "talk": "", "tier": "", "why": "", "top": []}, {"id": "iXJWieKME1", "t": "F2F-AP: Flow-to-Future Asynchronous Policy for Real-time Dynamic Manipulation", "a": "Haoyu Wei; Xiuwei Xu; Ziyang Cheng; Hang Yin; Angyuan Ma; Bingyao Yu; Jie Zhou; Jiwen Lu", "k": ["Imitation learning (behavioral cloning, inverse RL)", "Robot manipulation"], "kind": "P", "pdf": "https://arxiv.org/pdf/2604.02408v4", "ps": 2, "b": 10, "talk": "", "tier": "", "why": "", "top": []}, {"id": "CH33XUEIBO", "t": "FACA: Force-Aware Contact Adaptation for Task-Parameterized Robotic Assembly", "a": "Xing Hu; Xiangkang Zhao; Jinxin Liu; Runzhe Zhan; Naijin Liu", "k": ["Reinforcement learning for physical robot control", "Learning representations for robotic perception and control, world model, robot assembly"], "kind": "P", "pdf": "", "ps": 3, "b": 150, "talk": "", "tier": "S", "why": "Force-aware assembly", "top": ["Perception & vision", "World models", "Dexterous/contact-rich", "RL"]}, {"id": "YrNlVJcApO", "t": "FACT: Failure-Aware Causal Training for World-Action Models", "a": "Quanquan Peng; Yutong Liang; Rui Yan; Nicklas Hansen; Xiaolong Wang", "k": ["Robot foundation models and general-purpose knowledge systems", "Video models and latent world models for robot learning, robotic manipulation"], "kind": "P", "pdf": "https://arxiv.org/pdf/2608.10232v2", "ps": 3, "b": 4, "talk": "", "tier": "S", "why": "Failure-aware causal training", "top": ["Policy eval & safety bounds", "VLA testing", "World models", "Efficient/real-time"], "sum": "Many world-action models train their future prediction mostly on successful demonstrations, so they learn little about the results of bad actions. FACT is a causal model that predicts future video and task progress given the action actually taken, so failed rollouts can supervise training and optionally rank candidate actions. It beats many baselines on simulated and real bimanual tasks; no numbers are stated."}, {"id": "03zMMFkTXk", "t": "FACTR 2: Learning External Force Sensing for Commodity Robot Arms Improves Policy Learning", "a": "Steven Oh; Jason Jingzhou Liu; Tony Tao; Philip Han; Kenneth Shaw; Satoshi Funabashi; Ruslan Salakhutdinov; Deepak Pathak", "k": ["Imitation learning (behavioral cloning, inverse RL)", "Robot systems, hardware, and sensors for learning"], "kind": "O", "pdf": "https://arxiv.org/pdf/2606.12406v2", "ps": 2, "b": 155, "talk": "O6", "tier": "M", "why": "Oral: learned external force sensing on commodity arms — force without F/T sensor", "top": ["Dexterous/contact-rich", "RL"], "sum": "Many robot arms lack force sensors, which limits contact-rich manipulation. The authors present NEXT, a learned estimator of external joint torques that needs no force sensor, and FIRST, a training scheme that oversamples the moments just before and during contact. Across five long-horizon tasks, FIRST beats earlier force-aware policies by more than 17% in task progress."}, {"id": "mMRhLrwLFx", "t": "FADA: Few-Shot Domain Adaptation via Dynamics Alignment for Humanoid Control", "a": "Angchen Xie; Nikhil Sobanbabu; Ishayu Shikhare; Alan Wang; Max Simchowitz; Guanya Shi", "k": ["Model-based and model-free learning for robotic control", "Sim-to-real transfer", "Domain adaptation", "Humanoid control"], "kind": "P", "pdf": "https://arxiv.org/pdf/2606.28476v2", "ps": 3, "b": 179, "talk": "", "tier": "", "why": "", "top": []}, {"id": "7jMlaTLtAc", "t": "FAR: Failure-Aware Retry for Test-Time Recovery and Continual Policy Improvement", "a": "Haoran Hao; Shahram Najam Syed; Jeffrey Ichnowski; Jeff Schneider", "k": ["Robot manipulation", "Reinforcement learning for physical robot control", "Failure recovery", "Test-time adaptation"], "kind": "P", "pdf": "https://arxiv.org/pdf/2607.01111v2", "ps": 2, "b": 95, "talk": "", "tier": "S", "why": "Failure-aware retry", "top": ["Policy eval & safety bounds", "Dexterous/contact-rich", "RL"], "sum": "Deployed robot policies often fail, and plain retries repeat the same mistakes while many recovery methods need human help. Failure-Aware Retry uses preference learning on past failures and small action perturbations during retries, then adds successful recoveries to training data. It averages 17.6% higher success than a standard diffusion policy in simulation and 11.7% higher on real manipulation tasks."}, {"id": "1zYrrwoISV", "t": "FAWAM: Force-Aware World Action Models for Closed-Loop Contact-Rich Manipulation", "a": "Haotian He; zeyu yan; Qipeng Liu; Ning Guo; Wenzhao Lian", "k": ["Robot manipulation", "Video models and latent world models for robot learning, world action model with force, contact rich manipulation"], "kind": "P", "pdf": "https://arxiv.org/pdf/2606.08555v2", "ps": 2, "b": 145, "talk": "", "tier": "S", "why": "Force-aware world action models", "top": ["World models", "Dexterous/contact-rich"], "sum": "Most manipulation methods treat force sensing as just another input. FAWAM uses force at three stages: encoding recent force/torque readings to guide action generation, predicting future actions together with end-effector wrenches, and applying a real-time residual correction from force feedback. On real contact-rich tasks, it raised average success by 36.25% over vision-only baselines and 21.25% over existing force-aware ones."}, {"id": "QBAA8svAIK", "t": "FedGuide: Diffusion Prior Alignment and Value Baseline Guidance for Heterogeneous Federated Reinforcement Learning", "a": "Zhilin He; Gauri Joshi", "k": ["Reinforcement learning for physical robot control", "Probabilistic learning and uncertainty in robotics", "Federated Reinforcement Learning", "Diffusion Priors and Value-Guided Policy Learning"], "kind": "S", "pdf": "https://arxiv.org/pdf/2609.18964v3", "ps": 1, "b": 88, "talk": "S2", "tier": "", "why": "", "top": [], "sum": "Federated reinforcement learning usually shares policy or value parameters and does little about mismatched data distributions across clients. FedGuide gives each client a personalized diffusion model as a behavior prior, merges the priors with an optimal-transport mixture of experts, and adds a DICE-based value baseline to reduce variance in policy guidance. It reportedly beats representative methods on average return, final-round performance, and worst-round robustness, with no numbers stated."}, {"id": "yNHgrgATuY", "t": "FIBERTUNE: Preserving Action-Fiber Visual Residuals in Vision-Language-Action Fine-Tuning", "a": "Haihao Lin; Xiangsheng Huang; Xiao Yang; Weibang Zhou; Yiqi Zhang; Bo Yang; Simin Zeng; Jiawei Yang; Zhengyang Wang; Jiahui Du", "k": ["Learning representations for robotic perception and control", "Robot foundation models and general-purpose knowledge systems", "Vision-Language-Action Models", "Representation-Preserving Fine-Tuning"], "kind": "P", "pdf": "https://arxiv.org/pdf/2606.08653v4", "ps": 1, "b": 18, "talk": "", "tier": "", "why": "", "top": []}, {"id": "RAA96LpIxJ", "t": "FingerEye: Learning Dexterous Manipulation with Continuous Vision-Tactile Sensing", "a": "Zhixuan Xu; YICHEN LI; Wu Xuanye; Qiu Tianyu; Lin Shao", "k": ["Robot systems, hardware, and sensors for learning", "Robot manipulation"], "kind": "S", "pdf": "https://arxiv.org/pdf/2604.20689v4", "ps": 2, "b": 163, "talk": "S4", "tier": "", "why": "", "top": [], "sum": "FingerEye targets robotic hands that lose useful sensing once fingers touch an object. It combines fingertip stereo cameras with a compliant ring whose marker-tracked deformation stands in for contact force, and a policy that fuses inputs in groups to avoid over-relying on one sensor. Across seven contact-sensitive tasks in simulation and real life, mean success rose by more than 30 points over a wrist-camera-only policy."}, {"id": "PL6UDcy9Eu", "t": "FingerViP: Learning Real-World Dexterous Manipulation with Fingertip Visual Perception", "a": "Zhen Zhang; Weinan Wang; Hejia Sun; Qingpeng Ding; Xiangyu Chu; Guoxin Fang; Kwok Wai Samuel Au", "k": ["Robot manipulation", "Multimodal perception, sensor fusion, and robot vision"], "kind": "P", "pdf": "https://arxiv.org/pdf/2604.21331v3", "ps": 2, "b": 133, "talk": "", "tier": "", "why": "", "top": []}, {"id": "sdujBb3P4e", "t": "FlashDrive:  Flash Vision-Language-Action Inference Framework for Autonomous Driving", "a": "Zekai Li; Yihao Liang; Hongfei Zhang; Jian Chen; Yesheng Liang; Zhijian Liu", "k": ["Autonomous driving and flight", "Efficient Inference Framework"], "kind": "P", "pdf": "", "ps": 3, "b": 221, "talk": "", "tier": "", "why": "", "top": []}, {"id": "DBLXUxxslN", "t": "FlashRFCL: Demonstration-Efficient Sparse Reward RL via Reverse-Forward Curriculum Learning in High-Throughput GPU Simulation", "a": "Yong Woo Choi; Stone Tao; Henrik I Christensen", "k": ["Robot manipulation", "Model-based and model-free learning for robotic control"], "kind": "P", "pdf": "", "ps": 1, "b": 96, "talk": "", "tier": "", "why": "", "top": []}, {"id": "05nE8s5e7I", "t": "FlashVLA: Streaming Action Decoding for Fast and Asynchronous VLA Inference", "a": "Zekai Li; Jiaming Tang; Zhijian Liu", "k": ["Robot foundation models and general-purpose knowledge systems", "Imitation learning (behavioral cloning, inverse RL)", "Vision-Language-Action Model"], "kind": "P", "pdf": "https://arxiv.org/pdf/2608.27384v1", "ps": 2, "b": 8, "talk": "", "tier": "S", "why": "Streaming action decoding", "top": ["VLA testing", "RL", "Efficient/real-time"], "sum": "Flow-matching VLA models suffer from high latency and unstable asynchronous execution because each action needs several denoising steps. FlashVLA keeps a streaming buffer of action chunks at different noise levels, decoded with chunk-wise causal attention, so each inference step yields one executable chunk. It reaches a control frequency of at least 30 Hz on a single GPU with smooth real-world operation."}, {"id": "OJkazbkLtE", "t": "Flexible Language-Guided Representation Editing for Adaptive Robot Behavior", "a": "Audrey Lee; Nathaniel S. Dennler; Ilia Sucholutsky; Andreea Bobu", "k": ["Human-robot interaction and natural language instruction", "Learning representations for robotic perception and control"], "kind": "P", "pdf": "https://arxiv.org/pdf/2610.28893v1", "ps": 2, "b": 37, "talk": "", "tier": "", "why": "", "top": []}, {"id": "BWHjoo36Dr", "t": "Flow as Flow: Modeling Robot Velocity Fields as Probability Velocity Fields for Flow-Based Object Manipulation", "a": "Koki Seno; Daichi Yashima; Yusuke Takagi; Kento Tokura; Komei Sugiura", "k": ["Learning representations for robotic perception and control", "Video models and latent world models for robot learning", "Learning from human videos", "Flow matching"], "kind": "P", "pdf": "https://arxiv.org/pdf/2606.23090v3", "ps": 2, "b": 68, "talk": "", "tier": "", "why": "", "top": []}, {"id": "hSZ0lT7TCp", "t": "Flow Control: Steering Vision-Language-Action Models with Simple Real-Time Inputs", "a": "Jonathan C. Kao; Jason Chan; Andy Wang", "k": ["Human-robot interaction and natural language instruction", "Robot foundation models and general-purpose knowledge systems", "Policy steering", "Shared autonomy"], "kind": "P", "pdf": "https://arxiv.org/pdf/2606.10180v2", "ps": 2, "b": 14, "talk": "", "tier": "", "why": "", "top": []}, {"id": "acslhrig33", "t": "Flow Policy Gradients for Robot Control", "a": "Brent Yi; Hongsuk Choi; Himanshu Gaurav Singh; Xiaoyu Huang; Takara E. Truong; Carmelo Sferrazza; Yi Ma; Rocky Duan; Pieter Abbeel; Guanya Shi; Karen Liu; Angjoo Kanazawa", "k": ["Reinforcement learning for physical robot control"], "kind": "O", "pdf": "https://arxiv.org/pdf/2602.02481v2", "ps": 2, "b": 63, "talk": "O4", "tier": "S", "why": "Oral: flow policy gradients — RL for flow policies", "top": ["Dexterous/contact-rich", "RL"], "sum": "Most policy-training methods need action likelihoods, which limits policies to simple distributions such as Gaussians. The authors improve the objective for flow-matching policy gradients, which skip likelihood computation, so expressive policies can be trained or fine-tuned. They show results on legged locomotion, humanoid motion tracking and manipulation, with transfer to two real humanoids. No specific numbers are stated."}, {"id": "aspenN9eir", "t": "FlowDAgger: Human-in-the-Loop Adaptation of Generative Robot Policies in Latent Space", "a": "Michael Murray; Daphne Chen; Simran Bagaria; Dean Fortier; Tess Hellebrekers; Galen Mullins; Harshavardhan Reddy Gajarla; Oier Mees; Maya Cakmak; Andrey Kolobov", "k": ["Imitation learning (behavioral cloning, inverse RL)", "Robot foundation models and general-purpose knowledge systems", "Human-in-the-Loop Learning", "Generative Policies"], "kind": "S", "pdf": "https://arxiv.org/pdf/2607.08877v1", "ps": 2, "b": 29, "talk": "S3", "tier": "", "why": "", "top": [], "sum": "Pretrained generative robot policies fail in situations their data did not cover, and fixing this usually needs costly data collection or risky online reinforcement learning. FlowDAgger keeps the policy frozen, maps each human correction back to its originating noise, and trains a small latent policy to steer it. It beats supervised fine-tuning and latent-space RL, though no figures are given."}, {"id": "Wv9xF5Ii7L", "t": "FlowDPG: Deterministic Policy Gradient on Flow Matching Policies for Real-World Manipulation", "a": "Kexin Shi; Junyao Shi; Poorvi Hebbar; Zhuolun Zhao; Tarun Amarnath; Yifan Su; Shikhar Bahl; Deepak Pathak", "k": ["Robot manipulation", "Reinforcement learning for physical robot control"], "kind": "P", "pdf": "https://arxiv.org/pdf/2606.22303v2", "ps": 3, "b": 62, "talk": "", "tier": "", "why": "", "top": []}, {"id": "fTx97RpooW", "t": "FlowPRO: Reward-Free Fine-Tuning of Flow-Matching VLAs via Proximalized Preference Optimization", "a": "Yihao Wu; He Zhang; Junbo Tan; Xueqian Wang; Zhengyou Zhang", "k": ["Reinforcement learning for physical robot control"], "kind": "P", "pdf": "", "ps": 3, "b": 63, "talk": "", "tier": "", "why": "", "top": []}, {"id": "ZAdTLinUnd", "t": "FlowVLA: Enabling World Dynamics Understanding through Pluggable 3D Flow Learning", "a": "Junhyeong Go; Mingyu Jung; Woobin Im; Jongbin Ryu", "k": ["Learning representations for robotic perception and control", "Imitation learning (behavioral cloning, inverse RL)", "Motion-relevant 3D Dynamics, 3D Scene Understanding"], "kind": "P", "pdf": "https://arxiv.org/pdf/2610.16160v1", "ps": 1, "b": 2, "talk": "", "tier": "", "why": "", "top": []}, {"id": "42z4ov9nRQ", "t": "FM-VLA: Force-based Memory for Vision-Language-Action Models in Contact-Rich Manipulation", "a": "Ruicheng Li; Qixiu Li; Ruichun Ma; Yu Deng; Lin Luo; Zhiying Du; Jianfeng Xiang; Huizhi Liang; Ruicheng Wang; Jiaolong Yang; Baining Guo", "k": ["Robot manipulation", "Multimodal perception, sensor fusion, and robot vision", "Force-based Memory", "Vision-Language-Action Models"], "kind": "P", "pdf": "https://arxiv.org/pdf/2607.18231v1", "ps": 2, "b": 147, "talk": "", "tier": "S", "why": "Force memory for VLA", "top": ["Perception & vision", "VLA testing", "Dexterous/contact-rich", "Long-horizon"], "sum": "Vision-language-action models struggle with tasks depending on past events, and frame-based memory is costly and can confuse similar-looking moments like repeated button presses. FM-VLA compresses force sensor histories into compact memory tokens with a variational autoencoder and feeds them to the action module. On three memory-dependent tasks it exceeds 80% success with little extra inference cost."}, {"id": "AztNrTzNOf", "t": "Foci Policy: Focus on Object-Centric Interactions for Relational Manipulation Policies", "a": "Ze Fu; Pinhao Song; Yutong Hu; Renaud Detry", "k": ["Imitation learning (behavioral cloning, inverse RL)", "Learning representations for robotic perception and control", "Relational manipulation policy", "Object-object interaction"], "kind": "P", "pdf": "https://arxiv.org/pdf/2609.08743v1", "ps": 1, "b": 137, "talk": "", "tier": "", "why": "", "top": []}, {"id": "3M39Fmw8Mx", "t": "FocusVLA: Future-Intent Guided Dynamic View Routing for Vision-Language-Action Models", "a": "Huixin Xu; ziya yu; Peng Li", "k": ["Robot manipulation", "Learning representations for robotic perception and control", "Vison-Language-Action Models"], "kind": "P", "pdf": "", "ps": 1, "b": 4, "talk": "", "tier": "", "why": "", "top": []}, {"id": "JMcC5JoPKD", "t": "FoldNet++: a Large-Scale Synthetic Dataset for Robotic T-Shirt Folding and Unfolding", "a": "Yuxing Chen; Zhiyuan Wei; Bowen Xiao; Zhizheng Zhang; He Wang", "k": ["Robotic data generation", "Sim-to-real transfer", "Deformable object manipulation", "Datasets for robot learning"], "kind": "P", "pdf": "https://arxiv.org/pdf/2609.12433v1", "ps": 2, "b": 52, "talk": "", "tier": "", "why": "", "top": []}, {"id": "w2H90oEzfp", "t": "ForceBand: Learning Forceful Manipulation with sEMG", "a": "Botao He; Zhi Wang; Linna Kuang; Ishaan Ghosh; Jitendra Malik; Cornelia Fermuller; Tingfan Wu; Jiayuan Mao; Ruoshi Liu; Haozhi Qi; Yiannis Aloimonos", "k": ["Robot manipulation", "Robot systems, hardware, and sensors for learning", "Force-aware Learning from human"], "kind": "P", "pdf": "https://arxiv.org/pdf/2606.26093v1", "ps": 3, "b": 151, "talk": "", "tier": "", "why": "", "top": []}, {"id": "q1q252TIt0", "t": "FR-VLA: Implicit Force Reasoning VLA for Contact-Rich Manipulation", "a": "Jiaju He; Zhiyuan Yang; Ruyang Han; Jiahong Tang; Zhiping Lin; Haiyue Zhu", "k": ["Multimodal perception, sensor fusion, and robot vision", "Learning representations for robotic perception and control", "Force-aware VLA", "Contact-rich manipulation"], "kind": "P", "pdf": "https://arxiv.org/pdf/2610.25981v1", "ps": 2, "b": 146, "talk": "", "tier": "S", "why": "Implicit force reasoning VLA", "top": ["Perception & vision", "VLA testing", "Dexterous/contact-rich"], "sum": "Existing VLA models feed force sensor data through a fixed channel and cannot tell when force matters. FR-VLA adds a reasoning step with learned force query tokens that judges how relevant force is, then uses that to control a separate force pathway for generating actions. On five contact-rich real-world tasks across two robot platforms it scores best on average over six stages; the abstract gives no success rates."}, {"id": "FYlYM2c6Xc", "t": "Freeform Preference Learning for Robotic Manipulation", "a": "Marcel Torne; Anubha Mahajan; Abhijnya Bhat; Chelsea Finn", "k": ["Reinforcement learning for physical robot control", "Robot manipulation", "Preference Learning"], "kind": "P", "pdf": "https://arxiv.org/pdf/2606.32027v3", "ps": 3, "b": 57, "talk": "", "tier": "", "why": "", "top": []}, {"id": "uSrlwzdTIC", "t": "FreeLoc: Online Floorplan Localization via Diffusion-Aided Pose Refinement", "a": "Haocheng Peng; Boyang Zhou; Jiarui Hu; Xiyue Guo; Ziyang Zhang; Boming Zhao; Yifan Gao; Xiao Li; Hujun Bao; Zhaopeng Cui", "k": ["Multimodal perception, sensor fusion, and robot vision", "Robot navigation and locomotion", "Localization"], "kind": "P", "pdf": "https://arxiv.org/pdf/2610.05011v2", "ps": 1, "b": 179, "talk": "", "tier": "", "why": "", "top": []}, {"id": "022K2ZIPR6", "t": "From Foundation VLM to Versatile Driving VLM: A Triplet Incremental Training Approach", "a": "Shengtao Wu; Zichao Dong; Weixuan Qiao; Xiaolu Liu; Xin Zhan; Junbo Chen; Jianke Zhu", "k": ["Multimodal perception, sensor fusion, and robot vision", "Autonomous driving and flight"], "kind": "P", "pdf": "", "ps": 3, "b": 220, "talk": "", "tier": "", "why": "", "top": []}, {"id": "hDNvcoKMXH", "t": "From Grasps to Dexterity: Large-Scale Grasp Pretraining for Dexterous Manipulation", "a": "Ying Yuan; Xinyu Liu; Sriram Krishna; David Held", "k": ["Robot manipulation", "Benchmarks and datasets for robot learning", "Dexterous Manipulation", "Grasp Pretraining"], "kind": "P", "pdf": "https://arxiv.org/pdf/2606.30749v1", "ps": 2, "b": 124, "talk": "", "tier": "", "why": "", "top": []}, {"id": "dkaxE3v6uu", "t": "From Imitation to Alignment: Human-Preference Flow Policies for Long-Horizon Sidewalk Navigation", "a": "Honglin He; Zhizheng Liu; Yukai Ma; Bolei Zhou", "k": ["Robot navigation and locomotion", "Robot safety, alignment, and safe learning-based systems"], "kind": "P", "pdf": "https://arxiv.org/pdf/2606.12603v1", "ps": 1, "b": 149, "talk": "", "tier": "", "why": "", "top": []}, {"id": "RwGNm8fUxX", "t": "From Region Arrival to Instance-Level Grounding in Vision-and-Language Navigation", "a": "Xiangyu Shi; Ruoxi Yang; Wei Tao; Jiwen Zhang; Yanyuan Qiao; Qi Wu", "k": ["Robot navigation and locomotion"], "kind": "S", "pdf": "https://arxiv.org/pdf/2607.03792v1", "ps": 3, "b": 205, "talk": "S8", "tier": "", "why": "", "top": [], "sum": "Vision-and-language navigation benchmarks count a stop within 3 meters of the goal as success, ignoring final orientation and target visibility, so agents can pass without truly grounding the object. REALM is a plug-in module that handles the final approach separately using visibility-aware stopping, released with REVERIE-AIM, a dataset with instance-level goals and 180K short-horizon training samples. It shows consistent gains across four backbones, without specific numbers."}, {"id": "nBDd4rVq5Q", "t": "From Video Frames to Robot Meta-Frames: A Unified Latent Interface for World Action Models", "a": "Guoqiang Liang; Yiqi Lin; Yanzhe Chen; Kevin Yuchen Ma; Mike Zheng Shou", "k": ["Video models and latent world models for robot learning", "Robot foundation models and general-purpose knowledge systems", "World Action Model"], "kind": "P", "pdf": "", "ps": 3, "b": 10, "talk": "", "tier": "", "why": "", "top": []}, {"id": "mjvsJNQuFV", "t": "FT-WBC: Learning Fault-Tolerant Whole-Body Control for Legged Loco-Manipulation", "a": "Yudong Zhong; Pengfei MAI; Sikai Guo; Jiahang Cao; Zhihai Bi; Qiuyue LIU; Ziyan Feng; JINNI ZHOU; Jun Ma", "k": ["Robot safety, alignment, and safe learning-based systems", "Fault-Tolerant Control", "Whole-Body Control"], "kind": "P", "pdf": "https://arxiv.org/pdf/2606.24466v2", "ps": 2, "b": 214, "talk": "", "tier": "", "why": "", "top": []}, {"id": "xc8asDq7QI", "t": "FTP-1: A Generalist Foundation Tactile Policy Across Tactile Sensors for Contact-Rich Manipulation", "a": "Chengbo Yuan; Zicheng Zhang; Mingjie Zhou; Wendi Chen; Yi Wang; Zhuoyang Liu; Dantong Niu; Shuo Wang; Hui Zhang; Wenkang Zhang; Yingdong Hu; Yuanqing Gong; Wanli Xing; Chuan Wen; Cewu Lu; Kaifeng Zhang; Yang Gao", "k": ["Robot foundation models and general-purpose knowledge systems", "Learning representations for robotic perception and control", "Tactile Manipulation", "Generalist Policy"], "kind": "P", "pdf": "https://arxiv.org/pdf/2606.13102v3", "ps": 2, "b": 142, "talk": "", "tier": "", "why": "", "top": []}, {"id": "9gWuAC6Oum", "t": "Functional-SLAM: Interaction-Aware Mapping with Online Functional Scene Graphs", "a": "Xinggang Hu; Chenyangguang Zhang; Zihan Zhu; Ruida Zhang; Xiangkui Zhang; Xiangyang Ji", "k": ["Learning representations for robotic perception and control", "Robot foundation models and general-purpose knowledge systems"], "kind": "P", "pdf": "https://arxiv.org/pdf/2609.07497v1", "ps": 1, "b": 190, "talk": "", "tier": "", "why": "", "top": []}, {"id": "m94Acp7Al5", "t": "Future-Aware Flow Planning for Safe UAV Target Following", "a": "Boning Feng; Haoran Zhang; Xiaowen Bi; Yanzhen Zhang; Xiaodan Shi", "k": ["Combination of learning and planning in robotics", "Autonomous driving and flight", "UAV target following", "Safe generative trajectory planning"], "kind": "P", "pdf": "https://arxiv.org/pdf/2609.10166v2", "ps": 2, "b": 228, "talk": "", "tier": "", "why": "", "top": []}, {"id": "1zWj66605w", "t": "G2-Nav: Grounded and Guarded Vision-Language Costmaps for Robot Social Navigation", "a": "Yuwen Liao; Yihang Lan; Yizhuo Yang; Ruimeng Liu; Xinhang Xu; Shenghai Yuan; Lihua Xie", "k": ["Human-robot interaction and natural language instruction", "Robot navigation and locomotion", "Social Navigation", "VLM Grounding"], "kind": "P", "pdf": "https://arxiv.org/pdf/2607.16956v2", "ps": 1, "b": 146, "talk": "", "tier": "", "why": "", "top": []}, {"id": "33H7BChFgI", "t": "G2G: Exploiting Intra-Group Geometry for Inter-Group Pose Estimation", "a": "YufeiWei; Shuhao Ye; Chenxiao Hu; Yiyuan Pan; Dongyu Feng; Yanmei Jiao; Rong Xiong; Yue Wang", "k": ["Learning representations for robotic perception and control", "Multimodal perception, sensor fusion, and robot vision", "Cross-sequence visual relocalization", "Multi-camera rig odometry"], "kind": "P", "pdf": "https://arxiv.org/pdf/2606.08284v3", "ps": 1, "b": 182, "talk": "", "tier": "S", "why": "Pose estimation", "top": ["Perception & vision"], "sum": "Estimating the relative 6-DoF pose between two groups of images matters for relocalization and multi-camera rigs, but existing multi-view models treat all views as one set. G2G keeps a pretrained foundation model frozen and adds three lightweight modules, about 32M trainable parameters, trained only on relative poses. It reports state-of-the-art accuracy on both tasks across four datasets, without specific numbers in the abstract."}, {"id": "C96z0RnFh8", "t": "GaP: A Graph-as-Policy Multi-Agent Self-Learning Harness For Variational Automation Tasks", "a": "Kaiyuan Chen; Shuangyu Xie; Letian Fu; Justin Yu; William Pacini; Sandeep Bajamahal; Hudson Kim; Jaimyn Drake; Daehwa Kim; Haoru Xue; Jonathan Francis; Christian Juette; Peter Schaldenbrand; Muhammet Yunus Seker; Ruwan Wickramarachchi; Uksang Yoo; Guanzhi Wang; Adithyavairavan Murali; Balakumar Sundaralingam; S. Shankar Sastry; Yuke Zhu; Linxi Fan; Spencer Huang; Ken Goldberg", "k": ["Robot manipulation", "Robot foundation models and general-purpose knowledge systems", "Agentic Coding for robotics", "Variational Automation"], "kind": "S", "pdf": "https://arxiv.org/pdf/2607.05369v1", "ps": 3, "b": 100, "talk": "S6", "tier": "S", "why": "Agentic graph-as-policy harness", "top": ["VLA testing", "Efficient/real-time"], "sum": "This paper asks whether agentic coding can combine interpretable robot programs with the adaptability of learned policies for tasks where object shape and pose vary. GaP is a multi-agent system that builds graphs of perception, planning and control modules from a skill library, then refines variants in parallel simulation. It reportedly beats baselines on 8 new benchmarks (4 simulated, 4 real), without stated success rates."}, {"id": "TZM6J864Lf", "t": "Gated Memory Policy", "a": "Yihuai Gao; Jinyun Liu; Shuang Li; Shuran Song", "k": ["Imitation learning (behavioral cloning, inverse RL)", "Robot manipulation", "Robot Memory"], "kind": "P", "pdf": "", "ps": 1, "b": 39, "talk": "", "tier": "", "why": "", "top": []}, {"id": "xEOer7gykg", "t": "Gaze Prompts: Temporally Dense Human Attention for Vision–Language–Action Fine-Tuning", "a": "Yihan Zhou; Rui Yan; Mingcong Li; Zheyuan Huang; Xu Yang; Guo Xueyang; Yilin Mo", "k": ["Imitation learning (behavioral cloning, inverse RL)", "Multimodal perception, sensor fusion, and robot vision"], "kind": "P", "pdf": "https://arxiv.org/pdf/2609.34550v1", "ps": 3, "b": 59, "talk": "", "tier": "", "why": "", "top": []}, {"id": "HWaigsXLaH", "t": "General Humanoid Whole-Body Control via Pretraining and Fast Adaptation", "a": "Zepeng Wang; Jiangxing Wang; Shiqing Yao; Yu Zhang; Ziluo Ding; Ming Yang; Yuxuan Wang; Haobin Jiang; Chao Ma; XIAOCHUAN SHI; Zongqing Lu", "k": ["Reinforcement learning for physical robot control", "Robot foundation models and general-purpose knowledge systems, robotics, whole-body control"], "kind": "P", "pdf": "https://arxiv.org/pdf/2602.11929v1", "ps": 2, "b": 205, "talk": "", "tier": "", "why": "", "top": []}, {"id": "weyfPS89NJ", "t": "Generative Flow on Symbolic Abstractions for Embodiment Capability Discovery", "a": "Youwei Yu; Lantao Liu", "k": ["Robot foundation models and general-purpose knowledge systems", "Robotic data generation", "Sim-to-real transfer"], "kind": "P", "pdf": "https://arxiv.org/pdf/2610.17174v1", "ps": 1, "b": 224, "talk": "", "tier": "", "why": "", "top": []}, {"id": "Am3aGfOlLh", "t": "GeoAlign: Beyond Semantics with State-Guided Spatial Alignment in VLA Models", "a": "Yizhi Chen; Zhanxiang Cao; Xinyi Peng; yixiao zheng; Xiaxi Si; Yiheng Li; Liyun Yan; Keqi Zhu; Haoyang Li; XueyunChen; Shengcheng Fu; Tianyue Zhan; Yufei Jia; Jinming Yao; yan xie; Wang Kun; Cewu Lu; Yue Gao", "k": ["Learning representations for robotic perception and control", "Robot manipulation", "Vision–language–action"], "kind": "P", "pdf": "https://arxiv.org/pdf/2606.03240v2", "ps": 2, "b": 42, "talk": "", "tier": "", "why": "", "top": []}, {"id": "qHndjmxgs1", "t": "GeoHAT: Geometry-Adaptive Hybrid Action Transformer for Mobile Manipulation", "a": "Xiangyu Zhu; Renjun Wu; Luzhou Ge; Jinyan Liu; Xuesong Li", "k": ["Imitation learning (behavioral cloning, inverse RL)", "Mobile Manipulation"], "kind": "P", "pdf": "https://arxiv.org/pdf/2606.13394v1", "ps": 1, "b": 121, "talk": "", "tier": "", "why": "", "top": []}, {"id": "wHAVgmIwj3", "t": "Geometry-Aware Absolute Pose Regression via Geometric Pose Proxy", "a": "YI ZHANG; Longguang Wang; Zhiheng Fu; Ye Zhang; Yueqiang Zhang; Yulan Guo", "k": ["Robot navigation and locomotion"], "kind": "P", "pdf": "", "ps": 1, "b": 178, "talk": "", "tier": "", "why": "", "top": []}, {"id": "HvKifHMHcM", "t": "GeomVLA: Unifying Scene, Motion, and Action in 3D", "a": "Ziyin Xiong; Nikolaos Gkanatsios; Moritz Reuss; Katerina Fragkiadaki", "k": ["Learning representations for robotic perception and control", "Robot foundation models and general-purpose knowledge systems", "Vision-Language-Action Models, 3D Motion Prediction"], "kind": "P", "pdf": "https://arxiv.org/pdf/2609.13812v2", "ps": 1, "b": 6, "talk": "", "tier": "", "why": "", "top": []}, {"id": "rcE4amkjBq", "t": "GeoProp: Grounding Robot State in Vision for Generalist Manipulation", "a": "Guoyang Zhao; Quanhao Qian; Gongjie Zhang; Wenhao Li; Jiuniu Wang; Xiaowei Lu; Deli Zhao; Ran Xu", "k": ["Learning representations for robotic perception and control", "Imitation learning (behavioral cloning, inverse RL)"], "kind": "P", "pdf": "https://arxiv.org/pdf/2607.07101v1", "ps": 1, "b": 29, "talk": "", "tier": "", "why": "", "top": []}, {"id": "EWEKI0rF6v", "t": "GeoWorldAD: Geometry World Action Model for Autonomous Driving", "a": "Songyan Zhang; Jinyuan Tian; Hanbing Li; Daqi Liu; Hao Chen; Wenhui Huang; Fang Li; Guang Chen; Hangjun Ye; Long Chen; Kuiyuan Yang; Chen Lv", "k": ["Autonomous driving and flight", "Robot foundation models and general-purpose knowledge systems", "Geometry World-Action Model"], "kind": "P", "pdf": "https://arxiv.org/pdf/2607.17521v2", "ps": 3, "b": 212, "talk": "", "tier": "", "why": "", "top": []}, {"id": "XjyM9If1Tm", "t": "GeoXel: Geographic Per-pixel 3D Mapping from Aerial Video in the Wild", "a": "Zeyu Cui; Maojun Zhang; Shuaibang Peng; Shen Yan; Yu Liu", "k": ["Multimodal perception, sensor fusion, and robot vision", "Video models and latent world models for robot learning"], "kind": "P", "pdf": "", "ps": 2, "b": 225, "talk": "", "tier": "", "why": "", "top": []}, {"id": "y5Z5ccS0Bv", "t": "GIF: Agentic Generation of Interactive and Functional Object Compositions for Robot Learning", "a": "Long Xu; Zhiqi Zhang; Mi Yan; Shengliang Deng; Chong Xia; Mingyu Dong; Jiayi Chen; Jiangran Lyu; Fei Gao; Zhizheng Zhang; He Wang", "k": ["Robotic data generation, interactive scene generation"], "kind": "P", "pdf": "https://arxiv.org/pdf/2609.05927v2", "ps": 3, "b": 83, "talk": "", "tier": "", "why": "", "top": []}, {"id": "nl8iBTm3Mt", "t": "GINIO: A Geometric SO(3)-Equivariant Interface for Neural Inertial Odometry", "a": "Chankyo Kim; Minghan Zhu; Tzu-Yuan Lin; Avantika Rattan; Maani Ghaffari", "k": ["Robot navigation and locomotion", "Theoretical foundations of robot learning"], "kind": "P", "pdf": "https://arxiv.org/pdf/2609.25338v2", "ps": 1, "b": 193, "talk": "", "tier": "", "why": "", "top": []}, {"id": "xyFvvMLQRo", "t": "GLST: Global-Local Spatio-Temporal Memory Decomposition Framework for Online Chained-Goal Navigation", "a": "Yousef Liang; Ryan Ardalan; Yarden Goraly; Chenhao Zhu; Jonas Frey; Claire Tomlin; Marco Pavone; S. Shankar Sastry", "k": ["Robot navigation and locomotion"], "kind": "P", "pdf": "https://arxiv.org/pdf/2610.17927v1", "ps": 1, "b": 159, "talk": "", "tier": "", "why": "", "top": []}, {"id": "Rrnnh3mDaH", "t": "GoalDex: Learning Image-Goal-Conditioned Policies for Dexterous In-Hand Manipulation", "a": "Arjun Bhardwaj; Mayank Mittal; Maximum Wilder-Smith; Vaishakh Patil; Marco Hutter", "k": ["Learning representations for robotic perception and control", "Reinforcement learning for physical robot control", "Visuomotor Dexterous Manipulation", "Image-Goal Conditioned Policies"], "kind": "P", "pdf": "", "ps": 2, "b": 130, "talk": "", "tier": "", "why": "", "top": []}, {"id": "8T3FxlYk9K", "t": "Going with the Flow: Koopman Behavioral Models as Pseudo Planners for Visuo-Motor Dexterity", "a": "Yunhai Han; Jiaqi Fu; Linhao Bai; Ziyu Xiao; Zhaodong Yang; Yogita Choudhary; Krishna Jha; Chuizheng Kong; Shreyas Kousik; Harish Ravichandar", "k": ["Imitation learning (behavioral cloning, inverse RL)", "Robot manipulation"], "kind": "P", "pdf": "https://arxiv.org/pdf/2602.07413v3", "ps": 3, "b": 123, "talk": "", "tier": "", "why": "", "top": []}, {"id": "7tCsPSbYZb", "t": "GRACE: Group-Aware Socially Compliant Visual Navigation in Human Environments", "a": "Lulu Huang; Wenbo Wang; Guo Cheng; Hao Cheng; Jian-Jian Jiang; Wei-Shi Zheng; Jingke Meng", "k": ["Robot navigation and locomotion"], "kind": "P", "pdf": "", "ps": 1, "b": 151, "talk": "", "tier": "", "why": "", "top": []}, {"id": "k6kMJCL22t", "t": "Gradient-Free Neural Hamilton-Jacobi Reachability for Scalable Safety-Critical Control", "a": "Zeyuan Feng; Ali Fuat Sahin; Santiago Thorup; Somil Bansal", "k": ["Robot safety, alignment, and safe learning-based systems"], "kind": "P", "pdf": "https://arxiv.org/pdf/2609.14087v1", "ps": 1, "b": 205, "talk": "", "tier": "S", "why": "Neural HJ reachability", "top": ["Motion control & safety"], "sum": "Hamilton-Jacobi reachability can certify robot safety, but grid solvers fail in high dimensions and existing neural methods need precise gradients or train unstably. This framework learns reachable and reach-avoid tubes by backward value propagation, using teacher actions from gradient-free value probes and a windowed curriculum. It handles benchmarks up to 80 dimensions and a safety filter over 16,000-dimensional inputs, transferring to a real RC car."}, {"id": "2dEfANeQL7", "t": "GRAIL: Generating Humanoid Loco-Manipulation from World Models", "a": "Tianyi Xie; Haotian Zhang; Jinhyung Park; Zi Wang; Bowen Wen; Jiefeng Li; Xueting Li; Qingwei Ben; Haoyang Weng; Yufei Ye; David Minor; Tingwu Wang; Chenfanfu Jiang; Sanja Fidler; Jan Kautz; Linxi Fan; Yuke Zhu; Zhengyi Luo; Umar Iqbal; Ye Yuan", "k": ["Robotic data generation"], "kind": "O", "pdf": "https://arxiv.org/pdf/2606.05160v2", "ps": 2, "b": 216, "talk": "O7", "tier": "", "why": "", "top": [], "sum": "Collecting humanoid loco-manipulation demonstrations by teleoperation or motion capture is hard to scale. GRAIL is a virtual pipeline that uses 3D assets, known scene geometry and video generation models to reconstruct human-object interaction motions, then retargets them to a Unitree G1 humanoid. Policies trained only on over 20,000 generated sequences reached 84% real-world success on pick-up and 90% on stair climbing."}, {"id": "bsjuF5klA3", "t": "Graph-Reweighted Behavior Cloning with Human Interventions for Precise Robotic Manipulation", "a": "Xiaoman Li; Zhiqiang Yang; Jiayu Hu; Jipeng Kong; Yang Zhang; waylen zhang; Fangzheng YAN; Chunhua Shen; Chenjia Bai", "k": ["Imitation learning (behavioral cloning, inverse RL)", "Robot manipulation", "Vision-Language-Action Models"], "kind": "P", "pdf": "https://arxiv.org/pdf/2610.20504v1", "ps": 2, "b": 65, "talk": "", "tier": "S", "why": "Graph-reweighted BC with interventions for precise manipulation — precision", "top": ["VLA testing", "Precision", "RL"], "sum": "Long-horizon precise manipulation produces mixed-quality demonstrations and rollouts. Graph-Reweighted Behavior Cloning builds a goal-reachability graph from demos, rollouts, failures and human interventions, then weights each action chunk by how much it cuts the estimated steps remaining. Tested on four tasks and three VLA backbones, it beats single-round fine-tuning and reaches 91% success after a few offline iterations."}, {"id": "EAeJdjpDzM", "t": "Grounding Generative Policies in Physics: Optimization-Guided Diffusion for Robot Control", "a": "Sabrina Bodmer; René Zurbrügg; Tifanny Portela; Hao Ma; Alexandre Didier; Marco Hutter; Colin Jones; Melanie N. Zeilinger", "k": ["Imitation learning (behavioral cloning, inverse RL)", "Robot foundation models and general-purpose knowledge systems", "Diffusion Policies", "Cross-Embodiment Adaptation"], "kind": "P", "pdf": "https://arxiv.org/pdf/2606.24208v1", "ps": 1, "b": 212, "talk": "", "tier": "M", "why": "Optimization-guided diffusion: physically feasible actions — control + learning", "top": ["VLA testing", "Training frontier", "Planning & optimization", "RL", "Efficient/real-time"], "sum": "Diffusion models can generate robot grasps and trajectories that break physical constraints like reachability or collisions. This work treats guidance at inference time as a constrained optimization step, so constraints apply without retraining. It matches baselines on feasibility, keeps grasp quality better, and improves task success by up to 20 points (grasping) and 23 points (visuomotor manipulation) over the best baseline."}, {"id": "kGLogzKtYq", "t": "GROW²: Grounding Which and Where for Robot Tool Use", "a": "Yuhong Deng; Yuyao Liu; David Hsu", "k": ["Multimodal perception, sensor fusion, and robot vision", "Robot manipulation"], "kind": "P", "pdf": "https://arxiv.org/pdf/2606.30632v2", "ps": 1, "b": 127, "talk": "", "tier": "", "why": "", "top": []}, {"id": "U5POjpnj6J", "t": "GSWAM: A Unified Gaussian World Action Model for Robotic Manipulation", "a": "Chengzhi zhao; Hongbo Duan; Yueyang Weng; Xiaopeng Zhang; Mu Yongjin; Bin Qian; Yanjie Li", "k": ["Video models and latent world models for robot learning", "Robot manipulation", "World Action Model, 3D Gaussian Splatting"], "kind": "P", "pdf": "", "ps": 3, "b": 15, "talk": "", "tier": "", "why": "", "top": []}, {"id": "6EN09R3NGP", "t": "Guided Discovery of New Behaviors using Diffusion Policies", "a": "Dian Yu; Sebastian Sanokowski; Majid Khadiv", "k": ["Imitation learning (behavioral cloning, inverse RL)", "Robot manipulation", "Rare-Event Sampling", "Motion Discovery"], "kind": "P", "pdf": "https://arxiv.org/pdf/2606.08743v1", "ps": 2, "b": 73, "talk": "", "tier": "", "why": "", "top": []}, {"id": "cxxUgLuNa2", "t": "Guiding Unified Dexterous Grasp Synthesis Across Modes and Scales via Learned Human Priors", "a": "Mingrui Yu; Yongpeng Jiang; Yongyi Jia; Kangchen Lv; Xiangjie Yan; Li Huang; Yi Ren; Xiang Li", "k": ["Robot manipulation", "Robotic data generation", "Dexterous Grasp Synthesis", "Human Grasp Data"], "kind": "P", "pdf": "https://arxiv.org/pdf/2607.04554v1", "ps": 2, "b": 123, "talk": "", "tier": "", "why": "", "top": []}, {"id": "6TXMWx1Wih", "t": "GUILD: Guided Iterative Data Collection for Imitation Learning", "a": "Shivin Dass; Kevin Nguyen; Rohan Yelandur; Junhong Xu; Roberto Martín-Martín", "k": ["Robotic data generation", "Imitation learning (behavioral cloning, inverse RL)"], "kind": "P", "pdf": "", "ps": 3, "b": 91, "talk": "", "tier": "", "why": "", "top": []}, {"id": "ST0jumL7Ma", "t": "H-VLA: Hierarchical Vision-Language-Action Model with Key-Action Reasoning and Motion Planning in a Unified Action Space", "a": "Xiongfeng Peng; Lu Xu; YandongWang; Jiaqian Yu; Zirui Zheng; Yamin Mao; Weiming Li; Inseop Chung; Hyun-woong Cho; Jaewook Yoo; Dongwook Lee; Daehyun Ji; Chao Zhang", "k": ["Robot manipulation", "Task and motion planning"], "kind": "P", "pdf": "https://arxiv.org/pdf/2609.22895v1", "ps": 1, "b": 219, "talk": "", "tier": "", "why": "", "top": []}, {"id": "SMKzI5HX9P", "t": "H2RBench: A Real-to-Sim Benchmark for Evaluating Human-to-Robot Transfer", "a": "Chuyang Xiao; Haotian Zhan; Sriram Krishna; Peilin Meng; Muhammad Zubair Irshad; Sergey Zakharov; David Held", "k": ["Benchmarks and datasets for robot learning", "Robot manipulation", "Human-to-Robot Transfer", "Learning from human videos"], "kind": "P", "pdf": "https://arxiv.org/pdf/2609.24778v2", "ps": 3, "b": 49, "talk": "", "tier": "", "why": "", "top": []}, {"id": "L9RkFeuKRc", "t": "HAF-VLA: Hierarchical Action Flow Framework for Humanoid Vision-Language-Action Control", "a": "Langzhe Gu; Chengkai Hou; Meng Li; Xinhua Wang; Xinyuan Lv; Shuanghao Bai; Guangrun Li; He Jingyang; Ziluo Ding; Zhiyuan Xu; Ning Ding; Kuan Cheng; Jian Tang; Shanghang Zhang; Zhengping Che", "k": ["Imitation learning (behavioral cloning, inverse RL)", "Robot manipulation"], "kind": "P", "pdf": "https://arxiv.org/pdf/2610.26584v1", "ps": 3, "b": 172, "talk": "", "tier": "", "why": "", "top": []}, {"id": "JqZEEaNDLJ", "t": "HARBOR: A Harness Framework for Agentic Robot Reinforcement Learning", "a": "Zechu Li; Yufeng Jin; Xiao-Yang Liu; Puze Liu; Vignesh Prasad; Carlo D'Eramo; Georgia Chalvatzaki", "k": ["Reinforcement learning for physical robot control", "Sim-to-real transfer"], "kind": "P", "pdf": "https://arxiv.org/pdf/2606.08610v1", "ps": 1, "b": 106, "talk": "", "tier": "", "why": "", "top": []}, {"id": "rIyIQWvpST", "t": "Hardware-as-Regularization: Enhancing Data Consistency in Imitation Learning via an Adjustable Passive Compliant Leader Arm", "a": "Hideyuki Ichiwara; Yushi Kaida; Hirokazu Ishida", "k": ["Robot systems, hardware, and sensors for learning", "Imitation learning (behavioral cloning, inverse RL)", "Leader Device"], "kind": "P", "pdf": "https://arxiv.org/pdf/2610.22977v1", "ps": 3, "b": 152, "talk": "", "tier": "S", "why": "Passive compliance as
